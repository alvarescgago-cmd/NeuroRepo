 transaminasas también proceden del músculo, así que una hipertransaminasemia en un niño con torpeza motora debe hacer pedir una CPK antes de iniciar un estudio hepático (y mucho antes de una biopsia). Esta es la aplicación práctica de ese dato.","p":null},{"id":"Miopatias_T21-3","b":"Miopatias_T21","t":"T21","n":3,"q":"Mujer de 28 años cuyo hermano tiene una distrofia muscular de Duchenne. Está asintomática y quiere saber si es portadora antes de buscar un embarazo. Su CPK es normal. Señale la afirmación CORRECTA:","o":["Una CPK normal descarta que sea portadora de la mutación.","No la descarta: solo la mitad de las portadoras tiene la CPK elevada.","Si es portadora, sus hijas heredarán una forma grave de la enfermedad.","Si es portadora, todos sus hijos varones tendrán la enfermedad."],"a":1,"e":"La herencia es recesiva ligada al X: las mujeres suelen ser portadoras asintomáticas y los varones, afectos. La elevación de la CPK ayuda a detectar portadoras, pero solo un 50 % la tiene elevada, por lo que una CPK normal no descarta el estado de portadora: hace falta un estudio genético. Si es portadora, cada hijo varón tiene un 50 % de riesgo de estar afectado y cada hija, un 50 % de ser portadora (habitualmente asintomática).","p":null},{"id":"Miopatias_T21-4","b":"Miopatias_T21","t":"T21","n":4,"q":"Varón de 24 años con dificultad progresiva para silbar y para levantar los brazos por encima de la cabeza. Presenta debilidad facial con cierre palpebral incompleto, escápula alada y debilidad de bíceps y tríceps con fuerza normal en el antebrazo, todo ello más marcado en el lado derecho, además de debilidad de la musculatura abdominal. Su padre tiene un cuadro similar. La CPK está ligeramente elevada. ¿Cómo se confirma el diagnóstico más probable?","o":["Estudio genético de la delección del segmento D4Z4.","Estudio genético de la expansión CTG en el gen DMPK.","Biopsia muscular con tinción específica para distrofina.","Biopsia muscular con infiltrados endomisiales CD8."],"a":0,"e":"Distrofia facioescapulohumeral: la tercera distrofia más frecuente (tras las distrofinopatías y Steinert), de herencia autosómica dominante, por delección del segmento D4Z4. Suele ser asimétrica, con debilidad facial, escapular (escápula alada), pectoral y del brazo (no del antebrazo), y a veces abdominal. La CPK es normal o está ligeramente elevada, y el EMG y la biopsia pueden mostrar datos de miopatía, pero la confirmación es genética. No tiene tratamiento específico.","p":null},{"id":"Miopatias_T21-5","b":"Miopatias_T21","t":"T21","n":5,"q":"Varón de 33 años que refiere desde hace años dificultad para soltar los objetos tras agarrarlos con fuerza, que empeora con el frío y mejora al repetir el movimiento. Presenta cara alargada con atrofia temporal, ptosis bilateral, calvicie frontal y debilidad de la musculatura intrínseca de las manos y de los flexores de los dedos. Al percutir la eminencia tenar, el pulgar tarda en relajarse. ¿Cuál es el diagnóstico más probable?","o":["Distrofia muscular facioescapulohumeral.","Miositis por cuerpos de inclusión.","Distrofia miotónica tipo 1 (Steinert).","Miastenia gravis generalizada seropositiva."],"a":2,"e":"Enfermedad de Steinert: fenómeno miotónico tras la contracción o la percusión, que empeora con el frío o el estrés y mejora con las repeticiones. A diferencia de otras miopatías, la debilidad y la atrofia son de predominio distal (intrínsecos de la mano, flexores de los dedos y, en las piernas, dorsiflexión del pie). Facies típica: cara alargada por atrofia temporal, ptosis bilateral, boca entreabierta y calvicie frontal. Es autosómica dominante (gen DMPK, cromosoma 19) y es la distrofia más prevalente en el adulto. El diagnóstico de certeza es genético; el EMG muestra descargas de amplitud decreciente ('caída de una bomba').","p":null},{"id":"Miopatias_T21-6","b":"Miopatias_T21","t":"T21","n":6,"q":"Mujer de 52 años diagnosticada de enfermedad de Steinert, con cataratas, discreta miotonía en las manos y calvicie frontal leve. Su hijo de 25 años presenta un cuadro mucho más grave, que comenzó en la adolescencia. ¿Qué explica la diferencia?","o":["Herencia mitocondrial con heteroplasmia variable.","Herencia recesiva ligada al X, con inactivación del X en la madre.","Penetrancia incompleta del alelo materno por imprinting.","Anticipación por expansión del triplete CTG en el gen DMPK."],"a":3,"e":"La enfermedad de Steinert (distrofia miotónica tipo 1) es autosómica dominante y se debe a una expansión del triplete CTG en el gen DMPK del cromosoma 19. Presenta anticipación: a mayor número de repeticiones, mayor gravedad y presentación más precoz en las generaciones sucesivas. Suele comenzar entre la 2.ª y la 3.ª década.","p":null},{"id":"Miopatias_T21-7","b":"Miopatias_T21","t":"T21","n":7,"q":"Varón de 40 años con enfermedad de Steinert que acude a urgencias por un síncope sin pródromos. El ECG muestra un bloqueo auriculoventricular de alto grado. Señale la afirmación CORRECTA:","o":["Es una complicación excepcional en la enfermedad, y obliga a buscar otra causa del síncope.","Es la manifestación más peligrosa de la enfermedad y puede requerir un marcapasos.","Se debe a una miocardiopatía dilatada, y su tratamiento son los corticoides.","Indica una crisis miotónica, y se trata con mexiletina por vía intravenosa."],"a":1,"e":"Lo más peligroso de la enfermedad de Steinert es la afectación cardiaca, que causa arritmias y bloqueos de la conducción; todo paciente debe ser evaluado por Cardiología y a veces es necesario un marcapasos. Otras manifestaciones no neurológicas: cataratas subcapsulares posteriores, resistencia a la glucosa e hipogonadismo (abortos de repetición), por lo que también se sigue en Oftalmología y Endocrinología. No hay tratamiento curativo; para la miotonía se han usado mexiletina, fenitoína, carbamazepina o acetazolamida.","p":null},{"id":"Miopatias_T21-8","b":"Miopatias_T21","t":"T21","n":8,"q":"Mujer de 58 años con debilidad proximal progresiva y mialgias de 6 semanas. Presenta eritema violáceo en los párpados, pápulas eritematosas en los nudillos y eritema en V en el escote. La CPK es 20 veces la normal. La biopsia muestra un infiltrado perifascicular y perivascular de linfocitos T CD4 y linfocitos B. Además de iniciar corticoides, ¿qué es imprescindible?","o":["Estudio genético para descartar una distrofia de cinturas.","Búsqueda de una neoplasia oculta (pulmón, colon, ovario, mama).","Repetir la biopsia si no mejora en una semana y retirar los corticoides.","Test de la gota seca para descartar una glucogenosis tipo II (Pompe)."],"a":1,"e":"Dermatomiositis: cuadro muscular a veces más agudo, con mialgias, debilidad subaguda e incluso rabdomiólisis. Las lesiones cutáneas pueden preceder a la debilidad: heliotropo, pápulas de Gottron, eritema en V y eritema en superficies de extensión. Puede ser un síndrome paraneoplásico, sobre todo de cáncer de pulmón o colon, y también de ovario, páncreas y mama, por lo que hay que buscar una neoplasia. Histología: linfocitos T CD4 y B perifasciculares, perivasculares y perimisiales, con depósito de complemento. Responde bien al tratamiento: corticoides y, si no hay respuesta, inmunosupresores o inmunoglobulinas.","p":null},{"id":"Miopatias_T21-9","b":"Miopatias_T21","t":"T21","n":9,"q":"Mujer de 46 años con debilidad progresiva de 3 meses para levantarse de la silla, peinarse y levantar la cabeza de la almohada, y disfagia leve. No tiene lesiones cutáneas. La CPK es 30 veces la normal y el EMG muestra un patrón mixto. La biopsia muestra infiltrados endomisiales de linfocitos T CD8 que rodean e invaden fibras no necróticas, con expresión de MHC de clase I. ¿Cuál es el diagnóstico y qué estudio debe completarse?","o":["Dermatomiositis amiopática; capilaroscopia y biopsia cutánea.","Miositis por cuerpos de inclusión; no requiere más estudios.","Polimiositis; estudio inmunológico para descartar conectivopatías.","Distrofia muscular de cinturas; panel genético de distrofias musculares."],"a":2,"e":"Polimiositis: debilidad proximal y de flexores del cuello, faringe y, en casos graves, musculatura respiratoria; puede haber afectación cardiaca. Es frecuente su asociación a otras enfermedades del tejido conectivo, por lo que debe solicitarse estudio inmunológico. También puede ser paraneoplásica (pulmón, vejiga, linfoma no Hodgkin). Histología: infiltrados endomisiales de linfocitos T CD8 y macrófagos que rodean o invaden fibras no necróticas, con expresión de MHC de clase I. Las miopatías inflamatorias comparten la elevación de CPK y un EMG con patrón mixto. Su respuesta al tratamiento es regular.","p":null},{"id":"Miopatias_T21-10","b":"Miopatias_T21","t":"T21","n":10,"q":"Varón de 69 años con debilidad lentamente progresiva desde hace 4 años, con caídas porque le fallan las rodillas y dificultad para abrocharse botones y agarrar objetos. La debilidad afecta a los cuádriceps y a los flexores de los dedos, de forma asimétrica. La CPK está ligeramente elevada. Recibió prednisona durante 6 meses sin mejoría. ¿Qué hallazgo cabe esperar en la biopsia?","o":["Vacuolas tapizadas de material granular e inclusiones filamentosas.","Infiltrado perifascicular de linfocitos CD4 y B con depósito de complemento.","Ausencia de distrofina en las tinciones inmunohistoquímicas específicas.","Patrón distrófico con sustitución del músculo por tejido adiposo."],"a":0,"e":"Miositis por cuerpos de inclusión: más frecuente en varones y a partir de los 50 años. Debilidad progresiva y asimétrica, proximal en las piernas (cuádriceps) y distal en los brazos (flexores de los dedos). Eleva menos la CPK que las otras miositis, responde mal al tratamiento y no se asocia a conectivopatías ni a cáncer. Histología: infiltrado endomisial, fibras necróticas con invasión de macrófagos y vacuolas tapizadas de material granular, que en la microscopía electrónica muestran inclusiones filamentosas (tubulofilamentos), con depósito de amiloide.","p":null},{"id":"Miopatias_T21-11","b":"Miopatias_T21","t":"T21","n":11,"q":"Respecto a las miopatías inflamatorias, señale la afirmación CORRECTA:","o":["La dermatomiositis aparece a cualquier edad, se asocia a cáncer y responde bien al tratamiento.","La miositis por cuerpos de inclusión se asocia con frecuencia tanto a conectivopatías como a neoplasias.","La polimiositis se caracteriza por depósitos perifasciculares de complemento en la biopsia.","La ausencia de inflamación en la biopsia no tiene ningún valor para descartar una miositis."],"a":0,"e":"Según la tabla comparativa de los apuntes, la dermatomiositis aparece a cualquier edad, se asocia a cáncer y a conectivopatías, produce lesiones cutáneas y responde bien al tratamiento. La polimiositis es del adulto, con biopsia de linfocitos T CD8 endomisiales y respuesta regular. La miositis por cuerpos de inclusión es de mayores de 50 años, apenas se asocia a conectivopatías y no se asocia a cáncer, y responde mal. Los depósitos perifasciculares de complemento son propios de la dermatomiositis. La inflamación es necesaria para el diagnóstico, por lo que su ausencia tiene valor predictivo negativo.","p":null},{"id":"Miopatias_T21-12","b":"Miopatias_T21","t":"T21","n":12,"q":"Mujer de 34 años con debilidad proximal de cinturas lentamente progresiva que, desde hace meses, presenta cefalea matutina, somnolencia diurna y disnea al tumbarse por debilidad de la musculatura respiratoria. La CPK está moderadamente elevada. ¿Qué diagnóstico es prioritario descartar y por qué?","o":["Enfermedad de McArdle; porque tiene tratamiento enzimático sustitutivo.","Distrofia facioescapulohumeral; mediante el estudio del segmento D4Z4.","Miositis por cuerpos de inclusión; por su buena respuesta a corticoides.","Enfermedad de Pompe; tiene tratamiento enzimático con alfa-glucosidasa."],"a":3,"e":"Enfermedad de Pompe o glucogenosis tipo II: déficit de maltasa ácida, autosómica recesiva. Produce una debilidad miopática proximal y puede afectar a la musculatura respiratoria. Es importante considerarla porque tiene tratamiento específico con alfa-glucosidasa. Para el diagnóstico se hace primero el test de la gota seca y, si es positivo, un estudio genético o de la actividad enzimática en cultivo de fibroblastos de la piel.","p":null},{"id":"Miopatias_T21-13","b":"Miopatias_T21","t":"T21","n":13,"q":"Chico de 19 años que desde la infancia presenta mialgias, rigidez y contracturas dolorosas con el ejercicio intenso, y que en una ocasión orinó oscuro tras una carrera. Refiere que, si al empezar a correr se detiene unos minutos y luego reanuda la actividad, la tolera mucho mejor. ¿Cuál es el diagnóstico más probable y la prueba indicada?","o":["Enfermedad de Pompe; test de la gota seca.","Distrofia de Becker; biopsia con tinción de distrofina.","Enfermedad de McArdle; test del ejercicio.","Enfermedad de Steinert; EMG con descargas miotónicas."],"a":2,"e":"Enfermedad de McArdle o glucogenosis tipo V: déficit de miofosforilasa. Es característica la intolerancia al ejercicio, con mialgias, debilidad, rigidez y contracturas, y puede haber mioglobinuria (síntoma positivo de miopatía). Presenta el fenómeno de 'segundo viento': el paciente rinde mejor en un segundo intento. El diagnóstico se hace con el test del ejercicio.","p":null},{"id":"Miopatias_T21-14","b":"Miopatias_T21","t":"T21","n":14,"q":"Varón de 67 años con dislipemia mixta en tratamiento con atorvastatina, al que hace 6 semanas se añadió fenofibrato. Consulta por mialgias y debilidad proximal para subir escaleras. La CPK es 8 veces la normal. No toma otros fármacos y la TSH es normal. ¿Cuál es la actitud más adecuada?","o":["Suspender los hipolipemiantes y vigilar la clínica y la CPK.","Iniciar prednisona 1 mg/kg/día por sospecha de polimiositis de inicio tardío.","Mantener el tratamiento y añadir analgesia, ya que es un efecto banal.","Solicitar un estudio genético de distrofias musculares de inicio tardío."],"a":0,"e":"Entre las miopatías tóxico-metabólicas adquiridas destacan las debidas a estatinas y fibratos, zidovudina y ciclosporina, a patología tiroidea o paratiroidea y la miopatía esteroidea. Ante una relación temporal clara, lo primero es retirar el agente causal y vigilar la evolución. Los apuntes no detallan el manejo: retirar el fármaco es el principio general. Un dato que no figura en los apuntes: si la debilidad y la CPK persisten tras la retirada, hay que pensar en una miopatía necrotizante inmunomediada (anti-HMGCR).","p":null},{"id":"Miopatias_T21-15","b":"Miopatias_T21","t":"T21","n":15,"q":"Varón de 23 años diagnosticado, tras biopsia y estudio genético, de una miopatía congénita por mutación del receptor de rianodina (RYR1). Va a ser intervenido de una fractura de tibia. ¿Qué precaución es fundamental?","o":["Retirar la ventilación mecánica lo antes posible tras la cirugía.","Evitar anestésicos inhalados y relajantes despolarizantes.","Administrar corticoides a dosis altas antes de la intervención.","Usar anestesia general inhalatoria con sevoflurano, por ser más segura."],"a":1,"e":"Las miopatías congénitas son muy variadas y pueden presentarse incluso en adultos, por lo que a veces solo se diagnostican tras biopsia y estudio genético. La más importante según los apuntes es la asociada a alteraciones del receptor de rianodina, en la que los anestésicos inhalados o los relajantes despolarizantes (succinilcolina) pueden provocar una hipertermia maligna.","p":null},{"id":"Motoneurona_T18-1","b":"Motoneurona_T18","t":"T18","n":1,"q":"Varón de 57 años que consulta por torpeza progresiva de la mano derecha desde hace 6 meses, con dificultad para abrochar botones y hacer la pinza. Presenta atrofia del primer interóseo dorsal y de la eminencia tenar derechos, fasciculaciones en ambos brazos, reflejos exaltados en las cuatro extremidades, Hoffman positivo bilateral y Babinski derecho. La sensibilidad y los esfínteres son normales. ¿Cuál es el diagnóstico más probable?","o":["Neuropatía cubital por atrapamiento en el codo derecho.","ELA de inicio cervicobraquial.","Polineuropatía sensitivo-motora axonal de predominio distal.","Esclerosis múltiple con afectación medular cervical."],"a":1,"e":"La ELA combina signos de primera motoneurona (hiperreflexia, Hoffman, Babinski) y de segunda motoneurona (atrofia, fasciculaciones) con curso progresivo, sin alteración sensitiva ni esfinteriana. El inicio cervicobraquial (35-40 %) suele ser unilateral y distal (pinza, elevar un dedo), con atrofia característica del primer interóseo dorsal y de las eminencias. Respeta los flexores de la mano y el tríceps hasta fases finales y se extiende después a la pierna ipsilateral y luego a la contralateral.","p":null},{"id":"Motoneurona_T18-2","b":"Motoneurona_T18","t":"T18","n":2,"q":"Durante la exploración de un paciente con sospecha de enfermedad de motoneurona, ¿cuál de los siguientes hallazgos traduce afectación de la PRIMERA motoneurona?","o":["Fasciculaciones en la musculatura lingual.","Hipotonía con arreflexia aquílea bilateral.","Atrofia de la eminencia hipotenar bilateral.","Signo de Hoffman positivo."],"a":3,"e":"Signos de primera motoneurona: hiperreflexia (respuesta viva, policinética, con aumento del área reflexógena y clonus), Babinski, Hoffman positivo (al golpear la uña del 2.º-4.º dedo se flexionan ese dedo y el pulgar), espasticidad, claudicación en las maniobras antigravitatorias con la mano 'en excavación' y pronación, marcha en guadaña y síndrome pseudobulbar. Signos de segunda motoneurona: atrofia (distal en la afectación difusa), fasciculaciones, hipotonía, hipo o arreflexia, calambres y marcha en estepaje.","p":null},{"id":"Motoneurona_T18-3","b":"Motoneurona_T18","t":"T18","n":3,"q":"Varón de 42 años que ingresa por una lesión medular cervical traumática hace 24 horas. Presenta tetraplejía flácida con arreflexia. Señale la afirmación CORRECTA:","o":["La flacidez y la arreflexia descartan una lesión de primera motoneurona.","En la fase hiperaguda predomina inicialmente la hipotonía.","La hipotonía indica que la lesión está en las astas anteriores y no en el haz corticoespinal.","La espasticidad aparece de forma inmediata en cualquier lesión de primera motoneurona."],"a":1,"e":"La lesión de primera motoneurona no va ligada siempre a hipertonía. En la fase hiperaguda de un daño grave (lesión medular aguda o ictus), el paciente presenta inicialmente más hipotonía que hipertonía, lo que puede confundir, ya que la hipotonía es el signo característico de la segunda motoneurona. La espasticidad aparece de forma subaguda o crónica: es una resistencia al movimiento pasivo dependiente de la velocidad, 'en hoja de navaja'.","p":null},{"id":"Motoneurona_T18-4","b":"Motoneurona_T18","t":"T18","n":4,"q":"Mujer de 68 años con dificultad progresiva para hablar y atragantamientos con los líquidos desde hace 4 meses, sin síntomas en las extremidades. Presenta habla espástica, reflejo mentoniano exaltado, atrofia y fasciculaciones en la lengua, y episodios de llanto incontrolado sin tristeza. ¿Qué forma clínica presenta y qué pronóstico tiene?","o":["ELA bulbar, la forma de peor pronóstico.","ELA de inicio lumbosacro, la forma de mejor pronóstico.","Miastenia gravis bulbar, de buen pronóstico con tratamiento.","Síndrome pseudobulbar aislado de origen vascular, sin implicaciones pronósticas."],"a":0,"e":"La ELA de inicio bulbar (síntomas bulbares en los 3 primeros meses; un 25 % de los casos) es la forma con peor pronóstico, con neumonías por broncoaspiración como complicación frecuente; su supervivencia media es de 2-3 años, frente a 3-5 en las formas espinales. Signos bulbares de primera motoneurona: habla espástica, disfagia para líquidos, reflejo mentoniano exaltado y labilidad emocional. Signos de segunda motoneurona: atrofia, debilidad y fasciculaciones linguales, debilidad del paladar y paresia facial.","p":null},{"id":"Motoneurona_T18-5","b":"Motoneurona_T18","t":"T18","n":5,"q":"Un paciente con ELA presenta episodios de risa y llanto incontrolados, desproporcionados a su estado de ánimo, junto con disartria y disfagia. ¿Cuál es el sustrato de estos síntomas?","o":["Afectación de las motoneuronas del núcleo del hipogloso en el bulbo raquídeo.","Una demencia frontotemporal asociada, que se confirma con este único síntoma.","Síndrome pseudobulbar por lesión bilateral de primera motoneurona.","Un trastorno depresivo reactivo, que no guarda relación con la enfermedad."],"a":2,"e":"El síndrome pseudobulbar se produce por lesión bilateral de la primera motoneurona: hay clínica de pares bajos (disartria, disfagia, disfonía), pero la lesión no está en el bulbo, sino más arriba en la vía corticoespinal o corticonuclear. Asocia de forma característica labilidad emocional, por falta de inhibición de la risa y el llanto. Los apuntes advierten de que esta labilidad puede confundirse con un trastorno cognitivo subyacente.","p":null},{"id":"Motoneurona_T18-6","b":"Motoneurona_T18","t":"T18","n":6,"q":"Varón de 61 años con sospecha de ELA. ¿Cuál de los siguientes hallazgos debería hacer dudar del diagnóstico y buscar otra causa?","o":["Fasciculaciones generalizadas y calambres frecuentes.","CK ligeramente elevada en las fases iniciales.","Pérdida de peso marcada sin causa digestiva.","Incontinencia urinaria con nivel sensitivo dorsal."],"a":3,"e":"En la ELA no deberíamos esperar alteración sensitiva, síntomas esfinterianos, disfunción sexual ni alteración oculomotora (los oculomotores se respetan hasta fases muy avanzadas), y la mayoría no tiene alteración cognitiva. Una alteración sensitiva o esfinteriana orienta a patología medular, radicular o de nervio periférico. Los calambres, las fasciculaciones, la pérdida de peso (a veces motivo de consulta) y una CK elevada en fases iniciales son compatibles con ELA.","p":null},{"id":"Motoneurona_T18-7","b":"Motoneurona_T18","t":"T18","n":7,"q":"Varón de 66 años con debilidad y atrofia de la musculatura intrínseca de ambas manos con fasciculaciones en los brazos, y espasticidad con hiperreflexia y Babinski en las piernas. La musculatura facial, el paladar y la lengua son normales. ¿Qué diagnóstico alternativo a la ELA es obligado descartar en primer lugar?","o":["Miositis por cuerpos de inclusión de inicio distal.","Mielopatía cervical compresiva espondiloartrósica.","Síndrome benigno de calambres y fasciculaciones.","Atrofia multisistémica de predominio cerebeloso."],"a":1,"e":"La mielopatía cervical compresiva, generalmente degenerativa, merece especial mención por su frecuencia y porque es tratable. La compresión de las raíces cervicales produce signos de segunda motoneurona en los brazos, y la compresión medular, signos de primera motoneurona en las piernas, simulando una ELA. Estos pacientes no tienen signos en el territorio craneal, por lo que explorar la lengua y la musculatura bulbar ayuda al diagnóstico diferencial.","p":null},{"id":"Motoneurona_T18-8","b":"Motoneurona_T18","t":"T18","n":8,"q":"Volviendo al caso anterior, ¿qué hallazgo apoyaría el diagnóstico de ELA frente a una mielopatía cervical?","o":["Atrofia y fasciculaciones en la lengua.","Hiperreflexia rotuliana bilateral.","Ausencia de alteraciones en la RM cerebral.","Babinski bilateral."],"a":0,"e":"La mielopatía cervical no produce signos en el territorio craneal. La presencia de signos bulbares de segunda motoneurona (atrofia y fasciculaciones linguales) o de primera motoneurona en el territorio craneal indica afectación por encima del foramen magno y apoya la ELA. La hiperreflexia y el Babinski en las piernas aparecen en ambas entidades.","p":"Motoneurona_T18-7"},{"id":"Motoneurona_T18-9","b":"Motoneurona_T18","t":"T18","n":9,"q":"Mujer de 59 años con debilidad progresiva de la extensión del primer dedo del pie izquierdo que ha progresado a pie caído. Presenta atrofia del pedio y del tibial anterior, clonus aquíleo y Babinski izquierdos. La RM lumbar y cervical son normales y el EMG muestra denervación activa en tres regiones. Señale la afirmación CORRECTA:","o":["La forma de inicio lumbosacra es la de peor pronóstico.","La debilidad proximal es el inicio habitual de la ELA lumbosacra.","ELA de inicio lumbosacro, la forma de mejor pronóstico.","El clonus y el Babinski descartan una ELA en una extremidad con atrofia."],"a":2,"e":"El inicio lumbosacro (25-30 %) comienza con debilidad para la extensión del primer dedo y progresa a debilidad de la dorsiflexión del pie, con atrofia del pedio y del tibial anterior. Pueden coexistir clonus aquíleo y Babinski, signos de primera motoneurona en el mismo territorio que la atrofia, lo que es típico de la ELA. La debilidad proximal es poco frecuente como inicio. Es la forma de inicio con mejor pronóstico.","p":null},{"id":"Motoneurona_T18-10","b":"Motoneurona_T18","t":"T18","n":10,"q":"En un paciente con sospecha clínica de ELA, ¿cuál es el papel del electromiograma?","o":["Es imprescindible para confirmar la afectación de primera motoneurona.","No aporta información si la exploración clínica es concluyente.","Debe sustituirse por una biopsia muscular en todos los pacientes.","Confirma y extiende la afectación de segunda motoneurona."],"a":3,"e":"Lo más importante en el diagnóstico son la anamnesis y la exploración. El EMG confirma la afectación de segunda motoneurona (denervación aguda con fibrilaciones, fasciculaciones y ondas positivas, pérdida de unidades en el reclutamiento) y valora el número de regiones afectadas, incluida la musculatura paraespinal. La afectación de primera motoneurona puede apoyarse con estimulación magnética transcraneal y RM con espectroscopia. La RM descarta patología estructural, y la punción lumbar y la biopsia muscular se reservan para casos atípicos.","p":null},{"id":"Motoneurona_T18-11","b":"Motoneurona_T18","t":"T18","n":11,"q":"Varón de 63 años con debilidad progresiva documentada en visitas sucesivas a lo largo de un año. La exploración y el EMG muestran signos de segunda motoneurona (atrofia, fasciculaciones y denervación activa) en los miembros superiores y en la región lumbosacra, sin signos claros de primera motoneurona. Se han excluido otras causas. Según los criterios de Gold Coast (2019), ¿cumple criterios de ELA?","o":["Sí: progresión, afectación de segunda motoneurona en dos regiones y exclusión.","No: exige siempre signos de primera y segunda motoneurona en una misma región.","No: se requiere afectación de tres regiones con signos de ambas motoneuronas.","No: los criterios exigen siempre una biopsia muscular confirmatoria."],"a":0,"e":"Criterios de Gold Coast (2019): (1) deterioro motor progresivo documentado, precedido de función motora normal; (2) disfunción de primera y segunda motoneurona en al menos una región del cuerpo, o disfunción de segunda motoneurona en al menos dos regiones; (3) exclusión de otros procesos. Este paciente cumple la segunda opción.","p":null},{"id":"Motoneurona_T18-12","b":"Motoneurona_T18","t":"T18","n":12,"q":"Mujer de 55 años diagnosticada de ELA hace 2 meses. ¿Qué afirmación sobre el riluzol es CORRECTA?","o":["Detiene la progresión de la enfermedad y revierte la atrofia muscular ya establecida.","Es un agonista glutamatérgico que estimula la regeneración de los axones motores.","Inhibe la liberación de glutamato y prolonga la supervivencia 2-4 meses.","Solo está indicado en las formas familiares con mutación del gen SOD1."],"a":2,"e":"El riluzol (100 mg/día) es el tratamiento específico: inhibe la liberación presináptica de glutamato (frente a la excitotoxicidad mediada por receptores NMDA y AMPA), reduce la lesión neuronal, enlentece la progresión y aumenta la supervivencia en 2-4 meses. No detiene ni revierte la enfermedad. Efectos adversos más frecuentes: fatiga, somnolencia, náuseas, diarrea, mareo y elevación de las enzimas hepáticas.","p":null},{"id":"Motoneurona_T18-13","b":"Motoneurona_T18","t":"T18","n":13,"q":"Varón de 64 años con ELA de inicio bulbar que en los últimos meses ha perdido un 12 % de peso, tarda más de una hora en cada comida y ha tenido dos neumonías aspirativas. Su capacidad vital forzada desciende progresivamente. Señale la actitud MÁS adecuada:","o":["Mantener la vía oral con dieta túrmix para no medicalizar la fase final de la enfermedad.","PEG y valorar soporte ventilatorio, en un equipo multidisciplinar.","Iniciar corticoides para mejorar la fuerza de la musculatura bulbar.","Suspender el riluzol, ya que está contraindicado en las formas bulbares."],"a":1,"e":"El equipo multidisciplinar mejora la supervivencia y la calidad de vida: debe anticipar las complicaciones, mejorar el estado nutricional, evitar la vía oral si hay afectación bulbar importante y prevenir las infecciones aspirativas, con frecuencia mediante una PEG. Se vigila la función respiratoria con pruebas periódicas y se aporta ventilación no invasiva o invasiva cuando se precisa. La causa más frecuente de muerte es el fallo respiratorio y las neumonías por broncoaspiración. Factores de mal pronóstico: inicio bulbar, edad >50 años, deterioro rápido de la CVF y mal estado nutricional.","p":null},{"id":"Motoneurona_T18-14","b":"Motoneurona_T18","t":"T18","n":14,"q":"Varón de 58 años con ELA de un año de evolución. Su familia refiere desinhibición, conductas impulsivas, apatía y cambios en los hábitos alimentarios desde hace meses. Su madre falleció de una demencia. ¿Qué alteración genética es más probable?","o":["Mutación de SOD1, la más frecuente en la ELA esporádica.","Expansión de tripletes GAA en el gen de la frataxina.","Mutación en el gen de la espastina (paraparesia espástica).","Expansión en el gen C9orf72."],"a":3,"e":"La mayoría de los pacientes con ELA no tiene clínica cognitiva, pero un porcentaje desarrolla una demencia frontotemporal (complejo DFT-ELA), especialmente con mutación del gen C9orf72. SOD1 (cobre-zinc superóxido dismutasa) está mutado en el 20 % de las ELA familiares y solo en el 2 % de las esporádicas. El 90 % de las ELA son esporádicas y el 10 %, familiares. La frataxina corresponde a la ataxia de Friedreich y la espastina a la paraparesia espástica hereditaria.","p":null},{"id":"Motoneurona_T18-15","b":"Motoneurona_T18","t":"T18","n":15,"q":"Mujer de 60 años con ELA avanzada, anartria y tetraplejía, sin alteración cognitiva. Su familia pregunta cómo podrá comunicarse. ¿Qué opción se apoya en una característica de la enfermedad?","o":["Dispositivo de rastreo ocular.","Comunicador manual, ya que los flexores de la mano se preservan siempre.","Ninguna, porque la oftalmoparesia es precoz en la ELA.","Logopedia intensiva, con la que se recupera el habla."],"a":0,"e":"En la ELA, los músculos oculares extrínsecos se respetan hasta fases muy avanzadas o durante toda la enfermedad, lo que permite usar dispositivos de rastreo ocular para mantener una comunicación efectiva cuando la disartria evoluciona a anartria. Una alteración oculomotora precoz debe hacer dudar del diagnóstico. Los flexores de la mano se respetan hasta fases finales, pero no durante toda la enfermedad.","p":null},{"id":"Neuropatias_T19-T20-1","b":"Neuropatias_T19-T20","t":"T19","n":1,"q":"Mujer de 76 años con cefalea temporal de 3 semanas, dolor al masticar, febrícula y pérdida de peso, que hoy se despierta con pérdida brusca e indolora de visión en el ojo derecho. La arteria temporal derecha está indurada y sin pulso. La VSG es de 98 mm/h y la PCR está elevada. ¿Cuál es la actitud inmediata?","o":["Esperar el resultado de la biopsia de la arteria temporal antes de iniciar los corticoides.","Bolo IV inmediato de metilprednisolona 1000 mg, después 250-500 mg/día 3-5 días y descenso.","Antiagregación con AAS y control de factores de riesgo, por tratarse de una forma no arterítica.","Corticoides orales a dosis bajas (10 mg/día) para minimizar efectos adversos y revisión en un mes."],"a":1,"e":"Neuropatía óptica isquémica anterior arterítica por arteritis de células gigantes (Horton): pérdida visual monocular rápida e indolora, con VSG y PCR elevadas, induración de las arterias temporales, cefalea, claudicación mandibular y pérdida de peso. Es una urgencia: los apuntes recogen un bolo inicial de metilprednisolona 1000 mg, seguido de 250-500 mg/día durante 3-5 días y pauta descendente. No hay que retrasar el tratamiento por la biopsia, por el riesgo de afectación del otro ojo. Tiene mal pronóstico visual.","p":null},{"id":"Neuropatias_T19-T20-2","b":"Neuropatias_T19-T20","t":"T19","n":2,"q":"Varón de 63 años, hipertenso, diabético y dislipémico, que al despertar nota que no ve la mitad inferior del campo visual del ojo izquierdo. No tiene dolor. Presenta edema de papila sectorial con hemorragias en astilla, y la visión de los colores está relativamente preservada. La VSG y la PCR son normales. ¿Cuál es el diagnóstico más probable?","o":["Neuritis óptica desmielinizante retrobulbar.","Neuropatía óptica hereditaria de Leber.","Neuropatía óptica isquémica no arterítica.","Neuropatía óptica compresiva por meningioma del ala esfenoidal."],"a":2,"e":"La neuropatía óptica isquémica es la principal causa de pérdida visual unilateral aguda (de minutos a horas). Se produce en pacientes con factores de riesgo vascular, mayores de 50 años, con un déficit rápido e indoloro, hemorragias peripapilares y papilitis, por isquemia de las ramas terminales de las arterias ciliares posteriores. La forma no arterítica es la más frecuente y se asocia a HTA, diabetes e hiperlipemia: palidez o edema papilar, defecto altitudinal inferior, hemorragias en astilla y relativa preservación de la visión cromática. Tiene mal pronóstico. Con VSG y PCR normales es poco probable la arterítica.","p":null},{"id":"Neuropatias_T19-T20-3","b":"Neuropatias_T19-T20","t":"T19","n":3,"q":"Mujer de 26 años con dolor en el ojo izquierdo al moverlo, seguido en los días siguientes de pérdida de visión de ese ojo y de que los colores le parecen 'apagados'. Presenta un escotoma central, un defecto pupilar aferente izquierdo y un fondo de ojo normal. ¿Cuál es el diagnóstico y qué aporta el tratamiento?","o":["Neuritis óptica retrobulbar; los corticoides IV acortan el tiempo de recuperación.","Neuropatía óptica isquémica arterítica; los corticoides evitan la afectación del otro ojo.","Neuritis óptica retrobulbar; los corticoides IV mejoran el pronóstico visual final.","Neuropatía óptica hereditaria de Leber; no existe un tratamiento eficaz."],"a":0,"e":"La neuritis óptica desmielinizante, típica de jóvenes (esclerosis múltiple), es subaguda, con dolor en los días previos y alteración de la visión cromática. Suele ser retrobulbar (sin edema de papila), con escotoma central o centrocecal y defecto pupilar aferente. Los corticoides parenterales reducen el tiempo de recuperación, pero la recuperación del déficit visual es parcial. No se ha demostrado que mejoren el resultado visual final (C).","p":null},{"id":"Neuropatias_T19-T20-4","b":"Neuropatias_T19-T20","t":"T19","n":4,"q":"Varón de 67 años, diabético, con dolor periorbitario derecho y visión doble de instauración brusca. Presenta ptosis derecha y ojo derecho desviado hacia fuera y ligeramente hacia abajo, con limitación de la aducción, la elevación y la depresión. Las pupilas son simétricas y reactivas. ¿Cuál es la causa más probable y su pronóstico?","o":["Aneurisma de la arteria comunicante posterior, con alto riesgo de rotura.","Herniación del uncus por un hematoma intracraneal.","Lesión nuclear mesencefálica, con ptosis bilateral asociada.","Isquemia del III par (microvascular), con buena recuperación en meses."],"a":3,"e":"Parálisis del III par: diplopía binocular horizontal, ptosis, ojo desviado hacia fuera y abajo y, si se afecta el parasimpático, midriasis arreactiva. La isquemia del nervio en pacientes con factores de riesgo vascular (diabetes) produce una oftalmoplejía dolorosa, generalmente con respeto pupilar, y buena recuperación en unos meses. Las fibras pupilares van en la periferia del nervio y se lesionan precozmente en las compresiones (aneurisma de la comunicante posterior). Una lesión nuclear produce ptosis bilateral y afectación del recto superior contralateral.","p":null},{"id":"Neuropatias_T19-T20-5","b":"Neuropatias_T19-T20","t":"T19","n":5,"q":"Mujer de 48 años con cefalea intensa de 2 días y visión doble. Presenta ptosis completa izquierda, ojo izquierdo desviado hacia fuera y abajo y midriasis izquierda arreactiva. ¿Cuál es la actitud más adecuada?","o":["Angio-TC o angio-RM urgente por sospecha de aneurisma de la comunicante posterior.","Observación y control glucémico, ya que la causa más probable es la isquemia microvascular.","Corticoides orales por sospecha de síndrome de Tolosa-Hunt, sin necesidad de neuroimagen.","Prueba de neostigmina y anticuerpos antirreceptor de acetilcolina por sospecha de miastenia."],"a":0,"e":"La parálisis del III par con afectación precoz de la pupila sugiere una lesión compresiva en el trayecto subaracnoideo, sobre todo un aneurisma de la arteria comunicante posterior. Es una urgencia que exige estudio vascular inmediato. Otras causas compresivas son los tumores y la herniación del uncus. La miastenia no afecta a la pupila. El Tolosa-Hunt es una oftalmoplejía dolorosa inflamatoria del seno cavernoso y es un diagnóstico de exclusión.","p":null},{"id":"Neuropatias_T19-T20-6","b":"Neuropatias_T19-T20","t":"T19","n":6,"q":"Varón de 34 años que, tras un traumatismo craneal en moto, refiere visión doble vertical que empeora al bajar escaleras y al leer. Mantiene la cabeza inclinada hacia el hombro izquierdo. El ojo derecho está ligeramente más alto, y la desviación aumenta al inclinar la cabeza hacia el hombro derecho. ¿Qué nervio está afectado?","o":["III par derecho.","VI par izquierdo.","IV par derecho.","IV par izquierdo."],"a":2,"e":"El IV par inerva el oblicuo superior o mayor, que desvía el ojo hacia abajo (sobre todo en aducción). En su parálisis troncular el ojo afectado está ligeramente elevado (hipertropía), con diplopía vertical máxima al mirar hacia abajo y hacia dentro (bajar escaleras, leer). El signo de Bielschowsky es el aumento de la desviación al inclinar la cabeza hacia el hombro ipsilateral al ojo afectado; por eso el paciente compensa inclinándola al lado contrario. La causa más frecuente son los traumatismos craneales. Una lesión nuclear afecta al oblicuo mayor contralateral, porque el nervio se cruza.","p":null},{"id":"Neuropatias_T19-T20-7","b":"Neuropatias_T19-T20","t":"T19","n":7,"q":"Mujer de 29 años, obesa, con cefalea progresiva de 2 meses que empeora al acostarse, episodios de visión borrosa transitoria y, desde hace una semana, visión doble horizontal que empeora al mirar a lejos. El ojo derecho no abduce completamente. El fondo de ojo muestra edema de papila bilateral. Señale la interpretación CORRECTA:","o":["La parálisis del VI par localiza la lesión en la protuberancia derecha, y obliga a una RM de tronco.","El edema de papila bilateral orienta a una neuritis óptica bilateral de origen desmielinizante.","El VI par puede afectarse por la propia hipertensión intracraneal, que explica el edema de papila.","La diplopía horizontal sugiere un estrabismo previo descompensado, sin significado neurológico."],"a":2,"e":"El VI par inerva el recto externo; su parálisis troncular produce diplopía binocular horizontal con el ojo desviado hacia dentro y limitación de la abducción. Entre sus causas está la hipertensión intracraneal, por su largo trayecto intracraneal, sin que haya lesión en el propio nervio. El edema de papila bilateral suele indicar hipertensión intracraneal, y el unilateral, una alteración del nervio óptico. Una lesión nuclear del VI par produce una paresia de toda la mirada horizontal, y una lesión protuberancial suele asociar paresia facial.","p":null},{"id":"Neuropatias_T19-T20-8","b":"Neuropatias_T19-T20","t":"T19","n":8,"q":"Varón de 55 años con dolor retroorbitario izquierdo intenso de 2 semanas y visión doble. Presenta paresia de los pares III, IV y VI izquierdos e hipoestesia en la frente izquierda (territorio de V1). ¿Dónde se localiza más probablemente la lesión?","o":["Mesencéfalo izquierdo.","Seno cavernoso izquierdo.","Ápice del peñasco izquierdo.","Agujero rasgado posterior izquierdo."],"a":1,"e":"Las parálisis combinadas de los oculomotores se deben al síndrome de Tolosa-Hunt, al síndrome de Miller Fisher, al síndrome del seno cavernoso (asociado a afectación de la primera rama del trigémino) y al síndrome de la fisura esfenoidal. Por el seno cavernoso pasan los pares III, IV y VI y la rama V1. Causas: aneurismas carotídeos, tumores, procesos expansivos y el síndrome de Tolosa-Hunt (oftalmoplejía dolorosa inflamatoria idiopática). El agujero rasgado posterior afecta a los pares IX, X y XI.","p":null},{"id":"Neuropatias_T19-T20-9","b":"Neuropatias_T19-T20","t":"T19","n":9,"q":"Mujer de 40 años que tras un dolor retroauricular izquierdo de un día amanece sin poder cerrar el ojo izquierdo ni elevar la ceja de ese lado, con la boca desviada a la derecha. Al intentar cerrar el ojo izquierdo, este se desvía hacia arriba. Refiere molestia con los ruidos y alteración del gusto. No hay vesículas ni otros hallazgos. ¿Cuál es el tratamiento indicado?","o":["Prednisona 1 mg/kg/día durante 5 días, con descenso en otros 5 días.","Aciclovir intravenoso en monoterapia durante 7 días, sin corticoides.","Cirugía descompresiva urgente del nervio facial en el canal de Falopio.","Observación sin tratamiento, porque siempre recupera por completo."],"a":0,"e":"Parálisis de Bell: la causa más frecuente de parálisis facial periférica aguda, sin antecedentes y con el resto de la exploración normal. Se debe a una inflamación del nervio en el canal facial. Cursa con dolor retroauricular previo, déficit motor en horas o días (incluida la musculatura frontal) y signo de Bell. La hiperacusia indica lesión proximal a la rama del estapedio, y la alteración del gusto, proximal a la cuerda del tímpano: tiene valor localizador. Tratamiento: prednisona 1 mg/kg durante 5 días y descenso rápido en otros 5.","p":null},{"id":"Neuropatias_T19-T20-10","b":"Neuropatias_T19-T20","t":"T19","n":10,"q":"Varón de 62 años con dolor intenso en el oído derecho de 3 días, seguido de parálisis facial periférica derecha y vértigo. En la exploración se observan vesículas en el pabellón auricular y el conducto auditivo externo derechos. ¿Cuál es el diagnóstico y el tratamiento?","o":["Parálisis de Bell; corticoides en monoterapia y protección ocular.","Síndrome de Melkersson-Rosenthal; corticoides y estudio de recurrencias.","Otitis media complicada con colesteatoma; cirugía otológica urgente.","Síndrome de Ramsay Hunt; aciclovir o valaciclovir más corticoides."],"a":3,"e":"El síndrome de Ramsay Hunt es una parálisis facial aguda y dolorosa por herpes zóster: dolor auricular y mastoideo, paresia facial y erupción vesicular en el pabellón auricular y el CAE, a veces con vértigo. Se trata con antivirales (aciclovir, famciclovir, valaciclovir) y corticoides. El Melkersson-Rosenthal cursa con parálisis faciales recurrentes, edema facial y lengua plicata. Una parálisis facial aguda en el contexto de una otitis obliga a pensar en un colesteatoma.","p":null},{"id":"Neuropatias_T19-T20-11","b":"Neuropatias_T19-T20","t":"T19","n":11,"q":"Mujer de 33 años, embarazada de 30 semanas, que se despierta varias noches con dolor y hormigueo en el pulgar, el índice y el medio de la mano derecha, que mejoran al sacudir la mano. ¿Cuál es el diagnóstico y el manejo inicial?","o":["Radiculopatía C6-C7; RM cervical urgente y valoración por Neurocirugía.","Túnel carpiano; confirmar con EMG/ENG y férula nocturna inicialmente.","Neuropatía cubital en el canal de Guyon; cirugía descompresiva inmediata.","Síndrome de la costilla cervical; maniobra de Adson y resección quirúrgica."],"a":1,"e":"El síndrome del túnel carpiano es la afectación más frecuente del nervio mediano, por compresión en el carpo. Es más frecuente en mujeres desde la quinta década y se asocia a microtraumatismos, hipotiroidismo, embarazo, diabetes, artritis reumatoide y sarcoidosis. Produce dolor y parestesias de predominio nocturno en los tres primeros dedos, con déficit sensitivo y motor y atrofia tenar en casos avanzados. Se confirma con EMG/ENG, y el tratamiento es conservador (antiinflamatorios, férulas nocturnas) o quirúrgico.","p":null},{"id":"Neuropatias_T19-T20-12","b":"Neuropatias_T19-T20","t":"T19","n":12,"q":"Varón de 45 años que, tras pasar varias horas en cuclillas colocando suelo, presenta pie caído derecho con marcha en estepaje. Tiene debilidad para la flexión dorsal del pie y de los dedos y para la eversión, con inversión conservada, e hipoestesia en el dorso del pie. Los reflejos son normales. ¿Cuál es el diagnóstico más probable?","o":["Radiculopatía L5 por hernia discal lumbar.","Meralgia parestésica por compresión del femorocutáneo.","Plexopatía lumbosacra por hematoma del psoas.","Mononeuropatía del peroneo en la cabeza del peroné."],"a":3,"e":"El nervio peroneo se comprime con frecuencia en la cabeza del peroné por traumatismos o posturas forzadas prolongadas (cuclillas, de rodillas, encamamiento). Produce debilidad de los extensores del pie y de los dedos y de la eversión, según el punto de compresión. La conservación de la inversión (tibial posterior, inervado por el tibial) ayuda a diferenciarla de una radiculopatía L5. La meralgia parestésica es exclusivamente sensitiva, en la cara anterolateral del muslo.","p":null},{"id":"Neuropatias_T19-T20-13","b":"Neuropatias_T19-T20","t":"T19","n":13,"q":"Varón de 58 años con fiebre, astenia, pérdida de 6 kg y mialgias de 2 meses. En las últimas semanas, de forma escalonada, ha presentado pie caído izquierdo, debilidad para extender la muñeca derecha y hormigueo doloroso en el borde cubital de la mano izquierda. ¿Cuál es el síndrome y qué etiología debe sospecharse en primer lugar?","o":["Polineuropatía diabética simétrica distal; optimizar el control glucémico.","Síndrome de Guillain-Barré; inmunoglobulinas IV a 0,4 g/kg/día durante 5 días.","Mononeuropatía múltiple por vasculitis (PAN); biopsia y corticoides o inmunosupresores.","Esclerosis lateral amiotrófica de inicio distal; riluzol y seguimiento en una unidad de ELA."],"a":2,"e":"La mononeuropatía múltiple es la afectación de varios nervios individuales de forma asíncrona y asimétrica. Su etiología es más restringida que la de las polineuropatías, la biopsia neuromuscular es más útil y el tratamiento precoz mejora claramente el pronóstico. La causa más frecuente entre las vasculitis necrosantes es la poliarteritis nudosa (adultos de edad media, con fiebre, astenia, pérdida de peso y mialgias); también la diabetes, las enfermedades del tejido conectivo y las infecciones. Diagnóstico: EMG/ENG y estudio sistémico (VSG, FR, ANA, ANCA, eosinofilia, serologías). Tratamiento: corticoides e inmunosupresores.","p":null},{"id":"Neuropatias_T19-T20-14","b":"Neuropatias_T19-T20","t":"T19","n":14,"q":"Varón de 27 años que, una semana después de vacunarse, presenta un dolor muy intenso en el hombro derecho y la base del cuello, que empeora por la noche. A los 4 días el dolor cede y aparece debilidad para elevar el brazo con escápula alada y atrofia precoz de la musculatura del hombro. ¿Cuál es el diagnóstico y su pronóstico?","o":["Radiculopatía C5 por hernia discal cervical; descompresión quirúrgica urgente.","Rotura del manguito de los rotadores; ecografía y reparación artroscópica.","Tumor del vértice pulmonar (Pancoast); pronóstico vital sombrío.","Síndrome de Parsonage-Turner; recuperación lenta pero buen pronóstico."],"a":3,"e":"Síndrome de Parsonage-Turner: predomina en varones jóvenes y aparece de forma espontánea o tras vacunaciones o infecciones (por una desmielinización focal inflamatoria). Comienza con dolor intenso en el hombro, la base del cuello o la nuca, de predominio nocturno, y tras horas o días aparece parálisis de la musculatura del hombro y proximal del brazo con amiotrofia precoz. Afecta al plexo superior y en especial al nervio torácico largo (escápula alada); hasta un 25 % es bilateral. Se confirma con EMG/ENG y hay que descartar neoplasias del vértice pulmonar. Tratamiento: inmovilización, analgesia, corticoides, inmunoglobulinas y rehabilitación.","p":null},{"id":"Neuropatias_T19-T20-15","b":"Neuropatias_T19-T20","t":"T19","n":15,"q":"Varón de 61 años, fumador de 45 paquetes-año, con dolor progresivo en el hombro y el borde cubital del brazo izquierdo, debilidad de la musculatura intrínseca de la mano izquierda y ptosis y miosis izquierdas. ¿Cuál es la sospecha y cómo se estudia?","o":["Tumor de Pancoast con afectación de C8-D1 y síndrome de Horner; RM de plexo y EMG/ENG.","Síndrome de Parsonage-Turner; corticoides orales e inmovilización, sin necesidad de imagen.","Síndrome de la costilla cervical; maniobra de Adson positiva y resección quirúrgica.","Disección de la carótida interna con Horner; angio-TC urgente de troncos supraaórticos."],"a":0,"e":"Los tumores del vértice pulmonar (Pancoast), los de mama y las metástasis ganglionares pueden debutar con clínica del plexo braquial. Suelen afectar a las raíces C8-D1 (musculatura intrínseca de la mano, borde cubital) y asociar un síndrome de Horner. El diagnóstico se hace con RM del plexo y EMG/ENG. La costilla cervical produce parestesias y dolor en la mano con atrofia tenar en fases avanzadas y pérdida del pulso radial con la maniobra de Adson, pero no Horner.","p":null},{"id":"Neuropatias_T19-T20-16","b":"Neuropatias_T19-T20","t":"T20","n":16,"q":"Varón de 35 años que, 2 semanas después de una gastroenteritis, presenta parestesias en manos y pies y debilidad que comenzó en las piernas y en 5 días ha ascendido a los brazos. Refiere dolor lumbar. En la exploración tiene tetraparesia simétrica de predominio distal con arreflexia generalizada y diplejía facial leve. No hay nivel sensitivo ni alteración esfinteriana. ¿Cuál es el diagnóstico y la actitud?","o":["Guillain-Barré; ingreso con monitorización respiratoria y autonómica, punción lumbar y EMG/ENG.","Miastenia gravis generalizada; prueba de edrofonio, anticuerpos y tratamiento con piridostigmina.","Mielitis transversa aguda; RM medular urgente y bolos de metilprednisolona intravenosa.","Polineuropatía diabética de rápida evolución; control glucémico estricto y seguimiento ambulatorio."],"a":0,"e":"Síndrome de Guillain-Barré: polirradiculoneuropatía inmunomediada aguda y monofásica, precedida en el 70 % de los casos por una infección (Campylobacter jejuni en el 30 %). Tríada: debilidad progresiva ascendente y simétrica, hipo o arreflexia y parestesias distales; es frecuente el dolor interescapular o lumbar, y la diplejía facial aparece en el 50 %. El 90 % alcanza el máximo déficit a las 4 semanas. Es una urgencia: un 10-30 % precisa soporte ventilatorio y el 70 % tiene disautonomía. El diagnóstico se basa en la clínica, el LCR y el estudio neurofisiológico.","p":null},{"id":"Neuropatias_T19-T20-17","b":"Neuropatias_T19-T20","t":"T20","n":17,"q":"En el paciente anterior, la punción lumbar realizada al tercer día de evolución muestra proteínas y células normales. Señale la actitud CORRECTA:","o":["El LCR normal descarta el síndrome de Guillain-Barré y obliga a buscar otra causa.","No lo excluye: la disociación albuminocitológica aparece a lo largo de la primera semana.","Debe iniciarse antibioterapia empírica por sospecha de meningitis bacteriana decapitada.","La normalidad del LCR orienta a una miopatía inflamatoria y obliga a solicitar CK y biopsia."],"a":1,"e":"En el LCR del Guillain-Barré las proteínas aumentan a lo largo de la primera semana, sin aumento de células (normales hasta 5/mm³; nunca más de 50, y siempre linfocitos): es la disociación albuminocitológica. En los primeros días tanto el LCR como el estudio neurofisiológico pueden ser normales, y en una parte de los pacientes la disociación no aparece nunca. El diagnóstico se sustenta en la clínica.","p":"Neuropatias_T19-T20-16"},{"id":"Neuropatias_T19-T20-18","b":"Neuropatias_T19-T20","t":"T20","n":18,"q":"Mujer de 42 años con debilidad progresiva de ambas piernas de 5 días, retención urinaria desde el inicio, nivel sensitivo en D10 y fiebre. Los reflejos rotulianos están abolidos. El LCR muestra 120 células/mm³. ¿Qué actitud es la más adecuada?","o":["Confirmar un síndrome de Guillain-Barré e iniciar inmunoglobulinas IV sin más estudios.","Diagnosticar un síndrome de Miller Fisher por la arreflexia.","Dudar del diagnóstico de Guillain-Barré y descartar una lesión medular con RM urgente.","Iniciar plasmaféresis de forma inmediata, por ser más eficaz que las inmunoglobulinas."],"a":2,"e":"Ponen en duda el diagnóstico de Guillain-Barré: nivel sensitivo, asimetría marcada y persistente de la debilidad, disfunción urinaria o intestinal al inicio o grave y persistente, déficit sensitivo intenso con poca debilidad, fiebre, LCR atípico (más de 50 células) y disfunción pulmonar intensa sin debilidad. Aquí concurren varios, lo que orienta a patología medular (mielitis, compresión). La arreflexia puede deberse a la fase aguda de la lesión medular.","p":null},{"id":"Neuropatias_T19-T20-19","b":"Neuropatias_T19-T20","t":"T20","n":19,"q":"Paciente con síndrome de Guillain-Barré de 4 días de evolución. ¿Cuál de los siguientes hallazgos se asocia a una mayor probabilidad de necesitar ventilación mecánica?","o":["Hipoestesia distal en guante y calcetín en las cuatro extremidades.","Incapacidad para toser y para levantar la cabeza.","Arreflexia aquílea y rotuliana bilateral.","Parestesias distales en manos y pies."],"a":1,"e":"Los apuntes recogen seis parámetros: evolución menor de 7 días, incapacidad para toser, incapacidad para levantarse sin ayuda, para levantar las rodillas o para levantar la cabeza desde el plano horizontal, y elevación de las transaminasas. Con 4 de esos 6, el 85 % de los pacientes necesita ventilación mecánica. Un 25 % de los pacientes con Guillain-Barré requiere UCI.","p":null},{"id":"Neuropatias_T19-T20-20","b":"Neuropatias_T19-T20","t":"T20","n":20,"q":"Varón de 50 años con síndrome de Guillain-Barré de 6 días de evolución, que ya no puede caminar sin ayuda. ¿Cuál es el tratamiento indicado?","o":["Metilprednisolona IV a dosis altas durante 5 días.","Solo medidas de soporte, porque ningún tratamiento modifica la evolución.","Prednisona oral 1 mg/kg/día asociada a sesiones de plasmaféresis.","Inmunoglobulinas IV a 0,4 g/kg/día durante 5 días."],"a":3,"e":"Si el paciente no puede caminar sin ayuda y lleva menos de 15 días de evolución (ampliable a 4 semanas), se trata con inmunoglobulinas IV (0,4 g/kg/día durante 5 días). La plasmaféresis tiene el mismo resultado, pero es más invasiva y tiene más complicaciones (4-5 recambios en 1-2 semanas). No se recomienda tratar a pacientes muy leves. Los corticoides no han demostrado beneficio. Además se mantienen las funciones vitales, se previene la TVP, se corrige el SIADH y se hace rehabilitación.","p":null},{"id":"Neuropatias_T19-T20-21","b":"Neuropatias_T19-T20","t":"T20","n":21,"q":"Mujer de 39 años ingresada por un síndrome de Guillain-Barré, que presenta fluctuaciones bruscas de la presión arterial entre 80/50 y 190/110 mmHg, taquicardia, íleo paralítico y un sodio de 124 mEq/l. Señale la afirmación CORRECTA:","o":["Se deben a la disautonomía del Guillain-Barré; la hiponatremia puede deberse a un SIADH.","La disautonomía es excepcional en el Guillain-Barré y obliga a descartar un feocromocitoma.","Corresponden a disautonomía, que en el Guillain-Barré se acompaña siempre de retención urinaria.","La hiponatremia no se explica por el Guillain-Barré y obliga a descartar una porfiria aguda."],"a":0,"e":"La disautonomía aparece en el 70 % de los casos: hiper o hipofunción simpática con taquicardia, arritmias, hipotensión grave o hipertensión, anomalías de la sudoración y la termorregulación y paresia intestinal, pero no alteración esfinteriana. Precisa vigilancia estrecha y es motivo de ingreso en UCI. Una complicación posible es el SIADH con hiponatremia.","p":null},{"id":"Neuropatias_T19-T20-22","b":"Neuropatias_T19-T20","t":"T20","n":22,"q":"Varón de 45 años que, 10 días después de una infección respiratoria, presenta visión doble, inestabilidad de la marcha y torpeza de las manos. En la exploración tiene oftalmoplejía bilateral, ataxia y arreflexia generalizada, con fuerza conservada. ¿Qué anticuerpo es más probable y cuál es el tratamiento?","o":["Anti-GM1; plasmaféresis.","Anti-Hu; quimioterapia.","Anti-GQ1b; inmunoglobulinas IV.","Antirreceptor de acetilcolina; piridostigmina."],"a":2,"e":"El síndrome de Miller Fisher es una variante del Guillain-Barré (5 % de los casos, más frecuente en Japón) con oftalmoplejía, arreflexia y ataxia, aunque hay cuadros incompletos. Se relaciona típicamente con anticuerpos anti-GQ1b (85-90 %), y el LCR es similar al del Guillain-Barré clásico. Diagnóstico diferencial: ictus o encefalitis de tronco, encefalopatía de Wernicke y miastenia gravis. Tratamiento: inmunoglobulinas IV.","p":null},{"id":"Neuropatias_T19-T20-23","b":"Neuropatias_T19-T20","t":"T20","n":23,"q":"Varón de 23 años que, 2 semanas después de una diarrea en verano, desarrolla una tetraparesia aguda, simétrica y puramente motora, sin alteración sensitiva y con reflejos conservados. Los anticuerpos anti-GM1 son positivos. ¿Qué variante presenta?","o":["Polirradiculoneuropatía desmielinizante inflamatoria aguda (AIDP).","Neuropatía axonal sensitivo-motora aguda (AMSAN).","Síndrome de Miller Fisher.","Neuropatía axonal motora aguda (AMAN)."],"a":3,"e":"La AMAN es una variante con escasa desmielinización: cuadro puramente motor, con debilidad y preservación de los reflejos. Es la más desencadenada por Campylobacter jejuni (más casos en verano y en orientales), con anticuerpos anti-GM1, anti-GD1a y anti-GD1b. Hay degeneración axonal sin respuesta inflamatoria, con ataque a los nodos de Ranvier. Suele tener buena recuperación. La AMSAN es similar, pero motora y sensitiva y más intensa. En Europa y EE. UU. la AIDP supone el 85-90 % de los casos.","p":null},{"id":"Neuropatias_T19-T20-24","b":"Neuropatias_T19-T20","t":"T20","n":24,"q":"Mujer de 52 años diagnosticada de síndrome de Guillain-Barré, en la que la debilidad sigue progresando 10 semanas después del inicio, con un patrón desmielinizante en el EMG. ¿Qué diagnóstico debe plantearse?","o":["Guillain-Barré con evolución habitual, que no cambia el diagnóstico.","Polirradiculoneuropatía desmielinizante crónica (CIDP).","Esclerosis lateral amiotrófica de inicio bulbar.","Neuropatía axonal motora aguda (AMAN) prolongada."],"a":1,"e":"En el Guillain-Barré la progresión se objetiva en las dos primeras semanas, y en las primeras cuatro el 90 % alcanza el máximo déficit; después hay una fase de estabilidad y otra de recuperación que puede durar meses. Si el curso se prolonga más de 8 semanas, hay que pensar en una CIDP (polirradiculoneuropatía desmielinizante inflamatoria crónica).","p":null},{"id":"Neuropatias_T19-T20-25","b":"Neuropatias_T19-T20","t":"T20","n":25,"q":"¿Cuál de las siguientes combinaciones se asocia a peor pronóstico en el síndrome de Guillain-Barré?","o":["Edad menor de 30 años en el momento del diagnóstico.","Antecedente de infección previa por Mycoplasma.","Ventilación asistida y edad mayor de 60 años.","Presencia de diplejía facial asociada a la debilidad."],"a":2,"e":"Factores de mal pronóstico: tetraplejía, edad mayor de 60 años, necesidad de ventilación asistida y descenso de la amplitud de los potenciales motores en más del 10 %. La mortalidad es del 3-5 % y un 5-10 % queda con secuelas definitivas.","p":null},{"id":"Neuropatias_T19-T20-26","b":"Neuropatias_T19-T20","t":"T20","n":26,"q":"Varón de 41 años con debilidad lentamente progresiva desde hace un año para extender los dedos de la mano derecha y, después, para separar los dedos de la mano izquierda, con atrofia leve, calambres y algunas fasciculaciones. No hay alteraciones sensitivas, los reflejos están disminuidos en los brazos y no hay signos piramidales ni bulbares. ¿Qué estudio confirma el diagnóstico más probable y cuál es su tratamiento?","o":["EMG con denervación activa en tres regiones; riluzol.","Biopsia muscular con infiltrados inflamatorios; corticoides.","RM cervical con estenosis de canal; descompresión quirúrgica.","ENG con bloqueos de conducción motora; inmunoglobulinas IV."],"a":3,"e":"Neuropatía motora multifocal con bloqueos de la conducción: inmunomediada, más frecuente en varones de 20-50 años, con debilidad asimétrica subaguda, distal en los brazos, en el territorio de al menos dos nervios motores, sin alteración sensitiva y con reflejos normales o disminuidos; puede asociar fasciculaciones y calambres. Excluyen el diagnóstico los signos de primera motoneurona, la afectación bulbar intensa y la alteración sensitiva marcada. El EMG/ENG muestra desmielinización focal y bloqueos de la conducción motora fuera de los sitios habituales de compresión; hay anti-GM1 en el 30-80 %. Tratamiento: inmunoglobulinas IV periódicas. Los corticoides están contraindicados y la plasmaféresis no es eficaz. El diagnóstico diferencial principal es la ELA.","p":null},{"id":"Neuropatias_T19-T20-27","b":"Neuropatias_T19-T20","t":"T20","n":27,"q":"Varón de 64 años con diabetes tipo 2 de 15 años de evolución mal controlada, que refiere quemazón y hormigueo en ambos pies que ha ido ascendiendo hasta los tobillos, peor por la noche. Presenta hipoestesia en calcetín, abolición de los reflejos aquíleos y fuerza normal. Señale la afirmación CORRECTA:","o":["Es una mononeuropatía múltiple, la forma más frecuente de neuropatía diabética.","Polineuropatía simétrica distal axonal; control glucémico y fármacos para el dolor.","Polineuropatía desmielinizante adquirida que responde a inmunoglobulinas IV periódicas.","El EMG/ENG es innecesario, puesto que en un diabético la causa siempre es la diabetes."],"a":1,"e":"La diabetes es la causa más frecuente de polineuropatía en los países industrializados, sobre todo con mal control y larga evolución. La forma más frecuente es la polineuropatía simétrica distal sensitivo-motora, insidiosa, de predominio en las piernas, con más clínica sensitiva que motora y afectación sobre todo axonal. Otras formas: autonómica, sensitiva aguda dolorosa, craneales, radiculopatía toracoabdominal, mononeuropatías y amiotrofia diabética. Tratamiento: el de la causa y el sintomático del dolor. El EMG/ENG caracteriza el tipo y la intensidad, y hasta en un 20 % de las polineuropatías no se identifica la causa.","p":null},{"id":"Neuropatias_T19-T20-28","b":"Neuropatias_T19-T20","t":"T20","n":28,"q":"Mujer de 61 años, fumadora, con dolor, entumecimiento e inestabilidad de la marcha de 2 meses de evolución, que empeora con los ojos cerrados. Presenta pérdida grave de la sensibilidad posicional y vibratoria en las cuatro extremidades con arreflexia y fuerza conservada. El EMG muestra una neuropatía sensitiva axonal. ¿Qué estudio es prioritario?","o":["Anti-Hu y búsqueda de carcinoma microcítico de pulmón.","Anticuerpos anti-GQ1b y RM de tronco del encéfalo.","Estudio genético de Charcot-Marie-Tooth (PMP22).","Anticuerpos anti-GM1 y estudio de bloqueos de conducción."],"a":0,"e":"La neuropatía paraneoplásica más típica es la sensitiva de presentación subaguda, con hipoestesia, dolor y alteración de la propiocepción que produce ataxia de la marcha. Se asocia a carcinoma microcítico de pulmón en el 80 % de los casos, con anticuerpos anti-Hu en suero. El EMG/ENG muestra una neuropatía sensitiva de predominio axonal. Los tumores que más se asocian a polineuropatía son los de pulmón, mama, ovario y los linfomas.","p":null},{"id":"Neuropatias_T19-T20-29","b":"Neuropatias_T19-T20","t":"T20","n":29,"q":"Chico de 17 años con caídas frecuentes y torceduras de tobillo desde la infancia. Presenta pies cavos, dedos en martillo, atrofia de la musculatura distal de las piernas, debilidad para la dorsiflexión, arreflexia aquílea y déficit sensitivo leve. Su madre tiene los mismos pies. El EMG/ENG muestra una disminución difusa y homogénea de las velocidades de conducción. ¿Cuál es el diagnóstico más probable?","o":["Charcot-Marie-Tooth tipo 1A, desmielinizante y AD.","Charcot-Marie-Tooth tipo 2, axonal y autosómica dominante.","Ataxia de Friedreich, autosómica recesiva.","Polirradiculoneuropatía desmielinizante inflamatoria crónica."],"a":0,"e":"Charcot-Marie-Tooth (neuropatía sensitivo-motora hereditaria): prevalencia de 10-30/100.000, herencia autosómica dominante en la mayoría. Comienza en la primera o segunda década con debilidad y atrofia distal lentamente progresivas, hiporreflexia, pies cavos y dedos en martillo, y déficit sensitivo leve. La CMT1 es desmielinizante y autosómica dominante, y la CMT1A es la forma más frecuente; la CMT2 es axonal, y la CMT4, desmielinizante autosómica recesiva. Las velocidades de conducción reducidas indican desmielinización.","p":null},{"id":"Neuropatias_T19-T20-30","b":"Neuropatias_T19-T20","t":"T20","n":30,"q":"Varón de 58 años en tratamiento con quimioterapia con vincristina por un linfoma, que en las últimas semanas presenta parestesias distales en manos y pies, con hipoestesia en guante y calcetín y arreflexia aquílea. ¿Cuál es la causa más probable y la actitud?","o":["Síndrome de Guillain-Barré secundario; inmunoglobulinas IV durante 5 días.","Polineuropatía tóxica por vincristina; valorar ajuste con Oncología.","Neuropatía motora multifocal; inmunoglobulinas IV periódicas.","Mononeuropatía múltiple por vasculitis; bolos de corticoides IV."],"a":1,"e":"Entre las polineuropatías agudas o subagudas están las tóxicas por fármacos (taxol, suramina, vincristina, cisplatino) y por otros tóxicos (mercurio, talio, arsénico, organofosforados, n-hexano, alcohol, acrilamida). La infiltración por linfoma y las paraneoplásicas también deben considerarse. El tratamiento es el de la causa siempre que sea posible, junto con el sintomático del dolor (tricíclicos, gabapentina, oxcarbazepina). La distribución simétrica en guante y calcetín indica una polineuropatía, no una mononeuropatía múltiple.","p":null},{"id":"Parkinson_T14-1","b":"Parkinson_T14","t":"T14","n":1,"q":"Varón de 63 años con temblor en la mano derecha desde hace 8 meses, que aparece en reposo, desaparece al coger objetos y tiene un movimiento de pronosupinación a unos 5 Hz. Su mujer refiere que escribe con letra cada vez más pequeña y que tiene la cara 'menos expresiva'. Desde hace años tiene estreñimiento, ha perdido olfato y grita y da patadas mientras duerme. En la exploración presenta bradicinesia y rigidez en rueda dentada en el lado derecho. ¿Cuál es la actitud diagnóstica más adecuada?","o":["El diagnóstico es clínico de enfermedad de Parkinson; la neuroimagen solo se pide si hay rasgos atípicos.","Es imprescindible una RM cerebral, que mostrará la atrofia de la sustancia negra.","El diagnóstico exige confirmar el déficit dopaminérgico con un DaTSCAN en todos los pacientes.","Debe realizarse un estudio genético, ya que los síntomas no motores previos indican una forma hereditaria."],"a":0,"e":"Para hablar de parkinsonismo debe haber bradicinesia y al menos otro síntoma: rigidez, temblor de reposo o alteración de los reflejos posturales. En la EP el inicio es asimétrico y de lenta progresión, y el temblor de reposo (4-6 Hz, distal, en pronosupinación) es el síntoma de inicio más característico, aunque un 25 % no lo tiene. La fase presintomática puede incluir hiposmia, estreñimiento, depresión y trastorno de conducta del sueño REM, muy específico de las α-sinucleinopatías. El diagnóstico es clínico; la TC y la RM son normales en la EP y se piden ante rasgos atípicos o sospecha de parkinsonismo estructural.","p":null},{"id":"Parkinson_T14-2","b":"Parkinson_T14","t":"T14","n":2,"q":"Respecto a la fisiopatología de la enfermedad de Parkinson, señale la afirmación CORRECTA:","o":["El déficit dopaminérgico activa la vía directa e inhibe la indirecta, lo que aumenta la excitación de la corteza.","Los síntomas aparecen cuando se pierde aproximadamente el 20 % de las neuronas de la pars reticulata.","Se inhibe la vía directa y se activa la indirecta, con hiperactividad del subtalámico.","Los ganglios basales proyectan directamente sobre la médula espinal para iniciar el movimiento voluntario."],"a":2,"e":"La dopamina nigroestriatal estimula la vía directa (estriado → pálido interno) e inhibe la indirecta (estriado → pálido externo → núcleo subtalámico → pálido interno). En la EP, su déficit inhibe la vía directa y activa la indirecta: el núcleo subtalámico se vuelve hiperexcitable y bloquea la vía tálamo-cortical, lo que produce la bradicinesia. Por eso la estimulación cerebral profunda actúa sobre el subtalámico. Los síntomas aparecen cuando se pierde más del 70 % de las neuronas de la pars compacta. Los ganglios basales no proyectan sobre la médula, sino de vuelta a la corteza a través del tálamo.","p":null},{"id":"Parkinson_T14-3","b":"Parkinson_T14","t":"T14","n":3,"q":"Mujer de 68 años con temblor bilateral de las manos de años de evolución, que aparece al mantener posturas y al beber, y que ha empeorado. En la exploración se duda si existe una bradicinesia leve. ¿Qué prueba permite diferenciar mejor una enfermedad de Parkinson de un temblor esencial, y cuál es su limitación?","o":["La RM cerebral, diagnóstica de EP, aunque no distingue los parkinsonismos atípicos.","DaTSCAN: patológico en la EP y normal en el temblor esencial, pero no distingue atípicos.","La gammagrafía cardiaca con MIBG, normal en la EP y patológica en el temblor esencial.","El electromiograma, que mide la frecuencia del temblor y confirma así la EP."],"a":1,"e":"Los estudios presinápticos (DaTSCAN o PET con F-dopa) muestran hipocaptación estriatal en la EP y permiten diferenciarla del temblor esencial o de un parkinsonismo por fármacos, en los que son normales. Pero no diferencian la EP de los parkinsonismos atípicos (AMS, PSP), en los que también son patológicos. La MIBG es patológica en la EP y normal en la AMS. La ecografía de la sustancia negra muestra hiperecogenicidad en la EP de forma precoz. Para diferenciar la EP de otros parkinsonismos degenerativos, la prueba más sensible y específica es el PET-FDG.","p":null},{"id":"Parkinson_T14-4","b":"Parkinson_T14","t":"T14","n":4,"q":"Mujer de 79 años con vértigo crónico tratada con sulpirida desde hace 2 meses y con flunarizina. En las últimas semanas presenta lentitud generalizada, rigidez simétrica en las cuatro extremidades, temblor bilateral al mantener posturas y marcha a pasos cortos. El DaTSCAN es normal. ¿Cuál es la actitud más adecuada?","o":["Iniciar levodopa a dosis altas, ya que se trata de una enfermedad de Parkinson de inicio bilateral.","Mantener los fármacos y añadir un agonista dopaminérgico.","Diagnosticar una atrofia multisistémica por la simetría del cuadro.","Retirar la sulpirida y la flunarizina, sabiendo que la mejoría puede tardar más de 6 meses."],"a":3,"e":"Parkinsonismo farmacológico: subagudo, de días o semanas, simétrico, con temblor de actitud bilateral (no de reposo) y trastorno de la marcha precoz. El DaTSCAN y la ecografía de la sustancia negra son normales. Fármacos responsables: neurolépticos y derivados (sulpirida, metoclopramida, levosulpirida, clebopride, cinitaprida), calcioantagonistas (flunarizina, cinarizina), valproato, litio y amiodarona. Tratamiento: retirar el fármaco; la mejoría es lenta, a veces de más de 6 meses, y puede no resolverse si hay un parkinsonismo degenerativo subyacente o un síndrome tardío por neurolépticos.","p":null},{"id":"Parkinson_T14-5","b":"Parkinson_T14","t":"T14","n":5,"q":"Varón de 78 años, con hipertrofia prostática y olvidos leves, recién diagnosticado de enfermedad de Parkinson con bradicinesia que le limita para vestirse y caminar. ¿Cuál es el tratamiento inicial más adecuado?","o":["Levodopa con un inhibidor de la dopa-decarboxilasa, evitando la politerapia.","Trihexifenidilo, por su eficacia sobre la bradicinesia en el paciente anciano.","Pramipexol en monoterapia, para retrasar la aparición de fluctuaciones.","Amantadina en monoterapia, como fármaco de primera línea en el anciano."],"a":0,"e":"La levodopa es el tratamiento fundamental y más eficaz. Siempre se asocia a un inhibidor de la dopa-decarboxilasa (carbidopa o benserazida) para potenciar su efecto y evitar efectos sistémicos. En el anciano se recomienda iniciar directamente con levodopa, con precaución en la politerapia. Los agonistas deben vigilarse si hay deterioro cognitivo. Los anticolinérgicos se reservan para el temblor refractario o la distonía. La amantadina, antiglutamatérgica y anticolinérgica, empeora la cognición, puede producir retención urinaria y se usa sobre todo para las discinesias.","p":null},{"id":"Parkinson_T14-6","b":"Parkinson_T14","t":"T14","n":6,"q":"Varón de 54 años con enfermedad de Parkinson tratado con pramipexol desde hace 2 años. Su mujer refiere que ha empezado a apostar compulsivamente por internet, ha gastado los ahorros familiares y compra objetos que no necesita. ¿Cuál es la causa más probable y la actitud adecuada?","o":["Progresión natural de la enfermedad; aumentar la dosis de pramipexol para controlarla.","Trastorno de control de impulsos por el agonista; reducir o retirar el pramipexol.","Demencia frontotemporal asociada a la enfermedad; iniciar rivastigmina.","Episodio maníaco primario sin relación con el tratamiento; iniciar haloperidol."],"a":1,"e":"Los trastornos del control de impulsos (ludopatía, compras o sexualidad compulsivas) tienen una prevalencia del 15-30 % en la EP y suelen deberse a la medicación, sobre todo a los agonistas dopaminérgicos. La actitud es reducir o retirar el agonista. Por este riesgo, los agonistas deben evitarse en pacientes con depresión, aunque son útiles en la apatía. La apomorfina tiene escasos efectos cognitivos y de control de impulsos, a diferencia del resto de agonistas. Los neurolépticos típicos como el haloperidol se toleran mal en la EP.","p":null},{"id":"Parkinson_T14-7","b":"Parkinson_T14","t":"T14","n":7,"q":"Respecto a los fármacos para las fluctuaciones motoras en la enfermedad de Parkinson, señale la afirmación CORRECTA:","o":["La safinamida está indicada en monoterapia en la fase inicial de la enfermedad.","Los agonistas dopaminérgicos ergóticos son los de elección en la actualidad.","La rotigotina se administra por vía subcutánea mediante bomba de infusión.","Los inhibidores de la COMT siempre se asocian a la levodopa."],"a":3,"e":"Los inhibidores de la COMT (entacapona y opicapona) inhiben la enzima a nivel periférico, aumentan la biodisponibilidad de la levodopa en el cerebro, alargan su efecto y reducen el tiempo off; siempre se usan junto con levodopa. La safinamida (IMAO-B con efecto antiglutamatérgico) se usa en las fluctuaciones y no está indicada en monoterapia. Hoy se usan los agonistas no ergóticos: la rotigotina es el único transdérmico (parche) y la apomorfina, subcutánea o sublingual.","p":null},{"id":"Parkinson_T14-8","b":"Parkinson_T14","t":"T14","n":8,"q":"Mujer de 62 años con enfermedad de Parkinson de 7 años de evolución, tratada con levodopa. Refiere que unas 3 horas después de cada toma reaparecen el temblor y la lentitud antes de la siguiente dosis, y que por la mañana, al levantarse, está muy rígida. Además, a la hora de cada toma presenta movimientos involuntarios de tipo coreico en el tronco y los brazos. ¿Qué medidas son las más adecuadas?","o":["Suspender la levodopa, causante de la corea, y sustituirla por anticolinérgicos.","Iniciar haloperidol para controlar los movimientos coreicos de pico de dosis.","Fraccionar la levodopa o añadir un ICOMT, y amantadina para las discinesias.","Añadir rivastigmina, ya que las fluctuaciones indican una demencia incipiente."],"a":2,"e":"Con los años aparecen fluctuaciones motoras, sobre todo en pacientes jóvenes: deterioro de fin de dosis (wearing-off), retraso del efecto (delayed on), ausencia de efecto (no on) y acinesia matutina. Las discinesias, que suelen aparecer a los 4-6 años y clínicamente son una corea, son típicamente de pico de dosis (en on). Ante el deterioro de fin de dosis se fraccionan las tomas o se sube la dosis de levodopa, o se añaden IMAO-B, agonistas o inhibidores de la COMT. La amantadina se añade cuando aparecen discinesias, vigilando el deterioro cognitivo y las alucinaciones.","p":null},{"id":"Parkinson_T14-9","b":"Parkinson_T14","t":"T14","n":9,"q":"Varón de 58 años con enfermedad de Parkinson de 10 años de evolución, con excelente respuesta a la levodopa pero con fluctuaciones motoras y discinesias discapacitantes pese al ajuste óptimo de la medicación oral. No tiene deterioro cognitivo ni alteraciones psiquiátricas. ¿Cuál es el tratamiento de elección?","o":["Estimulación cerebral profunda bilateral del núcleo subtalámico.","HIFU, por ser el tratamiento de elección de las discinesias.","Aumentar la dosis de pramipexol hasta controlar los periodos off.","Talamotomía bilateral por radiocirugía."],"a":0,"e":"En la EP avanzada con buena respuesta a la levodopa y complicaciones motoras de difícil control hay terapias de rescate (levodopa inhalada, apomorfina subcutánea o sublingual) y terapias avanzadas: bombas (apomorfina subcutánea, levodopa duodenal por PEG con o sin entacapona, levodopa subcutánea) y cirugía. En pacientes de menos de 70 años sin deterioro cognitivo ni afectación neuropsiquiátrica, la estimulación cerebral profunda es de elección: se estimula de forma bilateral el núcleo subtalámico, inhibiendo su actividad. El HIFU se reserva para el temblor muy refractario con el resto de síntomas controlados.","p":null},{"id":"Parkinson_T14-10","b":"Parkinson_T14","t":"T14","n":10,"q":"Varón de 75 años con enfermedad de Parkinson de 12 años de evolución que en los últimos meses ve niños y animales en casa y está convencido de que su mujer le es infiel. Se han descartado infección y alteraciones metabólicas. ¿Cuál es la actitud más adecuada?","o":["Iniciar haloperidol a dosis bajas, el neuroléptico mejor tolerado en la EP.","Aumentar la levodopa, porque las alucinaciones indican un control motor insuficiente.","Añadir un agonista dopaminérgico para mejorar el estado de ánimo.","Valorar reducir fármacos y, si persiste, quetiapina o clozapina."],"a":3,"e":"Las alucinaciones aparecen en el 40-50 % de los pacientes (las más frecuentes son zoomorfas y homomorfas) e implican peor pronóstico. Se valora reducir fármacos (levodopa, IMAO, inhibidores de la COMT) y se usan neurolépticos atípicos: quetiapina (la más utilizada) y clozapina, que casi nunca empeoran la EP. Los neurolépticos típicos se toleran mal y producen más extrapiramidalismo. A menudo mejoran con anticolinesterásicos, preferentemente rivastigmina, que también se usa en la demencia de la EP.","p":null},{"id":"Parkinson_T14-11","b":"Parkinson_T14","t":"T14","n":11,"q":"Varón de 70 años con caídas hacia atrás desde el primer año de evolución, rigidez simétrica de predominio axial con retrocolis, mirada con expresión de sorpresa, disartria y disfagia. Al explorar los movimientos oculares, la mirada vertical voluntaria está muy limitada, pero mejora con la maniobra oculocefálica. Apenas respondió a la levodopa. ¿Qué hallazgo de RM es característico?","o":["Signo de la cruz ('hot cross bun') en la protuberancia.","Hiperintensidad en el borde lateral del putamen.","Atrofia mesencefálica con signo del colibrí.","Atrofia cortical frontoparietal muy asimétrica."],"a":2,"e":"Parálisis supranuclear progresiva (Steele-Richardson-Olszewski): taupatía, el parkinsonismo degenerativo más frecuente después de la EP, con evolución rápida y discapacidad en 4-5 años. Comienza con trastorno de los reflejos posturales y caídas hacia atrás, con oftalmoplejía supranuclear vertical (por eso mejora con la maniobra oculocefálica), parkinsonismo muy simétrico, facies de sorpresa, síndrome pseudobulbar, rigidez axial con retrocolis y demencia precoz. RM: atrofia mesencefálica con signo de Mickey Mouse (axial) y del colibrí o pingüino (sagital). Responde muy poco a dopaminérgicos.","p":null},{"id":"
