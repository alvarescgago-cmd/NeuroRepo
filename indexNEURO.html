iológica: coexistencia de lesiones de distinta antigüedad (unas captan contraste y otras no), aparición de lesiones nuevas en una RM de seguimiento, o clínica (dos o más brotes). Una sola RM puede cumplir ambas. Como la EM es un diagnóstico de exclusión, hay que descartar además otras causas.","p":null},{"id":"Desmielinizantes_T08-T09-3","b":"Desmielinizantes_T08-T09","t":"T08","n":3,"q":"Mujer de 24 años con un primer episodio de diplopía que se resuelve en 3 semanas. La RM muestra tres lesiones periventriculares ovoideas y una lesión en la protuberancia, ninguna de las cuales capta gadolinio. El estudio de autoinmunidad y las serologías son normales. ¿Cuál es la situación diagnóstica?","o":["Cumple criterios de EM remitente-recurrente y debe iniciar tratamiento de alta eficacia.","No cumple diseminación en espacio, porque todas las lesiones están en la misma topografía.","Debe diagnosticarse una NMOSD por la afectación del tronco del encéfalo.","Cumple diseminación en espacio, pero aún no en tiempo."],"a":3,"e":"Hay lesiones en dos topografías típicas (periventricular y tronco), por lo que cumple la diseminación en espacio. Sin embargo, ninguna capta contraste, así que no hay evidencia de lesiones de distinta antigüedad: falta la diseminación en tiempo. Esta se demostraría radiológicamente (nuevas lesiones en una RM de seguimiento) o clínicamente (un segundo brote).","p":null},{"id":"Desmielinizantes_T08-T09-4","b":"Desmielinizantes_T08-T09","t":"T08","n":4,"q":"Mujer de 33 años con EM remitente-recurrente que presenta desde hace 5 días hipoestesia y torpeza en la mano derecha, sin fiebre ni infección. ¿Cuál es el tratamiento indicado del brote?","o":["Metilprednisolona a dosis altas durante 3-5 días.","Recambio plasmático de 5-7 sesiones como primera línea.","Iniciar directamente un trasplante autólogo de progenitores hematopoyéticos.","Observación, ya que los corticoides empeoran la evolución a largo plazo."],"a":0,"e":"Un brote es un síntoma neurológico nuevo de al menos 24-48 horas, que suele durar semanas y traduce inflamación y desmielinización aguda; puede resolverse de forma espontánea o con corticoides. Primera línea: metilprednisolona a dosis altas durante 3-5 días para acortar su duración. El recambio plasmático (5-7 sesiones) se reserva para brotes refractarios o catastróficos. El trasplante de progenitores es un tratamiento de rescate de la enfermedad, no del brote.","p":null},{"id":"Desmielinizantes_T08-T09-5","b":"Desmielinizantes_T08-T09","t":"T08","n":5,"q":"Varón de 29 años con EM que presenta un brote medular con paraplejía. Tras 5 días de metilprednisolona a dosis altas no hay ninguna mejoría. ¿Cuál es el siguiente paso?","o":["Repetir un segundo ciclo de corticoides por vía oral durante 3 meses.","Recambio plasmático terapéutico de 5-7 sesiones.","Esperar la recuperación espontánea, ya que la remielinización suele ser completa.","Interferón beta en dosis altas como tratamiento del brote."],"a":1,"e":"En los brotes refractarios o catastróficos, el tratamiento es el recambio plasmático terapéutico (5-7 sesiones). La remielinización endógena no siempre ocurre o no es completa, y su capacidad disminuye con la evolución de la enfermedad (C).","p":null},{"id":"Desmielinizantes_T08-T09-6","b":"Desmielinizantes_T08-T09","t":"T08","n":6,"q":"Varón de 52 años con dificultad para caminar que ha empeorado de forma lenta y continua en los últimos 3 años, sin episodios agudos. Presenta paraparesia espástica y urgencia miccional. La RM muestra lesiones medulares cervicales y periventriculares típicas de EM. Señale la afirmación CORRECTA:","o":["Es una forma remitente-recurrente, la más frecuente al debut (85 %).","Es una forma secundariamente progresiva, ya que no ha tenido brotes.","Forma primariamente progresiva, con predominio degenerativo desde el inicio.","Al no haber brotes, puede descartarse que el proceso sea inflamatorio-desmielinizante."],"a":2,"e":"La EM primariamente progresiva supone alrededor del 15 % y tiene un curso progresivo desde el inicio sin brotes claros, con predominio del componente degenerativo. La forma secundariamente progresiva aparece tras una fase remitente-recurrente (el 85 % debuta con brotes), y alrededor del 50 % de las formas RR evoluciona a SP en 25 años. Los fenotipos son en realidad estadios de la misma enfermedad, en los que coexisten inflamación y degeneración con distinta intensidad.","p":null},{"id":"Desmielinizantes_T08-T09-7","b":"Desmielinizantes_T08-T09","t":"T08","n":7,"q":"Respecto a la historia natural de la esclerosis múltiple, señale la afirmación CORRECTA:","o":["Los brotes aumentan de frecuencia con los años, al aumentar la actividad inflamatoria.","La inflamación, la desmielinización, la remielinización y la degeneración axonal aparecen en fases sucesivas y nunca coexisten.","El sustrato de los brotes y el de la progresión es el mismo: la desmielinización aguda.","Con los años disminuye la inflamación y aumenta la degeneración axonal y neuronal."],"a":3,"e":"A lo largo de la evolución disminuye el componente inflamatorio (menos brotes) y aumenta la degeneración axonal y neuronal, que produce atrofia cerebral y medular y explica la mayor parte del deterioro físico y cognitivo. Los fenómenos histopatológicos coexisten desde el inicio con distinta intensidad (B). El brote traduce inflamación y desmielinización aguda; la progresión, degeneración axonal y neuronal (C).","p":null},{"id":"Desmielinizantes_T08-T09-8","b":"Desmielinizantes_T08-T09","t":"T08","n":8,"q":"¿Cuál de los siguientes hallazgos de RM es MENOS típico de esclerosis múltiple?","o":["Lesión medular central que se extiende a lo largo de 4 cuerpos vertebrales.","Signo de la vena central en las lesiones de sustancia blanca.","Lesiones ovoideas periventriculares orientadas perpendicularmente a los ventrículos.","Lesiones en el cuerpo calloso y yuxtacorticales."],"a":0,"e":"Las lesiones de EM son múltiples y pequeñas, muchas ovoideas porque se disponen alrededor de vénulas (dedos de Dawson), con signo de la vena central (típico, no patognomónico), y se localizan en periventricular, cuerpo calloso, tronco-cerebelo, cortical/yuxtacortical y nervio óptico. En la médula son pequeñas, periféricas, cervicales o dorsales, de menos de 3 cuerpos vertebrales. Una lesión central de 3 o más segmentos (LETM) orienta a NMOSD.","p":null},{"id":"Desmielinizantes_T08-T09-9","b":"Desmielinizantes_T08-T09","t":"T08","n":9,"q":"En la RM de un paciente con sospecha de EM, varias lesiones captan gadolinio. ¿Qué indica este hallazgo?","o":["Inflamación aguda, en lesiones aparecidas en las últimas 4 semanas.","Lesiones crónicas con gliosis establecida y sin actividad inflamatoria.","Lesiones con pérdida axonal irreversible y atrofia cerebral asociada.","Lesiones de origen vascular isquémico, que excluyen el diagnóstico de EM."],"a":0,"e":"El contraste paramagnético (gadolinio) detecta lesiones recientes, aparecidas en las últimas 4 semanas, y traduce inflamación aguda. La coexistencia de lesiones activas (captantes) y no activas indica lesiones de distinta edad y sirve como evidencia radiológica de diseminación en tiempo.","p":null},{"id":"Desmielinizantes_T08-T09-10","b":"Desmielinizantes_T08-T09","t":"T08","n":10,"q":"En el estudio del LCR de un paciente con sospecha de EM se detectan bandas oligoclonales y cadenas ligeras libres kappa. ¿Qué significan estos hallazgos?","o":["Infección del SNC, por lo que debe iniciarse tratamiento antibiótico empírico.","Rotura de la barrera hematoencefálica sin producción local de inmunoglobulinas.","Síntesis intratecal de inmunoglobulinas, que apoya el diagnóstico de EM.","Confirmación de EM, por lo que no es necesario descartar otras causas."],"a":2,"e":"El pilar biológico se basa en el LCR (bandas oligoclonales y cadenas ligeras libres kappa, cuya presencia indica síntesis intratecal) y en la sangre (serologías de lúes, VIH o Lyme, y estudio inmunológico con ANA, anti-Ro y anti-La) para descartar procesos que simulen una EM. Las bandas oligoclonales persistentes son típicas de la EM, frente a su ausencia o transitoriedad en NMOSD, MOGAD y ADEM. Aun así, la EM sigue siendo un diagnóstico de exclusión (D).","p":null},{"id":"Desmielinizantes_T08-T09-11","b":"Desmielinizantes_T08-T09","t":"T08","n":11,"q":"Mujer de 46 años con parestesias en el hemicuerpo izquierdo. La RM muestra varias lesiones en la sustancia blanca. Refiere desde hace un año sequedad de ojos y de boca, y artralgias. ¿Qué estudio es prioritario antes de establecer un diagnóstico de EM?","o":["Anti-Ro y anti-La, por sospecha de síndrome de Sjögren.","Ninguno: la clínica y la RM son suficientes para diagnosticar EM.","Determinación de anticuerpos anti-MOG en el LCR y en suero.","Biopsia cerebral estereotáctica de la lesión de mayor tamaño."],"a":0,"e":"La EM es un diagnóstico de exclusión. Hay que indagar en datos que sugieran procesos simuladores: artritis, artralgias, xerostomía, xeroftalmia, fotosensibilidad, fiebre o síndrome constitucional. Entre los procesos inmunológicos que la simulan están el LES, el Sjögren y el síndrome de Susac; también procesos infecciosos (lúes, VIH, Lyme, listeriosis), granulomatosos (sarcoidosis) y linfoproliferativos. Aquí la clínica sicca obliga a pedir ANA, anti-Ro y anti-La.","p":null},{"id":"Desmielinizantes_T08-T09-12","b":"Desmielinizantes_T08-T09","t":"T08","n":12,"q":"Mujer de 25 años recién diagnosticada de EM remitente-recurrente, con dos brotes en el último año y numerosas lesiones en la RM, varias captantes. ¿Cuál es la estrategia terapéutica más consolidada según los apuntes?","o":["Esperar a que acumule discapacidad antes de iniciar tratamiento modificador.","Iniciar cuanto antes un fármaco de alta eficacia, individualizando la elección.","Tratar solo los brotes con corticoides, ya que ningún fármaco modifica la evolución.","Iniciar tratamiento solo cuando entre en fase secundariamente progresiva, en la que los fármacos son más eficaces."],"a":1,"e":"Ningún tratamiento cura la EM. El tratamiento modificador debe iniciarse cuanto antes, en la fase inflamatoria, ya que todos los fármacos tienen mecanismo antiinflamatorio y pierden efecto en fases evolucionadas (D). El inicio directo con fármacos de alta eficacia es la estrategia cada vez más consolidada, para evitar daños irreparables; la alternativa es la escalada. La elección se individualiza según actividad clínica y radiológica, tiempo de evolución, comorbilidades, preferencias, proyecto gestacional y adherencia.","p":null},{"id":"Desmielinizantes_T08-T09-13","b":"Desmielinizantes_T08-T09","t":"T08","n":13,"q":"Varón de 31 años con EM en tratamiento con un fármaco de alta eficacia desde hace 2 años, que ha presentado dos brotes en el último año y nuevas lesiones captantes en la RM. ¿Cuál es la opción de tercera línea o de rescate?","o":["Plasmaféresis periódica de mantenimiento.","Trasplante de progenitores hematopoyéticos.","Corticoides orales en dosis bajas de forma indefinida.","Retirar el tratamiento, ya que ha fracasado y no hay más opciones."],"a":1,"e":"El tratamiento debe monitorizarse con clínica y RM periódicas, buscando un cambio precoz si hay fracaso terapéutico. Cuando, pese a un fármaco de alta eficacia, no se controla la actividad inflamatoria, el tratamiento de tercera línea o de rescate es el trasplante de progenitores hematopoyéticos.","p":null},{"id":"Desmielinizantes_T08-T09-14","b":"Desmielinizantes_T08-T09","t":"T08","n":14,"q":"Sobre la etiología de la esclerosis múltiple, señale la afirmación CORRECTA:","o":["Es una enfermedad hereditaria con patrón autosómico dominante.","El riesgo de concordancia en gemelos monocigóticos es del 95 %.","Su incidencia aumenta con la exposición solar y los niveles altos de vitamina D.","El gen más asociado es HLA-DRB1 y el VEB en la adolescencia es factor de riesgo."],"a":3,"e":"Etiología multifactorial: no es hereditaria, pero hay predisposición genética (gemelos monocigóticos 31 %, dicigóticos 5 %; el gen más asociado es HLA-DRB1, en el cromosoma 6, que contribuye hasta en un 60 % del riesgo). Factores ambientales: sedentarismo, obesidad, tabaco, dieta rica en sal, azúcares y grasas saturadas, déficit de vitamina D o baja exposición solar, infección por VEB en infancia o adolescencia y latitud (gradiente norte-sur). Predominio femenino 3:1, inicio a los 20-40 años.","p":null},{"id":"Desmielinizantes_T08-T09-15","b":"Desmielinizantes_T08-T09","t":"T08","n":15,"q":"Mujer de 23 años con hipoestesia desde el ombligo hacia abajo, predominante en la pierna izquierda, con debilidad leve de esa pierna y urgencia miccional, de 1 semana de evolución. ¿Cuál es la interpretación más acorde con los apuntes?","o":["Mielitis transversa incompleta, la presentación topográfica más frecuente.","Mielitis transversa completa, característica de la EM por su extensión.","Síndrome hemisférico, la forma de presentación más frecuente de la EM.","Síndrome de área postrema, forma de presentación típica de la EM."],"a":0,"e":"Según los apuntes, la mielitis es la topografía lesional de presentación más frecuente en la EM (seguida de la neuritis óptica), y es típicamente una mielitis transversa incompleta, a diferencia de una sección medular completa: clínica sensitiva y/o motora por debajo del nivel y posible clínica esfinteriana. El síndrome hemisférico es la forma menos frecuente y puede simular lesiones pseudotumorales. El síndrome de área postrema es típico de la NMOSD.","p":null},{"id":"Desmielinizantes_T08-T09-16","b":"Desmielinizantes_T08-T09","t":"T09","n":16,"q":"Mujer de 38 años que ingresa por náuseas, vómitos e hipo incoercibles de 3 semanas de evolución. Gastroscopia, ecografía abdominal y analítica son normales. Días después presenta pérdida grave de visión en ambos ojos. ¿Qué estudio es prioritario?","o":["Bandas oligoclonales en el LCR para confirmar una EM.","Anticuerpos anti-MOG en suero.","Anticuerpos anti-AQP4 en suero.","Estudio de anticuerpos onconeuronales anti-Hu."],"a":2,"e":"Síndrome de área postrema (náuseas, vómitos e hipo intratables sin causa digestiva) seguido de neuritis óptica grave y bilateral: es muy sugestivo de NMOSD. El área postrema, el nervio óptico y la médula expresan mucha acuaporina-4, por eso se afectan con más frecuencia. Los apuntes ponen como ejemplo de cuándo pedir anti-AQP4 una mujer con vómitos intratables y lesión bulbar dorsal.","p":null},{"id":"Desmielinizantes_T08-T09-17","b":"Desmielinizantes_T08-T09","t":"T09","n":17,"q":"Mujer de 34 años con paraparesia y nivel sensitivo dorsal de instauración subaguda e incontinencia urinaria. La RM medular muestra una lesión central que se extiende desde D2 a D8 y ocupa más del 50 % de la sección transversal. ¿Cuál es el diagnóstico más probable?","o":["Esclerosis múltiple, por ser la causa más frecuente de mielitis.","Neuromielitis óptica, por la LETM central.","MOGAD, ya que la lesión respeta el cono medular.","ADEM, por la extensión de la lesión medular."],"a":1,"e":"Mielitis longitudinalmente extensa (LETM): lesión central que ocupa 3 o más segmentos contiguos y más del 50 % de la sección transversal, típica de la NMOSD. En la EM las lesiones medulares son cortas (menos de 3 cuerpos vertebrales, típicamente menos de 2) y periféricas. La MOGAD puede dar lesiones extensas o parcheadas, con afectación característica del cono. La ADEM puede tener lesiones medulares largas, pero inespecíficas, y suele cursar con encefalopatía.","p":null},{"id":"Desmielinizantes_T08-T09-18","b":"Desmielinizantes_T08-T09","t":"T09","n":18,"q":"Respecto a la fisiopatología de la neuromielitis óptica asociada a anti-AQP4, señale la afirmación CORRECTA:","o":["Es una oligodendropatía mediada por anticuerpos contra una proteína de la vaina de mielina.","Es una enfermedad mediada fundamentalmente por linfocitos T, sin participación del complemento.","Se debe a una infección directa del SNC tras un proceso vírico previo.","Astrocitopatía: IgG anti-AQP4, complemento y desmielinización secundaria."],"a":3,"e":"La NMOSD es una astrocitopatía. Los anticuerpos IgG contra la acuaporina-4 (pies perivasculares de los astrocitos, región ependimaria y subpial) activan el complemento (C5b-9) y producen citotoxicidad mediada por anticuerpos y necrosis astrocitaria; la desmielinización es secundaria, por el ambiente tóxico y la pérdida del astrocito. La oligodendropatía anti-MOG corresponde a la MOGAD (A) y el mimetismo molecular parainfeccioso a la ADEM (C).","p":null},{"id":"Desmielinizantes_T08-T09-19","b":"Desmielinizantes_T08-T09","t":"T09","n":19,"q":"Mujer de 41 años diagnosticada de NMOSD con anti-AQP4 positivos tras un primer episodio de mielitis longitudinalmente extensa, del que se recuperó parcialmente tras metilprednisolona y plasmaféresis. ¿Qué actitud es la correcta para la prevención de recaídas?","o":["Tratamiento preventivo continuado (rituximab, inebilizumab, satralizumab o eculizumab).","Vigilar sin tratamiento, ya que la mayoría de los casos de NMOSD son monofásicos.","Iniciar tratamiento preventivo solo si presenta una segunda recaída en el primer año.","Corticoides solo durante los brotes, sin tratamiento de mantenimiento entre ellos."],"a":0,"e":"Sin tratamiento, la NMOSD tiene un curso recurrente y alto riesgo de discapacidad: históricamente hasta un 50-60 % de ceguera unilateral y un 30 % bilateral a los 10 años, y un 50 % de necesidad de ayuda para caminar a los 10-15 años. El tratamiento precoz y continuado es obligado: anti-CD20/19 (rituximab, inebilizumab), anti-IL-6R (satralizumab) o anti-C5 (eculizumab); alternativas: azatioprina y micofenolato. Con terapias dirigidas, recaídas y discapacidad disminuyen notablemente. El curso monofásico es propio de la ADEM y de parte de la MOGAD.","p":null},{"id":"Desmielinizantes_T08-T09-20","b":"Desmielinizantes_T08-T09","t":"T09","n":20,"q":"Varón de 45 años con una neuritis óptica grave con lesión de más de la mitad del nervio óptico y, meses después, un síndrome de área postrema con lesión en el bulbo dorsal. Los anticuerpos anti-AQP4 son negativos en dos determinaciones y los anti-MOG también. Se han descartado otras causas. Señale la afirmación CORRECTA:","o":["La negatividad de los anti-AQP4 excluye la NMOSD y obliga a diagnosticar una EM.","NMOSD seronegativa: cumple dos características cardinales con soporte de RM.","Para diagnosticar NMOSD seronegativa basta con una única característica clínica cualquiera.","Debe diagnosticarse una MOGAD, ya que es la causa más frecuente de NMOSD seronegativa."],"a":1,"e":"Los anti-AQP4 se detectan en el 80 % de los pacientes y su sensibilidad no es del 100 %: un resultado negativo con alta sospecha no excluye el diagnóstico. Si son negativos o desconocidos, se exigen al menos 2 características clínicas, incluida al menos una de neuritis óptica, mielitis aguda (LETM) o síndrome de área postrema, con requisitos de RM (neuritis con lesión de más de la mitad del nervio o del quiasma, LETM de 3 o más segmentos, lesión bulbar dorsal…) y exclusión de alternativas. Con anti-AQP4 positivos basta una característica clínica.","p":null},{"id":"Desmielinizantes_T08-T09-21","b":"Desmielinizantes_T08-T09","t":"T09","n":21,"q":"Mujer de 36 años con NMOSD anti-AQP4 positiva que presenta una neuritis óptica bilateral grave. Tras 5 días de metilprednisolona IV no hay mejoría. ¿Cuál es el siguiente paso?","o":["Repetir un ciclo de metilprednisolona IV durante 10 días más.","Interferón beta como tratamiento del brote.","Observar, ya que la recuperación visual en la NMOSD suele ser completa.","Plasmaféresis o inmunoglobulinas intravenosas."],"a":3,"e":"El brote de NMOSD se trata con metilprednisolona IV y, si es refractario, con plasmaféresis o inmunoglobulinas IV. La neuritis óptica de la NMOSD suele ser grave, con frecuencia bilateral y con recuperación incompleta, y deja mucha secuela desde el primer episodio. Una mala recuperación tras la neuritis o la LETM es un factor de peor pronóstico.","p":null},{"id":"Desmielinizantes_T08-T09-22","b":"Desmielinizantes_T08-T09","t":"T09","n":22,"q":"¿Cuál de los siguientes NO es un factor de peor pronóstico en la NMOSD según los apuntes?","o":["Retraso en el diagnóstico y en el inicio del tratamiento.","Alta carga de brotes en los primeros años de enfermedad.","Lesiones medulares cervicales longitudinalmente extensas.","Bandas oligoclonales persistentes en el LCR."],"a":3,"e":"Factores de peor pronóstico en la NMOSD: retraso diagnóstico, alta carga de brotes iniciales, lesiones medulares cervicales extensas y mala recuperación tras la neuritis óptica o la LETM. Las bandas oligoclonales son raras y transitorias en la NMOSD; su persistencia es característica de la EM.","p":null},{"id":"Desmielinizantes_T08-T09-23","b":"Desmielinizantes_T08-T09","t":"T09","n":23,"q":"Niña de 9 años que, 2 semanas después de una infección respiratoria banal, presenta pérdida de visión bilateral con dolor ocular. El fondo de ojo muestra edema de papila bilateral y la RM, captación de contraste de gran extensión en ambos nervios ópticos, sin llegar al quiasma. ¿Qué anticuerpo es más probable que sea positivo y qué pronóstico visual cabe esperar?","o":["Anti-AQP4; mala recuperación visual con secuelas graves.","Anti-MOG; recuperación visual mejor que en la NMOSD.","Anti-AQP4; recuperación completa en todos los casos.","Ninguno; es la forma típica de neuritis óptica de la EM."],"a":1,"e":"MOGAD: más frecuente en jóvenes y niños, sin claro predominio de sexo, y con frecuencia tras una infección banal. La neuritis óptica puede ser uni o bilateral, anterior (edema de papila) o posterior, con gran extensión, y tiene mejor recuperación visual que en la NMOSD. El edema de papila es un criterio de apoyo de MOGAD. La neuritis de la EM es típicamente unilateral y retrobulbar.","p":null},{"id":"Desmielinizantes_T08-T09-24","b":"Desmielinizantes_T08-T09","t":"T09","n":24,"q":"Varón de 22 años con anestesia en silla de montar, retención urinaria y debilidad leve de ambas piernas de instauración subaguda. La RM muestra lesiones medulares parcheadas con afectación del cono medular. ¿Qué diagnóstico es más probable?","o":["Esclerosis múltiple remitente-recurrente.","Neuromielitis óptica anti-AQP4.","Enfermedad asociada a anticuerpos anti-MOG (MOGAD).","Encefalomielitis aguda diseminada sin afectación cerebral."],"a":2,"e":"En la MOGAD las mielitis pueden ser extensas o cortas y parcheadas, y es característica la afectación del cono medular, que produce clínica en silla de montar. En la NMOSD la lesión típica es una LETM central (con frecuencia cervical o dorsal), y en la EM las lesiones medulares son cortas y periféricas.","p":null},{"id":"Desmielinizantes_T08-T09-25","b":"Desmielinizantes_T08-T09","t":"T09","n":25,"q":"Mujer de 28 años con un único episodio de neuritis óptica con anticuerpos anti-MOG positivos a título claro, recuperada tras corticoides IV. ¿Cuál es la actitud más adecuada respecto al tratamiento preventivo?","o":["Observar sin preventivo; si recurre, IgIV, rituximab o micofenolato.","Iniciar eculizumab, aprobado específicamente para la MOGAD.","Iniciar un fármaco de alta eficacia para EM, ya que la MOGAD es una variante de la EM.","Plasmaféresis periódica de forma indefinida tras cada brote."],"a":0,"e":"En la MOGAD, el brote se trata con corticoides IV (y plasmaféresis o IgIV si es refractario). Los cursos monofásicos pueden observarse sin tratamiento preventivo; en las formas recurrentes se usan IgIV de mantenimiento, rituximab o micofenolato. No hay fármacos aprobados formalmente para la MOGAD, así que el manejo es empírico; el eculizumab figura entre los preventivos de la NMOSD. En adultos, alrededor del 40-50 % recurre a los 5 años; en niños, alrededor del 50 % es monofásico.","p":null},{"id":"Desmielinizantes_T08-T09-26","b":"Desmielinizantes_T08-T09","t":"T09","n":26,"q":"Respecto a los criterios diagnósticos de MOGAD (2023), señale la afirmación CORRECTA:","o":["Basta con detectar anti-MOG en suero a cualquier título, aunque la clínica no sea compatible.","Con título claro por CBA (≥1:100), basta clínica compatible y excluir alternativas.","La presencia de anti-AQP4 positivos es compatible con el diagnóstico de MOGAD.","Los títulos bajos de anti-MOG confirman el diagnóstico sin necesidad de criterios de apoyo."],"a":1,"e":"Criterios MOGAD 2023: evento clínico desmielinizante compatible (neuritis óptica, mielitis, ADEM, encefalitis cortical, síndrome de tronco o cerebelo…) más anti-MOG en suero por ensayo celular (CBA). Con un título claramente positivo (típicamente ≥1:100) basta con eso y con excluir alternativas. Sin título claro, se requiere al menos un criterio de apoyo: RM típica, edema de papila o afectación perineural. Hay que descartar EM y NMOSD con AQP4 positivo (C).","p":null},{"id":"Desmielinizantes_T08-T09-27","b":"Desmielinizantes_T08-T09","t":"T09","n":27,"q":"Niño de 7 años que, 10 días después de una infección vírica, presenta fiebre, cefalea, somnolencia, irritabilidad, una crisis convulsiva y hemiparesia derecha. ¿Cuál es la actitud inicial más adecuada?","o":["Diagnosticar ADEM e iniciar metilprednisolona IV sin más estudios.","Solicitar anti-MOG y esperar su resultado antes de cualquier tratamiento.","Antibióticos y antivirales empíricos, y punción lumbar con estudios microbiológicos.","Iniciar recambio plasmático urgente por la gravedad del cuadro."],"a":2,"e":"En un niño con fiebre, cefalea, confusión y déficit focal, la primera sospecha debe ser una encefalitis o meningitis infecciosa, que amenaza la vida y exige antibióticos y antivirales empíricos inmediatos. Solo tras descartarla con punción lumbar y estudios microbiológicos, y ante una RM típica, debe plantearse una ADEM. La ADEM es predominantemente pediátrica, sigue a infección o vacunación y cursa con encefalopatía, crisis y déficits multifocales.","p":null},{"id":"Desmielinizantes_T08-T09-28","b":"Desmielinizantes_T08-T09","t":"T09","n":28,"q":"En el niño de la pregunta anterior, descartada la infección, la RM muestra lesiones extensas, mal delimitadas y bastante simétricas en la sustancia blanca, el tálamo y los ganglios basales. El LCR muestra pleocitosis e hiperproteinorraquia sin bandas oligoclonales. Se diagnostica ADEM. Señale la afirmación CORRECTA:","o":["Su pronóstico es generalmente favorable, con recuperación completa en el 70-80 % de los casos.","La evolución a EM es la norma, aunque la RM inicial no muestre lesiones típicas de EM.","Es una infección directa del SNC por el virus responsable de la infección previa.","Su curso es característicamente recurrente, por lo que requiere tratamiento preventivo de por vida."],"a":0,"e":"La ADEM es una respuesta autoinmune por mimetismo molecular tras infección o vacunación, no una infección directa del SNC. Tiene buen pronóstico: recuperación completa en el 70-80 % y recaídas en el 5-10 % (más si hay anti-MOG positivos). La evolución a EM es poco frecuente si la RM inicial no muestra lesiones típicas de EM, y una minoría puede quedar con un déficit cognitivo leve. Tratamiento: corticoides IV, y plasmaféresis o IgIV si es refractaria.","p":"Desmielinizantes_T08-T09-27"},{"id":"Desmielinizantes_T08-T09-29","b":"Desmielinizantes_T08-T09","t":"T09","n":29,"q":"Varón de 25 años con una neuritis óptica retrobulbar unilateral. La RM muestra lesiones periventriculares perpendiculares a los ventrículos ('dedos de Dawson') y yuxtacorticales. ¿Qué actitud es la más adecuada respecto a los anticuerpos anti-AQP4 y anti-MOG?","o":["Solicitarlos siempre, ya que toda neuritis óptica obliga a descartar NMOSD y MOGAD.","Solicitar solo anti-AQP4, porque la NMOSD es más prevalente que la EM.","Solicitar ambos en LCR, ya que en suero tienen baja especificidad.","No solicitarlos: la clínica y la RM tienen alto valor predictivo de EM."],"a":3,"e":"La mayoría de los pacientes con neuritis óptica o mielitis desmielinizante tendrán una EM (prevalencia de unos 100/100.000, frente a 1-2/100.000 de la NMOSD), y no es necesario pedir estos anticuerpos de forma indiscriminada. Se reservan para cuando la clínica o la RM no son típicas de EM. Los apuntes ponen exactamente este caso como ejemplo de no pedirlos. Los anticuerpos se determinan en suero y son muy específicos, aunque no del todo sensibles.","p":null},{"id":"Desmielinizantes_T08-T09-30","b":"Desmielinizantes_T08-T09","t":"T09","n":30,"q":"¿Cuál de los siguientes hallazgos orienta MÁS a esclerosis múltiple que a NMOSD, MOGAD o ADEM?","o":["Lesión cerebral periependimaria y en el área postrema.","Lesión medular central de 5 segmentos que ocupa la mayor parte de la sección medular.","Bandas oligoclonales persistentes en el LCR.","Lesiones cerebrales grandes, mal definidas y simétricas en tálamos y ganglios basales."],"a":2,"e":"Según la tabla comparativa de los apuntes, las bandas oligoclonales persistentes son propias de la EM; en NMOSD y MOGAD son raras y transitorias, y en la ADEM están ausentes o son transitorias. Las lesiones periependimarias y del área postrema y la LETM central orientan a NMOSD; las lesiones extensas y simétricas de sustancia blanca y gris profunda, a ADEM (o a fenotipo ADEM-like de MOGAD).","p":null},{"id":"Encefalopatias_T23-1","b":"Encefalopatias_T23","t":"T23","n":1,"q":"Varón de 58 años, bebedor importante y desnutrido, al que encuentran en su domicilio estuporoso. Respira espontáneamente y está hemodinámicamente estable. La glucemia capilar es de 42 mg/dl. ¿Cuál es la actuación inmediata más correcta?","o":["Administrar suero glucosado hipertónico de inmediato y, una vez recuperado, valorar la tiamina.","Administrar tiamina intravenosa antes de la glucosa y, a continuación, corregir la hipoglucemia.","Realizar una TC craneal urgente antes de cualquier tratamiento, para descartar una causa estructural.","Administrar naloxona y esperar la respuesta antes de corregir la glucemia."],"a":1,"e":"La estabilización inicial del coma incluye ABC, glucemia capilar inmediata y considerar naloxona o tiamina, corrigiendo de inmediato las causas rápidamente reversibles (hipoglucemia, hipoxia, opioides). En pacientes desnutridos, alcohólicos o no, con riesgo de déficit de B1, hay que administrar SIEMPRE tiamina IV ANTES de la glucosa: el aumento del metabolismo tras la glucosa puede agotar las reservas residuales de tiamina y precipitar un Wernicke-Korsakoff. No se debe retrasar la corrección de la hipoglucemia por la TC.","p":null},{"id":"Encefalopatias_T23-2","b":"Encefalopatias_T23","t":"T23","n":2,"q":"Mujer de 67 años, hipertensa, que presenta vértigo y visión doble y, en las horas siguientes, disminución progresiva del nivel de conciencia hasta el coma. La exploración es difícil de valorar y no muestra una focalidad clara. La TC craneal simple urgente es normal. ¿Cuál es el siguiente paso?","o":["Descartar una causa estructural al ser la TC normal y orientar el estudio a una causa tóxico-metabólica.","Realizar una punción lumbar urgente como siguiente prueba.","Completar con angio-TC urgente por sospecha de trombosis de la arteria basilar.","Solicitar un EEG urgente, ya que la causa más probable es un estatus no convulsivo."],"a":2,"e":"La sensibilidad de la exploración para detectar una causa estructural en el coma es limitada, por lo que la ausencia de focalidad no la descarta. Además, una TC simple normal tampoco lo hace: si la sospecha persiste (por ejemplo, clínica de fosa posterior como vértigo y diplopía), hay que completar con angio-TC o RM. La trombosis aguda de la basilar puede pasar inadvertida en la TC simple y requiere angio-TC.","p":null},{"id":"Encefalopatias_T23-3","b":"Encefalopatias_T23","t":"T23","n":3,"q":"Varón de 74 años traído en coma de causa no aclarada. No hay signos focales ni meníngeos claros. La TC y la angio-TC craneales son normales, y la analítica urgente (glucosa, iones, función renal y hepática, amonio, gasometría, TSH, carboxihemoglobina y tóxicos en orina) también. ¿Qué prueba es prioritaria ahora?","o":["EEG urgente para descartar estatus no convulsivo.","RM cerebral programada de forma ambulatoria en semanas.","Repetir la TC craneal simple a las 24 horas.","Determinación de vitamina B12 y ácido metilmalónico."],"a":0,"e":"Si la neuroimagen y la analítica tóxico-metabólica ampliada no son concluyentes, debe descartarse un estado epiléptico no convulsivo mediante EEG urgente y valorar una punción lumbar si hay sospecha de infección del SNC. Además, el paciente debe reexplorarse de forma repetida, porque un cuadro inicialmente no estructural puede evolucionar y mostrar focalidad.","p":null},{"id":"Encefalopatias_T23-4","b":"Encefalopatias_T23","t":"T23","n":4,"q":"Un paciente tras un traumatismo craneal abre los ojos solo con el estímulo doloroso, emite palabras inapropiadas y, ante el dolor, presenta flexión anormal de las extremidades superiores. ¿Cuál es su puntuación en la escala de Glasgow?","o":["7","9","8","10"],"a":2,"e":"Apertura ocular al dolor: 2. Respuesta verbal con palabras inapropiadas: 3. Respuesta motora en flexión anormal (decorticación): 3. Total: 8. Escala de Glasgow: ocular 4 espontánea, 3 a la voz, 2 al dolor, 1 ninguna; verbal 5 orientado, 4 confuso, 3 inapropiada, 2 incomprensible, 1 ninguna; motora 6 obedece, 5 localiza, 4 retirada, 3 flexión anormal, 2 extensión, 1 ninguna (mínimo 3, máximo 15). En pacientes intubados se usa también la escala FOUR.","p":null},{"id":"Encefalopatias_T23-5","b":"Encefalopatias_T23","t":"T23","n":5,"q":"Motorista de 30 años en coma tras un accidente de tráfico, con collarín cervical por sospecha de lesión cervical inestable y otorragia derecha. Respecto a la exploración de los reflejos de tronco, señale la afirmación CORRECTA:","o":["Corneal (protuberancia) sí; oculocefálico y oculovestibular, contraindicados.","El reflejo fotomotor explora el bulbo, por lo que su ausencia indica lesión bulbar.","El reflejo oculovestibular puede realizarse sin otoscopia previa si se usa agua templada.","El reflejo tusígeno explora el mesencéfalo y es el primero en desaparecer."],"a":0,"e":"Niveles de los reflejos de tronco: fotomotor, mesencéfalo; corneal, protuberancia; oculocefálico y oculovestibular, protuberancia baja; tusígeno, bulbo. El oculocefálico está contraindicado si se sospecha lesión cervical inestable, y el oculovestibular si hay otorrea u otorragia (siempre otoscopia previa). En este paciente concurren ambas contraindicaciones.","p":null},{"id":"Encefalopatias_T23-6","b":"Encefalopatias_T23","t":"T23","n":6,"q":"Mujer de 24 años encontrada inconsciente en un baño público. Presenta frecuencia respiratoria de 6 rpm, pupilas puntiformes reactivas y no hay focalidad aparente. ¿Cuál es la actitud inmediata más adecuada?","o":["RM cerebral urgente, ya que la miosis indica siempre una lesión pontina.","Esperar el resultado del cribado de tóxicos en orina antes de cualquier tratamiento.","Soporte ventilatorio y administración de naloxona, mientras se completa el estudio.","Administrar flumazenilo, ya que la miosis es típica de la intoxicación por benzodiacepinas."],"a":2,"e":"La hipoventilación sin lesión estructural es típica de los depresores del SNC, y la miosis se asocia a opiáceos, a trastornos metabólicos y a lesión pontina. Mientras se asegura la ventilación, se corrigen de inmediato las causas rápidamente reversibles, entre ellas los opioides (naloxona). La mayoría de las causas metabólicas conservan el reflejo fotomotor. La exotropía bilateral, y no la miosis puntiforme, es la que los apuntes relacionan con la intoxicación por benzodiacepinas.","p":null},{"id":"Encefalopatias_T23-7","b":"Encefalopatias_T23","t":"T23","n":7,"q":"En un paciente en coma se observan movimientos oculares espontáneos conjugados hacia abajo seguidos de un movimiento hacia arriba, 'como una pelota al botar'. ¿Qué indican?","o":["Una encefalopatía metabólica, ya que es el movimiento típico de las causas tóxico-metabólicas.","Una intoxicación por benzodiacepinas.","Una lesión supratentorial hemisférica con mirada hacia el lado de la lesión.","Casi siempre una lesión estructural pontina caudal (bobbing ocular)."],"a":3,"e":"El bobbing ocular (movimiento conjugado descendente seguido de ascenso, como una pelota al botar) casi siempre traduce una lesión estructural pontina caudal. El roving (movimiento errático conjugado de un lado a otro) aparece en el sueño y en causas metabólicas. La exotropía bilateral se ve en la intoxicación por benzodiacepinas. En la desviación horizontal conjugada, la mirada se dirige hacia la lesión si es supratentorial y hacia el lado contrario si es pontina.","p":null},{"id":"Encefalopatias_T23-8","b":"Encefalopatias_T23","t":"T23","n":8,"q":"Sobre los patrones respiratorios en el paciente en coma, señale la asociación CORRECTA:","o":["Respiración de Cheyne-Stokes: lesión del bulbo raquídeo.","Hiperventilación neurógena central: lesión de la protuberancia.","Respiración apnéustica: lesión de la protuberancia.","Respiración atáxica de Biot: lesión del mesencéfalo."],"a":2,"e":"Cheyne-Stokes: lesión diencefálica o cortical difusa. Hiperventilación neurógena central: mesencéfalo. Respiración apnéustica: protuberancia. Respiración atáxica de Biot: bulbo. Sin lesión estructural, la hipoventilación orienta a depresores del SNC o hipotiroidismo, y la hiperventilación a infección respiratoria, edema agudo de pulmón, cetoacidosis o acidosis metabólica.","p":null},{"id":"Encefalopatias_T23-9","b":"Encefalopatias_T23","t":"T23","n":9,"q":"Mujer de 83 años, independiente y sin deterioro cognitivo previo, ingresada por una pielonefritis. Desde hace 2 días está desorientada y somnolienta, no consigue mantener la atención en la conversación y empeora por la tarde-noche, con momentos de lucidez durante la mañana. Presenta flapping bilateral. ¿Cuál es la interpretación más adecuada?","o":["Encefalopatía tóxico-metabólica secundaria a la infección.","Debut de una demencia degenerativa, al ser la edad su principal factor de riesgo.","Ictus de territorio posterior, por lo que debe activarse el Código Ictus.","Trastorno psiquiátrico primario, ya que las encefalopatías no fluctúan."],"a":0,"e":"Encefalopatía: alteración del nivel y del contenido de la conciencia (desde un déficit neuropsicológico sutil hasta el coma), con déficit de atención casi siempre desde el inicio, no explicable por deterioro cognitivo previo, secundaria a una condición médica general y con fluctuación típica en periodos cortos, con empeoramiento vespertino. El flapping bilateral orienta a encefalopatía metabólica. Historia y exploración identifican el órgano responsable, y las pruebas de laboratorio lo confirman.","p":null},{"id":"Encefalopatias_T23-10","b":"Encefalopatias_T23","t":"T23","n":10,"q":"Varón de 59 años reanimado tras 25 minutos de parada cardiorrespiratoria. Ingresa en UCI en coma, sedoanalgesiado, con mioclonías generalizadas. Respecto a la encefalopatía hipóxico-isquémica, señale la afirmación CORRECTA:","o":["El pronóstico debe establecerse solo con la exploración clínica en las primeras horas.","Las mioclonías generalizadas indican una forma leve con buen pronóstico.","La pronta recuperación de los reflejos de tronco es la regla en las formas graves.","Se valora de forma multimodal: EEG, N20, enolasa neuroespecífica y neuroimagen."],"a":3,"e":"La causa más frecuente de encefalopatía hipóxico-isquémica es la parada cardiorrespiratoria. Las formas graves cursan con coma persistente, sin reflejos de tronco y con mioclonías generalizadas. El nivel de conciencia puede estar enmascarado por la sedoanalgesia y la relajación (A). El pronóstico se valora con múltiples parámetros: EEG, N20 en potenciales evocados somatosensoriales, enolasa neuroespecífica y neuroimagen (RM con necrosis laminar cortical hiperintensa en T1/T2; en la TC, pérdida de la diferenciación gris-blanca por edema difuso).","p":null},{"id":"Encefalopatias_T23-11","b":"Encefalopatias_T23","t":"T23","n":11,"q":"Varón de 46 años, hipertenso con mal cumplimiento, que acude por cefalea intensa, confusión, visión borrosa y una crisis tónico-clónica. La presión arterial es de 238/142 mmHg y la exploración no muestra hemiparesia ni otros déficits focales. ¿Cuál es el tratamiento más adecuado según las guías citadas en los apuntes?","o":["Nifedipino sublingual para normalizar la presión arterial lo antes posible en Urgencias.","Labetalol o nicardipino IV en perfusión, sin bajar la PAM >25 % en la primera hora.","No tratar la presión arterial, ya que el cerebro necesita una presión de perfusión elevada.","Bajar la presión arterial a 120/80 mmHg en la primera hora con bolos IV repetidos."],"a":1,"e":"Encefalopatía hipertensiva: elevación rápida y pronunciada de la PA que supera la autorregulación (PAM orientativa >170 mmHg), con vasodilatación, rotura de la barrera hematoencefálica y edema vasogénico de predominio posterior. Tétrada: cefalea, encefalopatía, clínica visual y crisis. Las guías AHA 2025 recomiendan un inicio ultraprecoz pero una reducción cautelosa: no más del 25 % de la PAM en la primera hora, después menos de 160/100 en las 6 horas siguientes y luego 130-140, con fármacos IV titulables en perfusión (nicardipino, clevidipino, labetalol). Un déficit focal distinto de la clínica visual no es típico y obliga a descartar un ictus.","p":null},{"id":"Encefalopatias_T23-12","b":"Encefalopatias_T23","t":"T23","n":12,"q":"Mujer de 39 años, trasplantada renal en tratamiento con tacrolimus, que presenta cefalea, alteración visual con alucinaciones visuales y dos crisis epilépticas. La presión arterial es de 150/92 mmHg. La RM muestra lesiones hiperintensas en T2/FLAIR en la sustancia blanca de ambos lóbulos occipitales y parietales posteriores. Señale la afirmación CORRECTA:","o":["La ausencia de una crisis hipertensiva franca descarta un síndrome de encefalopatía posterior reversible.","Probable PRES por el inmunosupresor; se empieza por corregir la causa.","Infartos occipitales bilaterales de origen embólico, que obligan a iniciar anticoagulación.","Leucoencefalopatía irreversible, sin expectativa de recuperación clínica ni radiológica."],"a":1,"e":"El PRES es un síndrome clínico-radiológico, no una enfermedad única: lesiones hiperintensas en T2/FLAIR de predominio posterior (edema vasogénico), con alteraciones visuales (incluso alucinaciones), cefalea, encefalopatía y crisis. La causa más frecuente es la encefalopatía hipertensiva (unos 2/3), pero también lo producen preeclampsia, sepsis y fármacos citotóxicos o inmunosupresores (ciclosporina, tacrolimus…), por disfunción endotelial sin necesidad de HTA franca. El tratamiento consiste en identificar y tratar la causa, corregir la HTA si existe y aplicar antiepilépticos o medidas antiedema si son precisos.","p":null},{"id":"Encefalopatias_T23-13","b":"Encefalopatias_T23","t":"T23","n":13,"q":"Mujer de 71 años, diabética tratada con metformina y en tratamiento crónico con omeprazol, que refiere hormigueos en manos y pies e inestabilidad que empeora en la oscuridad. En la exploración presenta paraparesia leve, abolición de los reflejos aquíleos, Babinski bilateral y pérdida de la sensibilidad vibratoria y posicional en las piernas. ¿Cuál es el diagnóstico más probable?","o":["Esclerosis lateral amiotrófica de inicio en miembros inferiores.","Polineuropatía diabética aislada de predominio sensitivo.","Encefalopatía de Wernicke con ataxia predominante.","Degeneración combinada subaguda por déficit de B12."],"a":3,"e":"Degeneración combinada subaguda: afectación de cordones posteriores (sensibilidad vibratoria y posicional, ataxia sensitiva que empeora en la oscuridad) y laterales (piramidalismo). Al asociarse con frecuencia a polineuropatía, da una combinación poco frecuente y orientativa: arreflexia aquílea con Babinski bilateral. Metformina e IBP son causas de déficit de B12 por uso crónico. La ELA no produce alteración sensitiva y la polineuropatía diabética no explica el Babinski.","p":null},{"id":"Encefalopatias_T23-14","b":"Encefalopatias_T23","t":"T23","n":14,"q":"Varón de 23 años, consumidor recreativo habitual de óxido nitroso, que presenta en semanas parestesias, inestabilidad de la marcha y signos de afectación de cordones posteriores. La vitamina B12 sérica es normal. ¿Cuál es el siguiente paso más adecuado?","o":["Descartar un origen carencial, dado que la B12 sérica es normal.","Determinar el ácido metilmalónico en sangre.","Iniciar tiamina intravenosa en dosis altas de forma empírica.","Solicitar anticuerpos anti-AQP4 por sospecha de neuromielitis óptica."],"a":1,"e":"El óxido nitroso figura entre las causas de déficit de B12. Ante sospecha clínica con B12 sérica normal, hay que considerar el ácido metilmalónico: el déficit de adenosilcobalamina (cofactor de la metilmalonil-CoA mutasa) hace que se acumule y puede elevarse antes de que la B12 baje. Prueba inicial: B12 total o activa (holotranscobalamina); descartar anemia perniciosa con anticuerpos anti factor intrínseco. Tratamiento: B12 parenteral, con pauta inicial el primer mes y mantenimiento mensual.","p":null},{"id":"Encefalopatias_T23-15","b":"Encefalopatias_T23","t":"T23","n":15,"q":"Mujer de 27 años, embarazada de 11 semanas, ingresada por hiperémesis gravídica. Presenta confusión, nistagmo con paresia de la mirada lateral bilateral e inestabilidad de la marcha con base amplia. ¿Cuál es la actitud correcta?","o":["Tiamina IV en dosis altas de inmediato, sin esperar a la RM, y comprobar el magnesio.","Solicitar RM cerebral y niveles de tiamina, e iniciar el tratamiento solo si se confirma.","Administrar suero glucosado y, después, tiamina oral 100 mg/día.","No administrar tiamina por el riesgo teratógeno durante el primer trimestre."],"a":0,"e":"Encefalopatía de Wernicke (encefalopatía, ataxia, oftalmoparesia), que debe sospecharse también fuera del alcoholismo: hiperémesis gravídica, neoplasia diseminada, cirugía gastrointestinal o bariátrica, diálisis, nutrición parenteral o realimentación, anorexia nerviosa y VIH. Tiamina IV lo antes posible, sin esperar confirmación analítica ni por RM, para evitar la evolución a Korsakoff: la EFNS recomienda 200 mg/8 h IV durante 3-5 días, luego 250 mg/24 h durante 3-5 días y mantenimiento de 100 mg/día. Siempre tiamina antes de la glucosa.","p":null},{"id":"Encefalopatias_T23-16","b":"Encefalopatias_T23","t":"T23","n":16,"q":"Varón de 52 años, alcohólico con desnutrición, que acude por inestabilidad para caminar y desorientación leve. Los movimientos oculares son normales. ¿Cuál es la actitud correcta respecto a la encefalopatía de Wernicke?","o":["Descartarla, ya que sin oftalmoparesia no se cumple la tríada clásica de Wernicke.","Solicitar tiamina difosfato eritrocitaria y tratar solo si está baja.","Iniciar tiamina IV empírica: cumple dos o más criterios de Caine modificados.","Esperar a la RM para confirmar la afectación de los cuerpos mamilares antes de tratar."],"a":2,"e":"La tríada clásica completa solo aparece en una minoría. Los criterios de Caine modificados (recomendados por la EFNS) consideran suficientes 2 de 4 elementos para iniciar tiamina empírica: deficiencia dietética o nutricional, alteración oculomotora, ataxia y alteración del estado mental o de memoria leve. Este paciente cumple tres. El umbral de sospecha debe ser muy bajo. El patrón oro analítico es la tiamina difosfato eritrocitaria o en sangre total por HPLC, y la RM muestra afectación de cuerpos mamilares, tálamo medial y región periacueductal, pero no hay que esperarlas.","p":null},{"id":"Encefalopatias_T23-17","b":"Encefalopatias_T23","t":"T23","n":17,"q":"El paciente de la pregunta anterior recibe tiamina IV a dosis altas desde hace 48 horas, sin ninguna mejoría. ¿Qué debe comprobarse?","o":["Los niveles de vitamina B12, ya que su déficit bloquea la acción de la tiamina.","La natremia, para corregirla lo más rápido posible.","La glucemia, para suspender la tiamina si es normal.","La magnesemia, ya que sin magnesio la tiamina no funciona."],"a":3,"e":"Hay que comprobar, y reponer si es necesario, que no exista un déficit asociado de magnesio, porque sin magnesio la tiamina no funciona. Los puntos clave de los apuntes resaltan administrar dosis altas de tiamina IV asegurando una magnesemia correcta. En el beriberi, además de tiamina, se da un cóctel de vitaminas (B2, B6, niacina y vitamina C). Corregir la natremia rápidamente es peligroso por el riesgo de desmielinización osmótica (B).","p":"Encefalopatias_T23-16"},{"id":"Encefalopatias_T23-18","b":"Encefalopatias_T23","t":"T23","n":18,"q":"Mujer de 49 años, alcohólica, que ingresa con un sodio de 108 mEq/l. En las primeras 24 horas la natremia sube a 126 mEq/l. Tres días después presenta tetraparesia, disartria, disfagia y disminución del nivel de conciencia. La TC craneal es normal. ¿Cuál es el diagnóstico más probable y cómo debió prevenirse?","o":["Encefalopatía de Wernicke; administrando tiamina antes del suero.","Desmielinización osmótica; corrigiendo ≤8-10 mEq/l en 24 h.","Ictus vertebrobasilar; con antiagregación precoz tras la TC.","Degeneración cerebelosa alcohólica; con abstinencia completa."],"a":1,"e":"Síndrome de desmielinización osmótica (clásicamente mielinolisis central pontina): incluye la afectación pontina y la extrapontina (tálamo, cerebelo, sustancia blanca subcortical). Los alcohólicos y desnutridos son especialmente vulnerables por la hiponatremia de base corregida demasiado rápido. Prevención clave: limitar la corrección de la hiponatremia crónica a unos 8-10 mEq/l en 24 h (aquí subió 18). Estas lesiones pueden pasar inadvertidas en la TC y requerir RM.","p":null},{"id":"Encefalopatias_T23-19","b":"Encefalopatias_T23","t":"T23","n":19,"q":"Varón de 61 años, alcohólico de larga evolución, con inestabilidad progresiva de la marcha de base amplia. Las maniobras dedo-nariz son normales y no hay alteración oculomotora ni cognitiva. ¿Cuál es el sustrato más probable?","o":["Atrofia selectiva de la parte superior del vermis cerebeloso, respetando los hemisferios.","Desmielinización de la porción central del cuerpo calloso.","Lesión de los cuerpos mamilares y del tálamo medial.","Atrofia de ambos hemisferios cerebelosos con afectación predominante de las extremidades superiores."],"a":0,"e":"Degeneración cerebelosa alcohólica: atrofia selectiva de la parte superior del vermis, respetando los hemisferios, con ataxia de la marcha y relativa preservación de las extremidades superiores. La desmielinización del cuerpo calloso corresponde a la enfermedad de Marchiafava-Bignami, y la lesión de cuerpos mamilares y tálamo medial a la encefalopatía de Wernicke.","p":null},{"id":"Encefalopatias_T23-20","b":"Encefalopatias_T23","t":"T23","n":20,"q":"Varón de 57 años, alcohólico crónico, con cambios de personalidad, enlentecimiento, reflejos de liberación frontal, disartria e incontinencia de meses de evolución. La RM muestra desmielinización de la porción central del cuerpo calloso. ¿Cuál es el diagnóstico?","o":["Síndrome de Korsakoff.","Síndrome de desmielinización osmótica extrapontina.","Pelagra.","Enfermedad de Marchiafava-Bignami."],"a":3,"e":"Enfermedad de Marchiafava-Bignami: desmielinización de la porción central del cuerpo calloso en alcohólicos crónicos (no solo bebedores de vino tinto), con síndrome frontal (enlentecimiento, cambio de personalidad, reflejos de línea media), disartria, incontinencia, hemiparesia y crisis. Es potencialmente grave y puede evolucionar a demencia y coma. Tratamiento: rehabilitación alcohólica y soporte nutricional. El Korsakoff se caracteriza por amnesia retrógrada y anterógrada con confabulación.","p":null},{"id":"Epilepsia_T04-T05-1","b":"Epilepsia_T04-T05","t":"T04","n":1,"q":"Varón de 34 años, sin antecedentes, que presenta una primera crisis tónico-clónica generalizada no provocada mientras dormía. La exploración neurológica y la RM cerebral son normales. Señale la afirmación CORRECTA:","o":["No puede diagnosticarse epilepsia hasta que presente una segunda crisis no provocada separada más de 24 horas de la primera.","Se trata de una crisis sintomática aguda, por lo que no precisa estudio ni seguimiento neurológico adicional.","Puede diagnosticarse epilepsia con una sola crisis, ya que su aparición durante el sueño implica alto riesgo de repetición.","El diagnóstico de epilepsia exige demostrar anomalías epileptiformes en el EEG intercrítico, con independencia de la clínica."],"a":2,"e":"Según los apuntes, el diagnóstico de epilepsia requiere dos crisis no provocadas separadas más de 24 h, O una sola crisis con alto riesgo de repetición: neuroimagen o EEG alterados, disfunción cerebral previa o aparición durante el sueño. No es sintomática aguda (no hay factor precipitante). El diagnóstico es clínico y un porcentaje considerable de epilépticos tiene EEG intercrítico normal (D).","p":null},{"id":"Epilepsia_T04-T05-2","b":"Epilepsia_T04-T05","t":"T04","n":2,"q":"¿Cuál de las siguientes debe considerarse una crisis NO provocada?","o":["Crisis a los 4 días de un traumatismo craneoencefálico con contusión frontal.","Crisis en un paciente con hiponatremia grave (Na 110).","Crisis durante la fase aguda de una meningoencefalitis bacteriana.","Crisis a los 12 días de un infarto cerebral en territorio de la ACM."],"a":3,"e":"Crisis sintomática aguda: la que aparece en estrecha relación temporal con una agresión aguda al SNC. En ictus, traumatismo o neurocirugía la ventana es de 7 días; en infecciones del SNC y alteraciones metabólicas o tóxicas, durante el episodio agudo (la tabla de los apuntes fija Na <115 como umbral metabólico). Fuera de esos márgenes, la crisis se considera NO provocada, con mayor riesgo de recurrencia.","p":null},{"id":"Epilepsia_T04-T05-3","b":"Epilepsia_T04-T05","t":"T04","n":3,"q":"Niña de 7 años cuya profesora refiere múltiples episodios diarios de 'desconexión' de segundos de duración, de inicio y final bruscos, sin caída al suelo; la niña no es consciente de ellos. En la consulta, la hiperventilación desencadena uno. El EEG muestra actividad de fondo normal y punta-onda generalizada a 3 Hz. ¿Qué tratamiento es adecuado?","o":["Carbamazepina.","Etosuximida.","Fenitoína.","Gabapentina."],"a":1,"e":"Epilepsia de ausencias infantil (3-12 años): ausencias muy numerosas durante el día sin pérdida del tono, punta-onda generalizada a 3 Hz desencadenada por hiperventilación; buen pronóstico (85 % desaparecen antes de los 20 años). Tratamiento: valproato o etosuximida (o combinaciones con lamotrigina o etosuximida). Carbamazepina, fenitoína y gabapentina EMPEORAN las crisis primariamente generalizadas, especialmente ausencias y mioclonías. Además, el valproato debe evitarse en niñas que serán mujeres en edad fértil.","p":null},{"id":"Epilepsia_T04-T05-4","b":"Epilepsia_T04-T05","t":"T04","n":4,"q":"Mujer de 17 años que refiere sacudidas bruscas de ambos brazos poco después de despertarse, con las que se le caen objetos durante el desayuno, sin pérdida de conciencia. El fin de semana, tras una noche sin dormir y con consumo de alcohol, presentó una crisis tónico-clónica generalizada. El EEG muestra polipunta-onda generalizada desencadenada por estimulación luminosa intermitente. ¿Cuál es el tratamiento más adecuado?","o":["Levetiracetam.","Valproato, por ser el fármaco más eficaz y de primera elección en cualquier paciente con este síndrome.","Lamotrigina, por ser uno de los fármacos menos teratógenos.","Carbamazepina, por su buena tolerancia en pacientes jóvenes."],"a":0,"e":"Epilepsia mioclónica juvenil (13-19 años): mioclonías de miembros superiores al despertar, con frecuencia alguna crisis TCG; desencadenantes típicos: privación de sueño y alcohol; PO/PPO generalizada, fotosensible en el 30 %. Buena respuesta al tratamiento, pero recurre si se retira. Tratamiento: valproato o levetiracetam; en mujer en edad fértil se recomienda EVITAR el valproato (teratogenicidad física e intelectual). La lamotrigina está indicada en generalizadas EXCEPTO mioclonías (puede empeorarlas) y la carbamazepina empeora mioclonías y ausencias.","p":null},{"id":"Epilepsia_T04-T05-5","b":"Epilepsia_T04-T05","t":"T04","n":5,"q":"Niño de 8 años, con desarrollo normal, que en el último año ha presentado tres crisis nocturnas breves con sacudidas hemifaciales izquierdas; una de ellas evolucionó a crisis tónico-clónica bilateral. La exploración neurológica es normal. El EEG muestra actividad de fondo normal con ondas agudas centrotemporales de alta amplitud que se activan con el sueño. ¿Cuál es la actitud más adecuada?","o":["RM urgente con contraste e inicio de carbamazepina de forma indefinida.","Abstención terapéutica si la familia comprende el problema, dada su evolución benigna.","Valproato de forma obligada, ya que las crisis nocturnas con evolución a bilateral suponen un alto riesgo.","Estudio genético del gen SCN1A e inicio de estiripentol como fármaco de primera línea."],"a":1,"e":"Epilepsia con puntas centrotemporales (rolándica): inicio a los 3-14 años (pico 8-9), crisis hemifaciales breves que pueden evolucionar a TCG si son nocturnas; neuroimagen normal; resolución hacia los 13 años (hasta 18). Al ser crisis escasas, se recomienda abstención terapéutica si la familia entiende el problema; si no, o si las crisis son frecuentes, valproato. SCN1A y estiripentol corresponden al síndrome de Dravet.","p":null},{"id":"Epilepsia_T04-T05-6","b":"Epilepsia_T04-T05","t":"T04","n":6,"q":"Mujer de 24 años con antecedente de una crisis febril prolongada a los 14 meses. Desde los 15 años presenta episodios que comienzan con sensación epigástrica ascendente y déjà vu, seguidos de desconexión con chupeteo, automatismos en la mano derecha y postura distónica del brazo izquierdo, con confusión posterior. Varios EEG convencionales han sido normales. Señale la afirmación CORRECTA:","o":["El foco más probable es temporal mesial izquierdo, contralateral a los automatismos de la mano.","La normalidad repetida del EEG convencional hace improbable el origen epiléptico de los episodios.","El foco más probable es temporal mesial derecho y, si no responde a fármacos, la cirugía es una buena opción.","Es característico que estas crisis evolucionen con frecuencia a crisis tónico-clónicas bilaterales."],"a":2,"e":"Epilepsia medial del lóbulo temporal: crisis febriles prolongadas en la infancia, intervalo libre y debut en la adolescencia; aura autonómica, cognitiva (déjà vu) o emocional, seguida de detención con automatismos oromanuales. Los automatismos unilaterales lateralizan al hemisferio IPSILATERAL (derecha) y la distonía al CONTRALATERAL (brazo izquierdo → hemisferio derecho). El EEG convencional es con frecuencia normal porque el foco es profundo. Rara vez evolucionan a TCG bilateral. Responden mal a fármacos y bien a la cirugía.","p":null},{"id":"Epilepsia_T04-T05-7","b":"Epilepsia_T04-T05","t":"T04","n":7,"q":"Lactante de 6 meses que presenta salvas de espasmos en flexión al despertar, con retraso madurativo. En la exploración se observan varias máculas hipomelanóticas. El EEG muestra hipsarritmia. ¿Qué fármaco es el más indicado en este caso?","o":["Etosuximida.","Carbamazepina.","Lamotrigina.","Vigabatrina."],"a":3,"e":"Síndrome de West (2 meses-2 años): espasmos en flexión, extensión o ambos, en salvas; el 60 % tiene encefalopatía previa; EEG con hipsarritmia (desorganización completa de la actividad de fondo); mal pronóstico, con evolución a Lennox-Gastaut. Tratamiento: ACTH, valproato y vigabatrina (en casos de esclerosis tuberosa, sugerida aquí por las máculas hipomelanóticas). La lamotrigina figura en el tratamiento del Lennox-Gastaut, no del West.","p":null},{"id":"Epilepsia_T04-T05-8","b":"Epilepsia_T04-T05","t":"T04","n":8,"q":"Niño de 4 años con una mutación en el gen SCN1A. Desde los 5 meses presentó crisis febriles prolongadas y focales; posteriormente, crisis polimorfas, varios estatus desencadenados por fiebre y retraso del desarrollo. ¿Cuál de los siguientes fármacos puede AGRAVAR sus crisis?","o":["Lamotrigina.","Estiripentol.","Fenfluramina.","Cannabidiol."],"a":0,"e":"Síndrome de Dravet (epilepsia mioclónica grave de la infancia): 85 % con mutación de SCN1A; inicio con crisis febriles atípicas (<6 meses, focales o prolongadas) y después crisis polimorfas; descompensaciones por aumento de temperatura, luz intermitente o excitación; estatus frecuentes. Tratamiento: topiramato, valproato, estiripentol, cannabidiol, fenfluramina, dieta cetógena. Carbamazepina y lamotrigina pueden agravar las crisis.","p":null},{"id":"Epilepsia_T04-T05-9","b":"Epilepsia_T04-T05","t":"T04","n":9,"q":"Niño de 2 años y medio con episodios muy frecuentes de desconexión breve, de inicio y final bruscos. El EEG muestra punta-onda generalizada a 3 Hz. ¿Qué diagnóstico debe considerarse y cuál sería su tratamiento específico?","o":["Epilepsia de ausencias infantil típica; etosuximida.","Déficit del transportador de glucosa GLUT-1; dieta cetógena.","Déficit de biotinidasa; ácido folínico.","Epilepsia dependiente de piridoxina; biotina."],"a":1,"e":"Si las crisis de ausencia se inician antes de los 4 años, hay que considerar los trastornos del transportador de glucosa (la ausencia infantil típica empieza a los 3-12 años, pero el inicio tan precoz obliga a descartarlo). El déficit de GLUT-1 se trata con dieta cetógena. Emparejamientos correctos: déficit de biotinidasa → biotina; epilepsia dependiente de piridoxina → piridoxina y piridoxal-5-fosfato; déficit cerebral de folato → ácido folínico.","p":null},{"id":"Epilepsia_T04-T05-10","b":"Epilepsia_T04-T05","t":"T04","n":10,"q":"Sobre la etiología de la epilepsia, señale la afirmación CORRECTA:","o":["En el conjunto del planeta, la etiología infecciosa es la más frecuente, con ejemplos como la neurocisticercosis.","Una etiología genética implica herencia familiar, por lo que siempre hay antecedentes en la familia.","Cuando la epilepsia debuta en la edad adulta, la etiología más frecuente es la genética.","Cada paciente se clasifica en una única categoría etiológica; la esclerosis tuberosa, por ejemplo, es solo genética."],"a":0,"e":"La infecciosa es la etiología más frecuente a nivel mundial (neurocisticercosis, tuberculosis, VIH, malaria, toxoplasmosis, Zika, CMV). Genético no es lo mismo que hereditario: muchas mutaciones aparecen de novo (B). En niños y adolescentes predomina la genética; en adultos, la estructural: ictus, tumores, demencia (C). Un paciente puede tener más de una categoría: la esclerosis tuberosa es estructural y genética (D).","p":null},{"id":"Epilepsia_T04-T05-11","b":"Epilepsia_T04-T05","t":"T05","n":11,"q":"Presencia en la calle cómo un hombre cae al suelo y comienza a presentar una crisis tónico-clónica generalizada. ¿Cuál de las siguientes actuaciones es CORRECTA?","o":["Introducir un objeto entre sus dientes para evitar la mordedura de la lengua.","Sujetar con firmeza sus extremidades para frenar las sacudidas y acortar la crisis.","Estimularle vigorosamente en el periodo poscrítico para comprobar su nivel de conciencia.","Retirar prótesis dentales, colocarle en decúbito lateral y protegerle de traumatismos craneales."],"a":3,"e":"Ante una crisis: evitar que se dañe, retirar cuerpos extraños de la boca (prótesis) y asegurar la vía aérea; decúbito lateral; evitar traumatismos craneales; esperar a que se recupere (suelen ser autolimitadas). Nunca introducir objetos en la boca. No estimular vigorosamente en el poscrítico, porque puede producirse agitación psicomotriz grave. Derivar al hospital si es la primera crisis, si se repiten o si no se recupera.","p":null},{"id":"Epilepsia_T04-T05-12","b":"Epilepsia_T04-T05","t":"T05","n":12,"q":"Varón de 45 años con epilepsia conocida, traído a Urgencias con una crisis tónico-clónica generalizada que persiste a los 6 minutos de su inicio. Se ha canalizado una vía venosa y la glucemia es normal. ¿Cuál es la actitud más adecuada?","o":["Esperar a que se cumplan 30 minutos de crisis, que es el tiempo a partir del cual se define el estado epiléptico.","Sedación anestésica con propofol e intubación orotraqueal como primera medida terapéutica.","Benzodiacepina intravenosa (repetible), junto con un fármaco anticrisis IV como valproato, levetiracetam, fenitoína o lacosamida.","Fenitoína intravenosa en monoterapia, por haber demostrado superioridad frente al resto de fármacos anticrisis IV."],"a":2,"e":"En el status de crisis TCG, T1 (momento de iniciar tratamiento) es a los 5 min y T2 (debe estar controlado por riesgo de daño cerebral) a los 30 min. En T1: benzodiacepinas IV (diazepam, clonazepam), IM o bucal (midazolam) o rectal (diazepam), repetibles hasta tres veces, más un fármaco IV: valproato, levetiracetam, fenitoína, lacosamida o brivaracetam. Ninguno ha demostrado superioridad sobre los demás. La sedación anestésica corresponde a T2.","p":null},{"id":"Epilepsia_T04-T05-13","b":"Epilepsia_T04-T05","t":"T05","n":13,"q":"El mismo paciente continúa en status convulsivo a los 50 minutos, pese a tres dosis de benzodiacepinas y a la administración sucesiva de levetiracetam y valproato IV. ¿Cuál es el siguiente paso?","o":["Sedación anestésica (midazolam, propofol, tiopental o ketamina) con soporte ventilatorio en UCI y monitorización EEG continua.","Añadir una cuarta dosis de diazepam y un tercer fármaco anticrisis por vía oral.","Suspender la medicación y observar, ya que la mayoría de los estatus ceden de forma espontánea.","Sedación anestésica y, si cesan las convulsiones, retirar la monitorización EEG, ya que el control clínico es suficiente."],"a":0,"e":"Superado T2, el status refractario requiere sedación anestésica (ketamina, propofol, midazolam, tiopental o fenobarbital), con soporte ventilatorio e ingreso en UCI, y se recomienda monitorización EEG continua. Esto último es importante porque a veces cesan las convulsiones clínicas pero persiste actividad eléctrica anómala (status no convulsivo), que solo se detecta con EEG (D). El status TCG es una urgencia vital: mortalidad del 10 % y secuelas en el 10-30 %.","p":"Epilepsia_T04-T05-12"},{"id":"Epilepsia_T04-T05-14","b":"Epilepsia_T04-T05","t":"T05","n":14,"q":"Mujer de 22 años que, estando de pie en un concierto en un ambiente caluroso, nota náuseas, sudoración y visión en túnel, y pierde la conciencia de forma progresiva. Los testigos refieren palidez y 3-4 sacudidas de los brazos durante menos de 10 segundos. Presenta mordedura en la punta de la lengua e incontinencia urinaria. Se recupera en 1-2 minutos, sin confusión posterior. ¿Cuál es el diagnóstico más probable?","o":["Crisis tónico-clónica generalizada, dado que hubo incontinencia urinaria y mordedura de lengua.","Síncope, por los pródromos, la palidez, la brevedad de las sacudidas y la ausencia de confusión posterior.","Crisis focal con evolución a bilateral, por la presencia de movimientos clónicos de los brazos.","Crisis atónica, por la pérdida brusca del tono muscular con caída al suelo."],"a":1,"e":"Distinguir crisis generalizada de síncope es el problema diagnóstico más frecuente. A favor de síncope: desencadenante (bipedestación, calor), pródromos (debilidad, náuseas, visión en túnel, sudoración), transición gradual, palidez, movimientos nunca más de 15 s y desorientación de menos de 5 min. La incontinencia puede darse en ambos. La mordedura en la punta es más típica del síncope; en la crisis es lateral o en la mucosa de la mejilla. La crisis atónica dura menos de 2 s y no explica los pródromos.","p":null},{"id":"Epilepsia_T04-T05-15","b":"Epilepsia_T04-T05","t":"T05","n":15,"q":"Respecto a las pruebas diagnósticas en epilepsia, señale la afirmación CORRECTA:","o":["Un EEG intercrítico normal permite descartar el diagnóstico de epilepsia.","La presencia de anomalías paroxísticas en el EEG confirma por sí sola la naturaleza epiléptica de los episodios.","La TC craneal tiene una rentabilidad equivalente a la RM para detectar esclerosis medial temporal o displasias corticales.","El vídeo-EEG es el gold standard, y el EEG tras privación de sueño aumenta la rentabilidad diagnóstica."],"a":3,"e":"El diagnóstico de epilepsia es clínico. Muchos epilépticos tienen EEG intercrítico normal (A), y pueden aparecer anomalías paroxísticas en individuos sanos (B). El EEG tras privación de sueño o durante el sueño aumenta la rentabilidad. El gold standard es registrar el episodio con vídeo-EEG (correlación electroclínica; puede revelar síncopes, arritmias o crisis funcionales). La RM es superior a la TC (C) y debe hacerse con protocolo de epilepsia: cortes coronales perpendiculares al eje del hipocampo en 3DT1, T2 y FLAIR.","p":null},{"id":"Epilepsia_T04-T05-16","b":"Epilepsia_T04-T05","t":"T05","n":16,"q":"Varón de 25 años que ha presentado una primera crisis tónico-clónica generalizada en vigilia, sin desencadenante. No tiene antecedentes neurológicos, la exploración es normal y tanto la RM con protocolo de epilepsia como el EEG con privación de sueño son normales. ¿Cuál es la actitud más adecuada?","o":["Pautar un fármaco anticrisis durante un año y, si no recurre, retirarlo de forma brusca.","Iniciar levetiracetam, ya que toda crisis no provocada requiere tratamiento crónico.","No iniciar tratamiento anticrisis, dado que no presenta factores de alto riesgo de repetición.","Iniciar politerapia racional con dos fármacos de distinto mecanismo de acción para asegurar el control."],"a":2,"e":"La primera crisis no se trata con fármacos anticrisis salvo alto riesgo de repetición: lesión cerebral, alteraciones en el EEG, crisis durante el sueño o enfermedad neurológica previa. Ninguno está presente. Otros principios: monoterapia a la dosis más baja eficaz; todo cambio o retirada debe ser GRADUAL (A); la politerapia, si se necesita, es 'racional' (mecanismos distintos), no una estrategia inicial (D). Precauciones generales: evitar alcohol, sueño regular y evitar el estrés.","p":null},{"id":"Epilepsia_T04-T05-17","b":"Epilepsia_T04-T05","t":"T05","n":17,"q":"Mujer de 29 años con epilepsia generalizada bien controlada con valproato, que desea quedarse embarazada en los próximos meses. ¿Cuál es la actitud más adecuada?","o":["Planificar el embarazo: cambio gradual a un fármaco menos teratógeno a la mínima dosis eficaz y ácido fólico 4 mg/día antes de concebir.","Suspender toda la medicación anticrisis durante el primer trimestre para evitar la teratogenicidad del valproato.","Mantener el valproato, ya que su riesgo teratógeno es menor que el riesgo de las crisis, y añadir ácido fólico al confirmar el embarazo.","Cambiar a lamotrigina y reducir su dosis en el tercer trimestre, ya que los estrógenos aumentan sus niveles."],"a":0,"e":"Los embarazos deben planificarse: reducir a la mínima dosis eficaz e iniciar ácido fólico 4 mg/día ANTES del embarazo. Debe evitarse el valproato en mujeres en edad fértil (C); los menos teratógenos son lamotrigina, levetiracetam, zonisamida y oxcarbazepina. No se recomienda abandonar la medicación: el riesgo de una crisis convulsiva supera al de teratogenicidad (B). En el tercer trimestre los estrógenos actúan como inductores y DISMINUYEN los niveles de lamotrigina, que suele haber que aumentar (D); se recomiendan niveles al menos trimestrales.","p":null},{"id":"Epilepsia_T04-T05-18","b":"Epilepsia_T04-T05","t":"T05","n":18,"q":"Mujer de 26 años con epilepsia focal tratada con carbamazepina, que toma anticonceptivos orales correctamente y queda embarazada. ¿Cuál es la explicación más probable?","o":["La carbamazepina es un inhibidor enzimático que acelera la eliminación del anticonceptivo.","Se trata de un fallo anticonceptivo casual, ya que los fármacos anticrisis no interaccionan con fármacos metabolizados por el citocromo P450.","Este efecto se habría producido igualmente con valproato, que es también un potente inductor enzimático.","La carbamazepina es un inductor enzimático del citocromo P450 que disminuye los niveles del anticonceptivo."],"a":3,"e":"Los fármacos anticrisis inductores enzimáticos (fenitoína, carbamazepina, fenobarbital) disminuyen los niveles de los fármacos que se metabolizan por el citocromo P450, como los anticonceptivos. El valproato es, por el contrario, inhibidor enzimático y aumenta la concentración de otros fármacos (C).","p":null},{"id":"Epilepsia_T04-T05-19","b":"Epilepsia_T04-T05","t":"T05","n":19,"q":"Señale la asociación CORRECTA entre fármaco anticrisis y efecto adverso característico:","o":["Lamotrigina: hiperplasia gingival e hirsutismo.","Topiramato: pérdida de peso y litiasis renal.","Fenitoína: exantema cutáneo como efecto adverso más característico.","Valproato: diplopía y alteraciones hematológicas."],"a":1,"e":"Según la tabla de los apuntes: fenitoína → hiperplasia gingival e hirsutismo; carbamazepina → mareo, diplopía, alteraciones hematológicas; valproato → hepatotoxicidad y teratogenicidad; lamotrigina → rash cutáneo; topiramato → pérdida de peso y litiasis renal. Efectos generales comunes: mareo, inestabilidad, aturdimiento, somnolencia, debilidad, náuseas.","p":null},{"id":"Epilepsia_T04-T05-20","b":"Epilepsia_T04-T05","t":"T05","n":20,"q":"Varón de 40 años con epilepsia focal y buen cumplimiento terapéutico, cuya última crisis con pérdida de conciencia ocurrió en vigilia hace 8 meses. Acude para renovar su permiso de conducir ordinario (vehículo particular). ¿Qué debe indicarse?","o":["Puede conducir, ya que han transcurrido más de 6 meses sin crisis.","Puede conducir sin restricciones si sus crisis previas fueron solo nocturnas, aunque la última haya sido en vigilia.","No puede obtener ni prorrogar el permiso hasta acreditar al menos un año sin crisis mediante informe neurológico.","No podrá conducir vehículos particulares en ningún caso por padecer epilepsia con pérdida de conciencia."],"a":2,"e":"Para el permiso ordinario no se permite la conducción si ha habido crisis convulsivas o con pérdida de conciencia en el último año; en pacientes controlados se requiere informe neurológico (diagnóstico, cumplimiento, más de un año sin crisis y tratamiento compatible con la conducción). Otros plazos: crisis exclusivamente durante el sueño, un año solo con esa sintomatología; sacudidas mioclónicas, tres meses; crisis única no filiada, por fármacos/drogas o postquirúrgica, seis meses (A).","p":null},{"id":"Heredoataxias_T16-1","b":"Heredoataxias_T16","t":"T16","n":1,"q":"Mujer de 58 años, vegana estricta desde hace 15 años, que consulta por inestabilidad progresiva de la marcha que empeora claramente al levantarse por la noche a oscuras. Camina golpeando el suelo con los talones. En la exploración presenta pérdida de la sensibilidad vibratoria y posicional en los pies y Romberg positivo, sin lateralización. No hay dismetría ni nistagmo. ¿Cuál es el tipo de ataxia y su causa más probable?","o":["Ataxia cerebelosa vermiana por déficit nutricional crónico.","Ataxia vestibular periférica bilateral de evolución crónica.","Ataxia sensitiva cordonal posterior por déficit de B12.","Ataxia sensitiva por tabes dorsalis, la causa más frecuente en la actualidad."],"a":2,"e":"Ataxia sensitiva o propioceptiva: marcha taloneante (o tabética), empeoramiento con poca luz, pérdida de la sensibilidad vibratoria y posicional, y Romberg positivo sin lateralizar. Su localización más frecuente es el cordón posterior, por delante del nervio periférico. Las tres causas principales son el déficit de B12 (aquí, por dieta vegana), la lúes y el VIH (mielopatía vacuolar). La tabes era la causa más frecuente antaño, pero hoy lo es menos.","p":null},{"id":"Heredoataxias_T16-2","b":"Heredoataxias_T16","t":"T16","n":2,"q":"Varón de 49 años, bebedor importante, con inestabilidad marcada al caminar y dificultad para mantenerse de pie con los pies juntos, incluso con los ojos abiertos. Presenta nistagmo, disartria, dismetría en la prueba dedo-nariz e hipotonía. Al cerrar los ojos, la inestabilidad no empeora de forma significativa. Señale la afirmación CORRECTA:","o":["Es una ataxia sensitiva, ya que la inestabilidad aparece con los pies juntos y no con base amplia.","Ataxia cerebelosa: no hay signo de Romberg, porque ya es inestable con los ojos abiertos.","Es una ataxia vestibular, ya que el Romberg se lateraliza hacia el lado hipofuncionante.","El signo de Romberg es característico de la lesión cerebelosa aislada."],"a":1,"e":"Si se lesiona el sistema visual, el propioceptivo o el vestibular, los otros dos compensan; al retirar la información visual en una lesión propioceptiva o vestibular aparece la inestabilidad súbita del signo de Romberg. El cerebelo es el integrador: su lesión produce ataxia aunque el resto de sistemas estén indemnes, con inestabilidad en todas direcciones incluso de pie o sentado, por lo que no hay signo de Romberg. Asocia disartria, nistagmo, dismetría, temblor de acción e hipotonía. El alcohol produce sobre todo toxicidad vermiana.","p":null},{"id":"Heredoataxias_T16-3","b":"Heredoataxias_T16","t":"T16","n":3,"q":"Mujer de 45 años con vértigo intenso, náuseas e inestabilidad desde hace 2 días. Presenta un nistagmo horizontorrotatorio con fase rápida hacia la izquierda. En la prueba de Barany, ambos brazos se desvían hacia la derecha, y en la de Ünterberger gira hacia la derecha. No hay otros signos neurológicos. ¿Cuál es el vestíbulo hipofuncionante?","o":["El derecho.","El izquierdo.","Ambos, por tratarse de una hipofunción bilateral.","No puede determinarse sin una prueba de neuroimagen."],"a":0,"e":"En la hipofunción vestibular periférica, el nistagmo es horizontorrotatorio con fase rápida hacia el lado sano y fase lenta hacia el lado afecto. En las pruebas de Barany y Ünterberger, y en la marcha en estrella, el paciente se lateraliza hacia el lado hipofuncionante. El Romberg también se lateraliza hacia ese lado. Todo apunta al vestíbulo derecho.","p":null},{"id":"Heredoataxias_T16-4","b":"Heredoataxias_T16","t":"T16","n":4,"q":"Varón de 74 años, hipertenso y diabético, con vértigo e inestabilidad de inicio brusco hace 3 horas. En la exploración presenta un nistagmo vertical. ¿Cuál es la actitud más adecuada?","o":["Diagnosticar una neuritis vestibular y pautar sedantes vestibulares.","Realizar maniobras de reposicionamiento por sospecha de vértigo posicional paroxístico benigno.","Tranquilizar al paciente, ya que la causa de la ataxia vestibular es casi siempre periférica.","Sospechar origen central (probablemente vascular) y hacer neuroimagen urgente."],"a":3,"e":"Todo nistagmo que no sea horizontorrotatorio (vertical, horizontal puro, multidireccional) debe considerarse potencialmente central. Aunque la mayoría de las ataxias vestibulares son periféricas, la edad orienta la causa central: en jóvenes, desmielinizante; en adultos de inicio brusco, vascular; de inicio progresivo con cefalea, tumoral.","p":null},{"id":"Heredoataxias_T16-5","b":"Heredoataxias_T16","t":"T16","n":5,"q":"Al explorar a un paciente con vértigo agudo se le pide que mire fijamente la nariz del examinador mientras se le gira la cabeza bruscamente. Al girarla hacia la izquierda, los ojos se desplazan con la cabeza y luego aparece una sacada correctora hacia la nariz; hacia la derecha la mirada se mantiene fija. ¿Cómo se interpreta?","o":["Prueba de Romberg positiva, que indica una lesión de los cordones posteriores.","Impulso cefálico alterado: hipofunción vestibular izquierda.","Nistagmo de origen central, que obliga a descartar un ictus de tronco.","Test del impulso cefálico normal, ya que las sacadas correctoras son fisiológicas."],"a":1,"e":"Test del impulso cefálico: el reflejo vestíbulo-ocular mantiene la mirada fija pese al movimiento de la cabeza. Si hay hipofunción vestibular, al mover la cabeza hacia ese lado no se produce el movimiento ocular automático compensador, sino una sacada correctora posterior, semivoluntaria. Aquí ocurre al girar a la izquierda: hipofunción vestibular izquierda.","p":null},{"id":"Heredoataxias_T16-6","b":"Heredoataxias_T16","t":"T16","n":6,"q":"Varón de 63 años con inicio brusco de vértigo, disfagia y ronquera. En la exploración presenta síndrome de Horner derecho, hipoestesia termoalgésica en la hemicara derecha y en el hemicuerpo izquierdo, y ataxia de las extremidades dere
