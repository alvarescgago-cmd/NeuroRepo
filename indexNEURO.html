chas. ¿Cuál es el diagnóstico?","o":["Infarto lacunar talámico izquierdo.","Infarto de la arteria cerebelosa superior derecha.","Síndrome bulbar lateral (de Wallenberg) derecho.","Síndrome protuberancial medial izquierdo."],"a":2,"e":"Es la pregunta que plantea el propio tema: síndrome sensitivo cruzado, síndrome de Horner y ataxia cerebelosa ipsilateral (a menudo por isquemia del pedúnculo cerebeloso). Corresponde al síndrome de Wallenberg, por isquemia de la porción posterolateral del bulbo (arteria vertebral o PICA). Entre las ataxias vasculares, los apuntes citan los ictus en territorio de AICA, PICA y arteria cerebelosa superior.","p":null},{"id":"Heredoataxias_T16-7","b":"Heredoataxias_T16","t":"T16","n":7,"q":"Varón de 38 años con rigidez y torpeza progresiva de ambas piernas desde hace años y urgencia miccional. Su padre y su abuela paterna tuvieron un cuadro similar. Presenta paraparesia espástica con hiperreflexia, clonus aquíleo, Babinski bilateral y disminución de la sensibilidad vibratoria en los pies. La RM muestra atrofia medular. Señale la afirmación CORRECTA:","o":["El diagnóstico de certeza es genético y el tratamiento, sintomático con antiespásticos.","La herencia más frecuente de esta entidad es autosómica recesiva, como en el Friedreich.","Estas enfermedades debutan siempre en la infancia, por lo que su inicio adulto descarta el diagnóstico.","Existe tratamiento curativo con terapia génica dirigida contra la espastina."],"a":0,"e":"Paraparesias espásticas hereditarias: neurodegeneración de la primera motoneurona y del haz corticoespinal, con frecuente afectación del cordón posterior y, en ocasiones, de las fibras parasimpáticas sacras (incontinencia). La herencia más frecuente es autosómica dominante (B). Pueden iniciarse desde la infancia hasta los 70 años (C). La RM muestra atrofia del haz corticoespinal y de los cordones posteriores. El diagnóstico de certeza es genético y no hay tratamiento curativo: antiespásticos (baclofeno, tizanidina, diazepam, dantroleno, toxina botulínica) y bomba de baclofeno intratecal en casos refractarios.","p":null},{"id":"Heredoataxias_T16-8","b":"Heredoataxias_T16","t":"T16","n":8,"q":"Chico de 15 años con inestabilidad progresiva de la marcha desde los 11 años. En la exploración presenta disartria, nistagmo, dismetría, marcha atáxica y taloneante, abolición de los reflejos aquíleos con Babinski bilateral, pérdida de la sensibilidad vibratoria y pie caído. Recientemente se le ha diagnosticado diabetes mellitus. Sus padres están sanos. ¿Cuál es el diagnóstico más probable?","o":["Ataxia espinocerebelosa tipo 3, de herencia autosómica dominante.","Paraparesia espástica hereditaria de herencia dominante.","Esclerosis múltiple de inicio pediátrico con afectación medular.","Ataxia de Friedreich (expansión GAA en el gen FXN)."],"a":3,"e":"Ataxia de Friedreich: autosómica recesiva (padres sanos), la causa más frecuente de ataxia hereditaria por debajo de los 25 años. Se debe a una expansión de tripletes GAA en el gen de la frataxina (FXN), una proteína mitocondrial del cromosoma 9q; más tripletes implican más gravedad e inicio más precoz. Combina afectación de primera motoneurona (Babinski, espasticidad), segunda motoneurona (hipotonía, pie caído), ganglio dorsal y cordón posterior (marcha taloneante) y cerebelo. Asocia diabetes por resistencia a la insulina y cardiopatía. Las SCA son autosómicas dominantes.","p":null},{"id":"Heredoataxias_T16-9","b":"Heredoataxias_T16","t":"T16","n":9,"q":"En el paciente de la pregunta anterior se confirma genéticamente la ataxia de Friedreich. ¿Qué evaluación es imprescindible por su impacto pronóstico?","o":["RM cerebral anual para vigilar la atrofia del vermis.","Evaluación cardiológica, por la miocardiopatía y las arritmias.","Electromiograma seriado para cuantificar la pérdida de segunda motoneurona.","Estudio oftalmológico para descartar retinopatía pigmentaria."],"a":1,"e":"La ataxia de Friedreich asocia afectación cardiológica, sobre todo miocardiopatía hipertrófica y arritmias, que es la causa de muerte más frecuente. Por eso siempre hay que hacer una evaluación cardiológica. El diagnóstico es genético tras descartar otras causas. La idebenona mostró en algunos estudios un beneficio discreto que no se ha confirmado después.","p":"Heredoataxias_T16-8"},{"id":"Heredoataxias_T16-10","b":"Heredoataxias_T16","t":"T16","n":10,"q":"Mujer de 24 años con un síndrome de malabsorción intestinal de larga evolución que presenta ataxia progresiva con arreflexia, pérdida de la sensibilidad vibratoria y signos cerebelosos, en un cuadro superponible a una ataxia de Friedreich. El estudio genético de FXN es negativo. ¿Qué determinación es prioritaria?","o":["Vitamina E en sangre, por su déficit tratable.","Ceruloplasmina, por sospecha de enfermedad de Wilson.","Anticuerpos anti-GQ1b, por sospecha de síndrome de Miller Fisher.","Ninguna: hay que repetir el estudio genético hasta confirmar el Friedreich."],"a":0,"e":"Entre las ataxias no hereditarias de causa metabólica, el déficit de vitamina E produce un cuadro idéntico a la ataxia de Friedreich, y en un contexto de malabsorción es la sospecha principal. Es importante identificarlo porque es tratable. Otras causas metabólicas más raras son la B12, el hipotiroidismo y el hipoparatiroidismo, por lo que suele pedirse una analítica completa.","p":null},{"id":"Heredoataxias_T16-11","b":"Heredoataxias_T16","t":"T16","n":11,"q":"Varón de 61 años con lentitud y rigidez simétricas de 2 años de evolución, sin respuesta a dosis adecuadas de levodopa, inestabilidad de la marcha con dismetría, hiperreflexia con Babinski, hipotensión ortostática, incontinencia urinaria e impotencia. ¿Qué hallazgo de neuroimagen apoyaría el diagnóstico más probable?","o":["Atrofia selectiva del vermis superior.","Lesiones periventriculares ovoideas perpendiculares a los ventrículos.","Signo de la cruz ('hot cross bun') en la protuberancia.","Atrofia del haz corticoespinal y de los cordones posteriores."],"a":2,"e":"Atrofia multisistémica: afecta a los sistemas piramidal (hiperreflexia, Babinski), extrapiramidal (síndrome rígido-acinético simétrico que no responde a levodopa), cerebeloso (ataxia, dismetría) y autonómico (incontinencia urinaria, impotencia, hipotensión ortostática). El diagnóstico es clínico tras excluir otras causas, y su marcador radiológico típico es el signo de la cruz ('hot cross bun'). No tiene tratamiento eficaz; si predomina el parkinsonismo, a veces se prueba levodopa a dosis mayores que en el Parkinson idiopático.","p":null},{"id":"Heredoataxias_T16-12","b":"Heredoataxias_T16","t":"T16","n":12,"q":"Varón de 35 años que, 10 días después de una gastroenteritis, presenta visión doble e inestabilidad progresivas. En la exploración tiene oftalmoparesia bilateral, ataxia de la marcha y de las extremidades y arreflexia generalizada, sin debilidad significativa. ¿Qué estudio apoya el diagnóstico más probable?","o":["Anticuerpos anti-Yo.","Anticuerpos anti-GQ1b.","Anticuerpos antitiroideos.","Anticuerpos contra el gluten."],"a":1,"e":"Síndrome de Miller Fisher, ataxia parainfecciosa o disinmune: cuadro similar al Guillain-Barré pero con clínica de tronco y cerebelo (oftalmoparesia y ataxia cerebelosa), clásicamente con arreflexia. Se relaciona con anticuerpos anti-GQ1b. Los anti-Yo son paraneoplásicos, los antitiroideos se asocian a la encefalopatía de Hashimoto y los anticuerpos contra el gluten a la ataxia por intolerancia al gluten.","p":null},{"id":"Heredoataxias_T16-13","b":"Heredoataxias_T16","t":"T16","n":13,"q":"Varón de 64 años, fumador de 50 paquetes-año, con un síndrome pancerebeloso grave de instauración subaguda en 6 semanas (ataxia de la marcha, dismetría bilateral, disartria y nistagmo). La RM cerebral es normal. ¿Cuál es la actitud más adecuada?","o":["Iniciar levodopa por sospecha de atrofia multisistémica.","Solicitar estudio genético de ataxias espinocerebelosas de tipos 2 y 3.","Diagnosticar una degeneración cerebelosa alcohólica y recomendar abstinencia.","Anticuerpos onconeuronales y búsqueda de una neoplasia, sobre todo pulmonar."],"a":3,"e":"Degeneración cerebelosa paraneoplásica: se asocia especialmente al carcinoma microcítico de pulmón y a anticuerpos anti-Yo, anti-Ri y anti-Hu. La instauración subaguda en un fumador con RM normal obliga a sospecharla y buscar el tumor. Las SCA (en España, sobre todo tipos 3 y 2) son hereditarias y progresan lentamente, y la atrofia multisistémica asocia parkinsonismo y disautonomía.","p":null},{"id":"Heredoataxias_T16-14","b":"Heredoataxias_T16","t":"T16","n":14,"q":"Mujer de 52 años con hipotiroidismo autoinmune que presenta en semanas confusión fluctuante e inestabilidad marcada con ataxia de la marcha. La RM y el LCR no muestran una causa alternativa y tiene títulos elevados de anticuerpos antitiroideos. ¿Cuál es el tratamiento indicado?","o":["Corticoides.","Levotiroxina a dosis altas.","Dieta estricta sin gluten.","Idebenona."],"a":0,"e":"La encefalopatía de Hashimoto, o encefalopatía respondedora a corticosteroides asociada a autoinmunidad antitiroidea, es una enfermedad rara en la que pacientes con o sin patología tiroidea presentan anticuerpos antitiroideos y una encefalopatía con predominio de la ataxia. Responde de manera espectacular a los corticoides. La dieta sin gluten se usa en la ataxia por intolerancia al gluten, con anticuerpos específicos positivos.","p":null},{"id":"Heredoataxias_T16-15","b":"Heredoataxias_T16","t":"T16","n":15,"q":"Varón de 30 años con epilepsia focal tratado con fenitoína, cuya dosis se aumentó hace 2 semanas. Consulta por inestabilidad de la marcha, visión borrosa y habla 'pastosa'. Presenta nistagmo horizontal en ambas direcciones, disartria y dismetría bilateral, sin otros hallazgos. ¿Cuál es la causa más probable?","o":["Ataxia espinocerebelosa de herencia dominante de debut tardío.","Ataxia sensitiva por neuropatía secundaria a la fenitoína.","Ataxia cerebelosa tóxica por fenitoína.","Encefalitis cerebelosa por varicela."],"a":2,"e":"Entre las ataxias cerebelosas no hereditarias de causa tóxica, los apuntes destacan el alcohol (sobre todo vermiano) y los fármacos (carbamazepina, fenitoína y litio), que hay que considerar siempre. La relación con el aumento de dosis y el síndrome cerebeloso bilateral (nistagmo, disartria, dismetría) orientan a toxicidad. La encefalitis por varicela afecta sobre todo al cerebelo, pero en un contexto infeccioso.","p":null},{"id":"Hipercineticos_T15-1","b":"Hipercineticos_T15","t":"T15","n":1,"q":"Varón de 52 años con temblor en ambas manos desde hace 10 años, algo asimétrico, que aparece al mantener los brazos extendidos, al beber o al escribir, y empeora con el estrés. Nota que mejora claramente tras tomar una copa de vino. Su madre y su tío materno tenían un temblor similar. No hay bradicinesia, rigidez ni signos cerebelosos. ¿Cuál es el diagnóstico y un tratamiento de primera línea?","o":["Enfermedad de Parkinson de inicio tremórico; levodopa.","Temblor esencial; propranolol o primidona.","Temblor cerebeloso; tratamiento de la causa subyacente.","Temblor fisiológico exacerbado; benzodiacepinas a demanda."],"a":1,"e":"El temblor esencial es el trastorno del movimiento más frecuente. Tiene componente hereditario autosómico dominante de alta penetrancia y se atribuye a la pérdida de células de Purkinje (pérdida de GABA). Es un temblor de acción (postural, con componente cinético e intencional) de 4-12 Hz, bilateral y asimétrico una vez establecido, en flexoextensión de la muñeca, que empeora con el estrés y mejora característicamente con el alcohol. No debe haber datos extrapiramidales, cognitivos ni cerebelosos. Tratamiento: propranolol, primidona, gabapentina, topiramato, zonisamida, perampanel, clonazepam o toxina botulínica.","p":null},{"id":"Hipercineticos_T15-2","b":"Hipercineticos_T15","t":"T15","n":2,"q":"El paciente anterior, años después, tiene un temblor grave y discapacitante que no se controla con propranolol ni con primidona a dosis máximas toleradas. ¿Qué opción terapéutica es la adecuada y sobre qué diana actúa?","o":["Estimulación cerebral profunda o HIFU sobre el núcleo ventral intermedio (VIM) del tálamo.","Estimulación cerebral profunda del globo pálido interno.","Estimulación cerebral profunda del núcleo subtalámico, igual que en la enfermedad de Parkinson.","Levodopa a dosis altas en combinación con un agonista dopaminérgico."],"a":0,"e":"En el temblor esencial grave y discapacitante se puede recurrir al HIFU (ultrasonidos focalizados de alta intensidad, sin cirugía, con marco estereotáctico y guía por RM) o a la estimulación cerebral profunda, ambos sobre el núcleo ventral intermedio (VIM) del tálamo, muy implicado en los circuitos del temblor. El globo pálido es la diana de la estimulación en la distonía, y el núcleo subtalámico, en la enfermedad de Parkinson.","p":"Hipercineticos_T15-1"},{"id":"Hipercineticos_T15-3","b":"Hipercineticos_T15","t":"T15","n":3,"q":"Mujer de 28 años con nerviosismo, pérdida de 5 kg, palpitaciones e intolerancia al calor. Presenta un temblor fino de alta frecuencia (unos 10 Hz) en ambas manos, ausente en reposo y presente al extender los brazos. ¿Qué tipo de temblor es y cómo puede controlarse mientras se trata la causa?","o":["Temblor esencial de inicio precoz; primidona indefinida.","Temblor rúbrico por lesión mesencefálica; levodopa.","Temblor fisiológico exacerbado; propranolol.","Temblor parkinsoniano; agonistas dopaminérgicos."],"a":2,"e":"El temblor fisiológico exacerbado tiene la frecuencia normal (8-12 Hz) pero mayor amplitud; está ausente en reposo y aparece al mantener una postura. Se debe a un aumento de la actividad β-adrenérgica periférica por catecolaminas circulantes: ansiedad, tirotoxicosis (como en este caso), feocromocitoma, hipoglucemia, fármacos (catecolaminas, metilxantinas) o retirada de β-bloqueantes, morfina o alcohol. Se controla bien con β-bloqueantes (propranolol), además de tratar la causa.","p":null},{"id":"Hipercineticos_T15-4","b":"Hipercineticos_T15","t":"T15","n":4,"q":"Varón de 64 años que sufrió hace 5 meses un infarto en el mesencéfalo izquierdo. Desde hace semanas presenta un temblor del brazo derecho de baja frecuencia (unos 3 Hz) y gran amplitud, presente en reposo, que empeora al mantener una postura y todavía más al intentar coger objetos. ¿De qué temblor se trata?","o":["Temblor esencial desencadenado por el ictus.","Temblor cerebeloso puro, solo intencional.","Temblor parkinsoniano por lesión de la sustancia negra.","Temblor rúbrico (mesencefálico o de Holmes)."],"a":3,"e":"El temblor rúbrico (mesencefálico o de Holmes) se produce por lesiones en la vía de proyección del núcleo dentado del cerebelo al tálamo, en las proximidades del núcleo rojo. Está presente en reposo, en postura y en movimiento, suele ser unilateral, de muy baja frecuencia (<5 Hz), y se asocia a esclerosis múltiple o a patología vascular del tronco. Su control es subóptimo: se prueban los fármacos del temblor esencial y la levodopa, y podría intentarse la estimulación profunda del VIM. El temblor cerebeloso es muy cinético e intencional, sin componente de reposo.","p":null},{"id":"Hipercineticos_T15-5","b":"Hipercineticos_T15","t":"T15","n":5,"q":"Varón de 21 años con temblor de gran amplitud de ambos brazos al mantenerlos extendidos y abducidos, 'como un aleteo', disartria, cambios de carácter y descenso del rendimiento académico. En la analítica tiene elevación de transaminasas. ¿Qué hallazgo apoyaría el diagnóstico más probable?","o":["Ceruloplasmina sérica elevada con cupremia alta.","Expansión de tripletes CAG en el cromosoma 4.","Ceruloplasmina baja y anillo de Kayser-Fleischer.","Ferritina baja con saturación de transferrina reducida."],"a":2,"e":"Enfermedad de Wilson: autosómica recesiva por mutación en ATP7B, con afectación multiorgánica. Debe descartarse en cualquier persona menor de 40 años con un trastorno del movimiento (distonía, síndrome rígido-acinético o temblor en aleteo, 'wing-beating'). Asocia disfunción hepática, síntomas neuropsiquiátricos y anillo de Kayser-Fleischer. En la analítica, ceruloplasmina sérica baja y cupremia baja; el diagnóstico se confirma con estudio molecular. Tiene tratamiento: quelantes del cobre.","p":null},{"id":"Hipercineticos_T15-6","b":"Hipercineticos_T15","t":"T15","n":6,"q":"Mujer de 43 años con movimientos involuntarios irregulares, rápidos y fluctuantes en la cara, el tronco y las extremidades, que al principio podía disimular. Desde hace 2 años tiene dificultad para planificar y organizarse, y ha sido tratada por depresión. Su padre falleció a los 55 años con un cuadro similar. En la exploración tiene dificultad para iniciar las sacadas oculares. ¿Qué hallazgo de neuroimagen es esperable?","o":["Atrofia de los caudados con dilatación de astas frontales.","Hiperintensidad del borde lateral del putamen.","Atrofia mesencefálica con signo del colibrí sagital.","Atrofia hipocampal bilateral marcada y simétrica."],"a":0,"e":"Enfermedad de Huntington: autosómica dominante, por expansión del triplete CAG en el gen IT15 del cromosoma 4 (huntingtina). Tríada: trastorno del movimiento (corea, al inicio suprimible, con distonía y parkinsonismo; la alteración de las sacadas puede ser el signo más precoz), deterioro cognitivo frontosubcortical con disfunción ejecutiva (sin afasias, apraxias ni agnosias, a diferencia de la EA) y clínica psiquiátrica (depresión en el 50 %, mayor riesgo de suicidio, psicosis en el 5-10 %). En TC o RM hay atrofia de los caudados con dilatación de las astas frontales y atrofia cortical difusa.","p":null},{"id":"Hipercineticos_T15-7","b":"Hipercineticos_T15","t":"T15","n":7,"q":"El hijo de 22 años de la paciente anterior, asintomático, solicita el estudio genético tras recibir consejo. El resultado muestra 38 repeticiones CAG en el gen de la huntingtina. ¿Cómo se interpreta?","o":["Resultado normal: no desarrollará la enfermedad ni la transmitirá.","Portador asintomático que nunca desarrollará la enfermedad, pero puede transmitirla.","Penetrancia incompleta: puede desarrollarla, más probable a más repeticiones.","Penetrancia completa con inicio juvenil asegurado antes de los 30 años."],"a":2,"e":"Repeticiones CAG: 6-26, normal; 27-35, portadores asintomáticos; 36-39, penetrancia incompleta, mayor cuantas más repeticiones; 40 o más, penetrancia completa; más de 60, formas precoces. La variante juvenil de Westphal (5-10 %, inicio antes de los 20 años) tiene predominio de rigidez sobre la corea, crisis y ataxia, y en el 90 % el gen se hereda del padre. El estudio genético se hace ante un cuadro típico o antecedentes familiares, en portadores asintomáticos y como consejo pregestacional.","p":"Hipercineticos_T15-6"},{"id":"Hipercineticos_T15-8","b":"Hipercineticos_T15","t":"T15","n":8,"q":"Respecto al tratamiento de la enfermedad de Huntington, señale la afirmación CORRECTA:","o":["Existe un tratamiento neuroprotector que frena la progresión si se inicia en la fase presintomática.","La corea debe tratarse siempre de forma precoz y a dosis altas, porque mejora la capacidad funcional.","La depresión se trata preferentemente con antidepresivos tricíclicos.","La corea solo se trata si molesta mucho, a dosis bajas (tetrabenazina o atípicos)."],"a":3,"e":"No existe tratamiento neuroprotector. El tratamiento de la corea no suele mejorar la capacidad funcional; solo se trata si el movimiento es muy molesto y siempre a dosis bajas, por el riesgo de parkinsonismo, discinesias tardías y sedación. Se usan depletores dopaminérgicos (tetrabenazina) o neurolépticos atípicos, y haloperidol si es refractaria o grave. La psicosis se trata con neurolépticos atípicos; la depresión, con ISRS, evitando los tricíclicos por el deterioro cognitivo. El parkinsonismo responde poco a los dopaminérgicos.","p":null},{"id":"Hipercineticos_T15-9","b":"Hipercineticos_T15","t":"T15","n":9,"q":"Niña de 9 años que, desde hace 3 semanas, presenta movimientos involuntarios bruscos e irregulares en las extremidades y la cara, habla disártrica, irritabilidad y labilidad emocional. Hace 2 meses tuvo una faringoamigdalitis. Los títulos de ASLO y la VSG son normales. Señale la afirmación CORRECTA:","o":["La normalidad del ASLO y de la VSG descarta una corea de Sydenham.","Probable corea de Sydenham; hay que valorar la afectación cardiaca.","Se trata de una enfermedad de Huntington juvenil, por la edad de inicio.","La corea de Sydenham tiene mal pronóstico, con secuelas graves en la mayoría."],"a":1,"e":"La corea de Sydenham es una enfermedad autoinmune postinfecciosa tras una faringitis por estreptococo del grupo A, en niños de 6-15 años, por anticuerpos contra los ganglios basales. Aparece 1-3 meses después, de forma subaguda, con corea, disartria y alteraciones conductuales o psicóticas, en el contexto de fiebre reumática (afectación cardiaca). El ASLO y la VSG son poco útiles porque suelen ser normales al ser tardía. Tratamiento: anticoreicos, el de la fiebre reumática y corticoides o inmunoglobulinas en casos graves. Mejora en semanas hasta la remisión o con escasas secuelas.","p":null},{"id":"Hipercineticos_T15-10","b":"Hipercineticos_T15","t":"T15","n":10,"q":"Mujer de 81 años con diabetes tipo 2 mal controlada que acude por movimientos involuntarios amplios, violentos y de lanzamiento del brazo y la pierna derechos, de 2 días de evolución. La glucemia es de 580 mg/dl, sin cetoacidosis. ¿Cuál es la causa más probable del cuadro?","o":["Enfermedad de Huntington de inicio tardío.","Hemicorea-hemibalismo por hiperglucemia grave.","Crisis epilépticas motoras focales continuas por hipoglucemia.","Corea gravídica."],"a":1,"e":"Entre las coreas secundarias, las metabólicas incluyen la hiperglucemia grave, que produce un cuadro de hemicorea-hemibalismo, y la hipomagnesemia. Otras causas secundarias son las vasculares (infarto en el putamen), los fármacos (dopaminérgicos, neurolépticos), las autoinmunes (Sydenham, lupus), las infecciosas (VIH, toxoplasma) y la corea gravídica (primer trimestre, autolimitada). Los movimientos hemicorporales suelen deberse a una lesión contralateral.","p":null},{"id":"Hipercineticos_T15-11","b":"Hipercineticos_T15","t":"T15","n":11,"q":"Mujer de 48 años con giro involuntario y mantenido de la cabeza hacia la derecha desde hace 2 años, con dolor cervical, que mejora al tocarse ligeramente la barbilla. La exploración neurológica es por lo demás normal. ¿Cuál es el tratamiento de elección?","o":["Infiltración con toxina botulínica de los músculos implicados.","Estimulación cerebral profunda del globo pálido como primera opción.","Levodopa a dosis altas de forma indefinida.","Estudio genético y de enzimas lisosomales antes de iniciar cualquier tratamiento."],"a":0,"e":"La distonía cervical es la distonía focal más frecuente. Las distonías focales o segmentarias del adulto suelen ser idiopáticas y esporádicas, sin otra focalidad, y no requieren más estudios. La toxina botulínica es de elección y especialmente eficaz en las formas focales (cervical, blefaroespasmo, disfonía espasmódica). La estimulación cerebral profunda del globo pálido se reserva para distonías generalizadas y cervicales resistentes a toxina y fármacos. Los estudios genéticos y metabólicos se reservan para formas generalizadas, juveniles o complejas.","p":null},{"id":"Hipercineticos_T15-12","b":"Hipercineticos_T15","t":"T15","n":12,"q":"Niña de 8 años con postura distónica de los pies que dificulta la marcha, mucho más marcada por la tarde y que mejora claramente tras dormir. La RM cerebral es normal. ¿Qué actitud terapéutica es la más adecuada?","o":["Toxina botulínica en las piernas como único tratamiento.","Estimulación cerebral profunda palidal precoz.","Haloperidol a dosis bajas y progresivas.","Prueba terapéutica con levodopa (sospecha de DYT5)."],"a":3,"e":"La DYT5 o enfermedad de Segawa (gen GCH1) es una distonía con respuesta a levodopa, a veces con parkinsonismo asociado y con fluctuaciones diurnas y empeoramiento vespertino; mejora con levodopa. En las distonías infantiles y juveniles, que suelen ser generalizadas e iniciarse en las piernas, siempre se hace una prueba de levodopa. Además, la enfermedad de Parkinson juvenil puede comenzar con distonía de una extremidad. La DYT1 es la distonía primaria generalizada más frecuente (autosómica dominante, pura).","p":null},{"id":"Hipercineticos_T15-13","b":"Hipercineticos_T15","t":"T15","n":13,"q":"Niño de 9 años con parpadeo, muecas faciales y sacudidas del hombro desde los 6 años, junto con carraspeos y gruñidos frecuentes. Puede contenerlos un rato, pero le produce una sensación desagradable que se alivia al hacerlos. Disminuyen cuando juega concentrado y empeoran con los exámenes. Tiene además rasgos de TDAH y conductas obsesivas. Los tics le interfieren en el colegio. Señale la actitud CORRECTA:","o":["Los tics no son controlables por la voluntad, por lo que debe descartarse una epilepsia mediante EEG.","El tratamiento farmacológico de elección de los tics es la levodopa a dosis bajas.","Terapia cognitivo-conductual y, si son disfuncionales, neurolépticos atípicos.","La enfermedad empeora siempre en la edad adulta, por lo que debe indicarse una estimulación cerebral profunda precoz."],"a":2,"e":"Síndrome de Gilles de la Tourette: trastorno neuropsiquiátrico hereditario (poligénico, más penetrante en varones) con inicio antes de los 18 años (habitualmente a los 6-7), tics motores múltiples y vocales que varían en el tiempo, y asociación con TDAH, TOC y ansiedad. Los tics son parcialmente controlables, disminuyen con la distracción y empeoran con el estrés; tienden a mejorar en la edad adulta. Tratamiento: terapia cognitivo-conductual y, si son disfuncionales, neurolépticos (los más eficaces: atípicos como risperidona u olanzapina y, si fallan, haloperidol), clonazepam, tetrabenazina o toxina botulínica. La estimulación cerebral profunda se reserva para adultos con tics graves.","p":null},{"id":"Hipercineticos_T15-14","b":"Hipercineticos_T15","t":"T15","n":14,"q":"Mujer de 55 años que desde hace un año siente cada noche, al sentarse a ver la televisión o al acostarse, una necesidad imperiosa de mover las piernas con sensación desagradable, que se alivia al caminar y le impide dormir. La ferritina es de 40 ng/ml y la función renal es normal. Según las guías citadas en los apuntes, ¿cuál es la actitud más adecuada?","o":["Iniciar pramipexol a dosis bajas como primera línea.","Iniciar levodopa nocturna como tratamiento de elección.","Pautar duloxetina por las disestesias nocturnas.","Reponer hierro e iniciar gabapentina o pregabalina."],"a":3,"e":"El síndrome de piernas inquietas (2 % de la población) exige 4 criterios clínicos: necesidad imperiosa de mover las piernas, predominio vespertino, aparición en reposo y alivio con la actividad. Las causas secundarias incluyen el déficit de ferritina, la insuficiencia renal, las neuropatías y la enfermedad de Parkinson. Tratamiento: evitar fármacos agravantes (duloxetina, mirtazapina), medidas no farmacológicas y reponer hierro si la ferritina es menor de 75 ng/ml o el IST menor del 20 %. Según las nuevas guías, la primera línea en el SPI diario es gabapentina o pregabalina, evitando agonistas y levodopa por el riesgo de trastorno de control de impulsos y de fenómeno de aumento.","p":null},{"id":"Hipercineticos_T15-15","b":"Hipercineticos_T15","t":"T15","n":15,"q":"Varón de 56 años que sobrevivió a una parada cardiorrespiratoria hace 3 meses y está consciente. Presenta sacudidas musculares bruscas y breves en las extremidades al intentar coger objetos o al caminar, que le impiden comer solo. ¿Cuál es el diagnóstico y qué tratamiento es adecuado?","o":["Temblor esencial desencadenado por la anoxia; propranolol.","Mioclonías posthipóxicas de Lance-Adams; levetiracetam.","Corea secundaria a la lesión hipóxica; tetrabenazina.","Tics motores adquiridos tras la parada; risperidona."],"a":1,"e":"Las mioclonías son movimientos involuntarios rápidos, breves y súbitos por contracción de agonistas y antagonistas (positivas) o por una breve pérdida del tono (negativas: asterixis o flapping). Entre las secundarias está la mioclonía posthipóxica o síndrome de Lance-Adams, en la que el paciente recupera la conciencia y presenta mioclonías de acción. Tratamiento: el etiológico; en cualquier mioclonía, valproato y clonazepam; en las corticales y epilépticas, además piracetam, levetiracetam o brivaracetam; en las subcorticales y reticulares, clonazepam o zonisamida.","p":null},{"id":"Ictus_T01-T03-1","b":"Ictus_T01-T03","t":"T01","n":1,"q":"Varón de 64 años, hipertenso y fumador, que presenta de forma brusca vértigo, vómitos e inestabilidad. En la exploración se objetiva ptosis y miosis derechas, hipoestesia en la hemicara derecha, disfonía con voz bitonal, disfagia grave con paresia del velo del paladar derecho, dismetría en extremidades derechas e hipoestesia en el hemicuerpo izquierdo. ¿Cuál es la localización más probable de la lesión y el vaso implicado?","o":["Porción paramediana de la hemiprotuberancia derecha; ramas perforantes paramedianas de la arteria basilar.","Porción posterolateral del hemibulbo izquierdo; arteria vertebral izquierda.","Porción posterolateral del hemibulbo derecho; arteria vertebral derecha.","Porción medial del hemibulbo derecho; arteria espinal anterior derecha."],"a":2,"e":"Síndrome de Wallenberg (bulbar lateral). Clínica ipsilateral: Horner, hipoestesia facial (V par), afectación de pares bajos IX-X (disfagia, voz bitonal, velo del paladar) y dismetría; clínica contralateral: hipoestesia del hemicuerpo por afectación de vías ya decusadas. Se asocia típicamente a oclusión de la vertebral del mismo lado (la afectación del cerebelo por la PICA no es necesaria). B invierte el lado: los pares craneales se afectan en el lado de la lesión. A daría clínica de VI/VII par con hemiparesia contralateral; D, hemiparesia contralateral sin Horner.","p":null},{"id":"Ictus_T01-T03-2","b":"Ictus_T01-T03","t":"T01","n":2,"q":"Varón de 70 años que presenta debilidad en la mano derecha y dificultad para encontrar palabras durante 40 minutos, con resolución completa. La TC craneal urgente es normal. En la RM realizada a las 72 horas, la secuencia de difusión (DWI) muestra una pequeña lesión hiperintensa cortical frontal izquierda. ¿Cuál es el diagnóstico correcto?","o":["Ataque isquémico transitorio, ya que la clínica se resolvió en menos de 24 horas.","Infarto cerebral agudo, ya que el diagnóstico lo establece la neuroimagen y no la duración de los síntomas.","Ataque isquémico transitorio de alto riesgo, ya que la lesión en DWI modifica el pronóstico pero no la categoría diagnóstica.","Ictus de etiología indeterminada, dado que la TC inicial no mostró lesión isquémica."],"a":1,"e":"El concepto actual de AIT exige reversibilidad clínica Y ausencia de lesión aguda en DWI (la secuencia más sensible para infarto agudo). Si la DWI muestra daño irreversible, es un infarto cerebral agudo independientemente de lo que durase la clínica; el criterio clásico de 24 h está superado (la mayoría de los ictus de más de 1 h dejan lesión). La normalidad de la TC no descarta infarto y 'indeterminado' es una categoría etiológica, no diagnóstica del evento.","p":null},{"id":"Ictus_T01-T03-3","b":"Ictus_T01-T03","t":"T01","n":3,"q":"Varón de 67 años, hipertenso y dislipémico, que acude a Urgencias 3 horas después de un episodio de 30 minutos de debilidad en el brazo izquierdo, ya resuelto. La exploración neurológica es normal y el ECG muestra ritmo sinusal. ¿Cuál de las siguientes afirmaciones es CORRECTA?","o":["Al estar asintomático y con ECG normal, puede remitirse a la consulta de Neurología de forma preferente en las próximas semanas.","El mayor riesgo de recurrencia precoz tras un AIT se asocia a causa cardioembólica, por lo que la prueba prioritaria es un ecocardiograma transesofágico urgente.","Debe realizarse un angio-TC urgente de forma sistemática en todos los pacientes con AIT, al ser el método más costo-efectivo para estudiar los vasos cerebrales.","Precisa estudio urgente no invasivo de arterias extra e intracraneales, pues la causa aterosclerótica es la de mayor riesgo de recurrencia precoz."],"a":3,"e":"El AIT es una urgencia neurológica: valoración neurológica urgente, ECG (descartar FA), TC y estudio no invasivo de arterias extra e intracraneales de circulación anterior y posterior. El mayor riesgo de recurrencia precoz se asocia a causa arterial, sobre todo aterosclerosis. El método más costo-efectivo es el eco-Doppler de TSA y transcraneal; el angio-TC es posible pero no rentable de urgencia en todos (C). Idealmente, RM con DWI en los primeros 7-10 días.","p":null},{"id":"Ictus_T01-T03-4","b":"Ictus_T01-T03","t":"T01","n":4,"q":"Mujer de 66 años, fumadora y diabética, con un infarto cortical en territorio de la ACM izquierda. El eco-Doppler de troncos supraaórticos muestra una estenosis del 60 % en la carótida interna izquierda cervical. ECG, monitorización ECG prolongada y ecocardiograma normales. ¿Cómo debe clasificarse etiológicamente el ictus?","o":["Ictus aterotrombótico.","Ictus de causa indeterminada, ya que para atribuir el ictus a aterosclerosis se requiere una estenosis superior al 70 %.","Ictus criptogénico, ya que una estenosis no crítica no puede producir isquemia por mecanismo hemodinámico.","Ictus de posible origen cardioembólico, dado que una monitorización normal no excluye fibrilación auricular paroxística."],"a":0,"e":"El diagnóstico de ictus aterotrombótico requiere una estenosis >50 % de una arteria proximal al territorio afectado, sin otra causa probable. El 70 % es el umbral para indicar revascularización, no para clasificar (B). Una placa sin estenosis crítica puede causar isquemia por embolismo arterio-arterial o trombosis, no solo por mecanismo hemodinámico (C). Con estudio cardiológico completo normal no hay base para etiquetarlo como cardioembólico (D).","p":null},{"id":"Ictus_T01-T03-5","b":"Ictus_T01-T03","t":"T01","n":5,"q":"Varón de 75 años con un infarto territorial de ACM derecha. Tras un estudio etiológico completo se detecta una fibrilación auricular no conocida en la monitorización y una estenosis aterosclerótica del 70 % en la carótida interna derecha cervical. ¿Cómo se clasifica el ictus?","o":["Cardioembólico, porque la fibrilación auricular es una cardiopatía embolígena mayor y prevalece sobre otras causas.","Aterotrombótico, porque la estenosis es ipsilateral al territorio infartado.","De causa indeterminada por coexistencia de dos causas.","Criptogénico, al no poder establecerse una causa única tras un estudio completo."],"a":2,"e":"Cuando coexisten dos causas potenciales (p. ej., FA y estenosis carotídea significativa ipsilateral), el ictus se clasifica como indeterminado por coexistencia de dos causas; ninguna 'prevalece' sobre la otra. El término criptogénico se reserva para el ictus sin causa hallada tras un estudio completo, que no es el caso.","p":null},{"id":"Ictus_T01-T03-6","b":"Ictus_T01-T03","t":"T01","n":6,"q":"Varón de 73 años con HTA mal controlada que presenta hemiparesia derecha que afecta de forma proporcionada a cara, brazo y pierna, sin alteraciones sensitivas, del lenguaje, del campo visual ni negligencia. La RM muestra un infarto agudo en el brazo posterior de la cápsula interna izquierda. Señale la afirmación CORRECTA:","o":["La asociación de una hemianopsia homónima seguiría siendo compatible con un síndrome lacunar hemimotor puro.","Por definición es un infarto de diámetro inferior a 15 mm en el territorio de arterias perforantes, que son arterias terminales sin anastomosis.","La lesión anatomopatológica que con más claridad se asocia a la HTA en este contexto es la microateromatosis en el origen de las perforantes.","Las microhemorragias asociadas a la enfermedad de pequeño vaso hipertensiva se localizan típicamente en la corteza lobar en secuencias de gradiente-eco."],"a":1,"e":"Infarto lacunar: subcortical, en territorio de perforantes (terminales, sin anastomosis) y <15 mm. La hemianopsia es un signo cortical y excluye un síndrome lacunar (A). Las lesiones ligadas a la HTA son la lipohialinosis y los microaneurismas de Charcot-Bouchard; la microateromatosis se asocia menos claramente a HTA y aparece también en diabéticos y dislipémicos (C). Las microhemorragias hipertensivas son profundas (ganglios basales, protuberancia, cerebelo); las corticales orientan a angiopatía amiloidea (D).","p":null},{"id":"Ictus_T01-T03-7","b":"Ictus_T01-T03","t":"T01","n":7,"q":"Mujer de 69 años que presenta de forma brusca debilidad intensa de la pierna izquierda, leve del brazo izquierdo y con la cara respetada. Asocia incontinencia urinaria y una llamativa apatía, con escasa iniciativa verbal. ¿Qué arteria está más probablemente afectada?","o":["Arteria cerebral anterior derecha.","Rama anterior de la arteria cerebral media derecha.","Perforantes lenticuloestriadas derechas (síndrome lacunar hemimotor puro).","Arteria cerebral posterior derecha."],"a":0,"e":"El síndrome de ACA combina hemiparesia de predominio crural, alteraciones esfinterianas y alteraciones neuropsicológicas (abulia, hasta mutismo acinético). La ACM da hemiparesia de predominio faciobraquial. El lacunar hemimotor puro es proporcionado y no asocia incontinencia ni apatía. La ACP produce clínica visual (hemianopsia) y amnésica.","p":null},{"id":"Ictus_T01-T03-8","b":"Ictus_T01-T03","t":"T01","n":8,"q":"Varón de 72 años con fibrilación auricular no anticoagulada, traído a Urgencias por agitación psicomotriz de inicio brusco. Presenta un lenguaje fluente pero incomprensible, no comprende órdenes sencillas y no reacciona a la amenaza en el hemicampo derecho. El balance muscular es normal en las cuatro extremidades. ¿Cuál es la localización más probable?","o":["Arteria cerebral posterior izquierda.","Rama anterior de la arteria cerebral media izquierda.","Tronco (segmento M1) de la arteria cerebral media izquierda.","Rama posterior de la arteria cerebral media izquierda."],"a":3,"e":"El síndrome de rama posterior de la ACM izquierda cursa típicamente con afasia sensitiva (de Wernicke), déficit campimétrico y, a menudo, agitación psicomotriz, sin déficit motor. La rama anterior produce afasia motora con paresia faciobraquial y preferencia ocular. La oclusión de M1 daría un síndrome completo con hemiplejía. La ACP produce hemianopsia y síntomas amnésicos, pero no afasia de Wernicke.","p":null},{"id":"Ictus_T01-T03-9","b":"Ictus_T01-T03","t":"T01","n":9,"q":"Mujer de 44 años, normotensa, con migraña con aura desde los 30 años y un episodio depresivo mayor. En el último año ha sufrido dos ictus lacunares. La RM muestra una leucoencefalopatía extensa con afectación de los polos temporales anteriores. Su padre falleció con demencia tras ictus de repetición desde los 50 años. ¿Cuál es el diagnóstico más probable?","o":["Angiopatía amiloidea cerebral hereditaria, por depósito de amiloide en arterias corticales.","Enfermedad de pequeño vaso hipertensiva de inicio precoz, por lipohialinosis de las perforantes.","CADASIL, por mutación del gen NOTCH3 en el cromosoma 19, con herencia autosómica dominante.","CADASIL, por mutación del gen NOTCH3 en el cromosoma 19, con herencia autosómica recesiva."],"a":2,"e":"CADASIL: herencia autosómica dominante (padre afecto), mutación de NOTCH3 (19p). Debuta en la 4.ª década con migraña y síntomas psiquiátricos, y evoluciona a ictus lacunares de repetición y demencia; la leucoencefalopatía afecta típicamente a los polos temporales. La paciente es normotensa (descarta B). La angiopatía amiloidea produce hemorragias lobares, sobre todo en ancianos.","p":null},{"id":"Ictus_T01-T03-10","b":"Ictus_T01-T03","t":"T01","n":10,"q":"Varón de 36 años que, tras una manipulación cervical, presenta dolor cervical izquierdo intenso. Doce horas después aparecen afasia y paresia faciobraquial derecha. En la exploración se observan ptosis y miosis izquierdas. ¿Qué hallazgo esperaría encontrar?","o":["Imagen hiperintensa en semiluna en la pared de la carótida interna izquierda en RM con supresión grasa.","Signo del delta vacío en el seno longitudinal superior en la TC craneal con contraste intravenoso.","Microhemorragias corticales y siderosis superficial en la secuencia de gradiente-eco.","Estenosis focal >70 % en la bifurcación carotídea izquierda por una placa calcificada en el eco-Doppler."],"a":0,"e":"Disección de la carótida interna extracraneal: causa frecuente de ictus en jóvenes, con dolor que precede o acompaña al ictus y Horner ipsilateral. El hematoma mural se ve como imagen hiperintensa en media luna ('croissant') en RM con supresión grasa; en arteriografía, afilamiento en 'pico de loro'. B es propio de la trombosis venosa cerebral, C de la angiopatía amiloidea y D de la aterosclerosis.","p":null},{"id":"Ictus_T01-T03-11","b":"Ictus_T01-T03","t":"T02","n":11,"q":"Respecto a la fisiopatología de la isquemia cerebral aguda, señale la afirmación CORRECTA:","o":["El core del infarto corresponde a las regiones con un FSC inferior a 22 ml/100 g·min, donde el daño es irreversible en pocos minutos.","La oligohemia benigna evoluciona habitualmente a infarto si no se produce reperfusión en las primeras 6 horas.","Si el paciente permanece clínicamente estable durante las primeras horas, puede asumirse que no se está produciendo reclutamiento de la penumbra.","La penumbra (FSC 10-22 ml/100 g·min) no funciona y da clínica, pero conserva su viabilidad estructural y es rescatable si se reperfunde a tiempo."],"a":3,"e":"Core: FSC <10 ml/100 g·min, daño irreversible en minutos. Penumbra: 10-22, tejido disfuncionante pero viable, rescatable con reperfusión e irremisiblemente infartado sin ella. Oligohemia: >22, normalmente no se infarta salvo condiciones que amplifiquen la cascada isquémica (hipertermia, acidosis). La conversión de penumbra en core puede ocurrir sin cambios clínicos significativos (C).","p":null},{"id":"Ictus_T01-T03-12","b":"Ictus_T01-T03","t":"T02","n":12,"q":"Varón de 68 años con hemiparesia derecha y afasia de 2 horas de evolución (NIHSS 10). Glucemia capilar de 132 mg/dl. La TC no muestra hemorragia (ASPECTS 9) y el angio-TC no evidencia oclusión de gran vaso. La presión arterial es de 205/112 mmHg. ¿Cuál es la actitud más adecuada?","o":["Una presión arterial >185/105 contraindica de forma absoluta la trombólisis, por lo que se inicia antiagregación con AAS.","Descender la presión arterial por debajo de 185/105 mmHg con antihipertensivos IV y, una vez conseguido, iniciar la trombólisis.","Iniciar la trombólisis intravenosa sin demora y controlar la presión arterial durante la infusión.","No tratar la presión arterial, ya que el tejido isquémico pierde la autorregulación, y proceder directamente a tratamiento endovascular."],"a":1,"e":"No se puede administrar trombolítico con TA >185/105, pero no es una contraindicación absoluta: si se consigue descender por debajo de esas cifras, puede trombolisarse. Iniciar la infusión por encima de ese umbral no es correcto (C). La pérdida de autorregulación es el motivo para no bajar la TA agresivamente fuera de este contexto, y sin oclusión de gran vaso no hay indicación de TEV (D).","p":null},{"id":"Ictus_T01-T03-13","b":"Ictus_T01-T03","t":"T02","n":13,"q":"Mujer de 78 años con FA no valvular anticoagulada con apixabán (última dosis hace 5 horas). Hace 90 minutos presenta hemiplejía izquierda, desviación oculocefálica derecha y anosognosia (NIHSS 19). Rankin previo 1. La TC no muestra hemorragia (ASPECTS 8) y el angio-TC muestra oclusión de M1 derecha. ¿Cuál es la actitud más adecuada?","o":["Las terapias de reperfusión están contraindicadas por la anticoagulación; ingreso en la unidad de ictus.","Tenecteplasa intravenosa seguida de trombectomía (reperfusión combinada), ya que la TNK es el fibrinolítico preferente en esta estrategia.","Tratamiento endovascular primario, sin trombólisis intravenosa previa.","Administrar idarucizumab para revertir la anticoagulación y a continuación alteplasa intravenosa."],"a":2,"e":"En pacientes anticoagulados, siempre que sea posible se indica TEV primario. Con un anti-Xa tomado recientemente, la trombólisis IV está contraindicada, por lo que la estrategia combinada (B) no es aplicable. El idarucizumab solo revierte el dabigatrán (D). Idea clave del tema: la toma de anticoagulantes no debe considerarse una contraindicación para la reperfusión en general (A).","p":null},{"id":"Ictus_T01-T03-14","b":"Ictus_T01-T03","t":"T02","n":14,"q":"Varón de 70 años, Rankin previo 0, al que su familia vio bien por última vez hace 16 horas y encuentra con hemiplejía derecha y afasia global (NIHSS 20). El angio-TC muestra oclusión de M1 izquierda y la TC de perfusión, un core de 20 ml con una penumbra de 110 ml. ¿Cuál es la actitud más adecuada?","o":["Tratamiento endovascular, al estar dentro de la ventana de 24 horas con un patrón favorable en neuroimagen avanzada.","No es candidato a reperfusión, ya que han transcurrido más de 6 horas desde la última vez que se le vio bien.","Alteplasa intravenosa aislada, ya que la neuroimagen avanzada permite tratar con tPA hasta las 24 horas.","Solo tratamiento antitrombótico, ya que en el ictus del despertar la ventana de 4,5 horas se cuenta desde el despertar y ya se ha superado."],"a":0,"e":"Tras DAWN y DEFUSE-3, la ventana del TEV se extiende a las primeras 24 h en casos seleccionados con neuroimagen avanzada (target mismatch: core <70 ml y ratio penumbra/core >1,8; aquí 20 ml y 5,5). El tiempo se cuenta siempre desde la última vez que se vio bien al paciente (D). Más allá de 4,5 h, el tPA con neuroimagen avanzada llega hasta unas 9 h; solo la TNK ha mostrado seguridad hasta 24 h en oclusiones de gran vaso seleccionadas (C).","p":null},{"id":"Ictus_T01-T03-15","b":"Ictus_T01-T03","t":"T02","n":15,"q":"Sobre la valoración del parénquima cerebral con TC simple en el ictus isquémico agudo, señale la afirmación CORRECTA:","o":["Los signos precoces de isquemia son muy sensibles pero poco específicos, por lo que su ausencia descarta la existencia de core.","En la escala ASPECTS, una puntuación de 0 corresponde a un estudio normal y se suma un punto por cada región afectada.","Un ASPECTS <7 contraindica tanto la trombólisis intravenosa como el tratamiento endovascular.","Para indicar trombólisis IV en las primeras 4,5 h basta con una TC simple, y un ASPECTS <7 la contraindica."],"a":3,"e":"En ventana de 4,5 h la TC simple es suficiente para indicar TIV, y unos signos precoces extensos (ASPECTS <7) la excluyen. Los signos precoces son muy específicos pero poco sensibles (A). ASPECTS parte de 10 (normal) y resta un punto por cada región afectada (B). El TEV admite cores más extensos: ASPECTS 3-10, e incluso 0-2 en <80 años en ventana <6,5 h según el ensayo LASTE (C).","p":null},{"id":"Ictus_T01-T03-16","b":"Ictus_T01-T03","t":"T02","n":16,"q":"En relación con la cerebroprotección en la fase aguda del ictus isquémico, señale la afirmación CORRECTA:","o":["Una glucemia de 250 mg/dl contraindica de forma absoluta la trombólisis intravenosa.","Lo más eficaz es la cerebroprotección no farmacológica de las unidades de ictus; los fármacos neuroprotectores no han demostrado eficacia.","En la fase prehospitalaria se recomienda tratar cifras de presión arterial superiores a 160/95 mmHg para reducir el riesgo de transformación hemorrágica.","Es habitual que el ictus se presente con hipotensión arterial, por lo que esta no obliga a buscar otras causas subyacentes."],"a":1,"e":"Hasta ahora ningún neuroprotector farmacológico ha demostrado eficacia; lo eficaz es el control de la homeostasis (temperatura <37,5 ºC, glucemia, TA, SatO2, equilibrio hidroelectrolítico) en unidades de ictus. Glucemia: >155 mg/dl empeora el pronóstico; no debe iniciarse reperfusión con >200 (hay que corregirla) y la contraindicación absoluta es >400 (A). No se trata la TA prehospitalaria por debajo de 185/105 por la pérdida de autorregulación (C). El ictus suele asociar HTA; un paciente hipotenso obliga a descartar sepsis, IAM, disección aórtica, etc. (D).","p":null},{"id":"Ictus_T01-T03-17","b":"Ictus_T01-T03","t":"T02","n":17,"q":"Mujer de 88 años que vive sola y es independiente para su autocuidado, aunque necesita ayuda para tareas domésticas pesadas (Rankin 2). Presenta de forma brusca hemiparesia izquierda, desviación de la mirada hacia la derecha, no reconoce su brazo izquierdo como propio y niega estar enferma. Señale la afirmación CORRECTA:","o":["Los signos corticales sugieren oclusión de gran arteria; debe activarse el Código Ictus, ya que no hay límite de edad y un Rankin ≤2 indica independencia.","No debe activarse el Código Ictus, ya que por encima de los 85 años el riesgo hemorrágico de la reperfusión supera su beneficio.","La desviación de la mirada hacia la derecha indica que la lesión responsable se localiza en el hemisferio cerebral izquierdo.","La escala de Glasgow es la más adecuada para cuantificar la gravedad clínica, al verse menos influida por los déficits focales que la NIHSS."],"a":0,"e":"Desviación oculocefálica hacia el lado de la lesión y heminegligencia (hemiasomatoagnosia y anosognosia) son signos corticales que obligan a sospechar oclusión de gran arteria (aquí, ACM derecha). No hay límite de edad para el Código Ictus: importa la situación funcional previa; Rankin ≤2 equivale a independencia (el protocolo regional admite hasta 3 de forma individualizada). La mirada se desvía hacia la lesión, luego es derecha (C). El Glasgow puede estar falsamente disminuido por déficits focales (p. ej., afasia); la gravedad se mide con la NIHSS (D).","p":null},{"id":"Ictus_T01-T03-18","b":"Ictus_T01-T03","t":"T02","n":18,"q":"Varón de 63 años con dos episodios de paresia braquial derecha de 15 minutos en las últimas 24 horas, ya asintomático. La TC es normal, el ECG muestra ritmo sinusal y no hay estenosis arteriales significativas. Se considera un AIT de alto riesgo no cardioembólico. ¿Qué tratamiento antitrombótico está indicado?","o":["AAS 300 mg de carga seguido de AAS 100 mg al día en monoterapia de forma indefinida.","Anticoagulación con un anticoagulante de acción directa, dado el alto riesgo de recurrencia precoz.","Carga de clopidogrel 300 mg + AAS 300-500 mg; después clopidogrel 75 mg + AAS 100 mg durante 21 días y luego monoterapia.","Doble antiagregación con AAS 100 mg y clopidogrel 75 mg durante 12 meses, seguida de monoterapia con AAS."],"a":2,"e":"En el AIT de alto riesgo y el ictus minor (NIHSS <4) no cardioembólicos, la doble antiagregación con dosis de carga durante 21 días ha demostrado superioridad; después se pasa a monoterapia. La anticoagulación se reserva para cardiopatías embolígenas mayores y otras indicaciones específicas. Una alternativa con evidencia es AAS + ticagrelor (ensayo THALES).","p":null},{"id":"Ictus_T01-T03-19","b":"Ictus_T01-T03","t":"T02","n":19,"q":"Mujer de 79 años ingresada en la unidad de ictus por un infarto extenso que ocupa dos tercios del territorio de la ACM izquierda, en la que se diagnostica una fibrilación auricular no conocida. No recibió tratamiento de reperfusión. ¿Cuándo debe iniciarse la anticoagulación?","o":["De forma inmediata, dado el elevado riesgo embolígeno de la fibrilación auricular en las primeras semanas.","A las 24 horas del inicio de los síntomas, que es el tiempo de espera recomendado por ficha técnica.","Entre 4 y 7 días, sin necesidad de repetir la neuroimagen si la evolución clínica es favorable.","Entre 7 y 10 días, tras repetir la neuroimagen para descartar transformación hemorrágica, y antiagregada mientras tanto."],"a":3,"e":"El inicio de la anticoagulación depende del riesgo embolígeno y del riesgo de transformación hemorrágica: AIT o ictus minor, desde la atención urgente; infarto intermedio, 4-7 días; infarto extenso, 7-10 días. Siempre hay que repetir la neuroimagen antes de anticoagular, y mientras tanto el paciente debe estar antiagregado. Las 24 h de ficha técnica se refieren al tiempo de espera tras la trombólisis IV antes de iniciar antitrombóticos (B).","p":null},{"id":"Ictus_T01-T03-20","b":"Ictus_T01-T03","t":"T02","n":20,"q":"Varón de 77 años con un AIT hemisférico izquierdo hace 4 días. El eco-Doppler muestra una estenosis aterosclerótica del 80 % en la carótida interna izquierda cervical. ¿Cuál es la actitud más adecuada?","o":["Tratamiento médico y revascularización únicamente si hay recurrencia a pesar de la doble antiagregación.","Tromboendarterectomía carotídea, preferiblemente en los primeros 15 días, asociada a estatina de alta potencia.","Stent carotídeo de forma preferente, ya que en mayores de 70 años es la técnica con menor riesgo de ictus periprocedimiento.","Diferir la revascularización al menos 3 meses para reducir el riesgo de complicaciones periprocedimiento."],"a":1,"e":"La estenosis carotídea cervical sintomática >70 % es indicación de revascularización, preferiblemente en los primeros 15 días. TEA y stent son equivalentes en menores de 70 años; en pacientes añosos el stent se asocia a mayor riesgo de ictus periprocedimiento (C). Revascularizar solo si falla el tratamiento médico es la regla para estenosis intracraneales y disecciones (A). En el ictus aterotrombótico: estatina de alta potencia (atorvastatina 80 mg o rosuvastatina 20 mg) con objetivo de LDL <55 mg/dl.","p":null},{"id":"Ictus_T01-T03-21","b":"Ictus_T01-T03","t":"T03","n":21,"q":"Mujer de 83 años, normotensa, con deterioro cognitivo progresivo de dos años de evolución. Presenta cefalea brusca y hemianopsia homónima izquierda. La TC muestra un hematoma lobar occipital derecho. En la RM, la secuencia de gradiente-eco muestra múltiples microhemorragias de localización cortical y depósitos de hemosiderina en la superficie pial. ¿Cuál es la causa más probable?","o":["Microangiopatía hipertensiva.","Metástasis hemorrágica.","Angiopatía amiloidea cerebral.","Malformación arteriovenosa."],"a":2,"e":"La angiopatía amiloidea, junto con la hipertensiva, es la causa más frecuente de hemorragia intracraneal en mayores de 80 años. Produce hemorragias lobares corticales, a menudo recurrentes, precedidas de deterioro cognitivo; en gradiente-eco muestra microhemorragias corticales y siderosis superficial (criterios de Boston). La microangiopatía hipertensiva da hemorragias y microhemorragias profundas; la MAV es la causa más frecuente en menores de 40 años.","p":null},{"id":"Ictus_T01-T03-22","b":"Ictus_T01-T03","t":"T03","n":22,"q":"Varón de 24 años, sin antecedentes ni consumo de tóxicos, que presenta cefalea brusca, una crisis epiléptica y hemiparesia izquierda. La TC muestra un hematoma lobar frontal derecho. ¿Cuál es el siguiente paso diagnóstico?","o":["Angio-TC urgente para descartar una malformación arteriovenosa.","RM con secuencia de gradiente-eco diferida para estudiar la distribución de microhemorragias crónicas.","Punción lumbar para descartar una hemorragia subaracnoidea asociada.","No precisa más estudios urgentes; debe atribuirse a microangiopatía hipertensiva y controlar la presión arterial."],"a":0,"e":"En menores de 40 años, la causa más frecuente de hemorragia intracraneal son las malformaciones vasculares, por lo que se indica un angio-TC en el mismo tiempo urgente; su resultado puede ser determinante para una eventual cirugía. La RM diferida con gradiente-eco sirve para orientar entre angiopatía hipertensiva y amiloide y para descartar tumor (B). La localización lobar en un joven no orienta a HTA (D).","p":null},{"id":"Ictus_T01-T03-23","b":"Ictus_T01-T03","t":"T03","n":23,"q":"Varón de 76 años con fibrilación auricular en tratamiento con acenocumarol, que ingresa por un hematoma talámico izquierdo de 18 ml. INR de 3,2. ¿Cuál es el tratamiento de elección para revertir la anticoagulación?","o":["Idarucizumab.","Plasma fresco congelado, por su mayor disponibilidad.","Vitamina K intravenosa en monoterapia.","Complejo protrombínico asociado a vitamina K."],"a":3,"e":"En la hemorragia intracerebral hay que revertir la anticoagulación de forma urgente para evitar el crecimiento precoz del hematoma. Con antivitamina K se usa complejo protrombínico (primera elección, efecto rápido) asociado a vitamina K (efecto sostenido; sola es demasiado lenta). El plasma fresco conlleva riesgo de hipervolemia. El idarucizumab es el antídoto específico del dabigatrán.","p":null},{"id":"Ictus_T01-T03-24","b":"Ictus_T01-T03","t":"T03","n":24,"q":"Mujer de 70 años, hipertensa, con un hematoma putaminal derecho diagnosticado a los 60 minutos del inicio de los síntomas. Glasgow 14. Presión arterial de 196/104 mmHg. ¿Cuál es el manejo tensional adecuado?","o":["No tratar salvo cifras superiores a 220/120 mmHg, para no comprometer la perfusión del tejido perihematoma.","Descenso precoz con antihipertensivos IV hasta una sistólica de 120-140 mmHg, evitando cifras inferiores a 120.","Mantener la presión arterial por debajo de 185/105 mmHg, el mismo umbral que se aplica a la trombólisis.","Reducción lo más intensa posible, incluso con sistólica inferior a 110 mmHg, para detener el crecimiento del hematoma."],"a":1,"e":"El objetivo del tratamiento médico de la HIC es evitar el crecimiento precoz: TA <140/90 de forma urgente con antihipertensivos IV. Existe un efecto en U: un descenso demasiado intenso (TAS <120) puede aumentar la isquemia perihematoma (D). El umbral de 185/105 corresponde a la trombólisis en el ictus isquémico (C).","p":null},{"id":"Ictus_T01-T03-25","b":"Ictus_T01-T03","t":"T03","n":25,"q":"Respecto a la evolución de la hemorragia intraparenquimatosa, señale la afirmación CORRECTA:","o":["El signo de la mancha ('spot sign') en la TC con contraste predice crecimiento del hematoma, predictor independiente de mal pronóstico.","El crecimiento del componente hemorrágico se produce principalmente entre el tercer y el quinto día de evolución.","El edema vasogénico perilesional alcanza su máxima expresión en las primeras 6 horas tras el sangrado.","La administración de factor VII recombinante ha demostrado reducir el crecimiento del hematoma y mejorar el pronóstico, por lo que se recomienda de rutina."],"a":0,"e":"El spot sign indica sangrado activo y predice crecimiento; también lo sugieren los niveles de distinta densidad en la TC simple. El crecimiento precoz ocurre en las primeras 24-48 h (B), mientras que el edema perilesional progresa de forma más lenta: vasogénico, por degradación de hemoglobina, trombina y productos de coagulación, con máximo entre los días 3 y 5 (C). La estrategia hemostática con factor VII no ha mostrado resultados positivos (D).","p":null},{"id":"Ictus_T01-T03-26","b":"Ictus_T01-T03","t":"T03","n":26,"q":"¿Cuál de los siguientes parámetros NO forma parte de la escala pronóstica ICH de la hemorragia intracerebral?","o":["Edad igual o superior a 80 años.","Volumen del hematoma superior a 30 ml.","Presión arterial sistólica al ingreso.","Invasión intraventricular."],"a":2,"e":"La escala ICH incluye 5 elementos: volumen >30 ml (estimado con la fórmula ABC/2), edad ≥80 años, nivel de conciencia (GCS), invasión ventricular y localización infratentorial/troncoencefálica. A más puntos, mayor mortalidad. La presión arterial es una diana terapéutica, pero no forma parte de la escala.","p":null},{"id":"Ictus_T01-T03-27","b":"Ictus_T01-T03","t":"T03","n":27,"q":"Varón de 65 años, no anticoagulado, con una hemorragia lobar parietal izquierda. Está consciente (Glasgow 15), sin necesidad de intubación ni de cirugía, y no ha presentado crisis epilépticas. Señale la actitud CORRECTA:","o":["Iniciar levetiracetam profiláctico, dado el elevado riesgo de crisis epilépticas de las hemorragias de localización lobar.","Ingreso en la UVI, ya que todas las hemorragias intraparenquimatosas precisan monitorización intensiva inicial.","Administrar plasma fresco congelado como primera opción para asegurar la hemostasia y limitar el crecimiento.","Ingreso en unidad de ictus con control de TA, glucemia, temperatura y SatO2 >94 %; anticomiciales solo si presenta una crisis."],"a":3,"e":"Con buen nivel de conciencia, la unidad de ictus es el lugar idóneo; la UVI se reserva para pacientes que precisan intubación o cirugía (B). Los anticomiciales no se administran de forma profiláctica, sino tras una crisis sintomática (A). En un paciente no anticoagulado no está indicado revertir con hemoderivados, y el plasma conlleva riesgo de hipervolemia (C).","p":null},{"id":"Ictus_T01-T03-28","b":"Ictus_T01-T03","t":"T03","n":28,"q":"En relación con la clínica de la trombosis venosa cerebral, señale la afirmación CORRECTA:","o":["La diplopía se debe típicamente a una afectación del III par por herniación uncal secundaria al edema.","La del sistema venoso profundo puede reducir el nivel de conciencia; la del superficial, dar déficits corticales y crisis focales.","Su presentación es casi siempre hiperaguda, en minutos, por lo que el retraso diagnóstico es excepcional.","En la actualidad, su causa más frecuente son las infecciones otorrinolaringológicas (tromboflebitis séptica)."],"a":1,"e":"Sistema profundo: afectación del sistema reticular activador ascendente, con disminución del nivel de conciencia y coma. Sistema superficial: déficits corticales (afasia, hemianopsia, déficit motor) y crisis focales por irritación cortical. La diplopía se debe a paresia del VI par por hipertensión intracraneal (A). La presentación puede ser aguda, subaguda o fluctuante, con un retraso diagnóstico mediano de 7 días (C). Las infecciones ORL eran la causa más frecuente en la era preantibiótica; hoy predominan los factores hormonales y los estados protrombóticos (D).","p":null},{"id":"Ictus_T01-T03-29","b":"Ictus_T01-T03","t":"T03","n":29,"q":"Mujer de 27 años que toma anticonceptivos orales, con cefalea progresiva de 6 días de evolución, vómitos, diplopía horizontal y edema de papila. Hoy ha presentado una crisis motora focal izquierda. La TC simple muestra una hipodensidad parietal derecha parasagital con componente hemorrágico y una hiperdensidad espontánea en el trayecto del seno longitudinal superior. ¿Qué prueba confirmaría el diagnóstico?","o":["Angio-RM venosa, combinada con secuencias de parénquima.","Punción lumbar con medición de la presión de apertura.","Arteriografía cerebral como primera prueba diagnóstica.","Electroencefalograma urgente."],"a":0,"e":"La sospecha es una trombosis venosa cerebral (mujer joven, anticonceptivos, hipertensión intracraneal, crisis focal y lesión parasagital con componente hemorrágico). Se confirma con imagen venosa: angio-RM venosa (la más utilizada) o venografía por TC; en la TC con contraste puede verse el signo del delta vacío. La arteriografía se reserva y no es la primera prueba (C). La punción lumbar no confirma el diagnóstico y es inapropiada ante una lesión con efecto de masa (además, es un posible precipitante).","p":null},{"id":"Ictus_T01-T03-30","b":"Ictus_T01-T03","t":"T03","n":30,"q":"En la paciente de la pregunta anterior se confirma una trombosis del seno longitudinal superior. ¿Cuál es el tratamiento indicado?","o":["Antiagregación con AAS, ya que el componente hemorrágico contraindica la anticoagulación.","Anticoagulación precoz con heparina pese al componente hemorrágico, pasando después a anticoagulación oral.","Trombólisis intravenosa con alteplasa como tratamiento de primera línea, dada la oclusión aguda del seno.","Tratamiento endovascular de primera elección en todos los casos para restablecer el drenaje venoso."],"a":1,"e":"El tratamiento de la TVC se basa en la anticoagulación precoz, inicialmente con heparina y después oral, incluso si existe componente hemorrágico en la lesión. La duración se individualiza: en general 6-12 meses si no hay una causa que obligue a anticoagulación permanente. El tratamiento endovascular se reserva para casos graves o fulminantes (D). Debe buscarse la causa: suspender anticonceptivos y realizar estudio de trombofilia ampliado.","p":"Ictus_T01-T03-29"},{"id":"Infecciones_SN_T10-T11-1","b":"Infecciones_SN_T10-T11","t":"T10","n":1,"q":"Varón de 24 años, sin antecedentes, con fiebre de 39 °C, cefalea intensa y vómitos de 12 horas. Está consciente y orientado (Glasgow 15), con rigidez de nuca y signos de Kernig y Brudzinski positivos. No hay focalidad neurológica ni lesiones cutáneas, y no está inmunodeprimido. ¿Cuál es la secuencia de actuación más adecuada?","o":["Hemocultivos, dexametasona y antibioterapia empírica, y punción lumbar sin TC previa.","TC cerebral urgente y, si es normal, punción lumbar antes de iniciar ningún tratamiento.","Punción lumbar y esperar al resultado del Gram para elegir el antibiótico adecuado.","Antibioterapia empírica y punción lumbar a las 24 horas, cuando esté estabilizado."],"a":0,"e":"Ante una sospecha clínica clara de meningitis bacteriana hay que iniciar cuanto antes el tratamiento antibiótico empírico y antiinflamatorio (dexametasona), tras extraer hemocultivos, y hacer en paralelo el diagnóstico urgente («tiempo es cerebro»; tiempo puerta-antibiótico menor de 60 minutos). La TC antes de la punción lumbar está indicada si hay déficit focal (excluidas las paresias de pares craneales), crisis de nueva aparición, alteración del nivel de conciencia o inmunosupresión grave. Este paciente no tiene ninguno de esos supuestos, por lo que puede hacerse la punción sin TC.","p":null},{"id":"Infecciones_SN_T10-T11-2","b":"Infecciones_SN_T10-T11","t":"T10","n":2,"q":"Mujer de 45 años traída a urgencias por fiebre, cefalea y rigidez de nuca, que en la sala de espera presenta una crisis tónico-clónica generalizada. Tras la crisis está somnolienta (Glasgow 12). ¿Cuál es la actitud correcta?","o":["Punción lumbar inmediata, ya que la crisis no modifica la indicación de la prueba.","TC cerebral y punción lumbar, sin iniciar antibióticos hasta conocer el LCR.","Hemocultivos y tratamiento empírico ya; después TC y, si no la contraindica, PL.","Iniciar únicamente aciclovir IV, porque la crisis indica una encefalitis herpética."],"a":2,"e":"La crisis epiléptica de nueva aparición y la alteración del nivel de conciencia son indicaciones de TC cerebral antes de la punción lumbar, porque pincharle a un paciente con hipertensión intracraneal grave puede favorecer la herniación. Si la punción lumbar se va a retrasar por la TC, se inicia el tratamiento antibiótico de forma inmediata tras los hemocultivos. El aciclovir se añade si hay clínica focal (meningoencefalitis) o un LCR no típicamente bacteriano, pero junto a la cobertura antibacteriana, no en su lugar.","p":null},{"id":"Infecciones_SN_T10-T11-3","b":"Infecciones_SN_T10-T11","t":"T10","n":3,"q":"Mujer de 62 años, inmunocompetente, con una meningitis aguda adquirida en la comunidad. El LCR muestra 2.500 leucocitos/mm³ (90 % PMN), proteínas de 280 mg/dl y glucosa de 15 mg/dl; el Gram no muestra gérmenes. ¿Cuál es la pauta antibiótica empírica más adecuada?","o":["Ceftriaxona en monoterapia, por ser el meningococo el germen más probable a esta edad.","Ceftriaxona más vancomicina más ampicilina, junto con dexametasona.","Penicilina G sódica más aciclovir intravenoso, junto con dexametasona.","Meropenem más ceftazidima, por el riesgo de Pseudomonas aeruginosa."],"a":1,"e":"En el adulto predomina el neumococo, seguido del meningococo, y Listeria es relevante a partir de los 50 años. Cefalosporina de 3.ª-4.ª generación (meningococo) + vancomicina (neumococo, por las frecuentes resistencias a penicilina) + ampicilina (Listeria, resistente a las cefalosporinas), con dexametasona. Los apuntes recogen como combinación más habitual hasta conocer el germen la cefalosporina + vancomicina + ampicilina + aciclovir; el aciclovir es especialmente necesario si hay clínica focal o el LCR no es típicamente bacteriano, como aquí no ocurre. El meropenem se reserva para la meningitis nosocomial, la posneuroquirúrgica o la de inmunodeprimidos neutropénicos.","p":null},{"id":"Infecciones_SN_T10-T11-4","b":"Infecciones_SN_T10-T11","t":"T10","n":4,"q":"Varón de 71 años con meningitis aguda que recibe ceftriaxona, vancomicina, ampicilina y dexametasona desde hace 36 horas. El cultivo del LCR es positivo para Listeria monocytogenes. ¿Qué modificación es correcta?","o":["Retirar la ampicilina y mantener la ceftriaxona, a la que Listeria es sensible.","Mantener la dexametasona 4 días, por su beneficio en todas las meningitis bacterianas.","Añadir rifampicina por la frecuente resistencia de Listeria a la ampicilina.","Suspender la dexametasona y dirigir el tratamiento con ampicilina."],"a":3,"e":"La dexametasona se suspende si se identifica un germen distinto de S. pneumoniae o H. influenzae. Es especialmente importante con Listeria, porque en alguna cohorte se ha descrito una asociación entre dexametasona y aumento de la mortalidad. Listeria es resistente a las cefalosporinas, por lo que la cubre la ampicilina.","p":null},{"id":"Infecciones_SN_T10-T11-5","b":"Infecciones_SN_T10-T11","t":"T10","n":5,"q":"¿Cuál es el fundamento de administrar la dexametasona antes o junto con la primera dosis de antibiótico en la meningitis bacteriana aguda?","o":["Aumenta la penetración de los antibióticos a través de la barrera hematoencefálica.","Atenúa la respuesta inflamatoria desencadenada por la lisis bacteriana.","Tiene una acción bactericida sinérgica con las cefalosporinas de tercera generación.","Previene la insuficiencia suprarrenal aguda propia de la meningococemia."],"a":1,"e":"La lisis bacteriana por la inmunidad innata y los antibióticos libera componentes de la pared (lipopolisacárido en gramnegativos; ácido teicoico y peptidoglicanos en el neumococo) que inducen IL-1β y TNF-α. Estas citocinas alteran la barrera hematoencefálica, generan exudado (hidrocefalia, edema intersticial), vasculitis e infartos, y atraen PMN (edema citotóxico); la mayoría de las complicaciones derivan de esta respuesta. Por eso la dexametasona se da unos 10 minutos antes del antibiótico (o hasta 4 horas después si no se dio antes): 0,15 mg/kg cada 6 horas durante 4 días (De Gans, NEJM 2002). Reduce la mortalidad y las secuelas, sobre todo en la neumocócica. De hecho, disminuye la penetración de la vancomicina, al contrario de lo que afirma la opción A.","p":null},{"id":"Infecciones_SN_T10-T11-6","b":"Infecciones_SN_T10-T11","t":"T10","n":6,"q":"Mujer de 18 años con fiebre, cefalea y vómitos de 8 horas, que presenta lesiones purpúricas en el tronco y las piernas que no desaparecen al presionarlas con un vaso. Tiene PA 75/40 mmHg, FC 135 lpm, frialdad acra, oliguria y lactato elevado. Señale la afirmación CORRECTA:","o":["El exantema que no desaparece a la vitropresión orienta a un origen viral benigno.","Debe hacerse la punción lumbar antes del antibiótico para no negativizar los cultivos del LCR.","Sugiere una meningococemia con shock; la PL está contraindicada mientras esté inestable.","La dexametasona a dosis de meningitis está especialmente indicada en esta situación de shock."],"a":2,"e":"El 50 % de las meningitis meningocócicas tiene un exantema característico. Si la erupción persiste con la vitropresión (test del vaso), es una púrpura de origen vascular, típica del meningococo. El shock séptico por meningococemia cursa con hipotensión, taquicardia, oliguria, mala perfusión distal y lactacidemia, y puede asociar un síndrome de Waterhouse-Friderichsen (infarto suprarrenal con insuficiencia suprarrenal aguda). La inestabilidad hemodinámica es una contraindicación de la punción lumbar, y los apuntes indican que la dexametasona no se da en el shock séptico. Se extraen hemocultivos y se inicia el antibiótico sin demora.","p":null},{"id":"Infecciones_SN_T10-T11-7","b":"Infecciones_SN_T10-T11","t":"T10","n":7,"q":"Estudiante de 20 años diagnosticado de meningitis meningocócica. Comparte piso con tres compañeros, una de ellas embarazada de 16 semanas. ¿Qué profilaxis debe indicarse a los convivientes?","o":["Rifampicina 2 días; en la embarazada, ceftriaxona 250 mg IM en dosis única.","Rifampicina 600 mg/12 h durante 2 días a todos los convivientes, incluida la embarazada.","Vigilancia clínica y vacunación de todos los convivientes, sin profilaxis antibiótica.","Amoxicilina oral durante 7 días a todos los convivientes, incluida la embarazada."],"a":0,"e":"La profilaxis de los contactos de una meningitis meningocócica debe iniciarse cuanto antes, idealmente en las primeras 24 horas, sobre todo en los contactos estrechos. Se usa rifampicina 600 mg cada 12 horas durante 2 días (4 dosis); en las embarazadas, la alternativa es ceftriaxona 250 mg IM en dosis única. Además, hay que hacer la notificación epidemiológica y el aislamiento respiratorio, que se mantiene 24 horas desde el inicio del tratamiento.","p":null},{"id":"Infecciones_SN_T10-T11-8","b":"Infecciones_SN_T10-T11","t":"T10","n":8,"q":"Mujer de 68 años en tratamiento con prednisona y metotrexato por una artritis reumatoide, que consume a menudo quesos frescos de leche cruda. Presenta fiebre y cefalea de 4 días y, después, inestabilidad, diplopía, nistagmo y paresia facial. El LCR muestra 350 células/mm³ con predominio de neutrófilos y glucosa de 45 mg/dl. ¿Cuál es el germen más probable y qué antibiótico es imprescindible?","o":["Streptococcus pneumoniae; vancomicina.","Neisseria meningitidis; ceftriaxona.","Virus herpes simple 1; aciclovir IV.","Listeria monocytogenes; ampicilina."],"a":3,"e":"Listeria es patógena en grupos de riesgo: inmunodeprimidos, mayores de 50 años, neonatos, alcohólicos, cirróticos y embarazadas. Se adquiere a menudo con alimentos listos para consumir (quesos frescos no pasteurizados, patés, pescado ahumado). Produce una meningoencefalitis de fosa posterior (romboencefalitis) con ataxia, nistagmo y afectación de tronco. Crece lentamente: el LCR suele tener predominio de neutrófilos (también puede ser monocitario) y la glucosa baja menos que con otras bacterias. Es resistente a las cefalosporinas, por lo que es imprescindible la ampicilina.","p":null},{"id":"Infecciones_SN_T10-T11-9","b":"Infecciones_SN_T10-T11","t":"T10","n":9,"q":"¿Cuál de los siguientes perfiles de LCR es más característico de una meningitis bacteriana aguda?","o":["40 leucocitos/mm³ (90 % linfocitos), proteínas 60 mg/dl, glucosa 60 mg/dl (cociente 0,6).","3.000 leucocitos/mm³ (95 % PMN), proteínas 300 mg/dl, glucosa 20 mg/dl (cociente 0,15).","250 leucocitos/mm³ (80 % linfocitos), proteínas 180 mg/dl, glucosa 30 mg/dl y ADA elevada.","Sin leucocitos, proteínas de 150 mg/dl y glucosa normal (disociación albuminocitológica)."],"a":1,"e":"LCR típico de meningitis bacteriana aguda: muchos leucocitos con predominio de neutrófilos, proteínas por encima de 220 mg/dl, glucorraquia menor de 34 mg/dl y cociente glucosa LCR/plasma menor de 0,23 (aspecto turbio, «pisco sour»). La opción A corresponde a un perfil viral (aséptico), la C a una meningitis tuberculosa (linfocitos, hipoglucorraquia, ADA) y la D a una disociación albuminocitológica (Guillain-Barré).","p":null},{"id":"Infecciones_SN_T10-T11-10","b":"Infecciones_SN_T10-T11","t":"T10","n":10,"q":"Chico de 17 años que en julio presenta fiebre, cefalea intensa, fotofobia y rigidez de nuca tras unos días de diarrea. Está consciente y sin focalidad. El LCR muestra 180 células/mm³ (85 % linfocitos), proteínas de 70 mg/dl y glucosa normal; el Gram es negativo. Es inmunocompetente. ¿Cuál es la actitud más adecuada?","o":["Probable meningitis por enterovirus; alta con vigilancia y serología de VIH.","Ingreso en UCI y tratamiento con ceftriaxona, vancomicina y ampicilina durante 14 días.","Tratamiento antituberculoso empírico, ya que la pleocitosis es de predominio linfocitario.","Aciclovir IV durante 21 días, por ser el VHS la causa más frecuente de meningitis aséptica."],"a":0,"e":"Dos tercios de las meningitis agudas asépticas son víricas, sobre todo por enterovirus, seguidos de los herpesvirus (VVZ, VHS-1, VHS-2). Un inmunocompetente con clínica y LCR típicos puede ser dado de alta y vigilado en su domicilio. Se hospitaliza si hay inmunocompromiso, signos focales, alteración del nivel de conciencia, crisis o LCR atípico. Se recomienda solicitar serología de VIH a todo paciente con meningitis aséptica (y carga viral si se sospecha primoinfección).","p":null},{"id":"Infecciones_SN_T10-T11-11","b":"Infecciones_SN_T10-T11","t":"T10","n":11,"q":"Mujer de 39 años que recibe inmunoglobulinas IV por una púrpura trombocitopénica inmune y que, a las 24 horas de la infusión, presenta cefalea intensa, fiebre de 38 °C y rigidez de nuca. El LCR muestra pleocitosis con proteínas elevadas y glucosa normal; los cultivos y la PCR múltiple son negativos. ¿Cuál es la causa más probable?","o":["Meningitis bacteriana parcialmente tratada.","Meningitis por enterovirus de transmisión hematógena.","Meningitis aséptica de causa farmacológica.","Carcinomatosis meníngea de debut agudo."],"a":2,"e":"Un tercio de las meningitis asépticas no son víricas. Entre las causas no infecciosas destacan los fármacos (AINE, carbamazepina, lamotrigina, inmunoglobulinas IV, azatioprina), la meningitis química (anestesia epidural, quimioterapia intratecal, tumores quísticos), las neoplasias (carcinomatosis meníngea) y las enfermedades inflamatorias sistémicas (sarcoidosis, Behçet, vasculitis). La relación temporal con la infusión de inmunoglobulinas orienta a la causa farmacológica.","p":null},{"id":"Infecciones_SN_T10-T11-12","b":"Infecciones_SN_T10-T11","t":"T10","n":12,"q":"Varón de 30 años al que hace 2 días se le administró ceftriaxona IM en su centro de salud por una sinusitis. Consulta por fiebre, cefalea intensa y rigidez de nuca. El LCR muestra 1.200 leucocitos/mm³ (80 % PMN), proteínas de 190 mg/dl y glucosa de 38 mg/dl. El Gram y el cultivo son negativos. Señale la interpretación CORRECTA:","o":["Es una meningitis aguda aséptica de origen viral, por lo que puede darse de alta.","El Gram negativo descarta una etiología bacteriana, dada su elevada sensibilidad.","Debe orientarse como una meningitis química y tratarse solo con corticoides.","Debe considerarse una meningitis bacteriana decapitada y tratarse como tal."],"a":3,"e":"Meningitis parcialmente tratada o decapitada: pleocitosis en el LCR sin confirmación bacteriológica en un paciente que ha recibido antibióticos a dosis que atraviesan la barrera hematoencefálica. El Gram tiene una sensibilidad del 60-90 %, y los apuntes insisten en que, si no muestra gérmenes, hay que evitar el diagnóstico a priori de meningitis viral. Una sinusitis orienta además a neumococo o H. influenzae.","p":null},{"id":"Infecciones_SN_T10-T11-13","b":"Infecciones_SN_T10-T11","t":"T10","n":13,"q":"Varón de 55 años con meningitis neumocócica tratada con ceftriaxona, vancomicina y dexametasona. A las 48 horas sigue febril, sin mejoría del nivel de conciencia, y la TC no muestra hidrocefalia ni otras complicaciones. El antibiograma aún no está disponible. ¿Qué medida está indicada?","o":["Suspender la dexametasona, porque favorece la persistencia de la infección bacteriana.","Repetir la punción lumbar para valorar una posible resistencia antibiótica.","Iniciar hipotermia terapéutica para reducir la hipertensión intracraneal.","Restringir líquidos de forma sistemática para prevenir el edema cerebral."],"a":1,"e":"Si el curso no es favorable, hay que buscar causas de deterioro: neurológicas (edema, hidrocefalia, empiema subdural, crisis, tromboflebitis séptica, vasculitis), infecciosas (resistencia antibiótica del neumococo, shock séptico) y metabólicas (hiponatremia). En la meningitis neumocócica sin mejoría debe repetirse la punción lumbar a las 24-48 horas si se sospecha resistencia. La dexametasona reduce la penetración de la vancomicina, por lo que hay que comprobar pronto la sensibilidad a la cefalosporina; si hay resistencia, algunos autores añaden rifampicina. La hipotermia resultó perjudicial y no se restringen líquidos de forma sistemática.","p":null},{"id":"Infecciones_SN_T10-T11-14","b":"Infecciones_SN_T10-T11","t":"T10","n":14,"q":"Mujer de 34 años con miastenia gravis generalizada en tratamiento con eculizumab,
