que consulta por fiebre alta, cefalea y rigidez de nuca de pocas horas de evolución. ¿Qué germen debe preocupar especialmente y por qué?","o":["Neisseria meningitidis, por la inhibición del complemento terminal.","Listeria monocytogenes, por el déficit de inmunidad celular asociado.","Cryptococcus neoformans, por la linfopenia CD4 inducida por el fármaco.","Virus JC, por la reactivación favorecida por los anticuerpos monoclonales."],"a":0,"e":"El complemento y la inmunidad humoral son fundamentales frente a las bacterias encapsuladas (meningococo y neumococo). Entre los factores predisponentes de la meningitis comunitaria están la hipocomplementemia, la esplenectomía, la hipogammaglobulinemia y los inhibidores del complemento terminal (eculizumab, ravulizumab), usados en enfermedades como la miastenia gravis. Estos fármacos aumentan sobre todo el riesgo de enfermedad meningocócica. Los inhibidores del complemento también aparecen entre las causas de meningitis recurrente.","p":null},{"id":"Infecciones_SN_T10-T11-15","b":"Infecciones_SN_T10-T11","t":"T10","n":15,"q":"Varón de 58 años intervenido de un meningioma, portador de un drenaje ventricular externo, que al sexto día presenta fiebre y disminución del nivel de conciencia. El LCR del drenaje muestra pleocitosis neutrofílica e hipoglucorraquia. ¿Qué tratamiento empírico es el más adecuado?","o":["Ceftriaxona más ampicilina, para cubrir neumococo, meningococo y Listeria.","Penicilina G sódica en monoterapia a dosis meníngeas.","Meropenem y vancomicina, cubriendo S. aureus y Pseudomonas.","Aciclovir IV más dexametasona, por sospecha de encefalitis herpética."],"a":2,"e":"En la meningitis nosocomial destaca el contexto neuroquirúrgico (ventriculostomía, craniectomía), con gérmenes como S. aureus y P. aeruginosa. Los apuntes indican que la cefalosporina puede sustituirse por meropenem en la meningitis adquirida en el hospital, la posneuroquirúrgica y la de inmunodeprimidos neutropénicos, o usar una cefalosporina con actividad antipseudomonas (ceftazidima). La vancomicina aporta cobertura frente a grampositivos resistentes, incluido S. aureus (esto último no viene explícito en los apuntes).","p":null},{"id":"Infecciones_SN_T10-T11-16","b":"Infecciones_SN_T10-T11","t":"T10","n":16,"q":"En el manejo de un paciente adulto ingresado por meningitis bacteriana aguda, señale la afirmación CORRECTA:","o":["Debe restringirse sistemáticamente el aporte de líquidos para evitar el edema cerebral.","Está indicada la profilaxis sistemática con antiepilépticos desde el ingreso.","La hipotermia terapéutica mejora el pronóstico neurológico y está recomendada.","Debe vigilarse la natremia, ya que es frecuente la hiponatremia por SIADH."],"a":3,"e":"Se aplican los principios generales del manejo de la sepsis: no restringir líquidos de forma sistemática, vigilar la natremia y evitar la hiponatremia (es frecuente el SIADH). No se recomienda la profilaxis sistemática de crisis. La hipotermia terapéutica no está indicada, porque resultó perjudicial en un ensayo clínico. Son pacientes graves que pueden requerir UCI.","p":null},{"id":"Infecciones_SN_T10-T11-17","b":"Infecciones_SN_T10-T11","t":"T10","n":17,"q":"Varón de 74 años anticoagulado con acenocumarol por fibrilación auricular (INR 3,4), que presenta fiebre, cefalea y rigidez de nuca. Está consciente y sin focalidad. ¿Cuál es la actitud correcta?","o":["Punción lumbar inmediata, porque la sospecha de meningitis prima sobre el riesgo de sangrado.","Hemocultivos y tratamiento empírico ya; la PL se difiere hasta corregir la coagulación.","Retrasar el tratamiento antibiótico hasta poder realizar la punción lumbar con seguridad.","Realizar la punción por vía cisternal, para evitar el riesgo de hematoma epidural espinal."],"a":1,"e":"Contraindicaciones de la punción lumbar en la meningitis: signos de herniación o efecto de masa en la TC, inestabilidad hemodinámica o shock, coagulopatía (CID, anticoagulación, trombopenia) e infección cutánea en el punto de punción. Si la punción no puede hacerse de inmediato, se extraen hemocultivos y se inicia la antibioticoterapia empírica sin demora.","p":null},{"id":"Infecciones_SN_T10-T11-18","b":"Infecciones_SN_T10-T11","t":"T10","n":18,"q":"Varón de 50 años dado de alta tras una meningitis neumocócica con buena evolución. ¿Cuál es la secuela neurológica más frecuente que debe buscarse activamente en el seguimiento?","o":["Parálisis del III par craneal con afectación pupilar.","Epilepsia focal farmacorresistente del lóbulo temporal.","Hipoacusia neurosensorial (VIII par).","Paresia facial periférica bilateral persistente."],"a":2,"e":"Dos tercios de los pacientes quedan sin secuelas. Las más importantes son la afectación de pares craneales (VI y, sobre todo, VIII, con sordera en torno al 14 %) y el déficit neuropsicológico a largo plazo; si hubo infartos, puede haber déficits focales. La mortalidad global es de alrededor del 21 %: unos 7 % en la meningocócica y 15-20 % en la neumocócica en países de renta alta (era de un 30 % antes de usar la dexametasona de forma sistemática).","p":null},{"id":"Infecciones_SN_T10-T11-19","b":"Infecciones_SN_T10-T11","t":"T10","n":19,"q":"Mujer de 66 años con otitis media crónica que presenta una meningitis aguda. El Gram del LCR muestra diplococos grampositivos. Recibe ceftriaxona, vancomicina, ampicilina y dexametasona. ¿Qué ajuste es correcto?","o":["Mantener la dexametasona 4 días y adecuar el antibiótico según el antibiograma.","Suspender la dexametasona, ya que su beneficio se limita a la meningitis meningocócica.","Suspender la vancomicina, porque el neumococo es siempre sensible a la penicilina.","Iniciar profilaxis con rifampicina a todos los contactos familiares cercanos."],"a":0,"e":"Una meningitis asociada a otitis, sinusitis o neumonía orienta a S. pneumoniae o H. influenzae; los diplococos grampositivos indican neumococo. La dexametasona (0,15 mg/kg cada 6 horas durante 4 días) disminuye la mortalidad y las secuelas, sobre todo en la neumocócica, y solo se suspende si el germen no es neumococo ni H. influenzae. La vancomicina se usa por las frecuentes resistencias a penicilina; luego se ajusta según el antibiograma. La quimioprofilaxis de contactos es para la meningocócica. La otitis media crónica y el implante coclear predisponen a esta infección.","p":null},{"id":"Infecciones_SN_T10-T11-20","b":"Infecciones_SN_T10-T11","t":"T10","n":20,"q":"Mujer de 35 años con su tercer episodio en 4 años de fiebre, cefalea y rigidez de nuca, que se resuelve espontáneamente en pocos días. Entre los episodios está asintomática y el LCR es normal. Durante los episodios, el LCR muestra pleocitosis linfocitaria con glucosa normal. ¿Cuál es el agente más probable?","o":["Enterovirus no polio (echovirus).","Mycobacterium tuberculosis.","Virus varicela-zóster (reactivación).","Virus herpes simple tipo 2."],"a":3,"e":"El VHS-2 es la principal causa de meningitis linfocitaria recurrente (síndrome de Mollaret). Se habla de meningitis recurrente cuando hay un periodo libre de clínica con LCR normal entre los episodios. Otras causas de recurrencia son las fístulas de LCR, la neurocirugía previa, las inmunodeficiencias, el quiste dermoide, los fármacos y enfermedades como Behçet, sarcoidosis o Vogt-Koyanagi-Harada. La tuberculosis produce una meningitis subaguda o crónica, no episodios autolimitados.","p":null},{"id":"Infecciones_SN_T10-T11-21","b":"Infecciones_SN_T10-T11","t":"T11","n":21,"q":"Varón de 38 años procedente de Senegal, con VIH no tratado, que presenta desde hace 3 semanas fiebre vespertina, sudoración nocturna, pérdida de peso, tos, cefalea progresiva y somnolencia, además de diplopía por paresia del VI par derecho. El sodio es de 126 mEq/l. El LCR muestra 220 células/mm³ (75 % linfocitos), proteínas de 210 mg/dl, glucosa de 28 mg/dl (glucemia 110) y ADA elevada. ¿Cuál es la actitud más adecuada?","o":["Esperar al cultivo en medio líquido antes de tratar, por la toxicidad de los fármacos.","Iniciar tratamiento antituberculoso con cuatro fármacos asociado a corticoides.","Iniciar aciclovir IV y repetir la punción lumbar en 3-7 días.","Iniciar anfotericina liposomal, flucitosina y fluconazol sin más estudios."],"a":1,"e":"Meningitis tuberculosa. Contexto de riesgo: VIH, diabetes, alcohol, corticoides, neoplasia, marginalidad y procedencia de zonas de alta incidencia (África subsahariana, sur y sudeste de Asia, este de Europa). Cursa con un cuadro constitucional y respiratorio al que se añaden cefalea y encefalopatía subaguda, afectación de pares craneales en el 30-50 % (sobre todo el VI) e hiponatremia por SIADH. El LCR muestra proteínas altas, glucosa baja, pleocitosis monocitaria y ADA elevada. La decisión de tratar de forma empírica se toma según la probabilidad clínica, sin esperar al cultivo (2-6 semanas). En un VIH es razonable pedir también el antígeno criptocócico, pero este cuadro orienta claramente a tuberculosis.","p":null},{"id":"Infecciones_SN_T10-T11-22","b":"Infecciones_SN_T10-T11","t":"T11","n":22,"q":"Mujer de 50 años en tratamiento crónico con corticoides que presenta una meningitis subaguda con paresia del VI par, hiponatremia y un LCR con pleocitosis linfocitaria, hipoglucorraquia y ADA elevada. La PCR Xpert MTB/RIF Ultra en el LCR es negativa. Señale la afirmación CORRECTA:","o":["La PCR negativa descarta la tuberculosis, dada su sensibilidad cercana al 100 %.","Debe esperarse el resultado del cultivo antes de iniciar cualquier tratamiento.","Una ADA elevada en LCR es diagnóstica de tuberculosis, con especificidad del 100 %.","La PCR tiene una sensibilidad en torno al 70 % y no descarta el diagnóstico."],"a":3,"e":"La OMS recomienda la PCR Xpert MTB/RIF Ultra en el LCR, que tiene una especificidad alta pero una sensibilidad en torno al 70 %, por lo que un resultado negativo no descarta la enfermedad. El cultivo en medio líquido es el patrón de referencia, pero tarda 2-6 semanas. El punto de corte de la ADA varía entre series y su especificidad es imperfecta. La decisión de iniciar el tratamiento empírico se basa en la probabilidad clínica.","p":null},{"id":"Infecciones_SN_T10-T11-23","b":"Infecciones_SN_T10-T11","t":"T11","n":23,"q":"Sobre el tratamiento de la meningitis tuberculosa en un paciente VIH negativo, señale la opción CORRECTA (R: rifampicina; H: isoniazida; Z: pirazinamida; E: etambutol):","o":["RHZE 2 meses y luego RH hasta completar 9-12 meses, con corticoides desde el inicio.","RHZE durante 6 meses en total, evitando los corticoides por el riesgo de diseminación.","RH durante 6 meses, añadiendo corticoides solo si aparece una hidrocefalia.","RHZE 2 meses y después RH 4 meses más, sin corticoides por ser VIH negativo."],"a":0,"e":"Tratamiento con cuatro fármacos (RHZE) durante 2 meses, seguidos de RH hasta completar 9-12 meses. Está indicado asociar corticoides desde el inicio, sobre todo en pacientes VIH negativos, porque varios ensayos han demostrado que reducen la mortalidad.","p":null},{"id":"Infecciones_SN_T10-T11-24","b":"Infecciones_SN_T10-T11","t":"T11","n":24,"q":"Varón de 42 años con VIH en tratamiento antirretroviral y serología treponémica positiva en sangre (RPR 1/64). Refiere cefalea leve. El LCR muestra 25 linfocitos/mm³, proteínas de 75 mg/dl y glucosa normal. El VDRL en el LCR es negativo y la FTA-ABS en el LCR es positiva. Señale la interpretación CORRECTA:","o":["El VDRL negativo en LCR descarta la neurosífilis, por lo que basta tratar la sífilis sistémica.","La FTA-ABS positiva en LCR es la prueba más específica para confirmar la neurosífilis.","Un VDRL negativo no descarta la neurosífilis, por su sensibilidad limitada (50-70 %).","La glucosa normal en el LCR descarta una meningitis de origen sifilítico."],"a":2,"e":"Una prueba treponémica positiva en sangre diagnostica la sífilis en general. Para la neurosífilis se necesita un VDRL positivo en el LCR, que es muy específico pero tiene una sensibilidad del 50-70 %: un VDRL negativo no la descarta. En cambio, una prueba treponémica (FTA-ABS) negativa en el LCR la hace muy improbable. El LCR típico muestra pleocitosis monocitaria, proteínas altas y glucosa normal. En la práctica, con este LCR inflamatorio y la FTA-ABS positiva suele tratarse como neurosífilis (dato de manejo que no detallan los apuntes).","p":null},{"id":"Infecciones_SN_T10-T11-25","b":"Infecciones_SN_T10-T11","t":"T11","n":25,"q":"Mujer de 29 años con sífilis secundaria diagnosticada hace 2 semanas (exantema palmoplantar), que consulta por visión borrosa y ojo rojo. Oftalmología diagnostica una uveítis. ¿Cuál es el tratamiento indicado?","o":["Penicilina G benzatina 2,4 millones UI IM, una dosis semanal durante 3 semanas.","Penicilina G sódica IV, 18-24 millones UI/día durante 10-14 días.","Doxiciclina oral 100 mg cada 12 horas durante 28 días y control serológico.","Ceftriaxona 250 mg IM en dosis única, junto con colirio de corticoides."],"a":1,"e":"La afectación ocular (uveítis) y la ótica se consideran formas de neurosífilis y se tratan como tal (MIR 2024): penicilina G sódica IV, 18-24 millones de UI/día durante 10-14 días. La penicilina benzatina se usa en la sífilis sin afectación del sistema nervioso.","p":null},{"id":"Infecciones_SN_T10-T11-26","b":"Infecciones_SN_T10-T11","t":"T11","n":26,"q":"Varón de 45 años con una sífilis no tratada adquirida hace unos 8 años, que presenta una hemiparesia derecha de instauración brusca. La RM muestra infartos en ambos núcleos lenticulares, de distribución simétrica. ¿Cuál es el diagnóstico más probable?","o":["Tabes dorsal.","Parálisis general progresiva.","Meningitis sifilítica de la fase secundaria.","Sífilis meningovascular."],"a":3,"e":"En la fase terciaria, entre los 5 y 10 años de evolución, la sífilis puede causar ictus (sífilis meningovascular). Los infartos suelen afectar al territorio profundo de la ACM (núcleo lenticular), a veces de forma bilateral y en espejo. En esta fase puede haber también afectación medular de cordones posteriores (tabes). La parálisis general, por afectación difusa del encéfalo y gomas, es la fase más avanzada. La meningitis de la fase secundaria aparece a los pocos meses del contagio en un 25 % y suele ser asintomática.","p":null},{"id":"Infecciones_SN_T10-T11-27","b":"Infecciones_SN_T10-T11","t":"T11","n":27,"q":"Varón de 36 años con VIH sin tratamiento (CD4 45/mm³), que presenta cefalea progresiva de 3 semanas, febrícula y náuseas. La exploración muestra una leve rigidez de nuca. ¿Qué prueba es la más rentable para el diagnóstico más probable y cuál es el tratamiento?","o":["Antígeno criptocócico en sangre y LCR; anfotericina, flucitosina y fluconazol.","VDRL en LCR; penicilina G sódica IV 18-24 millones UI/día durante 10-14 días.","PCR de virus JC en LCR; plasmaféresis y retirada del fármaco inmunosupresor implicado.","Proteína 14-3-3 en LCR; tratamiento sintomático y de soporte."],"a":0,"e":"La meningitis criptocócica es la meningitis crónica más frecuente en inmunodeprimidos (VIH, trasplantados, tratamiento inmunosupresor). Se diagnostica con el antígeno criptocócico (CrAg) en sangre y LCR. Según la OMS, se trata con una dosis única alta de anfotericina liposomal junto con flucitosina y fluconazol.","p":null},{"id":"Infecciones_SN_T10-T11-28","b":"Infecciones_SN_T10-T11","t":"T11","n":28,"q":"Mujer de 41 años con cefalea de 2 meses, parálisis facial periférica bilateral sucesiva e hipoacusia. La RM muestra realce leptomeníngeo basal, y el LCR, pleocitosis linfocitaria con proteínas elevadas; los cultivos y el estudio microbiológico son negativos. La radiografía de tórax muestra adenopatías hiliares bilaterales. ¿Cómo se establece habitualmente el diagnóstico en la práctica?","o":["Determinación de la ECA en LCR, por su elevada sensibilidad diagnóstica.","Gammagrafía con galio, que confirma el diagnóstico definitivo.","Biopsia de un tejido accesible (ganglio, pulmón) y PET-TC con FDG.","Biopsia meníngea como primera prueba diagnóstica en todos los pacientes."],"a":2,"e":"La neurosarcoidosis es una inflamación granulomatosa del sistema nervioso sin germen demostrable. Puede presentarse como una meningitis crónica con afectación de múltiples pares craneales. El diagnóstico definitivo exige biopsia del sistema nervioso, pero en la práctica suele establecerse como «probable» con la biopsia de un tejido sistémico más accesible (ganglio, pulmón). La PET-TC con FDG ha sustituido en gran medida a la gammagrafía con galio, y la ECA en LCR tiene escasa sensibilidad.","p":null},{"id":"Infecciones_SN_T10-T11-29","b":"Infecciones_SN_T10-T11","t":"T11","n":29,"q":"Mujer de 55 años con antecedente de carcinoma de mama que presenta en las últimas semanas cefalea, diplopía y paresia facial izquierda, además de dolor lumbar con debilidad e hipoestesia en ambas piernas y arreflexia aquílea. Una primera punción lumbar muestra pleocitosis linfocitaria y proteínas elevadas, con citología negativa. ¿Cuál es la actitud más adecuada?","o":["Descartar la carcinomatosis meníngea, dada la citología negativa en LCR.","Repetir la punción lumbar enviando al menos 10 ml de LCR para citología.","Iniciar tratamiento antituberculoso empírico por la pleocitosis linfocitaria.","Diagnosticar un síndrome de Guillain-Barré e iniciar inmunoglobulinas IV."],"a":1,"e":"La afectación simultánea o sucesiva de pares craneales y raíces raquídeas indica una diseminación meníngea craneocaudal, y la entidad más frecuente es la carcinomatosis meníngea. La citología del LCR tiene una sensibilidad baja en una única punción (alrededor del 50 %), que mejora con punciones repetidas y volúmenes de al menos 10 ml. La citometría de flujo es útil en los linfomas.","p":null},{"id":"Infecciones_SN_T10-T11-30","b":"Infecciones_SN_T10-T11","t":"T11","n":30,"q":"Varón de 32 años con su tercer episodio en 2 años de meningitis neumocócica. Hace 3 años sufrió un traumatismo craneoencefálico con fractura de la base del cráneo, y desde entonces refiere goteo de líquido claro por la nariz al inclinarse. ¿Cuál es la causa más probable de las recurrencias?","o":["Fístula de LCR.","Déficit del complemento terminal.","Meningitis de Mollaret.","Quiste dermoide intracraneal."],"a":0,"e":"Causas de meningitis recurrente. Infecciosas: fístulas de LCR, neurocirugía previa (válvulas de derivación), meningitis de Mollaret (VHS-2) e inmunodeficiencias (esplenectomía, déficit de complemento, hipogammaglobulinemia, inhibidores del complemento). No infecciosas: lesión estructural (quiste dermoide), fármacos y enfermedades inflamatorias (Behçet, sarcoidosis, Vogt-Koyanagi-Harada). La rinorrea clara tras una fractura de la base del cráneo indica una fístula.","p":null},{"id":"Infecciones_SN_T10-T11-31","b":"Infecciones_SN_T10-T11","t":"T11","n":31,"q":"Mujer de 34 años que acude a urgencias por fiebre y cefalea de 2 días. Durante la espera se muestra desorientada y agitada, tiene dificultad para encontrar las palabras y presenta una crisis focal con automatismos orofaciales. ¿Cuál es la secuencia más adecuada?","o":["Punción lumbar inmediata y esperar al resultado de la PCR para iniciar el tratamiento.","Fibrinólisis IV por sospecha de ictus, al tratarse de una afasia de inicio brusco.","Valoración por Psiquiatría por agitación psicomotriz y vigilancia sin tratamiento.","TC cerebral, punción lumbar si no la contraindica y aciclovir IV cuanto antes."],"a":3,"e":"Cuadro típico de encefalitis herpética, la causa más frecuente de encefalitis infecciosa esporádica: paciente joven con fiebre y cefalea que progresa rápidamente con alteración del comportamiento, agitación, alteración del lenguaje (lóbulo temporal) y crisis de inicio focal. Es un imitador importante del ictus. La TC es obligatoria antes de la punción si hay déficit focal, alteración del nivel de conciencia o crisis. Si no hay efecto de masa, se hace la punción lumbar, y mientras tanto se inicia el tratamiento empírico con aciclovir IV («tiempo es cerebro»).","p":null},{"id":"Infecciones_SN_T10-T11-32","b":"Infecciones_SN_T10-T11","t":"T11","n":32,"q":"Paciente con sospecha de encefalitis herpética, en tratamiento con aciclovir IV desde hace 36 horas. La RM muestra hiperseñal temporal medial izquierda, pero la PCR de VHS en el LCR obtenido al ingreso es negativa. ¿Qué actitud es la correcta?","o":["Suspender el aciclovir, ya que una PCR negativa descarta la encefalitis herpética.","Cambiar a valaciclovir oral, más cómodo y con igual eficacia como tratamiento inicial.","Mantener el aciclovir y repetir la punción lumbar a los 3-7 días.","Sustituir el aciclovir por ganciclovir, al ser probable una encefalitis por CMV."],"a":2,"e":"La PCR de VHS puede ser falsamente negativa en las primeras 72 horas. Si la sospecha persiste, se repite la punción lumbar a los 3-7 días sin suspender el aciclovir. El valaciclovir no se usa como tratamiento inicial. El ganciclovir, el foscarnet y el cidofovir se emplean en la infección por CMV.","p":null},{"id":"Infecciones_SN_T10-T11-33","b":"Infecciones_SN_T10-T11","t":"T11","n":33,"q":"Varón de 120 kg con obesidad, diagnosticado de encefalitis herpética. Señale la pauta de tratamiento CORRECTA:","o":["Aciclovir oral 800 mg cinco veces al día durante 7 días, de forma ambulatoria.","Aciclovir IV 10 mg/kg/8 h por peso ideal, 14-21 días, vigilando la función renal.","Aciclovir IV 10 mg/kg/8 h por peso real durante 5 días, sin necesidad de controles analíticos.","Valaciclovir oral 1 g cada 8 horas durante 21 días como tratamiento de inicio."],"a":1,"e":"Aciclovir 10-15 mg/kg cada 8 horas IV, dosificado por peso (peso ideal en obesos), con hidratación y vigilancia de la función renal por su nefrotoxicidad. La duración habitual es de 14-21 días, con una PCR de control al final si hay dudas. El valaciclovir no se usa como tratamiento inicial, y la pauta oral prolongada tras el aciclovir IV no mejoró el pronóstico neuropsicológico. El ensayo DexEnceph (2026) mostró que la dexametasona es segura, pero sin un beneficio clínico claro.","p":null},{"id":"Infecciones_SN_T10-T11-34","b":"Infecciones_SN_T10-T11","t":"T11","n":34,"q":"En la fase precoz de una encefalitis herpética, ¿qué prueba de imagen tiene mayor rendimiento diagnóstico?","o":["RM cerebral con secuencia de difusión, alterada en torno al 90 % de los casos.","TC cerebral, que muestra hipodensidad temporal en la mayoría de los casos iniciales.","Angio-TC, que muestra la oclusión de ramas de la arteria cerebral media.","SPECT cerebral, que muestra hiperperfusión occipital bilateral."],"a":0,"e":"La TC suele ser normal al inicio (es lo más frecuente); después muestra hipodensidad temporal, a menudo bilateral, a veces con componente hemorrágico (encefalitis necrohemorrágica). La RM, especialmente la difusión, es anormal en torno al 90 % de los casos ya en la fase precoz. El EEG está alterado en el 90 %: lo más frecuente es la actividad epileptiforme focal, seguida de la focalización temporal, las descargas periódicas lateralizadas (PLEDs) y, en su ausencia, la lentificación difusa.","p":null},{"id":"Infecciones_SN_T10-T11-35","b":"Infecciones_SN_T10-T11","t":"T11","n":35,"q":"Mujer de 23 años que, tras un cuadro pseudogripal, desarrolla en 3 semanas ansiedad, alucinaciones y conducta extraña, seguidas de crisis epilépticas, discinesias orofaciales, fluctuaciones de la presión arterial y la frecuencia cardiaca, hipoventilación y disminución del nivel de conciencia. La RM es normal y el LCR muestra una pleocitosis linfocitaria leve. ¿Qué estudios son prioritarios?","o":["PCR de virus herpes simple en LCR y repetición de la punción lumbar en 3-7 días.","RT-QuIC y proteína 14-3-3 en LCR y RM cerebral con secuencia de difusión.","Antígeno criptocócico en sangre y LCR y fondo de ojo para descartar papiledema.","Anticuerpos anti-NMDAR en LCR y búsqueda de teratoma de ovario."],"a":3,"e":"La encefalitis anti-NMDAR es típica de mujeres jóvenes y sigue una secuencia característica: síntomas psiquiátricos, crisis, discinesias, disautonomía, hipoventilación y bajo nivel de conciencia. En un porcentaje relevante se asocia a teratoma ovárico. El inicio es subagudo, con fiebre leve o ausente, la RM suele ser normal y hay pleocitosis ligera; los anticuerpos se detectan mejor en el LCR que en el suero. Tratamiento: primera línea con corticoides, inmunoglobulinas IV y/o plasmaféresis; segunda línea con rituximab o ciclofosfamida; y extirpación del tumor.","p":null},{"id":"Infecciones_SN_T10-T11-36","b":"Infecciones_SN_T10-T11","t":"T11","n":36,"q":"Niño de 6 años que se recuperó de una encefalitis herpética tratada con aciclovir. A las 4 semanas presenta movimientos coreoatetósicos, irritabilidad e insomnio. La PCR de VHS en el LCR es negativa y la RM no muestra lesiones nuevas. ¿Cuál es el diagnóstico más probable y su tratamiento?","o":["Recaída de la encefalitis herpética; reiniciar aciclovir IV durante 21 días.","Corea de Sydenham postestreptocócica; penicilina y haloperidol.","Encefalitis autoinmune posherpética (anti-NMDAR); inmunoterapia.","Secuela estructural de la encefalitis; tratamiento sintomático exclusivo."],"a":2,"e":"En el estudio del grupo de Barcelona (Armangue, Lancet Neurol 2018), alrededor de una cuarta parte de los pacientes desarrolló una encefalitis autoinmune, sobre todo anti-NMDAR, en los meses siguientes a una encefalitis herpética. Se presenta como una aparente «recaída» con PCR de VHS negativa, con coreoatetosis en niños y síntomas psiquiátricos en adultos, y responde a la inmunoterapia.","p":null},{"id":"Infecciones_SN_T10-T11-37","b":"Infecciones_SN_T10-T11","t":"T11","n":37,"q":"Niña de 6 años que, 2 semanas después de una varicela, presenta en pocos días somnolencia, irritabilidad, ataxia y paresia del brazo izquierdo. La RM muestra lesiones grandes, mal delimitadas, bilaterales y asimétricas en la sustancia blanca, con afectación de ambos tálamos. ¿Cuál es el diagnóstico y el tratamiento?","o":["Encefalitis herpética; aciclovir IV durante 21 días.","Encefalomielitis aguda diseminada; corticoides.","Esclerosis múltiple pediátrica; natalizumab.","Leucoencefalopatía multifocal progresiva; plasmaféresis."],"a":1,"e":"La encefalomielitis aguda diseminada (ADEM) afecta sobre todo a niños y adolescentes tras una infección vírica o una vacunación. Es un cuadro agudo o subagudo y monofásico, con inflamación y desmielinización de la sustancia blanca (también de la gris y de la médula). La RM muestra lesiones grandes, mal delimitadas, bilaterales y asimétricas, con frecuente afectación de la sustancia gris profunda (tálamos, ganglios basales). Se trata con corticoides. Una parte importante de las ADEM pediátricas tiene anticuerpos anti-MOG (espectro MOGAD), lo que tiene valor pronóstico por el riesgo de recaída.","p":null},{"id":"Infecciones_SN_T10-T11-38","b":"Infecciones_SN_T10-T11","t":"T11","n":38,"q":"Mujer de 41 años con esclerosis múltiple tratada con natalizumab desde hace 4 años, que desarrolla en semanas una hemianopsia homónima derecha y alteraciones cognitivas. La RM muestra lesiones de sustancia blanca subcortical parietooccipital izquierda con afectación de las fibras en U, sin efecto de masa ni realce. ¿Cuál es la actitud más adecuada?","o":["Bolos de metilprednisolona por un brote de esclerosis múltiple y mantener natalizumab.","Aciclovir IV empírico por sospecha de encefalitis herpética de presentación atípica.","Biopsia cerebral inmediata, ya que la PCR en LCR no tiene utilidad diagnóstica.","PCR de virus JC en LCR, retirar natalizumab y plasmaféresis, vigilando el IRIS."],"a":3,"e":"Leucoencefalopatía multifocal progresiva por el poliomavirus JC. Aparece en el sida, los tumores hematológicos, los trasplantes, las enfermedades inflamatorias crónicas y con inmunomoduladores (natalizumab, rituximab). Produce desmielinización multifocal que respeta el nervio óptico y la médula. Clínica: hemianopsia homónima (45 %), alteración mental (40 %), déficit motor, ataxia y crisis (20 %). La RM muestra lesiones subcorticales con afectación de fibras en U, sin efecto de masa ni realce; se confirma con la PCR de ADN del virus JC en el LCR y, si es negativa con alta sospecha, con biopsia. No hay tratamiento eficaz probado: hay que restablecer la inmunocompetencia (plasmaféresis si hay un inmunosupresor implicado), vigilando el síndrome inflamatorio de reconstitución inmune (IRIS).","p":null},{"id":"Infecciones_SN_T10-T11-39","b":"Infecciones_SN_T10-T11","t":"T11","n":39,"q":"Varón de 63 años con deterioro cognitivo rápidamente progresivo de 3 meses, inestabilidad de la marcha y sacudidas mioclónicas que se desencadenan con el ruido o al tocarle. La RM muestra hiperseñal en difusión con ribeteado cortical y afectación de ambos tálamos. ¿Qué prueba es hoy la de referencia para el diagnóstico in vivo?","o":["RT-QuIC en LCR.","Proteína 14-3-3 en LCR.","EEG con complejos periódicos.","Biopsia de amígdala palatina."],"a":0,"e":"Enfermedad de Creutzfeldt-Jakob esporádica (85 % de los casos), con una supervivencia mediana de 4-6 meses. Suele debutar con deterioro cognitivo, a veces con clínica psiquiátrica, o con formas de inicio visual o cerebeloso. Asocia mioclonías (90 %) desencadenadas por estímulos sensoriales, extrapiramidalismo, mutismo acinético, signos piramidales leves y crisis tardías. En la RM, lo más específico es la combinación de ribeteado cortical y afectación profunda. El RT-QuIC en LCR (sensibilidad alrededor del 90 %, especificidad cercana al 100 %) es el método de referencia; la proteína 14-3-3 es menos específica y el EEG puede mostrar complejos periódicos. El diagnóstico definitivo es anatomopatológico. Es de declaración obligatoria y exige precauciones con el instrumental quirúrgico.","p":null},{"id":"Infecciones_SN_T10-T11-40","b":"Infecciones_SN_T10-T11","t":"T11","n":40,"q":"Mujer de 58 años con encefalopatía subaguda progresiva, mioclonías y complejos periódicos en el EEG, en estudio por sospecha de enfermedad de Creutzfeldt-Jakob. El RT-QuIC en el LCR es negativo y la RM no muestra ribeteado cortical. ¿Qué determinación es prioritaria para descartar una causa tratable?","o":["Proteína 14-3-3 en LCR.","Estudio genético del gen de la proteína priónica.","Anticuerpos antitiroideos en sangre.","Proteína tau total en LCR."],"a":2,"e":"La encefalopatía de Hashimoto es una encefalopatía progresiva subaguda con mioclonías y complejos periódicos en el EEG; se diagnostica con anticuerpos antitiroideos. Es un diagnóstico diferencial clave de la enfermedad de Creutzfeldt-Jakob porque es tratable (responde a corticoides, dato que no figura en los apuntes). Otros diagnósticos diferenciales son las enfermedades neurodegenerativas, la vasculitis del SNC, las encefalitis autoinmunes (anti-LGI1), la sífilis, el VIH, el VHS, los tumores (gliomatosis, linfoma) y las encefalopatías metabólicas o tóxicas (litio, bismuto).","p":null},{"id":"Miastenia_T22-1","b":"Miastenia_T22","t":"T22","n":1,"q":"Mujer de 28 años que refiere desde hace 2 meses visión doble y caída del párpado derecho, que empeoran por la tarde y después de leer, y que cambian de un día a otro (algunos días se afecta el izquierdo). Al pedirle que mire hacia arriba durante un minuto, la ptosis se acentúa progresivamente. Las pupilas son normales y reactivas. ¿Cuál es el diagnóstico más probable?","o":["Parálisis del III par derecho por aneurisma de la comunicante posterior.","Miastenia gravis de predominio ocular.","Síndrome de Horner por disección carotídea.","Síndrome de Eaton-Lambert de predominio ocular."],"a":1,"e":"La miastenia gravis cursa con debilidad fluctuante (cambia de un día a otro o en el mismo día) y fatigable (empeora con el uso mantenido del músculo). Los músculos más afectados son los de mayor actividad metabólica, los oculares extrínsecos y los palpebrales; por eso los síntomas más frecuentes son la diplopía y la ptosis. La diplopía fluctuante no encaja con la lesión de un solo par oculomotor, y la ptosis es asimétrica y empeora al final del día y con la mirada mantenida hacia arriba. La pupila está respetada. Es más frecuente en mujeres.","p":null},{"id":"Miastenia_T22-2","b":"Miastenia_T22","t":"T22","n":2,"q":"Varón de 55 años con ptosis y diplopía fluctuantes de 4 meses, sin otra clínica, y con un test del hielo positivo. Los anticuerpos antirreceptor de acetilcolina son negativos. Señale la actitud CORRECTA:","o":["Descartar la miastenia gravis, ya que unos anticuerpos negativos la excluyen.","Iniciar corticoides a dosis altas sin necesidad de más estudios.","Solicitar RM cerebral, ya que la causa más probable es un tumor de tronco.","No la descarta; pedir anti-MuSK y estudio neurofisiológico (fibra aislada)."],"a":3,"e":"Los anticuerpos antirreceptor de acetilcolina confirman el diagnóstico, pero solo se detectan en el 50 % de las formas oculares y en el 85 % de las generalizadas. En las formas seronegativas pueden estudiarse los anti-MuSK (los siguientes en frecuencia), anti-LRP4, antititina, anti-RyR, antiagrina o anti-Kv1.4. La neurofisiología apoya el diagnóstico (decremento en la estimulación repetitiva, aumento del jitter en el estudio de fibra aislada). La neuroimagen se reserva para los casos de duda diagnóstica con una posible neuropatía de pares craneales.","p":null},{"id":"Miastenia_T22-3","b":"Miastenia_T22","t":"T22","n":3,"q":"Mujer de 35 años con miastenia gravis generalizada recién diagnosticada y anticuerpos antirreceptor de acetilcolina positivos. ¿Qué prueba de imagen debe realizarse en todos los pacientes en el momento del diagnóstico?","o":["TC de tórax, para buscar timoma o hiperplasia tímica en el mediastino.","RM cerebral con contraste, para descartar lesiones en el tronco del encéfalo.","RM de órbitas con contraste, para descartar una miopatía orbitaria inflamatoria.","Ecografía tiroidea, por su asociación casi constante con tiroiditis autoinmune."],"a":0,"e":"La prueba de imagen que debe hacerse a todo paciente al diagnóstico es la TC de tórax, que puede mostrar una masa en el mediastino anterior (hiperplasia tímica o timoma); su detección precoz es clave para el pronóstico. Se detecta un timoma en el 5-15 % de los pacientes (algunos autores consideran la miastenia un síndrome paraneoplásico) e hiperplasia tímica en el 60-75 %.","p":null},{"id":"Miastenia_T22-4","b":"Miastenia_T22","t":"T22","n":4,"q":"Varón de 62 años que acude a consulta por una ptosis izquierda marcada que, según refiere, empeora a lo largo del día. ¿Qué prueba sencilla puede hacerse en la propia consulta para apoyar el diagnóstico de sospecha?","o":["Prueba de edrofonio (Tensilon) en la consulta, sin necesidad de monitorización.","Prueba de la fenilefrina tópica para valorar la respuesta palpebral.","Test del hielo sobre el párpado, con mejoría rápida y transitoria.","Maniobra de Bielschowsky, inclinando la cabeza hacia el hombro afecto."],"a":2,"e":"El test del hielo produce una mejoría clínica rápida, transitoria y muy llamativa cuando los músculos afectados son accesibles, como el párpado. El test de edrofonio (Tensilon) también produce una mejoría breve, pero tiene riesgo arritmogénico y de broncoconstricción, por lo que no puede hacerse a la ligera. La respuesta clara a la piridostigmina permite un diagnóstico ex juvantibus. La maniobra de Bielschowsky se usa en la parálisis del IV par.","p":null},{"id":"Miastenia_T22-5","b":"Miastenia_T22","t":"T22","n":5,"q":"¿Cuál de los siguientes hallazgos neurofisiológicos apoya el diagnóstico de miastenia gravis?","o":["Incremento de la amplitud del potencial con la estimulación repetitiva a alta frecuencia.","Decremento de la amplitud de al menos un 10 % en la estimulación repetitiva.","Velocidades de conducción motora enlentecidas con bloqueos de la conducción.","Disminución del jitter en el estudio de fibra aislada."],"a":1,"e":"La estimulación repetitiva demuestra la fatigabilidad: decremento de la amplitud del potencial de al menos un 10 %, o a partir del 4.º-5.º potencial respecto al primero. En el estudio de fibra aislada (jitter) hay un aumento de la variabilidad, no una disminución. El incremento con estimulación a alta frecuencia es propio del síndrome de Eaton-Lambert, y los bloqueos de conducción, de las neuropatías desmielinizantes.","p":null},{"id":"Miastenia_T22-6","b":"Miastenia_T22","t":"T22","n":6,"q":"Mujer de 45 años con miastenia gravis generalizada que, tras una infección respiratoria, presenta en 2 días voz nasal y débil, dificultad para tragar, tos ineficaz y debilidad para levantar la cabeza. La saturación por pulsioximetría es del 97 %. ¿Cuál es la actitud correcta?","o":["Gasometría arterial e ingreso en UCI por sospecha de crisis miasténica.","Alta con aumento de piridostigmina, ya que la saturación es normal.","Vigilancia de la saturación con pulsioximetría cada 4 horas en planta.","Test de edrofonio urgente para confirmar que se trata de una crisis miasténica."],"a":0,"e":"La crisis miasténica es la aparición aguda o subaguda de síntomas bulbares o de insuficiencia ventilatoria (disartria, hipofonía, debilidad cervical, tos sin capacidad para movilizar secreciones) y puede poner en peligro la vida. No debe monitorizarse con el saturímetro, porque la saturación se altera de forma muy tardía: hay que hacer una gasometría arterial. Es indicación de ingreso en UCI o en una unidad de vigilancia intensiva, ya que puede necesitar ventilación mecánica no invasiva o invasiva. Puede precipitarse por infecciones, cambios farmacológicos o fármacos que actúen sobre la acetilcolina, y también ser la forma de presentación de la enfermedad.","p":null},{"id":"Miastenia_T22-7","b":"Miastenia_T22","t":"T22","n":7,"q":"Varón con miastenia gravis generalizada que ingresa por empeoramiento. ¿Qué hallazgo de la exploración tiene mayor valor para anticipar una insuficiencia ventilatoria y cómo debe explorarse?","o":["La ptosis bilateral, explorada con la mirada mantenida hacia arriba.","La debilidad de los orbiculares, tras cierres oculares repetidos.","La debilidad de la flexión cervical, explorada en decúbito supino.","La debilidad proximal de los brazos, explorada en sedestación."],"a":2,"e":"La musculatura cervical y el diafragma comparten inervación, por lo que la debilidad de la flexión cervical puede predecir la insuficiencia ventilatoria. Para que sea fiable debe explorarse en decúbito supino, ya que en sedestación puede ser falsamente negativa. La clínica bulbar (disfonía, disartria) también puede anticiparla y obliga a redoblar la vigilancia.","p":null},{"id":"Miastenia_T22-8","b":"Miastenia_T22","t":"T22","n":8,"q":"Mujer de 40 años diagnosticada de miastenia gravis con afectación exclusivamente ocular (ptosis y diplopía fluctuantes) y TC de tórax sin timoma. ¿Cuál es el tratamiento inicial más adecuado?","o":["Plasmaféresis de forma programada cada mes.","Eculizumab de primera línea, por su rapidez y su perfil de seguridad.","Inmunoglobulinas IV seguidas de rituximab.","Piridostigmina oral, con aumento progresivo de la dosis."],"a":3,"e":"Los inhibidores de la acetilcolinesterasa aumentan la acetilcolina en la hendidura sináptica: piridostigmina (oral) y neostigmina (intravenosa). Se recomienda un aumento progresivo de la dosis para minimizar efectos adversos (molestias digestivas, diarrea). En las formas oculares pueden ser el único tratamiento necesario; en las generalizadas suele hacer falta asociar otros fármacos. Los nuevos fármacos dirigidos al complemento y a otras dianas se reservan, por su elevado coste, para los pacientes resistentes a otras terapias.","p":null},{"id":"Miastenia_T22-9","b":"Miastenia_T22","t":"T22","n":9,"q":"Varón de 58 años con miastenia gravis generalizada que no ha mejorado lo suficiente con piridostigmina. Se inicia prednisona a dosis altas y, 5 días después, presenta más disfagia y debilidad. Señale la interpretación CORRECTA:","o":["Indica que el diagnóstico de miastenia es erróneo y debe suspenderse la prednisona.","Es el empeoramiento transitorio descrito al iniciar corticoides; exige vigilancia.","Se debe a una sobredosificación de corticoides y se trata con neostigmina intravenosa.","Es una miopatía esteroidea precoz y obliga a sustituir la prednisona por plasmaféresis."],"a":1,"e":"Los inmunosupresores están indicados en las formas generalizadas, o en las oculares que no mejoran con los inhibidores de la acetilcolinesterasa. Los más usados son los corticoides, que deben emplearse con cautela: pocos días después de iniciarlos puede haber un empeoramiento transitorio, por lo que hay que redoblar la vigilancia en ese periodo. En la práctica suelen iniciarse a dosis bajas y subirse de forma progresiva, o en régimen hospitalario si se inician a dosis altas (esto no figura en los apuntes).","p":null},{"id":"Miastenia_T22-10","b":"Miastenia_T22","t":"T22","n":10,"q":"Mujer de 66 años con miastenia gravis generalizada que precisa inmunosupresión, con diabetes mal controlada y osteoporosis con fracturas vertebrales. ¿Qué opción es la más adecuada para evitar dosis altas de corticoides?","o":["Mantener solo la piridostigmina a dosis máximas de forma indefinida.","Plasmaféresis semanal como único tratamiento de mantenimiento.","Un ahorrador de corticoides, como la azatioprina o el micofenolato.","Toxina botulínica en la musculatura afectada de forma periódica."],"a":2,"e":"Cuando hay contraindicación para los corticoides o se quieren evitar dosis elevadas, se usan fármacos ahorradores de corticoides: azatioprina, micofenolato, ciclosporina, tacrólimus, ciclofosfamida, rituximab o eculizumab. La plasmaféresis se reserva para casos resistentes o cuando se necesita eliminar anticuerpos rápidamente. La toxina botulínica bloquea la liberación presináptica de acetilcolina y empeoraría la miastenia.","p":null},{"id":"Miastenia_T22-11","b":"Miastenia_T22","t":"T22","n":11,"q":"Varón de 50 años con miastenia gravis generalizada refractaria que presenta un empeoramiento bulbar grave y en el que es necesario eliminar rápidamente los anticuerpos circulantes. ¿Qué opción es la adecuada y qué cabe esperar?","o":["Plasmaféresis o inmunoglobulinas IV; mejoría en días o pocas semanas.","Azatioprina; mejoría clínica en las primeras 24 horas.","Edrofonio en perfusión continua; mejoría inmediata y sostenida.","Prednisona a dosis altas; mejoría inmediata sin riesgo de empeoramiento."],"a":0,"e":"En los pacientes resistentes a otras terapias, o cuando hay que eliminar los anticuerpos con rapidez, se puede hacer plasmaféresis o administrar inmunoglobulinas humanas inespecíficas. La mejoría no es inmediata: puede tardar días o pocas semanas. El edrofonio no sirve como tratamiento, y los corticoides pueden producir un empeoramiento transitorio al inicio.","p":null},{"id":"Miastenia_T22-12","b":"Miastenia_T22","t":"T22","n":12,"q":"Respecto al test de cloruro de edrofonio (Tensilon) en la miastenia gravis, señale la afirmación CORRECTA:","o":["Produce una mejoría prolongada y se emplea como tratamiento de mantenimiento.","Actúa bloqueando los anticuerpos antirreceptor de acetilcolina circulantes.","Su mejoría clínica es diferida, de varios días, como la de la piridostigmina.","Su mejoría es breve y no sirve como tratamiento por riesgo arritmogénico."],"a":3,"e":"El edrofonio potencia la función de la acetilcolina (inhibe la acetilcolinesterasa) y produce una mejoría clínica breve, a veces muy llamativa, que apoya la sospecha diagnóstica. No se usa como tratamiento por su riesgo arritmogénico y de broncoconstricción. La piridostigmina produce una mejoría más diferida y, si es notoria, apoya un diagnóstico ex juvantibus.","p":null},{"id":"Miastenia_T22-13","b":"Miastenia_T22","t":"T22","n":13,"q":"Varón de 64 años, fumador de 50 paquetes-año, con debilidad progresiva de 3 meses en la musculatura proximal de las piernas, sequedad de boca y estreñimiento. Los reflejos están disminuidos pero aumentan al repetirlos, y la fuerza mejora tras unos segundos de contracción mantenida. ¿Cuál es el diagnóstico y qué hay que buscar?","o":["Miastenia gravis; TC de tórax para descartar un timoma.","Botulismo; detección de la toxina en suero y heces.","Eaton-Lambert; un carcinoma microcítico de pulmón.","Polimiositis paraneoplásica; una neoplasia de vejiga o un linfoma."],"a":2,"e":"El síndrome de Eaton-Lambert se debe a anticuerpos contra los canales de calcio voltaje-dependientes de la membrana presináptica. Se considera paraneoplásico: hay que buscar una neoplasia, sobre todo pulmonar (el carcinoma microcítico es el más relacionado). La debilidad empeora con el ejercicio, pero con la contracción mantenida o repetida hay potenciación, visible en el balance muscular y en los reflejos, que aumentan al repetirlos. Es característica la disautonomía. En la estimulación repetitiva a alta frecuencia la amplitud aumenta, al contrario que en la miastenia.","p":null},{"id":"Miastenia_T22-14","b":"Miastenia_T22","t":"T22","n":14,"q":"Mujer de 60 años diagnosticada de síndrome de Eaton-Lambert, cuya estimulación repetitiva a alta frecuencia muestra un aumento marcado de la amplitud del potencial motor. Además de tratar la neoplasia asociada, ¿cuál es el tratamiento sintomático específico?","o":["Piridostigmina en monoterapia.","3,4-diaminopiridina.","Antitoxina botulínica trivalente.","Toxina botulínica tipo A."],"a":1,"e":"El tratamiento del síndrome de Eaton-Lambert es la 3,4-diaminopiridina. Los apuntes dicen que actúa como bloqueante de los canales de calcio presinápticos, pero en realidad bloquea los canales de potasio presinápticos: prolonga la despolarización, lo que aumenta la entrada de calcio y la liberación de acetilcolina. El aumento de amplitud con la estimulación a alta frecuencia (fenómeno de potenciación) es el patrón neurofisiológico típico.","p":null},{"id":"Miastenia_T22-15","b":"Miastenia_T22","t":"T22","n":15,"q":"Varón de 47 años que, 24 horas después de comer conservas caseras de judías, presenta visión borrosa, diplopía, ptosis, pupilas midriáticas poco reactivas, sequedad de boca, disfagia y disartria, y en las horas siguientes debilidad de los brazos y dificultad respiratoria. Está consciente y sin alteraciones sensitivas. ¿Cuál es la actitud correcta?","o":["Ingreso en UCI, antitoxina botulínica y declaración obligatoria.","Inmunoglobulinas IV por sospecha de un síndrome de Miller Fisher.","Piridostigmina oral por sospecha de miastenia gravis de debut.","Corticoides a dosis altas por sospecha de encefalitis de tronco."],"a":0,"e":"El botulismo se debe a la toxina de Clostridium botulinum, generalmente por alimentos contaminados (conservas), por infección de heridas o de forma iatrogénica. La toxina impide la liberación presináptica de acetilcolina. Produce una debilidad generalizada descendente (pares craneales, síntomas bulbares, debilidad respiratoria y de extremidades) con marcada disautonomía, como la midriasis y la sequedad de boca. Se confirma con la detección de la toxina y es de declaración obligatoria. Se trata con antitoxina y hospitalización en UCI.","p":null},{"id":"Mielopatias_T17-1","b":"Mielopatias_T17","t":"T17","n":1,"q":"Mujer de 62 años con antecedente de carcinoma de mama hace 4 años, que consulta por dolor dorsal de 3 semanas, que empeora en decúbito. Desde hace 48 horas presenta debilidad en ambas piernas, nivel sensitivo en D8 y retención urinaria. ¿Cuál es la actitud más adecuada?","o":["Punción lumbar urgente para descartar una mielitis aguda antes de solicitar pruebas de imagen.","RM de la columna dorsal de forma preferente en las próximas semanas.","RM medular completa urgente y, si hay compresión, dexametasona, radioterapia o cirugía.","Gammagrafía ósea para estadificar la enfermedad metastásica antes de decidir el tratamiento."],"a":2,"e":"Ante una mielopatía aguda no traumática, lo primero es descartar de forma urgente una compresión medular, que siempre es una urgencia neurológica, porque el tratamiento es tiempo-dependiente. Se indica RM medular total urgente (incluyendo fosa posterior), ya que es importante estudiar toda la médula para decidir el tratamiento: dexametasona, radioterapia y/o descompresión quirúrgica. Las metástasis vertebrales de mama, pulmón, tumores hematológicos y mieloma suelen afectar a segmentos torácicos.","p":null},{"id":"Mielopatias_T17-2","b":"Mielopatias_T17","t":"T17","n":2,"q":"Varón de 54 años, diabético mal controlado, con fiebre de 38,5 ºC, malestar general y dolor lumbar intenso desde hace una semana. Hoy presenta debilidad progresiva en ambas piernas y dificultad para orinar. ¿Cuál es la sospecha principal?","o":["Mielitis aguda parainfecciosa, que se trata con corticoides sin necesidad de imagen urgente.","Compresión medular infecciosa (absceso epidural, espondilodiscitis): RM urgente.","Infarto medular por embolismo séptico, que no requiere RM porque esta suele ser normal al inicio.","Polirradiculoneuropatía diabética, que se estudia con un EMG ambulatorio."],"a":1,"e":"Entre las causas compresivas de mielopatía aguda están las infecciosas: empiema o absceso epidural, tuberculoma (mal de Pott) y espondilodiscitis, en las que puede predominar la clínica infecciosa y el malestar general. Como cualquier compresión medular, es una urgencia neurológica que requiere RM medular urgente.","p":null},{"id":"Mielopatias_T17-3","b":"Mielopatias_T17","t":"T17","n":3,"q":"Varón de 69 años que, al despertar de una cirugía de reparación de un aneurisma de aorta toracoabdominal, presenta paraplejía flácida, pérdida de la sensibilidad dolorosa y térmica por debajo de D10 y retención urinaria, con conservación de la sensibilidad vibratoria y posicional. ¿Cuál es el diagnóstico más probable?","o":["Infarto de la arteria espinal anterior por lesión de la arteria de Adamkiewicz.","Hematoma epidural compresivo secundario a la anticoagulación intraoperatoria.","Infarto en el territorio de las arterias espinales posteriores por hipoperfusión.","Lesión medular transversa completa por mielitis aguda postquirúrgica."],"a":0,"e":"La arteria radicular magna o de Adamkiewicz se origina en la aorta a nivel torácico bajo o lumbar alto, y la médula torácica baja tiene peor irrigación. Puede lesionarse en la cirugía torácica o aórtica, y al despertar el paciente presenta una paraplejía o paraparesia. El infarto de la arteria espinal anterior produce paraparesia, nivel sensitivo (espinotalámico) y afectación esfinteriana, con respeto de los cordones posteriores. Una lesión transversa completa afectaría también a la sensibilidad vibratoria y posicional.","p":null},{"id":"Mielopatias_T17-4","b":"Mielopatias_T17","t":"T17","n":4,"q":"Varón de 72 años, hipertenso y fumador, con dolor dorsal brusco seguido en pocos minutos de paraparesia grave e incontinencia, con nivel termoalgésico en D9 y sensibilidad vibratoria normal. La RM medular realizada a las 4 horas no muestra compresión ni alteraciones de señal. ¿Cuál es la actitud más adecuada?","o":["Descartar una lesión medular, dado que la RM es normal, y orientar el cuadro como funcional.","Iniciar metilprednisolona IV en dosis altas por sospecha de mielitis aguda.","Realizar una arteriografía medular urgente como primera prueba diagnóstica.","Mantener la sospecha de infarto, repetir la RM en 4-5 días y estudiar la causa."],"a":3,"e":"Las mielopatías agudas vasculares se sospechan por el contexto clínico. El infarto medular puede no verse en la primera RM, y hay que repetirla a los 4-5 días. Además hay que estudiar la causa: patología aórtica (disección, oclusión, cirugía), mecanismo hemodinámico (hipotensión en vasculópatas), embolismo cardiaco, embolismo fibrocartilaginoso, disección vertebral o vasculitis. Para ello se usan el angio-TC de aorta y el estudio de las causas embólicas.","p":null},{"id":"Mielopatias_T17-5","b":"Mielopatias_T17","t":"T17","n":5,"q":"Varón de 58 años, con espondiloartrosis, que tras levantar una carga pesada presenta un cuadro brusco de paraparesia con nivel sensitivo termoalgésico. La RM no muestra compresión, la angio-TC de aorta y el estudio cardiológico son normales, y en una RM de control se confirma un infarto medular adyacente a un disco degenerado. ¿Cuál es el mecanismo más probable?","o":["Disección de la arteria vertebral extendida a la arteria espinal anterior.","Embolismo de material fibrocartilaginoso procedente del núcleo pulposo.","Vasculitis primaria del sistema nervioso central.","Embolismo cardiaco por fibrilación auricular paroxística."],"a":1,"e":"Entre las causas de infarto espinal anterior, el embolismo de material fibrocartilaginoso se da sobre todo en gente mayor: el propio material degenerado de la artropatía (núcleo pulposo) pasa a la circulación y ocluye la irrigación de un segmento medular. La disección vertebral que progresa a la espinal anterior es muy rara. El estudio cardiológico normal hace menos probable el embolismo cardiaco.","p":null},{"id":"Mielopatias_T17-6","b":"Mielopatias_T17","t":"T17","n":6,"q":"Mujer de 29 años con parestesias ascendentes en ambas piernas y urgencia miccional de 5 días. La RM descarta una compresión y muestra una lesión medular dorsal que capta gadolinio y se extiende a lo largo de un cuerpo vertebral y medio; en la RM craneal hay lesiones periventriculares ovoideas. ¿Cuál es la etiología más probable?","o":["Neuromielitis óptica con mielitis longitudinalmente extensa.","Infarto medular de la arteria espinal anterior por hipoperfusión.","Mielitis aguda por un brote de EM.","Mielitis infecciosa directa por el virus varicela-zóster."],"a":2,"e":"En la mielitis aguda de un brote de esclerosis múltiple, la lesión ocupa normalmente 1-1,5 cuerpos vertebrales. En la NMO y la MOGAD las lesiones medulares son mucho más extensas y con más edema. La captación de gadolinio confirma el componente inflamatorio, y las lesiones periventriculares ovoideas apoyan la EM.","p":null},{"id":"Mielopatias_T17-7","b":"Mielopatias_T17","t":"T17","n":7,"q":"Mujer de 34 años con debilidad en las piernas, nivel sensitivo dorsal y retención urinaria de instauración subaguda. La RM no muestra compresión, pero sí una lesión medular que capta contraste. Refiere desde hace meses artralgias, fotosensibilidad y aftas orales. ¿Qué estudio es prioritario y qué enfermedad sistémica es la causa más frecuente de este cuadro?","o":["Estudio inmunológico; el lupus eritematoso sistémico.","Serologías de VIH y HTLV-1; la infección por retrovirus.","Angio-TC de aorta; la vasculitis de grandes vasos.","Niveles de B12 y cobre; un déficit carencial."],"a":0,"e":"Entre las mielitis agudas asociadas a enfermedades inflamatorias sistémicas, la que más frecuentemente las produce es el LES; otras son el Sjögren, el síndrome antifosfolípido, la esclerodermia y la sarcoidosis. En la práctica, toda mielopatía aguda de causa médica requiere un estudio inmunológico. El asedio diagnóstico también incluye LCR (citoquímica, serologías, citología, PCR de virus, bandas oligoclonales) y anticuerpos del espectro NMO y MOGAD.","p":null},{"id":"Mielopatias_T17-8","b":"Mielopatias_T17","t":"T17","n":8,"q":"Varón de 26 años con dolor lumbar irradiado a ambas piernas, retención urinaria y debilidad de las piernas de instauración subaguda. En la exploración se observan vesículas en la región genital. El LCR muestra pleocitosis linfocitaria. ¿Qué agente es el más probable?","o":["Virus varicela-zóster por reactivación.","Virus del herpes simple tipo 2.","Virus de Epstein-Barr en primoinfección.","Mycoplasma pneumoniae tras neumonía."],"a":1,"e":"Entre las mielitis infecciosas por herpesvirus, el VVZ es el más típico en general, pero el VHS-2 produce característicamente una mielorradiculitis asociada a herpes genital. En la práctica se solicitan serologías en sangre y LCR, y PCR de virus en el LCR. A veces es difícil distinguir la lesión directa por el virus (infecciosa) de la reacción inmunitaria frente a él (parainfecciosa).","p":null},{"id":"Mielopatias_T17-9","b":"Mielopatias_T17","t":"T17","n":9,"q":"Varón de 31 años que regresó hace 2 meses de un viaje a África subsahariana, donde se bañó en lagos de agua dulce. Presenta en pocas horas una mielopatía grave con paraparesia, dolor lumbar y retención urinaria. La RM no muestra compresión y el LCR es inflamatorio. ¿Qué etiología debe considerarse especialmente?","o":["Schistosoma mansoni (reacción granulomatosa).","Konzo, por el consumo de raíces que contienen cianuro.","Tabes dorsal por una sífilis adquirida en el viaje.","Paraparesia espástica tropical por el virus HTLV-1."],"a":0,"e":"Entre los parásitos que causan mielitis infecciosa está Schistosoma mansoni, que puede cursar con reacciones inflamatorias granulomatosas y producir un cuadro muy dramático en pocas horas; el baño en agua dulce en zona endémica es el antecedente típico. El konzo (raíces con cianuro, típico de África) es una mielopatía tóxica, no inflamatoria. La tabes y el HTLV-1 producen mielopatías crónicas.","p":null},{"id":"Mielopatias_T17-10","b":"Mielopatias_T17","t":"T17","n":10,"q":"Varón de 67 años con dolor cervical y parestesias en ambas manos de años de evolución, que en los últimos meses ha notado dificultad progresiva para caminar, caídas y urgencia miccional. Presenta atrofia leve de la musculatura intrínseca de las manos, hiporreflexia bicipital, hiperreflexia en las piernas y Babinski bilateral. Hace una semana empeoró bruscamente tras una caída. ¿Cuál es el diagnóstico más probable?","o":["Esclerosis lateral primaria de evolución rápida.","Esclerosis múltiple primariamente progresiva.","Mielopatía cervicoartrósica descompensada.","Paraparesia espástica familiar de inicio tardío."],"a":2,"e":"La mielopatía crónica se presenta como un trastorno de la marcha subagudo-crónico, con inestabilidad, caídas, debilidad y piramidalismo en ambas piernas y urgencia miccional. Es muy típico de la mielopatía cervicoartrósica: meses de dificultad para caminar con clínica radicular (aquí, signos de segunda motoneurona en los brazos) hasta que se alcanza un compromiso crítico y sobreviene un empeoramiento agudo. La combinación de paraparesia y radiculopatía orienta a causas compresivas.","p":null},{"id":"Mielopatias_T17-11","b":"Mielopatias_T17","t":"T17","n":11,"q":"Varón de 64 años con paraparesia progresiva de 2 años de evolución, que presenta episodios de empeoramiento brusco de la debilidad de las piernas al toser o al cambiar de postura, con recuperación parcial, 'como si fueran AIT medulares'. La RM muestra edema medular dorsal con vacíos de flujo perimedulares. ¿Qué prueba confirma el diagnóstico y qué tratamiento puede ofrecerse?","o":["Punción lumbar con bandas oligoclonales; corticoides en pulsos.","Determinación de B12; reposición parenteral.","Serología de HTLV-1; tratamiento antirretroviral.","Arteriografía medular; embolización por neurointervencionismo."],"a":3,"e":"Entre las mielopatías crónicas de causa vascular están las malformaciones arteriovenosas y la fístula dural. Su rasgo clínico típico es un curso progresivo con empeoramientos bruscos asociados a la tos o a la postura, que simulan 'AIT medulares'; el edema medular es congestivo. Pueden requerir arteriografía para el diagnóstico y en ocasiones se tratan mediante embolización por neurointervencionismo.","p":null},{"id":"Mielopatias_T17-12","b":"Mielopatias_T17","t":"T17","n":12,"q":"Mujer de 70 años con gastrectomía previa que presenta inestabilidad de la marcha y parestesias. En la exploración tiene paraparesia espástica con Babinski bilateral, abolición de los reflejos aquíleos y pérdida de la sensibilidad vibratoria y posicional en las piernas. La vitamina B12 sérica es de 85 pg/ml. ¿Cuál es el tratamiento indicado según los apuntes?","o":["B12 oral 1 mg/día durante 3 meses y suspender al normalizar los niveles.","B12 IM o SC diaria, luego semanal y después mensual de por vida, con fólico.","Ácido fólico en monoterapia, ya que corrige también la mielopatía.","Corticoides en pulsos por sospecha de mielitis aguda."],"a":1,"e":"Mielopatía combinada subaguda por déficit de B12: degeneración difusa de la sustancia blanca medular (cordones posteriores, haz corticoespinal y a veces espinotalámico), que combina mielopatía (paraparesia espástica, Babinski) y polineuropatía (arreflexia aquílea), una combinación rara y orientativa. Una B12 menor de 300 puede estar disminuida y una menor de 100 siempre está baja. Tratamiento: repleción parenteral con B12 IM o SC (1 mg/día durante 7-14 días, 1 mg/semana durante 1 mes y 1 mg/mes de por vida), ácido fólico 1-2 mg/día desde la segunda semana y rehabilitación.","p":null},{"id":"Mielopatias_T17-13","b":"Mielopatias_T17","t":"T17","n":13,"q":"Varón de 55 años, intervenido de bypass gástrico hace 6 años, con un cuadro progresivo de ataxia sensitiva, paraparesia espástica y Babinski bilateral, superponible a una mielopatía combinada subaguda. Los niveles de B12, ácido fólico y ácido metilmalónico son normales. ¿Qué déficit debe descartarse?","o":["Déficit de tiamina.","Déficit de vitamina D.","Déficit de cobre.","Déficit de piridoxina."],"a":2,"e":"Entre las causas tóxico-metabólicas de mielopatía crónica, además del déficit de B12, los apuntes incluyen el déficit de cobre y de vitamina E, que pueden producir un cuadro similar. En un paciente con malabsorción (cirugía bariátrica) y B12 normal, hay que pensar en ellos. Otros tóxicos medulares son el latirismo, el konzo y la siderosis meníngea.","p":null},{"id":"Mielopatias_T17-14","b":"Mielopatias_T17","t":"T17","n":14,"q":"Mujer de 48 años, natural de un área endémica del Caribe, con paraparesia espástica lentamente progresiva desde hace 3 años, urgencia miccional y leves alteraciones sensitivas en las piernas. La RM medular muestra atrofia dorsal sin lesiones focales. ¿Qué estudio orienta el diagnóstico?","o":["Anticuerpos anti-AQP4 en suero.","Arteriografía medular diagnóstica.","Niveles de cobre y de ceruloplasmina.","Serología de HTLV-1."],"a":3,"e":"El virus linfotrópico humano tipo 1 (HTLV-1) produce una paraparesia espástica tropical, a veces con clínica sensitiva, y puede ser difícil de distinguir de una ELA porque a veces afecta de forma selectiva a la segunda motoneurona. Ante una paraparesia espástica crónica, los apuntes señalan como causas la EM primariamente progresiva, el HTLV-1, las causas hereditarias y la esclerosis lateral primaria.","p":null},{"id":"Mielopatias_T17-15","b":"Mielopatias_T17","t":"T17","n":15,"q":"Varón de 41 años con infección por VIH no tratada que presenta de forma subaguda inestabilidad de la marcha que empeora a oscuras, parestesias y debilidad de las piernas. En la exploración tiene paraparesia con hiperreflexia, Babinski bilateral y pérdida de la sensibilidad vibratoria y posicional. ¿Cuál es el sustrato de esta mielopatía?","o":["Afectación selectiva de las astas anteriores de la médula.","Cavidad en el canal ependimario con déficit sensitivo suspendido.","Infarto en el territorio de la arteria espinal anterior.","Mielopatía posterolateral (cordones posteriores y haz lateral)."],"a":3,"e":"El VIH produce una mielopatía subaguda-crónica de predominio posterolateral, que afecta a los cordones posteriores y al haz espinotalámico lateral según los apuntes; clínicamente asocia piramidalismo, por lo que el haz corticoespinal lateral también está implicado. Es una de las causas de síndrome cordonal posterior, junto con el déficit de B12 y la tabes dorsal.","p":null},{"id":"Mielopatias_T17-16","b":"Mielopatias_T17","t":"T17","n":16,"q":"Varón de 35 años con quemaduras indoloras en ambas manos y antebrazos. En la exploración presenta pérdida de la sensibilidad dolorosa y térmica 'en esclavina' en hombros y brazos, con sensibilidad táctil fina y vibratoria conservada, atrofia de la musculatura intrínseca de las manos con arreflexia bicipital y un síndrome de Horner derecho. ¿Cuál es el diagnóstico más probable?","o":["Siringomielia cervical.","Esclerosis lateral amiotrófica.","Mielopatía combinada subaguda.","Síndrome de Brown-Séquard cervical."],"a":0,"e":"Siringomielia: alteración del desarrollo con una cavidad en el canal ependimario, que produce un déficit suspendido de la sensibilidad termoalgésica, porque lesiona las fibras espinotalámicas que se cruzan por delante del epéndimo. En su progresión puede afectar a las astas anteriores (atrofia y arreflexia), al simpático ascendente o a las astas intermediolaterales cervicales (Horner) y producir artropatía neuropática. La ELA no produce alteración sensitiva.","p":null},{"id":"Mielopatias_T17-17","b":"Mielopatias_T17","t":"T17","n":17,"q":"Mujer de 47 años con paraparesia espástica lentamente progresiva desde hace 4 años, sin episodios agudos, con urgencia miccional. La RM medular muestra lesiones cervicales cortas, sin compresión. ¿Qué estudios son los más adecuados a continuación?","o":["Arteriografía medular urgente para descartar una fístula dural.","Electromiograma como prueba diagnóstica principal del cuadro.","RM craneal y bandas oligoclonales en LCR (sospecha de EMPP).","Estudio genético de paraparesia espástica hereditaria de entrada."],"a":2,"e":"La EM, además de mielitis agudas en los brotes, puede producir una mielopatía crónica en la fase progresiva, desde el inicio si es primariamente progresiva o en la fase secundariamente progresiva. En el asedio de la mielopatía crónica se incluyen RM medular y craneal si se sospecha EM, y LCR con citoquímica, serologías, citología, PCR de virus y bandas oligoclonales. El EMG se reserva para cuando hay componente radicular o dudas topográficas.","p":null},{"id":"Mielopatias_T17-18","b":"Mielopatias_T17","t":"T17","n":18,"q":"En el asedio de una mielopatía crónica, el síndrome medular orienta hacia la causa. Señale la asociación CORRECTA según los apuntes:","o":["Síndrome cordonal posterior: déficit de B12, tabes dorsal y VIH.","Paraparesia con radiculopatía: esclerosis lateral primaria.","Paraparesia espástica pura: compresión espondilótica.","Síndrome cordonal posterior: HTLV-1 y paraparesia espástica familiar."],"a":0,"e":"Orientación sindrómica de las mielopatías crónicas: paraparesia espástica, EM primariamente progresiva, HTLV-1, causas hereditarias y esclerosis lateral primaria; paraparesia con radiculopatía, causas compresivas; síndrome cordonal posterior, déficit de B12, tabes y VIH. El tratamiento preferible es el causal.","p":null},{"id":"Mielopatias_T17-19","b":"Mielopatias_T17","t":"T17","n":19,"q":"Paciente con una mielopatía aguda no traumática en la que la RM descarta una compresión. ¿Qué dato del estudio diagnóstico permite diferenciar mejor una mielitis aguda de un infarto medular?","o":["La presencia de nivel sensitivo, que solo aparece en las mielitis.","La afectación esfinteriana, que no se produce en el infarto medular.","La edad, ya que el infarto medular no ocurre por debajo de los 60 años.","La confirmación de inflamación en la RM y/o en el LCR."],"a":3,"e":"Una vez descartada la compresión, el asedio debe diferenciar una causa inflamatoria de una vascular. Las causas inflamatorias muestran un LCR alterado o captación de contraste en la RM, y el diagnóstico de mielitis aguda exige confirmar el componente inflamatorio en la RM y/o en el LCR. En las no inflamatorias, entre las que la vascular es la más frecuente, el LCR no muestra inflamación. Ambas pueden dar nivel sensitivo y afectación esfinteriana.","p":null},{"id":"Mielopatias_T17-20","b":"Mielopatias_T17","t":"T17","n":20,"q":"Respecto a la terminología y el diagnóstico de las mielitis agudas, señale la afirmación CORRECTA:","o":["'Mielitis transversa' es el término preferido: la inflamación siempre ocupa todo el diámetro.","Se tiende a abandonar 'transversa', porque la inflamación suele ser parcial.","Sin una enfermedad asociada demostrada no puede diagnosticarse una mielitis aguda.","La mielitis tras una vacunación se considera infecciosa por lesión directa del agente."],"a":1,"e":"Las mielitis agudas se caracterizan por una afectación aguda, generalmente con un síndrome medular parcial. El término 'transversa' está en revisión y tiende a abandonarse porque la inflamación a menudo no afecta a todo el diámetro medular. Si hay evidencia de inflamación pero no de una enfermedad asociada, se habla de mielitis idiopática. La mielitis postvacunal es inmunomediada, no infecciosa.","p":null},{"id":"Mielopatias_T17-21","b":"Mielopatias_T17","t":"T17-A","n":21,"q":"Varón de 28 años con una herida por arma blanca en la región dorsal derecha. Presenta paresia de la pierna derecha con hiperreflexia y Babinski derechos, pérdida de la sensibilidad vibratoria y posicional en la pierna derecha, y pérdida de la sensibilidad dolorosa y térmica en la pierna izquierda por debajo de D10. ¿Cuál es el síndrome medular?","o":["Síndrome centromedular dorsal bajo.","Síndrome de la arteria espinal anterior.","Síndrome cordonal posterior bilateral.","Síndrome de Brown-Séquard derecho."],"a":3,"e":"En la hemisección medular, o síndrome de Brown-Séquard, hay afectación piramidal y cordonal posterior ipsilateral a la lesión (estas vías se decusan más arriba: el haz corticoespinal en el bulbo y el sistema lemniscal tras los núcleos de Goll y Burdach), y afectación de la sensibilidad termoalgésica en el lado contrario, porque el haz espinotalámico se cruza en la médula, cerca del nivel de entrada.","p":null},{"id":"Mielopatias_T17-22","b":"Mielopatias_T17","t":"T17-A","n":22,"q":"Una lesión medular cervical centrada en el epéndimo produce una pérdida de la sensibilidad dolorosa y térmica limitada a los segmentos afectados, con sensibilidad normal por encima y por debajo, y conservación de la vibratoria y la posicional. ¿Por qué?","o":["Porque se lesionan los cordones posteriores en todo su trayecto ascendente hacia el bulbo.","Porque se interrumpen las fibras espinotalámicas que se cruzan por delante del epéndimo.","Porque se lesiona el núcleo ventral posterolateral del tálamo contralateral.","Porque se lesionan las raíces posteriores antes de entrar en la médula espinal."],"a":1,"e":"En la vía espinotalámica, la neurona del asta posterior envía su axón a cruzar la línea media inmediatamente por delante del epéndimo para incorporarse al haz espinotalámico contralateral. Una lesión central (síndrome centromedular) interrumpe esas fibras solo en los segmentos afectados y produce un déficit suspendido de la sensibilidad táctil grosera, térmica y dolorosa. El sistema lemniscal, que asciende por los cordones posteriores, queda respetado.","p":null},{"id":"Mielopatias_T17-23","b":"Mielopatias_T17","t":"T17-A","n":23,"q":"Varón de 22 años que sufre una lesión medular dorsal completa en un accidente de tráfico. A las 6 horas presenta paraplejía flácida, arreflexia en las piernas y Babinski ausente. Señale la afirmación CORRECTA:","o":["Shock medular: fase flácida y arrefléxica, después hiperreflexia y espasticidad.","La flacidez indica afectación de segunda motoneurona y descarta la lesión medular.","La arreflexia sugiere una polirradiculoneuropatía asociada que debe estudiarse con EMG.","La espasticidad no llegará a aparecer nunca en una lesión medular completa."],"a":0,"e":"En una sección medular completa por causa aguda, los reflejos pueden pasar por una fase inicial de shock medular, caracterizada por parálisis flácida y arrefléxica, y tardar unos días en aparecer la hiperreflexia y la espasticidad. Por debajo del nivel hay déficit motor piramidal, pérdida de todas las modalidades sensitivas y afectación esfinteriana. En el nivel de la lesión puede haber signos de segunda motoneurona o radiculares.","p":null},{"id":"Mielopatias_T17-24","b":"Mielopatias_T17","t":"T17-A","n":24,"q":"Tras un traumatismo, un paciente presenta un nivel sensitivo a la altura del ombligo. ¿A qué nivel medular corresponde?","o":["T10.","T6.","T4.","L1."],"a":0,"e":"Puntos de referencia de los dermatomas: T4 en las mamilas y T10 en el ombligo. Los apuntes destacan también, por haber sido pregunta MIR, la numeración de las raíces: hay 8 cervicales, 12 dorsales, 5 lumbares y 5 sacras; las 7 primeras raíces cervicales salen por encima de su vértebra homónima, la C8 sale entre C7 y T1, y a partir de ahí cada raíz sale por debajo de su vértebra.","p":null},{"id":"Mielopatias_T17-25","b":"Mielopatias_T17","t":"T17-A","n":25,"q":"Respecto a la salida de las raíces nerviosas raquídeas, señale la afirmación CORRECTA:","o":["Todas las raíces salen por debajo de su vértebra homónima.","C8 sale entre C7 y T1; después, por debajo de su vértebra.","Existen 7 raíces cervicales, una por cada vértebra cervical.","La raíz T1 sale entre las vértebras C7 y T1, por encima de T1."],"a":1,"e":"Hay 8 raíces cervicales y solo 7 vértebras cervicales: las raíces C1-C7 salen por encima de su vértebra homónima, la C8 sale entre C7 y T1, y a partir de ahí cada raíz sale por debajo de su vértebra correspondiente (T1 entre T1 y T2). Los apuntes señalan que ha sido pregunta MIR.","p":null},{"id":"Mielopatias_T17-26","b":"Mielopatias_T17","t":"T17-A","n":26,"q":"Varón de 30 años con una lesión medular completa a nivel C2 tras una zambullida. Además de la tetraplejía, ¿qué es esperable?","o":["Respiración espontánea conservada gracias a la musculatura intercostal.","Afectación motora limitada a las extremidades superiores.","Conservación de la función esfinteriana y sexual.","Afectación de la musculatura respiratoria: asistencia ventilatoria."],"a":3,"e":"En las lesiones medulares completas por encima de C4 se produce una pentaplejía: además de las cuatro extremidades se afecta la musculatura respiratoria (el diafragma está inervado por el nervio frénico, C3-C5), por lo que el paciente necesita asistencia ventilatoria. Por debajo del nivel hay afectación de todas las modalidades sensitivas y esfinteriana.","p":null},{"id":"Mielopatias_T17-27","b":"Mielopatias_T17","t":"T17-A","n":27,"q":"Varón de 52 años con anestesia en silla de montar, retención urinaria e impotencia de instauración precoz, sin dolor radicular significativo y con fuerza conservada en las piernas. ¿Cuál es la localización más probable de la lesión?","o":["Cono medular.","Cauda equina por hernia discal lumbar.","Médula dorsal alta.","Raíces L4-L5 bilaterales."],"a":0,"e":"El cono medular es la parte final de la médula: su afectación suele dar anestesia en silla de montar, afectación esfinteriana y una disfunción eréctil muy marcada desde el inicio, y no suele haber clínica radicular (o aparece más tarde y menos florida). En la cauda equina predominan la clínica radicular y el dolor (radiculalgia), y la afectación esfinteriana aparece en la evolución; su causa más frecuente es la artropatía lumbosacra compresiva.","p":null},{"id":"Mielopatias_T17-28","b":"Mielopatias_T17","t":"T17-A","n":28,"q":"Varón de 46 años con dolor lumbar intenso irradiado por la cara posterior de ambas piernas, debilidad asimétrica de las piernas con arreflexia aquílea e hipoestesia en varios dermatomas lumbosacros. Días después aparece retención urinaria. ¿Cuál es la localización más probable y su causa más frecuente?","o":["Cono medular por un tumor intramedular.","Médula dorsal baja por una mielitis aguda.","Cauda equina, por artropatía lumbosacra.","Asta anterior por esclerosis lateral amiotrófica."],"a":2,"e":"El síndrome de cauda equina se produce sobre todo por causas compresivas articulares (la más frecuente es la artropatía lumbosacra), aunque también por polirradiculitis inflamatorias o infecciosas. Predominan la clínica radicular y el dolor irradiado, con signos de segunda motoneurona (arreflexia) y afectación esfinteriana en la evolución. En el cono, la clínica esfinteriana y sexual es precoz y la radicular, escasa.","p":null},{"id":"Mielopatias_T17-29","b":"Mielopatias_T17","t":"T17-A","n":29,"q":"Respecto al control autonómico de la micción y la función sexual, señale la afirmación CORRECTA:","o":["Durante el llenado vesical, el parasimpático sacro contrae el detrusor.","La erección depende principalmente del simpático toracolumbar.","En el vaciado, el centro pontino activa el parasimpático sacro y relaja el esfínter.","El esfínter urinario externo recibe inervación parasimpática por los nervios pélvicos."],"a":2,"e":"Llenado: el simpático (T11-L2, nervio hipogástrico) relaja el detrusor y contrae el cuello vesical, y el sistema somático (núcleo de Onuf, S2-S4, nervio pudendo) contrae el esfínter externo. Vaciado: el centro pontino de la micción activa el parasimpático sacro, que contrae el detrusor, e inhibe el esfínter. La erección depende del parasimpático sacro, la emisión del simpático toracolumbar y la expulsión de la vía somática pudenda. Como las vías descendentes viajan por el cordón lateral, pequeñas lesiones medulares producen disfunción vesical precoz.","p":null},{"id":"Mielopatias_T17-30","b":"Mielopatias_T17","t":"T17-A","n":30,"q":"En la exploración de un paciente con debilidad en el brazo derecho se observan atrofia muscular marcada, flacidez, hiporreflexia y pequeñas contracciones breves y arrítmicas visibles bajo la piel que no producen movimiento. ¿Qué indican estos hallazgos?","o":["Un síndrome de primera motoneurona, en el que la atrofia es característicamente intensa y precoz.","Un síndrome de segunda motoneurona con fasciculaciones, signo de denervación activa.","Una lesión del haz corticoespinal en la cápsula interna.","Una lesión del sistema lemniscal con ataxia sensitiva."],"a":1,"e":"Síndrome de segunda motoneurona: paresia con hipotonía (flacidez) e hiporreflexia, por interrupción del arco miotático en su vertiente eferente, y atrofia muscular importante, mucho más marcada que en la lesión de primera motoneurona, en la que la atrofia es moderada y por desuso. Cuando se lesionan los cuerpos neuronales aparecen fasciculaciones, que traducen la despolarización espontánea de fibras musculares (denervación activa). La primera motoneurona produce espasticidad, hiperreflexia y Babinski.","p":null},{"id":"Miopatias_T21-1","b":"Miopatias_T21","t":"T21","n":1,"q":"Niño de 4 años que empezó a caminar a los 20 meses, se cae con frecuencia y tiene dificultad para subir escaleras. Camina con marcha anadeante e hiperlordosis lumbar y, para levantarse del suelo, trepa apoyando las manos sobre sus propias piernas. Las pantorrillas son voluminosas y firmes. La CPK es de 18.000 UI/l. Un tío materno falleció joven por una enfermedad muscular. ¿Cuál es el diagnóstico más probable?","o":["Distrofia muscular de Becker, por déficit parcial de distrofina de herencia autosómica dominante.","Distrofia facioescapulohumeral, por delección del segmento D4Z4.","Distrofia muscular de Duchenne, por déficit total de distrofina ligado al X.","Enfermedad de Pompe, por déficit de maltasa ácida de herencia recesiva."],"a":2,"e":"Distrofia de Duchenne: mutación del gen de la distrofina con déficit total (en la de Becker el déficit es parcial, con menor gravedad e inicio más tardío). La herencia es recesiva ligada al X: las mujeres son portadoras asintomáticas y los varones están afectados (de ahí el tío materno). Comienza hacia los 3-5 años con retraso de la marcha, debilidad glútea y proximal (marcha anserina), signo de Gowers, pseudohipertrofia de pantorrillas, hiperlordosis y, a veces, retraso intelectual. La CPK, la GOT y la GPT están elevadas desde el nacimiento. En la biopsia hay ausencia de distrofina y un patrón distrófico. Lo más peligroso es la afectación cardiaca y respiratoria, por lo que el seguimiento cardiológico y neumológico es fundamental.","p":null},{"id":"Miopatias_T21-2","b":"Miopatias_T21","t":"T21","n":2,"q":"Niño de 2 años en el que, en una analítica por un cuadro febril, se detectan GOT de 210 UI/l y GPT de 260 UI/l. Está asintomático, aunque sus padres refieren que se cae mucho al correr. Es remitido a Digestivo para estudio de hepatopatía. ¿Cuál es la prueba inicial más rentable?","o":["Ecografía abdominal y serologías de virus hepatotropos.","Biopsia hepática percutánea para estudio histológico.","Estudio de autoinmunidad hepática (ANA, antimúsculo liso, anti-LKM).","Determinación de CPK para descartar un origen muscular."],"a":3,"e":"Los apuntes señalan que en las distrofinopatías, además de la CPK, se elevan la GOT y la GPT, y que esto ocurre prácticamente desde el nacimiento. Las
