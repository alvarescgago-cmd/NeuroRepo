<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neurología · Test</title>
<meta name="description" content="Banco interactivo de preguntas tipo test de Neurología: modo aleatorio de 25 preguntas y modo por tema, con corrección inmediata o final.">
<meta name="theme-color" content="#0f3d5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f3d5c'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f8fafc; --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f172a; --text-2:#475569; --text-3:#64748b;
  --accent:#0f5f8c; --accent-strong:#0b4a6f; --accent-soft:#e6f1f8; --on-accent:#ffffff;
  --ok:#15803d; --ok-soft:#e8f6ec; --ok-border:#86d19c;
  --ko:#c0262d; --ko-soft:#fdecec; --ko-border:#f2a3a6;
  --warn:#a16207; --warn-soft:#fdf5e1;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
  --radius:14px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#121b2b; --surface-2:#172235; --border:#24324a; --border-strong:#33445f;
    --text:#e5ecf5; --text-2:#a9b6c8; --text-3:#8394aa;
    --accent:#4fa8dc; --accent-strong:#7cc0e8; --accent-soft:#16304a; --on-accent:#06121e;
    --ok:#4ade80; --ok-soft:#10301f; --ok-border:#22693f;
    --ko:#f87171; --ko-soft:#3a1618; --ko-border:#7f2a2e;
    --warn:#fbbf24; --warn-soft:#33270b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#121b2b; --surface-2:#172235; --border:#24324a; --border-strong:#33445f;
  --text:#e5ecf5; --text-2:#a9b6c8; --text-3:#8394aa;
  --accent:#4fa8dc; --accent-strong:#7cc0e8; --accent-soft:#16304a; --on-accent:#06121e;
  --ok:#4ade80; --ok-soft:#10301f; --ok-border:#22693f;
  --ko:#f87171; --ko-soft:#3a1618; --ko-border:#7f2a2e;
  --warn:#fbbf24; --warn-soft:#33270b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button,summary,label,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
[hidden]{display:none !important}

/* Header */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:16px}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-txt b{font-size:15px;font-weight:700}
.brand-txt span{font-size:12px;color:var(--text-3)}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text-2)}
.icon-btn svg{width:18px;height:18px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:15px;color:var(--text);transition:background .15s,border-color .15s,transform .05s;text-decoration:none;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:9px}
.btn svg{width:16px;height:16px;flex:none}

/* Home */
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--text-2)}
.chip b{color:var(--text);font-weight:600}
.banner{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--radius);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.banner-txt{flex:1;min-width:200px;font-size:14px}
.banner-txt b{display:block;font-size:15px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0 8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.mode{padding:20px;display:flex;flex-direction:column;gap:10px}
.mode-ico{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mode-ico svg{width:22px;height:22px}
.mode h2{margin:2px 0 0;font-size:19px;letter-spacing:-.01em}
.mode p{margin:0;color:var(--text-2);font-size:14.5px;flex:1}
.mode .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);cursor:pointer;user-select:none}
.check input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px}
.section-title h2{margin:0;font-size:20px;letter-spacing:-.01em}
.section-title span{color:var(--text-3);font-size:14px}
.blocks{display:flex;flex-direction:column;gap:12px}
.block{overflow:hidden}
.block-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.block-head h3{margin:0;font-size:16px;flex:1;min-width:0}
.block-head h3 small{display:block;font-weight:500;color:var(--text-3);font-size:13px;margin-top:1px}
.tema{width:100%;display:flex;align-items:center;gap:14px;padding:13px 16px;border:0;border-top:1px solid var(--border);background:transparent;text-align:left;transition:background .12s}
.tema:first-of-type{border-top:0}
.tema-code{flex:none;min-width:54px;padding:4px 0;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-weight:700;font-size:13px;text-align:center;color:var(--accent-strong)}
.tema-body{flex:1;min-width:0}
.tema-name{font-weight:600;font-size:15px;line-height:1.35}
.tema-meta{font-size:13px;color:var(--text-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.meter{display:inline-block;width:70px;height:6px;border-radius:99px;background:var(--border);overflow:hidden;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--ok)}
.tema-go{flex:none;color:var(--text-3)}
.tema-go svg{width:18px;height:18px;display:block}
.foot{margin:34px 0 40px;padding-top:18px;border-top:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--text-3);font-size:13px}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface)}

/* Quiz */
.qhead{padding:18px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead-title{flex:1;min-width:0}
.qhead-title .eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.qhead-title h2{margin:2px 0 0;font-size:18px;line-height:1.3;letter-spacing:-.01em}
.progress{height:6px;border-radius:99px;background:var(--border);overflow:hidden;margin-bottom:8px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.progress-txt{display:flex;justify-content:space-between;font-size:13px;color:var(--text-3);margin-bottom:14px;gap:10px;flex-wrap:wrap}
.qcard{padding:22px}
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:7px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-strong)}
.tag-muted{background:var(--surface-2);color:var(--text-3);border:1px solid var(--border)}
.qnum{font-weight:700;font-size:14px;color:var(--text-3)}
.ctx{margin:0 0 14px;border:1px dashed var(--border-strong);border-radius:11px;background:var(--surface-2)}
.ctx summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--text-2);list-style:none;display:flex;align-items:center;gap:8px}
.ctx summary::-webkit-details-marker{display:none}
.ctx summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none}
.ctx[open] summary::before{transform:rotate(45deg)}
.ctx div{padding:0 14px 12px;font-size:14.5px;color:var(--text-2)}
.stem{font-size:17px;line-height:1.6;margin:0 0 18px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);text-align:left;line-height:1.5;font-size:15.5px;transition:border-color .12s,background .12s}
.opt:disabled{cursor:default}
.opt .L{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text-2);margin-top:-1px}
.opt .T{flex:1;padding-top:1px}
.opt .M{flex:none;width:22px;height:22px;margin-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)}
.opt.ko .L{background:var(--ko);border-color:var(--ko);color:#fff}
.opt.dim{opacity:.62}
:root[data-theme="dark"] .opt.ok .L,:root[data-theme="dark"] .opt.ko .L{color:#06121e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.ok .L,:root:not([data-theme="light"]) .opt.ko .L{color:#06121e}}
.fb{margin-top:18px;border-radius:12px;padding:15px 16px;border:1px solid var(--border);background:var(--surface-2)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok-border)}
.fb.ko{background:var(--ko-soft);border-color:var(--ko-border)}
.fb.blank{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.fb-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px;margin-bottom:6px}
.fb.ok .fb-head{color:var(--ok)} .fb.ko .fb-head{color:var(--ko)} .fb.blank .fb-head{color:var(--warn)}
.fb-head svg{width:20px;height:20px;flex:none}
.fb-ans{font-size:14.5px;font-weight:600;margin-bottom:6px}
.fb-exp{font-size:15px;line-height:1.62;color:var(--text)}
.qactions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.qactions .grow{flex:1}
.lbl-short{display:none}
.navgrid-wrap{margin:16px 0 0;padding:16px}
.navgrid-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.navgrid-head b{font-size:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--border-strong);background:var(--surface)}
.legend i.a{background:var(--accent-soft);border-color:var(--accent)}
.legend i.o{background:var(--ok);border-color:var(--ok)}
.legend i.k{background:var(--ko);border-color:var(--ko)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
.nv{height:38px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:14px;color:var(--text-2)}
.nv.a{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.nv.o{background:var(--ok);border-color:var(--ok);color:#fff}
.nv.k{background:var(--ko);border-color:var(--ko);color:#fff}
.nv.cur{outline:2.5px solid var(--text);outline-offset:1px}
:root[data-theme="dark"] .nv.o,:root[data-theme="dark"] .nv.k{color:#06121e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nv.o,:root:not([data-theme="light"]) .nv.k{color:#06121e}}
.hint{font-size:12.5px;color:var(--text-3);margin:14px 0 40px;text-align:center}

/* Results */
.res-hero{padding:22px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-top:18px}
.ring{--p:0;width:128px;height:128px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--border) 0);display:grid;place-items:center}
.ring>div{width:100px;height:100px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-size:28px;letter-spacing:-.02em;line-height:1}
.ring span{display:block;font-size:12px;color:var(--text-3);margin-top:3px}
.res-hero h2{margin:0 0 4px;font-size:21px;letter-spacing:-.01em}
.res-hero p{margin:0 0 14px;color:var(--text-2);font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:10px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border)}
.stat b{display:block;font-size:22px;line-height:1.1;letter-spacing:-.01em}
.stat span{font-size:12.5px;color:var(--text-3)}
.stat.o b{color:var(--ok)} .stat.k b{color:var(--ko)} .stat.w b{color:var(--warn)}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0}
.breakdown{margin-top:16px;padding:6px 0}
.bd-row{display:grid;grid-template-columns:62px 1fr 120px 64px;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--border);font-size:14px}
.bd-row:first-child{border-top:0}
.bd-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.bd-row .bar{height:7px;border-radius:99px;background:var(--border);overflow:hidden;display:flex}
.bd-row .bar i{display:block;height:100%}
.bd-row .num{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 12px}
.tab{padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:600;color:var(--text-2)}
.tab.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.tab span{opacity:.7;font-weight:500;margin-left:3px}
.review{display:flex;flex-direction:column;gap:12px;margin-bottom:40px}
.rv{padding:18px}
.rv .stem{font-size:15.5px;margin-bottom:12px}
.rv .opt{padding:10px 12px;font-size:14.5px}
.rv .opt .L{width:25px;height:25px;font-size:13px}
.rv .fb{margin-top:12px}
.rv .fb-exp{font-size:14.5px}
.empty{padding:26px;text-align:center;color:var(--text-3)}

@media (hover:hover){
  .icon-btn:hover{border-color:var(--border-strong);color:var(--text)}
  .btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-strong)}
  .btn-primary:hover:not(:disabled){background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
  .btn-ghost:hover:not(:disabled){background:var(--surface-2);border-color:var(--border);color:var(--text)}
  .tema:hover{background:var(--accent-soft)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
  .nv:hover{border-color:var(--accent)}
}
.tema:active{background:var(--accent-soft)}
.opt:active:not(:disabled){border-color:var(--accent)}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(2,8,20,.55);display:grid;place-items:center;padding:16px}
.modal-box{width:100%;max-width:440px;padding:22px}
.modal-box h3{margin:0 0 8px;font-size:18px}
.modal-box p{margin:0 0 18px;color:var(--text-2);font-size:15px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow)}

@media (max-width:680px){
  .modes{grid-template-columns:1fr}
  .qcard{padding:16px}
  .stem{font-size:16px}
  .opt{font-size:15px;padding:12px}
  .res-hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .stats{grid-template-columns:repeat(2,1fr);width:100%}
  .res-hero .res-actions{justify-content:center}
  .bd-row{grid-template-columns:54px 1fr 58px;gap:10px;padding:9px 12px}
  .bd-row .bar{grid-column:1 / -1;order:4}
  .brand-txt span{display:none}
  .block-head{flex-wrap:wrap}
  .hero{padding-top:22px}
  .mode{padding:18px}
  .tema{padding:13px 14px;gap:12px}
  .tema-code{min-width:50px}
  .foot .keys{display:none}
  /* Examen: cabecera compacta fija arriba y botones fijos abajo */
  body.in-quiz .topbar{position:static}
  .qsticky{position:sticky;top:0;z-index:15;margin:0 -16px;padding:10px 16px 9px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
  .qhead{padding:0;flex-wrap:nowrap;gap:8px}
  .qhead-title{flex:1 1 auto}
  .qhead-title .eyebrow{display:none}
  .qhead-title h2{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qhead .btn{flex:none}
  .qhead [data-act="exit"]{order:-1;width:36px;min-height:36px;padding:0;margin-left:-4px;border:1px solid var(--border);background:var(--surface)}
  .qhead [data-act="exit"] svg{width:18px;height:18px}
  .qhead .lbl{display:none}
  .progress{margin:9px 0 6px;height:5px}
  .progress-txt{margin:0;font-size:12.5px}
  .qcard{margin-top:12px}
  .qtop{margin-bottom:10px}
  .qtop .tag-muted{flex-basis:100%;background:none;border:0;padding:0;font-weight:500;font-size:13px;line-height:1.35}
  .ctx div{font-size:14px}
  .stem{line-height:1.55;margin-bottom:16px}
  .fb{padding:14px}
  .fb-exp{font-size:15px;line-height:1.6}

<script>
"use strict";
const DATA = {"blocks":[{"id":"Ictus_T01-T03","name":"Patología cerebrovascular","range":"T01-T03","sections":[{"code":"T01","name":"Patología cerebrovascular I"},{"code":"T02","name":"Patología cerebrovascular II"},{"code":"T03","name":"Patología cerebrovascular III"}],"count":30},{"id":"Epilepsia_T04-T05","name":"Epilepsia","range":"T04-T05","sections":[{"code":"T04","name":"Epilepsia I: Concepto, clasificación, síndromes y etiología"},{"code":"T05","name":"Epilepsia II: Diagnóstico, tratamiento y situaciones especiales"}],"count":20},{"id":"Cefaleas_T06-T07","name":"Cefaleas","range":"T06-T07","sections":[{"code":"T06","name":"Cefaleas I: Generalidades y migraña"},{"code":"T07","name":"Cefaleas II: Otras cefaleas primarias, neuralgias y cefaleas secundarias"}],"count":20},{"id":"Desmielinizantes_T08-T09","name":"Patología desmielinizante","range":"T08-T09","sections":[{"code":"T08","name":"Esclerosis múltiple"},{"code":"T09","name":"NMOSD, MOGAD y ADEM"}],"count":30},{"id":"Infecciones_SN_T10-T11","name":"Infecciones del sistema nervioso","range":"T10-T11","sections":[{"code":"T10","name":"Meningitis bacteriana aguda y meningitis aguda aséptica"},{"code":"T11","name":"Meningitis crónicas y recurrentes, encefalitis agudas, virus lentos y priones"}],"count":40},{"id":"Demencias_T12-T13","name":"Demencias","range":"T12-T13","sections":[{"code":"T12","name":"Demencias I: concepto, diagnóstico y enfermedad de Alzheimer"},{"code":"T13","name":"Demencias II: vascular, cuerpos de Lewy, frontotemporal e hidrocefalia"}],"count":30},{"id":"Parkinson_T14","name":"Enfermedad de Parkinson y parkinsonismos","range":"T14","sections":[{"code":"T14","name":"Enfermedad de Parkinson y otros parkinsonismos"}],"count":15},{"id":"Hipercineticos_T15","name":"Trastornos hipercinéticos","range":"T15","sections":[{"code":"T15","name":"Trastornos hipercinéticos y otros trastornos del movimiento"}],"count":15},{"id":"Heredoataxias_T16","name":"Heredoataxias","range":"T16","sections":[{"code":"T16","name":"Heredoataxias, atrofia multisistémica y paraparesias familiares"}],"count":15},{"id":"Mielopatias_T17","name":"Mielopatías","range":"T17 y anexo","sections":[{"code":"T17","name":"Mielopatías agudas, subagudas y crónicas"},{"code":"T17-A","name":"Anexo: repaso anatomofuncional y síndromes medulares"}],"count":30},{"id":"Motoneurona_T18","name":"Enfermedades de motoneurona","range":"T18","sections":[{"code":"T18","name":"Enfermedades de motoneurona y esclerosis lateral amiotrófica"}],"count":15},{"id":"Neuropatias_T19-T20","name":"Neuropatías periféricas","range":"T19-T20","sections":[{"code":"T19","name":"Pares craneales, mononeuropatías, mononeuritis múltiple y plexopatías"},{"code":"T20","name":"Guillain-Barré, neuropatía motora multifocal y polineuropatías"}],"count":30},{"id":"Miopatias_T21","name":"Miopatías","range":"T21","sections":[{"code":"T21","name":"Distrofias, síndromes miotónicos, miopatías inflamatorias, metabólicas, tóxicas y congénitas"}],"count":15},{"id":"Miastenia_T22","name":"Enfermedades de la unión neuromuscular","range":"T22","sections":[{"code":"T22","name":"Miastenia gravis, síndrome de Eaton-Lambert y botulismo"}],"count":15},{"id":"Encefalopatias_T23","name":"Encefalopatías tóxico-metabólicas","range":"T23","sections":[{"code":"T23","name":"Coma y encefalopatías tóxico-metabólicas"}],"count":20}],"questions":[{"id":"Cefaleas_T06-T07-1","b":"Cefaleas_T06-T07","t":"T06","n":1,"q":"Mujer de 26 años con episodios de cefalea desde hace 4 años, unos 2 al mes. Son hemicraneales, alternando de lado, pulsátiles, de intensidad moderada-grave, duran unas 12 horas, empeoran al subir escaleras y se acompañan de náuseas y fotofobia; mejoran si consigue dormir. La exploración neurológica es normal. ¿Cuál es la actitud más adecuada?","o":["Solicitar una RM cerebral para confirmar el diagnóstico de migraña antes de iniciar tratamiento.","Diagnosticar migraña sin aura e iniciar el tratamiento, sin pruebas complementarias.","Realizar una TC craneal urgente, ya que el dolor intenso con náuseas es un signo de alarma.","Solicitar un EEG, porque la alternancia del lado del dolor obliga a descartar crisis epilépticas."],"a":1,"e":"Cumple los criterios de migraña: al menos 5 crisis de 4-72 h, con al menos dos de cuatro características (unilateral, pulsátil, moderada-grave, empeora con la actividad física) y al menos uno de náuseas/vómitos o foto-fonofobia. Cuando la historia es sugerente de cefalea primaria y cumple criterios, con exploración normal, se hace un diagnóstico positivo sin pruebas. La clave es la anamnesis. La alternancia de lado tranquiliza; la unilateralidad estricta sería un signo de alarma.","p":null},{"id":"Cefaleas_T06-T07-2","b":"Cefaleas_T06-T07","t":"T06","n":2,"q":"Mujer de 31 años, migrañosa conocida, que describe que antes de algunas crisis nota destellos en zigzag en el campo visual derecho que se extienden lentamente; a los 20 minutos aparece hormigueo en la mano derecha que asciende hacia la cara y, después, dificultad para encontrar palabras. Todo cede en unos 40 minutos y comienza la cefalea. ¿Qué explica la secuencia de síntomas?","o":["Una isquemia transitoria en el territorio de la ACM izquierda por vasoespasmo.","La activación del arco reflejo trigémino-facial a través del ganglio esfenopalatino.","Una depresión cortical propagada que se desplaza en sentido postero-anterior desde la corteza occipital.","Una descarga epiléptica focal occipital con propagación rápida a la corteza frontal."],"a":2,"e":"El sustrato del aura es la depresión cortical propagada: onda de despolarización neuronal y glial que se inicia en la corteza occipital y avanza en sentido postero-anterior, con hiperemia breve seguida de hipoperfusión. Por eso los síntomas siguen el orden visual (occipital), sensitivo (parietal) y lenguaje con disfasia no fluente (frontal). Son síntomas positivos, de instauración progresiva y de 5-60 minutos; la progresión lenta y en marcha la distingue de la isquemia (brusca) y de la crisis epiléptica (rápida). El reflejo trigémino-facial corresponde a las cefaleas trigémino-autonómicas.","p":null},{"id":"Cefaleas_T06-T07-3","b":"Cefaleas_T06-T07","t":"T06","n":3,"q":"Varón de 47 años, sin antecedentes de cefalea, que acude a Urgencias por pérdida de visión en el hemicampo izquierdo y torpeza en la mano izquierda de 25 minutos de evolución, seguidas de cefalea leve. Su hermana tiene migraña con aura. ¿Cuál es la actitud más adecuada?","o":["Manejarlo como un posible ictus, con activación del protocolo correspondiente.","Diagnosticar un primer episodio de migraña con aura dados los antecedentes familiares y pautar un triptán.","Dar el alta con AINE y revisión en consulta de Neurología si el episodio se repite.","Iniciar tratamiento preventivo con lamotrigina, indicada en la migraña con aura."],"a":0,"e":"Un primer episodio de aura migrañosa, sobre todo si es atípica, debe manejarse en Urgencias como un posible ictus. Es mucho más tranquilizador un paciente con varios episodios que ya cumple los criterios diagnósticos. Además, el primer episodio de migraña con aura y las auras atípicas figuran entre los signos de alarma de cefalea secundaria. El déficit motor y el debut a los 47 años aumentan la sospecha.","p":null},{"id":"Cefaleas_T06-T07-4","b":"Cefaleas_T06-T07","t":"T06","n":4,"q":"Mujer de 38 años, migrañosa desde la adolescencia, que en los últimos 6 meses presenta cefalea 18 días al mes, de características migrañosas en 10 de ellos. Toma ibuprofeno casi a diario. Tiene obesidad y un trastorno de ansiedad. ¿Cuál es el diagnóstico y qué factor de riesgo de cronificación NO es modificable?","o":["Migraña episódica de alta frecuencia; el uso excesivo de medicación sintomática.","Migraña crónica; la obesidad.","Cefalea tensional crónica; el trastorno de ansiedad.","Migraña crónica; el sexo femenino."],"a":3,"e":"Migraña crónica: más de 3 meses con al menos 15 días de cefalea al mes, de los cuales al menos 8 con características migrañosas (la episódica tiene menos de 15 días al mes). Cada año se cronifica alrededor del 2,5 % de los migrañosos. Factores no modificables: sexo femenino, raza caucásica, factores genéticos y bajo nivel socioeconómico-cultural. Modificables: trastornos del ánimo, obesidad, uso excesivo de medicación sintomática, trastornos del sueño y otras causas de dolor crónico.","p":null},{"id":"Cefaleas_T06-T07-5","b":"Cefaleas_T06-T07","t":"T06","n":5,"q":"Varón de 55 años con migraña sin aura desde la juventud. Sufrió un infarto agudo de miocardio hace 2 años y toma AAS, bisoprolol y atorvastatina. Consulta porque el paracetamol no le alivia las crisis, que se acompañan de náuseas intensas. ¿Cuál es el tratamiento sintomático más adecuado?","o":["Rizatriptán bucodispersable, por su absorción lingual en caso de náuseas.","Codeína asociada a paracetamol, por su mayor potencia analgésica.","Naproxeno de forma precoz asociado a metoclopramida.","Ergotamina, al producir menos vasoconstricción coronaria que los triptanes."],"a":2,"e":"Los triptanes son de primera elección, pero están contraindicados en la cardiopatía isquémica, la HTA no controlada y el ictus reciente. Los ergóticos producen más vasoconstricción coronaria que los triptanes (D). No hay ninguna indicación de opiáceos en el tratamiento sintomático de las cefaleas (B). La opción es un AINE a dosis adecuada y de forma precoz, asociando un antiemético (metoclopramida 10 mg o domperidona). El paracetamol es poco eficaz en adultos.","p":null},{"id":"Cefaleas_T06-T07-6","b":"Cefaleas_T06-T07","t":"T06","n":6,"q":"Mujer de 29 años con migraña cuyas crisis comienzan con vómitos precoces e intensos, por lo que vomita los comprimidos de triptán. ¿Qué alternativa es la más adecuada?","o":["Sumatriptán por vía subcutánea o intranasal.","Frovatriptán oral, por su mejor tolerancia digestiva.","Naratriptán oral asociado a paracetamol.","Paracetamol intravenoso en Urgencias en cada crisis."],"a":0,"e":"Si hay náuseas precoces o dificultad para la vía oral, se cambia la vía del triptán: intranasal (sumatriptán, zolmitriptán), absorción lingual (rizatriptán, zolmitriptán) o subcutánea (sumatriptán). Frovatriptán y naratriptán son triptanes orales de acción lenta: menos eficaces, mejor tolerados y con menos recidivas, pero no resuelven el problema de la vía. El paracetamol es poco eficaz en la migraña del adulto.","p":null},{"id":"Cefaleas_T06-T07-7","b":"Cefaleas_T06-T07","t":"T06","n":7,"q":"Mujer de 34 años con migraña crónica, sin deseo gestacional y con buena tolerancia a fármacos. Su IMC es de 31. ¿Cuál es el tratamiento preventivo oral de primera elección?","o":["Ácido valproico, por su eficacia demostrada tanto en epilepsia como en migraña.","Flunarizina, por ser el único calcioantagonista indicado en migraña.","Toxina botulínica, por ser el tratamiento de elección en la migraña crónica.","Topiramato, con el máximo grado de recomendación en la migraña crónica."],"a":3,"e":"El topiramato es el único preventivo oral con el máximo grado de recomendación en la migraña crónica; en esta paciente, además, la flunarizina tendería a aumentar el peso. El valproato apenas se usa y no se recomienda en mujeres en edad fértil por su teratogenia (A). La toxina botulínica se reserva para la migraña crónica que no ha respondido o no ha tolerado dos preventivos orales, siendo uno de ellos el topiramato (C). El preventivo se da en monoterapia, con escalada progresiva y durante al menos 3 meses.","p":null},{"id":"Cefaleas_T06-T07-8","b":"Cefaleas_T06-T07","t":"T06","n":8,"q":"Mujer de 30 años, embarazada de 14 semanas, con migraña con crisis frecuentes e incapacitantes. ¿Qué opción preventiva recogen los apuntes como más adecuada en el embarazo?","o":["Topiramato a dosis bajas, con escalada lenta y control ecográfico.","Magnesio y, si es preciso, bloqueos con lidocaína.","Ácido valproico de liberación prolongada.","Anticuerpos monoclonales frente al CGRP, por su mejor tolerancia."],"a":1,"e":"Entre los 'otros preventivos', el magnesio se usa sobre todo en el embarazo, y los bloqueos anestésicos con lidocaína son seguros en el embarazo. La riboflavina se usa sobre todo en niños. El valproato no se recomienda en mujeres en edad fértil por su teratogenia, y en la gestación debe evitarse también el topiramato.","p":null},{"id":"Cefaleas_T06-T07-9","b":"Cefaleas_T06-T07","t":"T06","n":9,"q":"Mujer de 44 años con migraña crónica que no ha respondido a topiramato, a propranolol ni a amitriptilina, y que tampoco ha mejorado tras dos sesiones de toxina botulínica (una de ellas con 195 U). Según las recomendaciones de los apuntes, ¿cuál es el siguiente paso?","o":["Anticuerpos monoclonales frente al CGRP (erenumab, galcanezumab…).","Asociar un opiáceo de liberación prolongada como rescate.","Clasificarla ya como migraña crónica refractaria y plantear neuromodulación invasiva.","Repetir el topiramato a dosis más altas, ya que es el único preventivo con máxima recomendación."],"a":0,"e":"Los anticuerpos monoclonales anti-CGRP (erenumab, galcanezumab, fremanezumab y eptinezumab; los tres primeros subcutáneos y el último intravenoso; erenumab actúa frente al receptor y el resto frente al péptido) tienen reembolso en migraña episódica de alta frecuencia (más de 8 días al mes) o crónica tras el fallo de 3 preventivos; en la migraña crónica uno de ellos debe haber sido la toxina botulínica. Solo se habla de migraña crónica refractaria cuando han fallado todos los preventivos, incluidos los anti-CGRP (C).","p":null},{"id":"Cefaleas_T06-T07-10","b":"Cefaleas_T06-T07","t":"T06","n":10,"q":"Mujer de 36 años con migraña que acude a Urgencias por una crisis de 4 días de evolución que no ha cedido con triptanes ni AINE orales, con vómitos repetidos. ¿Cuál de las siguientes medidas NO está indicada?","o":["Hidratación y antieméticos administrados por vía parenteral.","Bloqueo anestésico de ambos nervios occipitales.","Corticoides, de forma ocasional y por un periodo breve.","Opiáceos intravenosos como analgésico de elección."],"a":3,"e":"Es un status migrañoso (ataque de al menos 72 h). Medidas: vía intravenosa, hidratación, AINE parenteral, sumatriptán subcutáneo, antiemético parenteral, neuroléptico o benzodiacepina suaves, sedación parenteral, gastroprotectores, corticoides solo ocasionalmente y, con frecuencia, bloqueo anestésico de ambos nervios occipitales. Después hay que valorar el tratamiento preventivo. Los apuntes subrayan que no hay ninguna indicación para usar opiáceos como tratamiento sintomático de las cefaleas.","p":null},{"id":"Cefaleas_T06-T07-11","b":"Cefaleas_T06-T07","t":"T07","n":11,"q":"Varón de 42 años con cefalea casi diaria desde hace meses, bilateral 'como un casco', opresiva, de intensidad leve-moderada, que no empeora con la actividad física y no se acompaña de náuseas. La exploración es normal. Señale la afirmación CORRECTA sobre su manejo:","o":["El tratamiento sintomático de elección es un triptán de acción rápida.","Prevención con terapia psicológica, cambios de estilo de vida y, sobre todo, tricíclicos.","La ausencia de signos de alarma permite descartar con seguridad una cefalea secundaria sin reevaluarlo.","Debe tratarse con analgésicos diarios de forma continuada, ya que la respuesta a ellos suele ser excelente."],"a":1,"e":"Cefalea tensional: bilateral, opresiva, leve-moderada, no empeora con la actividad ni suele asociar náuseas. Tratamiento sintomático con analgésicos o AINE, evitando siempre su abuso (y la respuesta suele ser escasa); nunca un antimigrañoso específico como los triptanes. Prevención: terapia psicológica, modificar desencadenantes y estilo de vida y, sobre todo, tricíclicos. Su inespecificidad la hace un 'lobo con piel de cordero': hay que ser cauteloso al atribuirle cuadros atípicos.","p":null},{"id":"Cefaleas_T06-T07-12","b":"Cefaleas_T06-T07","t":"T07","n":12,"q":"Varón de 34 años, fumador, que desde hace 3 semanas presenta cada madrugada un dolor intensísimo en el ojo derecho, de unos 60 minutos, con lagrimeo, rinorrea y ptosis derechos. Durante el ataque es incapaz de estar acostado y camina por la habitación. Un episodio similar ocurrió la primavera pasada. ¿Cuál es el tratamiento más eficaz del ataque agudo?","o":["Paracetamol e ibuprofeno a dosis altas combinados.","Indometacina oral, cuya respuesta es criterio diagnóstico.","Sumatriptán subcutáneo u oxígeno a alto flujo.","Lamotrigina oral en dosis ascendentes."],"a":2,"e":"Cefalea en acúmulos (racimos): varón de 20-40 años, dolor orbitario estrictamente unilateral de 15-180 minutos, con síntomas autonómicos ipsilaterales y agitación (deambula, no tolera el decúbito), con ritmo circadiano (madrugada) y circanual (primavera-otoño); el alcohol puede desencadenarlos. Para el ataque: triptanes de acción rápida, mejor sumatriptán subcutáneo, y oxígeno al mayor flujo posible 15-20 minutos. La indometacina es diagnóstica de las hemicráneas paroxística y continua, y la lamotrigina es de elección en el SUNCT.","p":null},{"id":"Cefaleas_T06-T07-13","b":"Cefaleas_T06-T07","t":"T07","n":13,"q":"En el paciente de la pregunta anterior, que está en pleno acúmulo con 3 ataques al día, ¿cuál es la profilaxis transicional recomendada?","o":["Carbonato de litio en monoterapia como fármaco de primera línea.","Galcanezumab, financiado en España para esta indicación.","Estimulación hipotalámica profunda de forma precoz.","Corticoides orales asociados a verapamilo o topiramato."],"a":3,"e":"La profilaxis transicional busca cortar o acortar el acúmulo: lo clásico son los corticoides orales, asociando de forma agresiva verapamilo o topiramato; en el centro de los apuntes se empieza con bloqueo anestésico de ambos nervios occipitales. El litio se añade en la profilaxis de las formas crónicas (A). El galcanezumab está aprobado por la EMA para esta indicación, pero sin reembolso en España (B). La neuromodulación (occipital, esfenopalatina e hipotalámica) se reserva para casos refractarios muy seleccionados.","p":"Cefaleas_T06-T07-12"},{"id":"Cefaleas_T06-T07-14","b":"Cefaleas_T06-T07","t":"T07","n":14,"q":"Mujer de 37 años con ataques de dolor orbitotemporal izquierdo muy intenso, de unos 15 minutos de duración, entre 10 y 15 veces al día, con lagrimeo e inyección conjuntival izquierdos. ¿Qué tratamiento es de elección y además apoya el diagnóstico?","o":["Indometacina.","Verapamilo.","Carbamazepina.","Sumatriptán subcutáneo."],"a":0,"e":"Hemicránea paroxística: ataques estrictamente unilaterales de 2-30 minutos, de varias a muchas veces al día, con síntomas autonómicos ipsilaterales; a diferencia de los racimos, es típica de mujeres. Responde de forma exquisita a la indometacina, y esa respuesta es criterio diagnóstico (igual que en la hemicránea continua, con dosis inicial de al menos 150 mg/día, hasta 225 mg). La carbamazepina es de elección en la neuralgia del trigémino.","p":null},{"id":"Cefaleas_T06-T07-15","b":"Cefaleas_T06-T07","t":"T07","n":15,"q":"Varón de 55 años con decenas de ataques diarios de dolor intenso periocular derecho que duran entre 20 segundos y 2 minutos, acompañados de lagrimeo e inyección conjuntival derechos. No responde a la indometacina. ¿Cuál es el diagnóstico y el tratamiento de primera elección?","o":["Neuralgia del trigémino; carbamazepina.","SUNCT; lamotrigina.","Cefalea en acúmulos; oxígeno a alto flujo.","Hemicránea paroxística; aumento de la dosis de indometacina hasta 225 mg."],"a":1,"e":"SUNCT (cefalea neuralgiforme unilateral de breve duración con inyección conjuntival y lagrimeo): ataques moderados o graves, estrictamente unilaterales, de segundos a minutos, al menos una vez al día, con lagrimeo e inyección conjuntival ipsilaterales; si hay otros síntomas autonómicos se llama SUNA. Tratamiento difícil; de primera elección, lamotrigina. La neuralgia del trigémino no suele asociar síntomas autonómicos tan llamativos, y los racimos duran 15-180 minutos.","p":null},{"id":"Cefaleas_T06-T07-16","b":"Cefaleas_T06-T07","t":"T07","n":16,"q":"Mujer de 68 años que en los últimos 2 meses se despierta casi todas las noches por una cefalea opresiva, bilateral, de intensidad moderada, que dura unas 2 horas, sin síntomas autonómicos. Nunca le ocurre durante el día. La VSG, la exploración, la RM cerebral y la monitorización de la presión arterial nocturna son normales. ¿Qué tratamiento se ha propuesto para este cuadro?","o":["Indometacina, ya que es una cefalea trigémino-autonómica.","Oxígeno a alto flujo durante los episodios nocturnos.","Cafeína nocturna, litio o flunarizina a dosis bajas.","Corticoides orales hasta normalizar la VSG."],"a":2,"e":"Cefalea hípnica: crisis recurrentes que solo aparecen durante el sueño y lo interrumpen, de hasta 4 horas, típica de mujeres mayores de 50 años, opresiva, leve-moderada y sin síntomas autonómicos. Es un diagnóstico de exclusión: la cefalea nocturna y la cefalea de novo en mayores de 50 años son signos de alarma (neuroimagen, descartar HTA nocturna y arteritis de la temporal con VSG), aquí ya descartados. Tratamiento propuesto: litio y cafeína por la noche; dosis bajas de flunarizina pueden ayudar.","p":null},{"id":"Cefaleas_T06-T07-17","b":"Cefaleas_T06-T07","t":"T07","n":17,"q":"Mujer de 61 años con episodios de dolor 'como una descarga eléctrica' en la mejilla y la encía superior derechas, de 1-2 segundos, que se desencadenan al lavarse los dientes o al rozarse la cara. La exploración neurológica es normal. ¿Cuál es el tratamiento de primera elección?","o":["Carbamazepina.","Indometacina.","Bloqueo anestésico de los nervios occipitales.","Descompresión microvascular inmediata."],"a":0,"e":"Neuralgia del trigémino (afectación intracraneal): ataques paroxísticos de una fracción de segundo a 2 minutos en el territorio de una o más ramas (aquí V2), intensos, punzantes, desencadenados por zonas gatillo y estereotipados. Tratamiento fundamentalmente con carbamazepina; alternativas: lamotrigina, duloxetina, venlafaxina y toxina botulínica. La cirugía (procedimientos ablativos o descompresión microvascular) se reserva para casos refractarios o situaciones especiales.","p":null},{"id":"Cefaleas_T06-T07-18","b":"Cefaleas_T06-T07","t":"T07","n":18,"q":"Varón de 45 años con dolor constante en la región frontal media derecha, con paroxismos sobreimpuestos, e hipersensibilidad a la presión en la escotadura supraorbitaria derecha. La exploración es por lo demás normal. Señale la afirmación CORRECTA:","o":["Es una neuralgia por afectación intracraneal, que cursa típicamente solo con paroxismos.","El tratamiento de elección es la descompresión microvascular del nervio.","Es una cefalea trigémino-autonómica y debe tratarse con indometacina.","Es una neuralgia epicraneal, cuyo dolor se suprime con bloqueos anestésicos locales."],"a":3,"e":"Neuralgia del supraorbitario, ejemplo de neuralgia epicraneal (afectación de ramas terminales): dolor persistente, con o sin paroxismos sobreimpuestos, e hipersensibilidad sobre el nervio. Se suprime con bloqueos anestésicos, que son su tratamiento. Las neuralgias por afectación intracraneal (como la del trigémino) cursan típicamente con paroxismos, y la descompresión microvascular es una opción para ellas en casos refractarios.","p":null},{"id":"Cefaleas_T06-T07-19","b":"Cefaleas_T06-T07","t":"T07","n":19,"q":"Mujer de 39 años que, durante una relación sexual hace 2 horas, presenta una cefalea occipital explosiva que alcanzó su máxima intensidad en segundos y que persiste. Está consciente y sin focalidad. La TC craneal urgente es normal. ¿Cuál es el siguiente paso?","o":["Alta con diagnóstico de cefalea primaria asociada a la actividad sexual, al ser la TC normal.","Pautar un triptán subcutáneo y revisar en consulta si el dolor recurre.","Punción lumbar, cuya sensibilidad para HSA es máxima desde las 12 h.","Arteriografía cerebral como prueba inmediata, sin necesidad de punción lumbar."],"a":2,"e":"Cefalea en trueno: intensa, de inicio brusco, máxima en los primeros segundos y de al menos 5 minutos; a menudo con ejercicio o actividad sexual. Obliga a un estudio en Urgencias hospitalarias. Algoritmo: TC (la HSA es la causa más frecuente, pero la TC no la detecta en el 100 %, sobre todo en las primeras horas); si es negativa, punción lumbar (HSA, meningitis), cuya sensibilidad para HSA solo es del 100 % a partir de las 12 h; si es negativa, RM con angio-RM (disección, vasoconstricción cerebral reversible, apoplejía hipofisaria, trombosis venosa, aneurisma). Solo con todo negativo se diagnostica cefalea primaria en trueno.","p":null},{"id":"Cefaleas_T06-T07-20","b":"Cefaleas_T06-T07","t":"T07","n":20,"q":"Respecto a los signos de alarma de cefalea secundaria, señale la asociación CORRECTA:","o":["Cefalea que empeora con el decúbito: hipotensión licuoral.","Cefalea desencadenada por la tos o el estornudo: debe descartarse una malformación de Chiari.","Cefalea de novo en mayor de 50 años: basta con una TC craneal normal para descartar causa grave.","Cefalea que empeora con el ortostatismo: hipertensión intracraneal."],"a":1,"e":"Ante una cefalea desencadenada por tos o estornudo hay que descartar una anomalía de Chiari (los precipitantes como esfuerzo, actividad sexual o tos requieren neuroimagen, a menudo con estudio de vasos). Con la postura: la hipertensión intracraneal empeora con el decúbito y la hipotensión licuoral con el ortostatismo (A y D invertidas). En la cefalea de novo en mayores de 50 años es fundamental descartar arteritis de la temporal con una VSG (C).","p":null},{"id":"Demencias_T12-T13-1","b":"Demencias_T12-T13","t":"T12","n":1,"q":"Mujer de 72 años, que vive sola y sigue haciendo sus compras, maneja su dinero y cocina sin ayuda. Desde hace un año olvida conversaciones recientes y repite preguntas. En la evaluación neuropsicológica presenta un déficit objetivable de memoria episódica, con el resto de dominios preservados. ¿Cuál es el diagnóstico y qué evolución cabe esperar?","o":["Demencia leve por enfermedad de Alzheimer, al existir un déficit objetivo de memoria.","Envejecimiento normal, que no requiere seguimiento.","Deterioro cognitivo leve amnésico, con progresión a EA de ~15 % anual.","Deterioro cognitivo no amnésico asociado a depresión, habitualmente reversible."],"a":2,"e":"El deterioro cognitivo leve es un deterioro objetivable de funciones superiores que supone un descenso respecto al rendimiento previo, pero no interfiere de forma significativa en la autonomía. El amnésico es el más frecuente y en la mayoría de los casos progresa a demencia por EA, a un ritmo de alrededor del 15 % anual. Lo que separa el deterioro cognitivo leve de la demencia es la valoración funcional: la demencia exige interferencia con el rendimiento social o laboral y pérdida de autonomía.","p":null},{"id":"Demencias_T12-T13-2","b":"Demencias_T12-T13","t":"T12","n":2,"q":"Varón de 78 años, viudo hace 6 meses, con quejas de falta de memoria, apatía, insomnio y tristeza. En la evaluación presenta enlentecimiento y fallos atencionales, pero la memoria episódica está conservada cuando se le facilitan pistas. ¿Qué interpretación es la más adecuada?","o":["Enfermedad de Alzheimer prodrómica, por la apatía como síntoma de inicio.","Deterioro no amnésico asociado a depresión, a veces reversible.","Demencia frontotemporal variante conductual de inicio tardío.","Envejecimiento normal, que por sí mismo explica una demencia."],"a":1,"e":"El deterioro cognitivo no amnésico (memoria episódica conservada) puede asociarse a otras demencias (vascular, cuerpos de Lewy, frontotemporal y también EA), pero también a enfermedades psiquiátricas, sobre todo la depresión del anciano, y en ocasiones es reversible. La sintomatología depresiva crea problemas diagnósticos por la llamada pseudodemencia depresiva. El envejecimiento produce un declive cognitivo y es factor de riesgo, pero por sí mismo no produce demencia (D).","p":null},{"id":"Demencias_T12-T13-3","b":"Demencias_T12-T13","t":"T12","n":3,"q":"Varón de 75 años al que su familia trae por pérdida de memoria y desorientación progresivas de 2 años, que ya le impiden manejar su dinero. Para el estudio inicial de la demencia, ¿qué pruebas deben realizarse siempre?","o":["Analítica básica (incluidas TSH y B12) y neuroimagen, habitualmente TC.","PET de amiloide y estudio genético de ApoE en todos los pacientes.","EEG y punción lumbar con determinación de proteína 14-3-3.","SPECT con ioflupano (DaTSCAN) para descartar una enfermedad por cuerpos de Lewy."],"a":0,"e":"En todo paciente con demencia: anamnesis (primer síntoma y evolución), exploración general y neurológica, evaluación neuropsicológica (MMSE o MoCA), neuropsiquiátrica y funcional, analítica básica (hemograma, función renal, electrolitos, calcio, función tiroidea, vitamina B12 y serología luética si procede) y neuroimagen básica, generalmente una TC, para descartar causas secundarias (hematoma subdural, procesos expansivos, hidrocefalia, lesiones vasculares). RM, EEG, LCR, SPECT, PET y estudios genéticos se reservan para casos seleccionados.","p":null},{"id":"Demencias_T12-T13-4","b":"Demencias_T12-T13","t":"T12","n":4,"q":"Varón de 63 años con deterioro cognitivo rápidamente progresivo en 6 semanas, ataxia de la marcha y sacudidas mioclónicas, ya dependiente para actividades básicas. ¿Qué pruebas son especialmente útiles para su principal sospecha?","o":["Biomarcadores plasmáticos de p-Tau217 y ratio Aβ42/40.","Ninguna: el cuadro es compatible con una enfermedad de Alzheimer de evolución rápida.","SPECT de perfusión con HMPAO como única prueba diagnóstica.","EEG y LCR (proteína 14-3-3, RT-QuIC)."],"a":3,"e":"Cuanto más agudo es el comienzo y más rápida la evolución, más probable es una causa no degenerativa clásica. La demencia rápidamente progresiva, de semanas de evolución, requiere un estudio preferente para descartar la enfermedad de Creutzfeldt-Jakob, encefalitis autoinmunes o causas tratables (tumor, lesión vascular). El EEG es útil en la ECJ y en las encefalopatías metabólicas, y el LCR permite detectar la proteína 14-3-3 y la RT-QuIC.","p":null},{"id":"Demencias_T12-T13-5","b":"Demencias_T12-T13","t":"T12","n":5,"q":"Mujer de 84 años, independiente y sin quejas cognitivas previas, que ingresa por una pielonefritis y presenta un cuadro confusional agudo con desorientación y agitación nocturna, que se resuelve al tratar la infección. ¿Qué significado tiene este episodio?","o":["Ninguno: es una complicación banal de la infección sin implicaciones posteriores.","Confirma el diagnóstico de demencia, aunque el cuadro haya revertido por completo.","Indica una enfermedad de Creutzfeldt-Jakob incipiente.","Es un marcador de vulnerabilidad cognitiva y posible neurodegeneración latente."],"a":3,"e":"El delirium es una alteración del nivel y del contenido de la conciencia por un proceso sistémico. Su aparición en un paciente con un proceso agudo (infección, insuficiencia cardiaca), sobre todo si es mayor, es un marcador de vulnerabilidad cognitiva que a menudo indica una enfermedad neurodegenerativa latente o subclínica. La demencia, en cambio, exige preservación del nivel de vigilia, lo que excluye los síndromes confusionales (B).","p":null},{"id":"Demencias_T12-T13-6","b":"Demencias_T12-T13","t":"T12","n":6,"q":"Varón de 80 años con deterioro cognitivo leve que ha empeorado en los últimos 2 meses. Toma oxibutinina por vejiga hiperactiva desde hace 3 meses, además de enalapril y atorvastatina. ¿Cuál es la primera actuación?","o":["Revisar la medicación y retirar el fármaco con acción anticolinérgica.","Iniciar donepezilo, ya que el empeoramiento indica progresión a demencia por EA.","Solicitar un PET de amiloide para confirmar una EA.","Añadir una benzodiacepina de vida media larga para mejorar el sueño."],"a":0,"e":"En Atención Primaria es importante pensar en fármacos que alteran la función cognitiva del anciano, en particular los de acción anticolinérgica (como la oxibutinina). En toda demencia hay que corregir comorbilidades: fármacos, alteraciones hidroelectrolíticas, hipotiroidismo y déficit de B12. Las benzodiacepinas deben evitarse porque empeoran la cognición y aumentan el riesgo de caídas y delirium.","p":null},{"id":"Demencias_T12-T13-7","b":"Demencias_T12-T13","t":"T12","n":7,"q":"Mujer de 76 años con 2 años de olvidos progresivos, discurso reiterativo y pérdida de objetos. En la exploración no recuerda una lista de palabras aprendida minutos antes, y no mejora al darle pistas ni con opciones de reconocimiento. La exploración física es normal. ¿Qué dato clínico es el marcador más fiable de su enfermedad más probable?","o":["La desorientación espacial como síntoma de inicio.","La anosognosia desde las primeras fases.","Las alucinaciones visuales bien estructuradas.","Amnesia hipocampal que no mejora con pistas."],"a":3,"e":"La inmensa mayoría de los pacientes con EA comienzan con un trastorno de la memoria episódica (reciente), con discurso reiterativo. El patrón es de tipo hipocampal: gran dificultad de aprendizaje y fallos que no mejoran con pistas. Es el dato clínico esencial del inicio de la EA y el marcador clínico más fiable. La desorientación es inicialmente temporal, y las alucinaciones visuales estructuradas orientan a cuerpos de Lewy. En fases leves y moderadas la exploración física es normal.","p":null},{"id":"Demencias_T12-T13-8","b":"Demencias_T12-T13","t":"T12","n":8,"q":"Varón de 47 años con deterioro progresivo de memoria episódica desde hace 2 años. Su padre y su abuela paterna desarrollaron una demencia antes de los 55 años. ¿Qué alteración genética es la más probable?","o":["Homocigosis para el alelo ApoE ε4 del cromosoma 19.","Mutación de presenilina 1 (cromosoma 14).","Mutación de presenilina 2 en el cromosoma 1.","Expansión de tripletes CAG en el gen de la huntingtina."],"a":1,"e":"En la EA familiar precoz, de transmisión autosómica dominante y alta penetrancia, hay tres genes: PSEN1 (cromosoma 14), responsable de la mayoría de los casos de EA familiar presenil; PSEN2 (cromosoma 1), muy rara; y APP (cromosoma 21). Las presenilinas modulan la γ-secretasa. El ApoE ε4 es el marcador de riesgo más potente de la EA tardía y esporádica, pero no un gen de transmisión dominante. Los estudios genéticos están indicados en formas precoces con antecedentes familiares.","p":null},{"id":"Demencias_T12-T13-9","b":"Demencias_T12-T13","t":"T12","n":9,"q":"Mujer de 69 años con deterioro cognitivo leve por EA confirmado con biomarcadores en LCR, que pregunta por los anticuerpos anti-amiloide. El estudio genético muestra que es homocigota para el alelo ApoE ε4. Señale la afirmación CORRECTA:","o":["Es la candidata ideal, ya que los homocigotos ε4 son quienes más se benefician de estas terapias.","Lecanemab y donanemab están financiados en el sistema público español para el deterioro cognitivo leve por EA.","No están indicados en homocigotos ApoE ε4, por el riesgo de complicaciones graves (ARIA).","El genotipo ApoE no tiene relevancia terapéutica y solo se usa en investigación."],"a":2,"e":"El genotipo ApoE ε4 es el marcador de riesgo más potente de la EA (riesgo 3-4 veces mayor en heterocigotos y 8-12 veces en homocigotos) y se relaciona con el riesgo de complicaciones graves de las terapias anti-amiloide (ARIA: edema y hemorragias). Lecanemab y donanemab, aprobados por la EMA en 2024 y 2025, están indicados solo en deterioro cognitivo ligero o demencia leve por EA, con amiloidosis demostrada por PET o LCR, en no portadores o heterocigotos de ε4. Según los apuntes, el posicionamiento del Ministerio de junio de 2026 no los financia en el sistema público.","p":null},{"id":"Demencias_T12-T13-10","b":"Demencias_T12-T13","t":"T12","n":10,"q":"Varón de 46 años con síndrome de Down que, según sus cuidadores, en el último año ha perdido habilidades que tenía, está más desorientado y olvida rutinas habituales. ¿Cuál es el mecanismo más probable?","o":["La copia extra del gen de la APP en el cromosoma 21, que produce un exceso de amiloide.","Una mutación de la presenilina 1 asociada a la trisomía.","Una demencia vascular por enfermedad de pequeño vaso.","Un déficit de B12 de origen malabsortivo, causa habitual de deterioro en el síndrome de Down."],"a":0,"e":"En el síndrome de Down, la copia extra del gen de la proteína precursora de amiloide (APP), situado en el cromosoma 21, produce casi invariablemente una producción excesiva de amiloide y una demencia por EA a partir de los 40-50 años.","p":null},{"id":"Demencias_T12-T13-11","b":"Demencias_T12-T13","t":"T12","n":11,"q":"Respecto a la patogenia y la anatomía patológica de la enfermedad de Alzheimer, señale la afirmación CORRECTA:","o":["Los ovillos neurofibrilares son depósitos extracelulares de β-amiloide en la corteza.","La vía de la α-secretasa es la vía amiloidogénica que genera las placas seniles.","La APP se procesa por β/γ-secretasas: placas de Aβ y ovillos de tau hiperfosforilada.","El déficit neuroquímico característico de la enfermedad es dopaminérgico."],"a":2,"e":"Hipótesis amiloidogénica: la APP se procesa por la vía de las β y γ-secretasas (amiloidogénica) en lugar de la α-secretasa (fisiológica), generando oligómeros solubles y placas extracelulares de Aβ40 y Aβ42. El Aβ40 se deposita además en la pared de los vasos (angiopatía amiloide). El amiloide lleva indirectamente a la hiperfosforilación de la tau, que forma los ovillos neurofibrilares intraneuronales. La muerte neuronal afecta especialmente a las neuronas colinérgicas. La progresión anatomopatológica sigue los estadios de Braak.","p":null},{"id":"Demencias_T12-T13-12","b":"Demencias_T12-T13","t":"T12","n":12,"q":"Varón de 70 años con deterioro cognitivo leve amnésico. Su análisis de sangre, en un laboratorio con plataforma validada, muestra p-Tau217 elevada con descenso de la ratio Aβ42/Aβ40. Según los criterios de la Alzheimer's Association (2024-2025), señale la afirmación CORRECTA:","o":["Son marcadores CORE-2, que solo sirven para estadificar la enfermedad avanzada.","Un biomarcador CORE-1 basta; el plasma confirma si sensibilidad y especificidad ≥90 %.","El diagnóstico de EA solo puede establecerse con un PET de Tau positivo.","La p-Tau217 plasmática es un marcador inespecífico de neurodegeneración, como la Tau total."],"a":1,"e":"Según la AA (2024), el diagnóstico de EA es biológico. Los biomarcadores CORE-1 (marcadores A —descenso de Aβ42 o de la ratio Aβ42/40, PET de amiloide— y T1, como la p-Tau 181, 217 o 231) aparecen precozmente, incluso en fases asintomáticas, y uno positivo basta para el diagnóstico. El marcador plasmático más consolidado es la p-Tau217, y su uso como prueba confirmatoria exige sensibilidad y especificidad mínimas del 90 % (AA 2025). El PET de Tau es CORE-2, tardío. La Tau total en LCR es un marcador de neurodegeneración (N).","p":null},{"id":"Demencias_T12-T13-13","b":"Demencias_T12-T13","t":"T12","n":13,"q":"Mujer de 81 años con demencia por EA en fase moderada-avanzada: necesita ayuda para vestirse y asearse. Lleva 2 años con donepezilo. ¿Qué fármaco está indicado en esta fase y cuál es su mecanismo?","o":["Galantamina, inhibidor de la acetilcolinesterasa, para frenar la enfermedad de forma significativa.","Lecanemab, anticuerpo anti-amiloide indicado en todas las fases.","Memantina, antagonista del receptor NMDA, indicada en fases moderadas y avanzadas.","Levodopa, para mejorar la apraxia del vestir."],"a":2,"e":"Los anticolinesterásicos (donepezilo, galantamina, rivastigmina) inhiben la acetilcolinesterasa central y están indicados en la demencia leve y moderada; no modifican el curso de la enfermedad, aunque pueden frenar muy discretamente el deterioro. La memantina, antagonista del receptor glutamatérgico NMDA, se emplea en fases moderadas y avanzadas, con un efecto discreto sobre las actividades básicas y la carga del cuidador. Los anti-amiloide solo están indicados en deterioro cognitivo ligero o demencia leve.","p":null},{"id":"Demencias_T12-T13-14","b":"Demencias_T12-T13","t":"T12","n":14,"q":"Varón de 83 años con EA moderada, que en las últimas semanas presenta agitación vespertina, ideas de que su mujer le roba y ansiedad. Se han descartado dolor, estreñimiento, retención urinaria y causas metabólicas o farmacológicas. ¿Cuál es el tratamiento farmacológico de primera elección?","o":["Lorazepam pautado cada 8 horas.","Citalopram o trazodona.","Haloperidol a dosis altas de forma indefinida.","Benzodiacepina de vida media larga por la noche."],"a":1,"e":"Primero hay que intentar medidas no farmacológicas y buscar desencadenantes (dolor, estreñimiento, retención urinaria, fármacos, alteraciones metabólicas). La agitación y la psicosis se tratan inicialmente con citalopram o trazodona; solo en casos graves se usan neurolépticos, a dosis bajas y por un tiempo limitado. Las benzodiacepinas deben evitarse porque empeoran la cognición y aumentan el riesgo de caídas y delirium; si fueran imprescindibles, de vida media corta. Las crisis epilépticas de la EA (10 %) se tratan con antiepilépticos no sedantes, sobre todo levetiracetam.","p":null},{"id":"Demencias_T12-T13-15","b":"Demencias_T12-T13","t":"T12","n":15,"q":"Mujer de 61 años con dificultad progresiva para leer, localizar objetos, calcular distancias al aparcar y vestirse, de 2 años de evolución. La memoria episódica y el lenguaje están relativamente preservados. Los biomarcadores en LCR muestran un perfil de EA. ¿Qué variante presenta?","o":["Afasia primaria progresiva logopénica.","Variante frontal de la EA.","Demencia semántica.","Atrofia cortical posterior."],"a":3,"e":"Variantes de la EA: frontal (predominio de alteraciones de conducta, diagnóstico diferencial con las demencias frontales); atrofia cortical posterior (predominan los trastornos práxicos y la disfunción visuoespacial, como en este caso); y afasia primaria progresiva logopénica (anomia progresiva con afectación precoz e intensa del lenguaje). La demencia semántica pertenece al complejo frontotemporal.","p":null},{"id":"Demencias_T12-T13-16","b":"Demencias_T12-T13","t":"T12","n":16,"q":"¿Cuál de los siguientes NO es un factor de riesgo de demencia o de enfermedad de Alzheimer recogido en los apuntes?","o":["Alta reserva cognitiva por nivel educativo.","Hipertensión arterial en la edad adulta.","Hipoacusia y déficit visual no corregidos.","Alteraciones del sueño en sus fases profundas."],"a":0,"e":"Factores de riesgo de EA y demencia: edad, historia familiar, sexo femenino, traumatismo craneal con pérdida de conciencia, sordera, déficit visual no corregido, aislamiento social, bajo nivel de escolaridad y cociente intelectual (escasa reserva cognitiva), diabetes, tabaquismo, alcoholismo, HTA en la edad adulta, colesterol total y LDL elevados y alteraciones del sueño profundo (disfunción del sistema glinfático). Según la Comisión Lancet 2024, podrían explicar hasta el 45 % de las demencias. Una reserva cognitiva elevada es protectora.","p":null},{"id":"Demencias_T12-T13-17","b":"Demencias_T12-T13","t":"T13","n":17,"q":"Varón de 77 años, hipertenso y diabético, con deterioro progresivo de 3 años con lentitud de pensamiento, apatía y dificultad para planificar, con memoria episódica relativamente preservada. Camina con pasos cortos, con bloqueos y dificultad para iniciar la marcha, sin temblor ni afectación de los brazos, y tiene urgencia miccional. La RM muestra hiperintensidades extensas en la sustancia blanca periventricular y subcortical e infartos lacunares. ¿Cuál es el diagnóstico más probable?","o":["Demencia vascular por enfermedad de pequeño vaso.","Enfermedad de Alzheimer típica.","Demencia por cuerpos de Lewy.","Demencia multiinfarto por infartos corticales de gran vaso."],"a":0,"e":"La demencia por enfermedad de pequeño vaso tiene un inicio insidioso con empeoramientos por lesiones nuevas. Produce un deterioro de tipo subcortical (bradipsiquia, apatía, disfunción ejecutiva, alteración de la memoria de trabajo con preservación de la episódica, menor fluencia verbal), un trastorno de la marcha con parkinsonismo vascular de la mitad inferior del cuerpo, signos de vías motoras o pseudobulbares y disfunción esfinteriana. En RM aparece leucoencefalopatía (hiperintensidades de sustancia blanca en T2; en TC, leucoaraiosis).","p":null},{"id":"Demencias_T12-T13-18","b":"Demencias_T12-T13","t":"T13","n":18,"q":"Varón de 68 años que, tras un episodio brusco de somnolencia, presenta de forma súbita un deterioro cognitivo marcado, con apatía, amnesia y desorientación, sin déficit motor. La RM muestra infartos agudos en ambos tálamos paramedianos. ¿Qué tipo de demencia vascular presenta?","o":["Demencia por enfermedad de pequeño vaso hipertensiva.","Demencia por infarto estratégico.","Demencia por hipoperfusión tras parada cardiaca.","Angiopatía amiloidea cerebral."],"a":1,"e":"La demencia por infarto estratégico se produce por lesiones, a menudo pequeñas, en regiones críticas para la función cognitiva: giro angular, tálamo paramediano o bilateral, lóbulo temporal inferomedial, giro cingular, núcleo caudado y globo pálido. Su presentación suele ser aguda. La demencia multiinfarto se debe a infartos corticales multifocales de gran vaso, y la de pequeño vaso tiene un inicio insidioso.","p":null},{"id":"Demencias_T12-T13-19","b":"Demencias_T12-T13","t":"T13","n":19,"q":"Mujer de 79 años, normotensa, con deterioro cognitivo de perfil subcortical, dos hemorragias lobares en los últimos 3 años y episodios breves y repetidos de parestesias que se extienden por un brazo. La RM con secuencia SWI muestra múltiples microsangrados corticales y depósitos de hemosiderina en la superficie pial. ¿Cuál es el diagnóstico?","o":["Enfermedad de pequeño vaso hipertensiva.","CADASIL de presentación tardía.","Angiopatía amiloidea cerebral.","Demencia multiinfarto cardioembólica."],"a":2,"e":"La angiopatía amiloidea cerebral se debe al depósito de amiloide en la pared de las arterias de mediano y pequeño calibre de la superficie cortical; la forma más frecuente es la esporádica asociada a la edad. Cursa con hemorragias lobares de repetición, deterioro subcortical y episodios de focalidad repetida ('amyloid spells'), relacionados con hemorragia subaracnoidea de la convexidad o hemosiderosis meníngea. En RM: microsangrados corticales (SWI), siderosis pial y lesiones de sustancia blanca subcortical posterior (criterios de Boston 2.0). La pequeño vaso hipertensiva da microhemorragias profundas.","p":null},{"id":"Demencias_T12-T13-20","b":"Demencias_T12-T13","t":"T13","n":20,"q":"Varón de 38 años, de origen japonés, hijo de padres consanguíneos sanos, con deterioro cognitivo progresivo, infartos subcorticales y leucoencefalopatía extensa, sin factores de riesgo vascular. ¿Cuál es el diagnóstico más probable?","o":["CADASIL por mutación de NOTCH3, autosómica dominante.","Demencia frontotemporal por expansión de C9orf72.","Angiopatía amiloidea hereditaria de tipo holandés.","CARASIL (HTRA1, autosómica recesiva)."],"a":3,"e":"Entre las demencias vasculares específicas, el CADASIL es autosómico dominante, por mutaciones de NOTCH3 en el cromosoma 19. El CARASIL es similar, pero autosómico recesivo, por mutaciones bialélicas en HTRA1, y se describió inicialmente en población japonesa. Los padres sanos y consanguíneos orientan a herencia recesiva. Las formas holandesa y de Iowa de angiopatía amiloidea se deben a mutaciones de la APP.","p":null},{"id":"Demencias_T12-T13-21","b":"Demencias_T12-T13","t":"T13","n":21,"q":"Mujer de 80 años con demencia mixta (enfermedad de Alzheimer y lesiones vasculares extensas). ¿Qué tratamiento recogen los apuntes como indicado?","o":["Galantamina, con eficacia muy discreta.","Memantina en fase leve, por su indicación específica en la demencia vascular.","Lecanemab, por su indicación en la patología vascular asociada.","Ningún tratamiento, ya que los anticolinesterásicos están contraindicados en presencia de lesiones vasculares."],"a":0,"e":"El tratamiento básico de la demencia vascular es la prevención primaria y el control de los factores de riesgo, además del tratamiento de la patología responsable. Para la demencia mixta (EA y vascular), los apuntes recogen la galantamina, con una eficacia muy discreta, similar a la de la EA; no tiene indicación establecida en la demencia vascular pura.","p":null},{"id":"Demencias_T12-T13-22","b":"Demencias_T12-T13","t":"T13","n":22,"q":"Varón de 74 años con 8 meses de deterioro cognitivo con predominio de fallos de atención y orientación visuoespacial, y días de clara mejoría alternando con otros en que 'está ausente'. Ve personas y animales en casa, que describe con detalle. Su mujer cuenta que desde hace años grita y da golpes mientras duerme. Presenta bradicinesia y rigidez leves. ¿Qué prueba apoya mejor el diagnóstico?","o":["PET de amiloide positivo en corteza.","SPECT con ioflupano (DaTSCAN) patológico.","RM cerebral con atrofia hipocampal marcada.","EEG con complejos periódicos de punta-onda."],"a":1,"e":"Demencia por cuerpos de Lewy. Sus cuatro criterios nucleares son las fluctuaciones cognitivas, las alucinaciones visuales bien estructuradas y recurrentes, el trastorno de conducta del sueño REM (con frecuencia años antes; hay que preguntarlo) y el parkinsonismo. El deterioro afecta sobre todo a la atención y a las habilidades visuoespaciales, con relativa preservación de la memoria. Apoyos característicos: DaTSCAN con déficit dopaminérgico nigroestriatal y gammagrafía MIBG con denervación simpática cardiaca. La RM muestra atrofia inespecífica con respeto hipocampal, y el SPECT o PET-FDG, defectos parieto-occipitales.","p":null},{"id":"Demencias_T12-T13-23","b":"Demencias_T12-T13","t":"T13","n":23,"q":"En el paciente anterior, por agitación nocturna en Urgencias, se administra haloperidol. Al día siguiente presenta rigidez intensa, empeoramiento cognitivo y somnolencia. ¿Qué tratamiento antipsicótico habría sido más apropiado si fuera imprescindible?","o":["Haloperidol a dosis más bajas, ya que el problema es solo de dosis.","Ningún antipsicótico es tolerable; debe usarse una benzodiacepina de vida media larga.","Quetiapina a dosis bajas o clozapina con supervisión hematológica.","Aumentar la levodopa para controlar las alucinaciones."],"a":2,"e":"La hipersensibilidad a los neurolépticos es característica de la demencia por cuerpos de Lewy, y los clásicos como el haloperidol están contraindicados. Los antipsicóticos mejoran las alucinaciones y los delirios, pero empeoran el parkinsonismo. Los más apropiados son los atípicos: quetiapina a dosis bajas y clozapina con supervisión hematológica. Además, las alucinaciones pueden deberse a los dopaminérgicos, y la levodopa (en dosis bajas y fraccionadas) puede empeorarlas.","p":"Demencias_T12-T13-22"},{"id":"Demencias_T12-T13-24","b":"Demencias_T12-T13","t":"T13","n":24,"q":"En un paciente con demencia por cuerpos de Lewy con fluctuaciones y deterioro cognitivo, ¿qué fármaco puede producir una mejoría, a veces llamativa?","o":["Memantina.","Haloperidol.","Levodopa en dosis altas.","Rivastigmina."],"a":3,"e":"En la demencia por cuerpos de Lewy existe un déficit colinérgico que puede mejorar, a veces de forma llamativa, con rivastigmina (también con donepezilo). Los anticolinesterásicos pueden mejorar el deterioro cognitivo y atenuar las fluctuaciones. El esquema terapéutico depende de qué síntomas predominen: el parkinsonismo o los trastornos de conducta.","p":null},{"id":"Demencias_T12-T13-25","b":"Demencias_T12-T13","t":"T13","n":25,"q":"Varón de 71 años diagnosticado de enfermedad de Parkinson hace 6 años, con buena respuesta a la levodopa, que en el último año ha desarrollado un deterioro cognitivo con pérdida de autonomía. ¿Cómo se denomina por consenso este cuadro?","o":["Demencia por cuerpos de Lewy, porque la anatomía patológica es idéntica.","Demencia asociada a la enfermedad de Parkinson (parkinsonismo >1 año antes).","Demencia vascular, por el parkinsonismo de la mitad inferior del cuerpo.","Parálisis supranuclear progresiva con demencia frontal."],"a":1,"e":"La demencia por cuerpos de Lewy y la demencia de la enfermedad de Parkinson tienen características clínicas y neuropatológicas similares (inclusiones de α-sinucleína) y tienden a considerarse un mismo proceso (enfermedad por cuerpos de Lewy). Por consenso, si el parkinsonismo precede en más de un año a la demencia, se denomina demencia asociada a la enfermedad de Parkinson; si el intervalo es menor de un año o el deterioro precede al parkinsonismo, demencia por cuerpos de Lewy.","p":null},{"id":"Demencias_T12-T13-26","b":"Demencias_T12-T13","t":"T13","n":26,"q":"Varón de 56 años al que su mujer trae porque desde hace 2 años hace comentarios sexuales inapropiados, gasta dinero de forma compulsiva, come en exceso dulces, ha abandonado sus responsabilidades y no muestra empatía; él niega tener ningún problema. El MMSE es de 28/30, pero falla en las pruebas de función frontal. Su padre tuvo un cuadro similar. ¿Cuál es el diagnóstico y qué tratamiento es de primera línea para sus trastornos de conducta?","o":["DFT variante conductual; ISRS o trazodona.","Enfermedad de Alzheimer de inicio precoz; donepezilo.","Demencia por cuerpos de Lewy; rivastigmina a dosis bajas.","DFT variante conductual; anticolinesterásicos y memantina."],"a":0,"e":"Complejo demencia frontotemporal: inicio antes de los 65 años en el 80 %, con antecedentes familiares en el 30-50 %. Produce trastornos de conducta (desinhibición, pérdida de introspección, anosognosia, descuido de normas sociales, hiperfagia), afectivos y del lenguaje, con signos de liberación frontal. Las pruebas cognitivas globales se afectan poco hasta fases moderadas, salvo las frontales y de lenguaje. El tratamiento es sintomático: los trastornos de conducta se tratan en primera línea con ISRS o trazodona (que también mejoran la conducta alimentaria). Los anticolinesterásicos y la memantina no han demostrado eficacia.","p":null},{"id":"Demencias_T12-T13-27","b":"Demencias_T12-T13","t":"T13","n":27,"q":"Mujer de 63 años con dificultad progresiva para entender el significado de palabras y reconocer objetos: habla con fluidez y gramática correcta, pero su discurso está vacío de contenido ('esa cosa', 'lo de eso') y pregunta qué es un 'tenedor'. La RM muestra atrofia del lóbulo temporal anterior izquierdo. ¿Qué fenotipo presenta?","o":["Afasia progresiva primaria no fluente.","Demencia semántica.","Afasia primaria progresiva logopénica por EA.","Variante conductual de la demencia frontotemporal."],"a":1,"e":"Fenotipos de la demencia frontotemporal: variante conductual; afasia progresiva primaria no fluente (lenguaje expresivo con menor fluencia y empobrecimiento gramatical, afectación frontal perisilviana del hemisferio dominante); y demencia semántica (lenguaje fluido pero carente de contenido y significado, afectación del lóbulo temporal anterior del hemisferio dominante). La variante logopénica, con anomia progresiva, es una variante de la EA.","p":null},{"id":"Demencias_T12-T13-28","b":"Demencias_T12-T13","t":"T13","n":28,"q":"Respecto al complejo demencia frontotemporal, señale la afirmación CORRECTA:","o":["Mutación de presenilina 1 como causa genética más frecuente.","Inclusiones de FUS en torno al 50 % de los casos.","Anticolinesterásicos como tratamiento de elección.","C9orf72 es la causa genética más frecuente de DFT y de ELA."],"a":3,"e":"Según la neuropatología, las inclusiones de TDP-43 suponen en torno al 50 %, las de Tau (incluidos los cuerpos de Pick) el 40-45 % y las de FUS el 5-10 %. Según la genética: mutaciones de Tau y de progranulina (cromosoma 17), C9orf72 (la causa genética más frecuente de DFT y de ELA), valosina (cromosoma 9) y neuroserpina (cromosoma 3). El diagnóstico de seguridad es neuropatológico, salvo en las formas genéticas identificables por ADN.","p":null},{"id":"Demencias_T12-T13-29","b":"Demencias_T12-T13","t":"T13","n":29,"q":"Varón de 74 años con dificultad progresiva para caminar desde hace un año, con pasos cortos, 'pies pegados al suelo' y bloqueos al girar, junto con lentitud mental y urgencia e incontinencia urinaria. La TC muestra dilatación ventricular desproporcionada respecto a la atrofia cortical, con un índice de Evans de 0,36. ¿Cuál es el diagnóstico más probable?","o":["Enfermedad de Parkinson idiopática con deterioro cognitivo.","Enfermedad de Alzheimer avanzada con atrofia secundaria.","Hidrocefalia a presión normal.","Demencia por cuerpos de Lewy con caídas."],"a":2,"e":"La hidrocefalia a presión normal es una causa rara de demencia (1-3 %), importante porque su tratamiento puede revertir los síntomas. Tríada: deterioro cognitivo subcortical (bradipsiquia, disfunción ejecutiva), trastorno de la marcha (sobre todo apráxico, a menudo parkinsoniano con bloqueos) e incontinencia urinaria. En la imagen, hidrocefalia desproporcionada respecto a la atrofia, especialmente en las astas frontales (índice de Evans >0,3); en RM, aumento de la velocidad de flujo en el acueducto de Silvio e hiperseñal periventricular por flujo transependimario.","p":null},{"id":"Demencias_T12-T13-30","b":"Demencias_T12-T13","t":"T13","n":30,"q":"En el paciente anterior se plantea un tratamiento. ¿Qué afirmación es CORRECTA?","o":["Derivación ventriculoperitoneal, seleccionando con tap-test y registro de PIC.","Acetazolamida oral de forma indefinida como tratamiento de elección.","Derivación en todos los pacientes, sin pruebas de selección, por ser de bajo riesgo.","Es típica la ausencia de ondas B en el registro de presión intracraneal."],"a":0,"e":"El tratamiento es la derivación ventriculoperitoneal, con una selección cuidadosa por sus riesgos (hematomas subdurales, infecciones). Para seleccionar se usan la respuesta a la evacuación de 30-50 ml de LCR por punción lumbar (tap-test), los test de infusión y el registro de presión intracraneal, en el que es típica la aparición de ondas B en más del 50 % del registro.","p":"Demencias_T12-T13-29"},{"id":"Desmielinizantes_T08-T09-1","b":"Desmielinizantes_T08-T09","t":"T08","n":1,"q":"Mujer de 27 años que presenta en 5 días pérdida progresiva de visión en el ojo derecho, con dolor al mover el ojo. El fondo de ojo es normal. No tiene antecedentes de interés. ¿Cuál es la prueba complementaria más importante para orientar el diagnóstico?","o":["Potenciales evocados visuales, ya que confirman la desmielinización del nervio óptico.","RM craneal, de nervio óptico y medular con contraste.","Punción lumbar con estudio de bandas oligoclonales, imprescindible para el diagnóstico.","TC craneal urgente para descartar una lesión compresiva retroorbitaria."],"a":1,"e":"Neuritis óptica retrobulbar (posterior): dolor con los movimientos oculares y pérdida visual progresiva unilateral con fondo de ojo normal, porque la inflamación está detrás de la papila. Es la segunda forma de presentación más habitual de la EM. La RM es la prueba complementaria más importante, porque sus hallazgos son necesarios para el diagnóstico: RM craneal y de nervio óptico, y RM medular, sobre todo cervical, con gadolinio. El LCR apoya, pero no es imprescindible.","p":null},{"id":"Desmielinizantes_T08-T09-2","b":"Desmielinizantes_T08-T09","t":"T08","n":2,"q":"Varón de 30 años con un primer episodio de parestesias en ambas piernas de 10 días de evolución. La RM muestra lesiones ovoideas periventriculares y yuxtacorticales y una lesión medular cervical; una de las lesiones periventriculares capta gadolinio y las demás no. Serologías y autoinmunidad son normales. Señale la afirmación CORRECTA:","o":["No puede diagnosticarse EM hasta que presente un segundo brote clínico.","Cumple diseminación en espacio, pero la diseminación en tiempo exige una RM de seguimiento.","Cumple diseminación en espacio y en tiempo; descartadas otras causas, es EM.","La captación de gadolinio de una sola lesión sugiere un proceso tumoral y obliga a biopsia."],"a":2,"e":"Los criterios exigen diseminación en espacio (lesiones en al menos dos topografías típicas: nervio óptico, cortical/yuxtacortical, periventricular, tronco y médula) y en tiempo. La diseminación en tiempo puede ser rad
