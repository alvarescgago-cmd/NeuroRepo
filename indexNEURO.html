Parkinson_T14-12","b":"Parkinson_T14","t":"T14","n":12,"q":"Varón de 59 años con parkinsonismo simétrico sin temblor, de rápida progresión y escasa respuesta a la levodopa. Desde el inicio presenta mareos al levantarse con hipotensión ortostática marcada, incontinencia urinaria y disfunción eréctil. Su mujer refiere ronquidos con estridor nocturno. No hay deterioro cognitivo. ¿Qué resultado apoyaría el diagnóstico más probable frente a una enfermedad de Parkinson?","o":["DaTSCAN patológico, que confirma la AMS y descarta la EP.","Escintigrafía cardiaca con MIBG normal.","RM con atrofia del mesencéfalo en cortes sagitales.","PET-FDG con hipocaptación occipital y signo de la isla."],"a":1,"e":"Atrofia multisistémica: α-sinucleinopatía con parkinsonismo (la forma más frecuente), síndrome cerebeloso, disautonomía y signos piramidales. Tiene evolución más rápida que la EP, parkinsonismo simétrico con poco temblor, inestabilidad postural precoz, disautonomía precoz y grave, estridor nocturno, apnea del sueño, anterocolis, trastorno de conducta REM siempre y ausencia de deterioro cognitivo. La MIBG es normal en la AMS y patológica en la EP. El DaTSCAN es patológico en ambas. El PET-FDG (hipometabolismo estriatal, caudado y cerebeloso) es la prueba más útil en el diagnóstico diferencial.","p":null},{"id":"Parkinson_T14-13","b":"Parkinson_T14","t":"T14","n":13,"q":"Mujer de 69 años con un cuadro de 2 años de rigidez y lentitud muy asimétricas en el brazo izquierdo, con postura distónica de la mano, sacudidas mioclónicas, incapacidad para usar objetos (apraxia) y sensación de que su mano izquierda 'se mueve sola'. Tiene agrafestesia en esa mano y no ha respondido a la levodopa. ¿Cuál es el diagnóstico más probable?","o":["Enfermedad de Parkinson de inicio asimétrico.","Degeneración corticobasal.","Atrofia multisistémica de tipo parkinsoniano.","Parkinsonismo vascular por un infarto estratégico."],"a":1,"e":"Degeneración corticobasal: taupatía poco frecuente con parkinsonismo muy asimétrico como la EP, pero rápidamente progresivo, en la séptima década, sin respuesta al tratamiento. Asocia distonía, mioclonías, apraxia, síndrome de la mano ajena, trastornos sensitivos corticales en el lado afectado (agrafestesia, astereognosia) y trastorno precoz de la marcha y el habla. RM: atrofia cortical frontoparietotemporal muy asimétrica; PET-FDG: hipometabolismo asimétrico. Tratamiento paliativo (levodopa, toxina botulínica para la distonía).","p":null},{"id":"Parkinson_T14-14","b":"Parkinson_T14","t":"T14","n":14,"q":"Varón de 77 años, hipertenso de larga evolución, con dificultad progresiva para caminar desde hace 2 años: pasos cortos, bloqueos al iniciar la marcha, inestabilidad y caídas, con braceo y movimientos de los brazos conservados y sin temblor. Presenta además lentitud mental. No ha mejorado con levodopa. La RM muestra lesiones extensas de pequeño vaso en los ganglios basales y la sustancia blanca. ¿Cuál es el diagnóstico más probable?","o":["Parkinsonismo vascular por enfermedad de pequeño vaso.","Enfermedad de Parkinson con predominio de inestabilidad postural.","Parálisis supranuclear progresiva.","Parkinsonismo farmacológico."],"a":0,"e":"El parkinsonismo vascular más frecuente se debe a múltiples lesiones de pequeño vaso en los ganglios basales o la sustancia blanca, generalmente por HTA. Produce un parkinsonismo de la mitad inferior del cuerpo, progresivo, con trastorno de la marcha muy simétrico, congelaciones, inestabilidad y caídas, sin temblor, con frecuente demencia subcortical y mínima o nula respuesta a la levodopa. La forma menos frecuente es una lesión estratégica única en los ganglios basales o el mesencéfalo, con parkinsonismo hemicorporal tardío. El predominio del trastorno de la marcha es una red flag frente a la EP.","p":null},{"id":"Parkinson_T14-15","b":"Parkinson_T14","t":"T14","n":15,"q":"Mujer de 66 años con enfermedad de Parkinson que acaba de iniciar levodopa y refiere náuseas y vómitos tras las tomas. ¿Qué antiemético es el adecuado?","o":["Metoclopramida.","Sulpirida.","Domperidona.","Haloperidol a dosis bajas."],"a":2,"e":"Las náuseas y los vómitos por los fármacos dopaminérgicos se tratan con domperidona, que no atraviesa de forma relevante la barrera hematoencefálica. La metoclopramida, la sulpirida y el haloperidol son antidopaminérgicos centrales: producen o empeoran el parkinsonismo y figuran entre las causas de parkinsonismo farmacológico. Otros síntomas no motores: hipotensión ortostática (medias de compresión, cabecero elevado, líquidos y, si es preciso, fludrocortisona), estreñimiento (fibra, líquidos, laxantes), sialorrea (atropina oral o toxina botulínica) y depresión (antidepresivos duales, trazodona o mirtazapina, evitando agonistas).","p":null}]};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const codeLabel = c => c.replace("-A", " anexo");

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const K_SESSION = "neuro-test.session.v1", K_STATS = "neuro-test.stats.v1", K_THEME = "neuro-test.theme", K_SHUFFLE = "neuro-test.shuffle";
function rnd(n) {
  if (window.crypto && crypto.getRandomValues) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  return Math.floor(Math.random() * n);
}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/* Si una pregunta depende de la anterior (caso clínico encadenado) y ambas están en la sesión, se colocan juntas y en orden. */
function keepPairs(ids) {
  const set = new Set(ids), out = [], placed = new Set();
  const childOf = new Map();
  ids.forEach(id => { const p = Q.get(id).p; if (p && set.has(p)) childOf.set(p, id); });
  ids.forEach(id => {
    if (placed.has(id)) return;
    const p = Q.get(id).p;
    if (p && set.has(p) && !placed.has(p)) return; // se colocará tras su padre
    out.push(id); placed.add(id);
    let c = childOf.get(id);
    while (c && !placed.has(c)) { out.push(c); placed.add(c); c = childOf.get(c); }
  });
  ids.forEach(id => { if (!placed.has(id)) { out.push(id); placed.add(id); } });
  return out;
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const fmt = n => (Math.round(n * 100) / 100).toLocaleString("es-ES", { maximumFractionDigits: 2 });

/* ---------- Estado ---------- */
let S = null; // sesión activa
let stats = store.get(K_STATS, {});
let reviewFilter = "all";

function newSession(kind, title, sub, ids) {
  S = { v: 1, kind, title, sub, ids, ans: {}, corr: {}, cur: 0, finished: false, t0: Date.now() };
  save(); show("quiz"); renderQuiz(true);
}
function save() { if (S) store.set(K_SESSION, S); }
function validSession(s) {
  return s && s.v === 1 && Array.isArray(s.ids) && s.ids.length && s.ids.every(id => Q.has(id)) && typeof s.ans === "object" && typeof s.corr === "object";
}
function record(id, ok) {
  const st = stats[id] || { c: 0, w: 0, l: 0 };
  if (ok) st.c++; else st.w++;
  st.l = ok ? 1 : 0; stats[id] = st; store.set(K_STATS, stats);
}

/* ---------- Navegación entre vistas ---------- */
function show(v) {
  $("#viewHome").hidden = v !== "home";
  $("#viewQuiz").hidden = v !== "quiz";
  $("#viewResults").hidden = v !== "results";
  document.body.classList.toggle("in-quiz", v === "quiz");
  window.scrollTo({ top: 0 });
}

/* ---------- Inicio ---------- */
function temaProgress(ids) {
  let done = 0, ok = 0;
  ids.forEach(id => { const s = stats[id]; if (s) { done++; if (s.l) ok++; } });
  return { done, ok, n: ids.length };
}
function renderHome() {
  const g = temaProgress(ALL_IDS);

  const saved = store.get(K_SESSION, null);
  let banner = "";

    banner = saved.finished

      : `<div class="banner"><div class="banner-txt"><b>Tienes una sesión a medias</b>${esc(saved.title)} · ${answered}/${saved.ids.length} respondidas</div><button class="btn btn-sm btn-primary" data-act="resume">Continuar</button><button class="btn btn-sm btn-ghost" data-act="discard">Descartar</button></div>`;
  }
  const blocks = DATA.blocks.map(b => {

      return `<button class="tema" type="button" data-tema="${esc(s.code)}">

    return `<div class="card block">

      ${multi ? `<button class="btn btn-sm" type="button" data-block="${esc(b.id)}">Bloque completo</button>` : ""}</div>
      ${rows}</div>`;
  }).join("");
  $("#viewHome").innerHTML = `
    <div class="hero">
      <h1>Neurología · Preguntas tipo test</h1>
      <p>${DATA.questions.length} preguntas con su respuesta y explicación, organizadas en ${TEMAS.length} temas.</p>
      <div class="chips">
        <span class="chip"><b>${DATA.questions.length}</b> preguntas</span>
        <span class="chip"><b>${TEMAS.length}</b> temas</span>
        <span class="chip">Practicadas <b>${g.done}</b>/${g.n}</span>
        ${g.done ? `<span class="chip">Acierto último intento <b>${pct(g.ok, g.done)}%</b></span>` : ""}
      </div>
      ${banner}
    </div>
    <div class="modes">
      <div class="card mode">
        <div class="mode-ico">${I.shuffle}</div>
        <h2>Modo aleatorio</h2>
        <p>${RANDOM_N} preguntas al azar de todo el temario. Cada simulacro es distinto.</p>
        <div class="row"><button class="btn btn-primary" type="button" data-act="random">Empezar simulacro</button></div>
      </div>
      <div class="card mode">
        <div class="mode-ico">${I.book}</div>
        <h2>Modo por tema</h2>
        <p>Todas las preguntas de un tema concreto, o de un bloque completo de temas.</p>
        <div class="row">
          <button class="btn" type="button" data-act="goTemas">Elegir tema</button>
          <label class="check"><input type="checkbox" id="shuffleChk" ${shuffleOn ? "checked" : ""}> Barajar el orden</label>
        </div>
      </div>
    </div>
    <div class="section-title" id="temasAnchor"><h2>Temas</h2><span>${DATA.blocks.length} bloques · ${TEMAS.length} temas</span></div>
    <div class="blocks">${blocks}</div>
    <div class="foot">
      <span class="keys">Atajos: <span class="kbd">A</span>–<span class="kbd">D</span> o <span class="kbd">1</span>–<span class="kbd">4</span> elegir · <span class="kbd">Enter</span> corregir/siguiente · <span class="kbd">←</span> <span class="kbd">→</span> navegar</span>
      <button class="btn btn-sm btn-ghost" type="button" data-act="resetStats">Borrar estadísticas</button>
    </div>`;
}
$("#viewHome").addEventListener("click", e => {
  const t = e.target.closest("[data-tema],[data-block],[data-act]");
  if (!t) return;
  if (t.dataset.tema) return startTema(t.dataset.tema);
  if (t.dataset.block) return startBlock(t.dataset.block);
  const a = t.dataset.act;
  if (a === "random") startRandom();
  else if (a === "goTemas") $("#temasAnchor").scrollIntoView({ behavior: "smooth", block: "start" });
  else if (a === "resume") {
    const saved = store.get(K_SESSION, null);
    if (!validSession(saved)) return renderHome();
    S = saved;
    if (S.finished) { reviewFilter = "all"; show("results"); renderResults(); }
    else { show("quiz"); renderQuiz(true); }
  } else if (a === "discard") { store.del(K_SESSION); S = null; renderHome(); }
  else if (a === "resetStats") {
    confirmBox("Borrar estadísticas", "Se borrará el historial de aciertos de todas las preguntas. Esta acción no se puede deshacer.", "Borrar", () => { stats = {}; store.del(K_STATS); renderHome(); toast("Estadísticas borradas"); });
  }
});
$("#viewHome").addEventListener("change", e => { if (e.target.id === "shuffleChk") store.set(K_SHUFFLE, e.target.checked); });

function maybeShuffle(ids) { return store.get(K_SHUFFLE, false) ? keepPairs(shuffle(ids)) : ids.slice(); }
function startRandom() {
  const ids = keepPairs(shuffle(ALL_IDS).slice(0, RANDOM_N));
  newSession("random", "Simulacro aleatorio", `${RANDOM_N} preguntas de todo el temario`, ids);
}
function startTema(code) {
  const t = TEMA.get(code); if (!t) return;
  newSession("tema", `${temaShort(code)} · ${t.name}`, BLOCK.get(t.block).name, maybeShuffle(t.ids));
}
function startBlock(bid) {
  const b = BLOCK.get(bid); if (!b) return;
  const ids = DATA.questions.filter(q => q.b === bid).map(q => q.id);
  newSession("bloque", `${b.name} (${b.range})`, "Bloque completo", maybeShuffle(ids));
}

/* ---------- Quiz ---------- */
function statusOf(id) {
  if (S.ans[id] === undefined) return S.finished ? "blank" : "none";
  if (S.finished || S.corr[id]) return S.ans[id] === Q.get(id).a ? "ok" : "ko";
  return "answered";
}
function feedbackHTML(q, chosen) {
  const correctTxt = `Respuesta correcta: ${LETTERS[q.a]}`;
  let cls, icon, head;
  if (chosen === undefined) { cls = "blank"; icon = I.minus; head = "Sin responder"; }
  else if (chosen === q.a) { cls = "ok"; icon = I.check; head = "¡Correcto!"; }
  else { cls = "ko"; icon = I.x; head = `Incorrecto · marcaste la ${LETTERS[chosen]}`; }
  return `<div class="fb ${cls}" role="status"><div class="fb-head">${icon}<span>${head}</span></div>
    <div class="fb-ans">${correctTxt}) ${esc(q.o[q.a])}</div>
    <div class="fb-exp">${esc(q.e)}</div></div>`;
}
function optionsHTML(q, chosen, revealed, interactive) {
  return q.o.map((txt, i) => {
    let cls = "opt", mark = "";
    if (revealed) {
      if (i === q.a) { cls += " ok"; mark = I.okMark; }
      else if (i === chosen) { cls += " ko"; mark = I.koMark; }
      else cls += " dim";
    } else if (i === chosen) cls += " sel";
    return `<button class="${cls}" type="button" data-opt="${i}" ${interactive && !revealed ? "" : "disabled"} aria-pressed="${i === chosen}">
      <span class="L">${LETTERS[i]}</span><span class="T">${esc(txt)}</span>${mark}</button>`;
  }).join("");
}
function contextHTML(q, prevIdInSession) {
  if (!q.p || !Q.has(q.p)) return "";
  const parent = Q.get(q.p);
  const open = prevIdInSession !== q.p;
  return `<details class="ctx" ${open ? "open" : ""}><summary>Caso clínico de la pregunta anterior</summary><div>${esc(parent.q)}</div></details>`;
}
function renderQuiz(scrollTop) {
  if (!S) return;
  const n = S.ids.length;
  S.cur = Math.max(0, Math.min(S.cur, n - 1));
  const id = S.ids[S.cur], q = Q.get(id), chosen = S.ans[id];
  const revealed = S.finished || !!S.corr[id];
  const answered = Object.keys(S.ans).length;
  const correctedCount = S.ids.filter(x => S.corr[x]).length;
  const okCount = S.ids.filter(x => S.corr[x] && S.ans[x] === Q.get(x).a).length;
  const t = TEMA.get(q.t);
  const isLast = S.cur === n - 1;
  const grid = S.ids.map((x, i) => {
    const st = statusOf(x);
    const c = st === "ok" ? "o" : st === "ko" ? "k" : st === "answered" ? "a" : "";
    const label = { ok: "correcta", ko: "incorrecta", answered: "respondida", none: "sin responder", blank: "sin responder" }[st];
    return `<button class="nv ${c} ${i === S.cur ? "cur" : ""}" type="button" data-go="${i}" aria-label="Pregunta ${i + 1}, ${label}">${i + 1}</button>`;
  }).join("");

  $("#viewQuiz").innerHTML = `
    <div class="qsticky">
    <div class="qhead">
      <div class="qhead-title"><div class="eyebrow">${esc(S.sub)}</div><h2>${esc(S.title)}</h2></div>
      <button class="btn btn-sm btn-ghost" type="button" data-act="exit" aria-label="Salir">${I.left}<span class="lbl"> Salir</span></button>
      ${S.finished ? `<button class="btn btn-sm btn-primary" type="button" data-act="results">Ver resultados</button>`
                   : `<button class="btn btn-sm btn-primary" type="button" data-act="finish">Corregir todas</button>`}
    </div>
    <div class="progress"><i style="width:${pct(answered, n)}%"></i></div>
    <div class="progress-txt"><span>Pregunta <b>${S.cur + 1}</b> de ${n}</span><span>${answered}/${n} respondidas${correctedCount && !S.finished ? ` · ${okCount}/${correctedCount} acertadas` : ""}</span></div>
    </div>
    <article class="card qcard" id="qcard">
      <div class="qtop"><span class="qnum">${S.cur + 1}.</span><span class="tag">${esc(temaShort(q.t))}</span><span class="tag tag-muted">${esc(t ? t.name : "")}</span></div>
      ${contextHTML(q, S.ids[S.cur - 1])}
      <p class="stem">${esc(q.q)}</p>
      <div class="opts" role="group" aria-label="Opciones de respuesta">${optionsHTML(q, chosen, revealed, true)}</div>
      ${revealed ? feedbackHTML(q, chosen) : ""}
      <div class="qactions">
        <button class="btn" type="button" data-act="prev" aria-label="Anterior" ${S.cur === 0 ? "disabled" : ""}>${I.left}<span class="lbl">Anterior</span></button>
        <span class="grow"></span>
        ${revealed ? "" : `<button class="btn" type="button" data-act="check" ${chosen === undefined ? "disabled" : ""}>Ver corrección</button>`}
        ${isLast
          ? (S.finished ? `<button class="btn btn-primary" type="button" data-act="results">Ver resultados</button>`
                        : `<button class="btn btn-primary" type="button" data-act="finish"><span class="lbl-long">Ver corrección de todas</span><span class="lbl-short">Corregir todas</span></button>`)
          : `<button class="btn btn-primary" type="button" data-act="next">Siguiente ${I.chev}</button>`}
      </div>
    </article>
    <div class="card navgrid-wrap">
      <div class="navgrid-head"><b>Mapa de preguntas</b>
        <div class="legend"><span><i></i>Sin responder</span><span><i class="a"></i>Respondida</span><span><i class="o"></i>Correcta</span><span><i class="k"></i>Incorrecta</span></div></div>
      <div class="navgrid">${grid}</div>
    </div>
    <p class="hint">Puedes corregir cada pregunta al momento con «Ver corrección» o responderlas todas y pulsar «Corregir todas» al final.</p>`;
  if (scrollTop) window.scrollTo({ top: 0 });
}
function go(i) {
  if (!S) return;
  S.cur = Math.max(0, Math.min(i, S.ids.length - 1)); save(); renderQuiz(false);
  const card = $("#qcard");
  if (card) {
    const off = stickyOffset();
    const top = card.getBoundingClientRect().top;
    if (top < off || top > window.innerHeight * 0.5) window.scrollTo({ top: Math.max(0, window.scrollY + top - off) });
  }
}
/* Altura ocupada arriba por barras fijas (cabecera general en escritorio, cabecera del examen en móvil) */
function stickyOffset() {
  const qs = $(".qsticky");
  if (qs && getComputedStyle(qs).position === "sticky") return qs.offsetHeight + 10;
  const tb = $(".topbar");
  return (tb && getComputedStyle(tb).position === "sticky" ? tb.offsetHeight : 0) + 12;
}
function bottomBarHeight() {
  const qa = $("#viewQuiz .qactions");
  return qa && getComputedStyle(qa).position === "fixed" ? qa.offsetHeight : 0;
}
function choose(i) {
  const id = S.ids[S.cur];
  if (S.finished || S.corr[id]) return;
  S.ans[id] = i; save(); renderQuiz(false);
}
function checkCurrent() {
  const id = S.ids[S.cur];
  if (S.finished || S.corr[id] || S.ans[id] === undefined) return;
  S.corr[id] = true; record(id, S.ans[id] === Q.get(id).a); save(); renderQuiz(false);
  const fb = $("#viewQuiz .fb");
  if (fb) {
    const limit = window.innerHeight - bottomBarHeight();
    const r = fb.getBoundingClientRect();
    if (r.top > limit - 140) window.scrollBy({ top: r.top - Math.max(stickyOffset(), limit * 0.45), behavior: "smooth" });
  }
}
function askFinish() {
  const blank = S.ids.filter(id => S.ans[id] === undefined).length;
  const msg = blank
    ? `Te quedan ${blank} pregunta${blank > 1 ? "s" : ""} sin responder, que contarán como en blanco. ¿Corregir todas ahora?`
    : "Se corregirán todas las preguntas y verás la explicación de cada una.";
  confirmBox("Corregir todas las preguntas", msg, "Corregir", finish);
}
function finish() {
  S.ids.forEach(id => { if (S.ans[id] !== undefined && !S.corr[id]) { S.corr[id] = true; record(id, S.ans[id] === Q.get(id).a); } });
  S.finished = true; S.t1 = Date.now(); save();
  reviewFilter = "all"; show("results"); renderResults();
}
$("#viewQuiz").addEventListener("click", e => {
  const o = e.target.closest("[data-opt]"); if (o && !o.disabled) return choose(+o.dataset.opt);
  const g = e.target.closest("[data-go]"); if (g) return go(+g.dataset.go);
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const a = t.dataset.act;
  if (a === "prev") go(S.cur - 1);
  else if (a === "next") go(S.cur + 1);
  else if (a === "check") checkCurrent();
  else if (a === "finish") askFinish();
  else if (a === "results") { reviewFilter = "all"; show("results"); renderResults(); }
  else if (a === "exit") goHome();
});
function goHome() { renderHome(); show("home"); }

/* ---------- Resultados ---------- */
function renderResults() {
  if (!S) return goHome();
  const n = S.ids.length;
  const ok = S.ids.filter(id => statusOf(id) === "ok");
  const ko = S.ids.filter(id => statusOf(id) === "ko");
  const bl = S.ids.filter(id => statusOf(id) === "blank");
  const net = ok.length - ko.length / 3;
  const score10 = Math.max(0, net) / n * 10;
  const p = pct(ok.length, n);
  const msg = p >= 85 ? "Excelente dominio." : p >= 70 ? "Buen resultado." : p >= 50 ? "Aprobado, pero hay margen de mejora." : "Conviene repasar estos contenidos.";
  // desglose por tema
  const temaOrder = [], byT = {};
  S.ids.slice().sort((a, b) => ORDER.get(a) - ORDER.get(b)).forEach(id => {
    const tc = Q.get(id).t; if (!byT[tc]) { byT[tc] = { ok: 0, ko: 0, bl: 0, n: 0 }; temaOrder.push(tc); }
    const st = statusOf(id); byT[tc].n++; if (st === "ok") byT[tc].ok++; else if (st === "ko") byT[tc].ko++; else byT[tc].bl++;
  });
  const breakdown = temaOrder.length > 1 ? `<div class="card breakdown">${temaOrder.map(tc => {
    const d = byT[tc], t = TEMA.get(tc);
    return `<div class="bd-row"><span class="tag">${esc(temaShort(tc))}</span><span class="nm" title="${esc(t.name)}">${esc(t.name)}</span>
      <span class="bar"><i style="width:${pct(d.ok, d.n)}%;background:var(--ok)"></i><i style="width:${pct(d.ko, d.n)}%;background:var(--ko)"></i></span>
      <span class="num">${d.ok}/${d.n}</span></div>`;
  }).join("")}</div>` : "";
  const counts = { all: n, ko: ko.length, bl: bl.length, ok: ok.length };
  const tabs = [["all", "Todas"], ["ko", "Fallos"], ["bl", "En blanco"], ["ok", "Aciertos"]]
    .map(([k, l]) => `<button class="tab ${reviewFilter === k ? "on" : ""}" type="button" data-filter="${k}">${l}<span>${counts[k]}</span></button>`).join("");
  const list = S.ids.map((id, i) => ({ id, i })).filter(({ id }) => {
    const st = statusOf(id);
    return reviewFilter === "all" || (reviewFilter === "ok" && st === "ok") || (reviewFilter === "ko" && st === "ko") || (reviewFilter === "bl" && st === "blank");
  });
  const review = list.length ? list.map(({ id, i }) => {
    const q = Q.get(id);
    return `<article class="card rv">
      <div class="qtop"><span class="qnum">${i + 1}.</span><span class="tag">${esc(temaShort(q.t))}</span><span class="tag tag-muted">${esc(TEMA.get(q.t).name)}</span></div>
      ${contextHTML(q, S.ids[i - 1])}
      <p class="stem">${esc(q.q)}</p>
      <div class="opts">${optionsHTML(q, S.ans[id], true, false)}</div>
      ${feedbackHTML(q, S.ans[id])}</article>`;
  }).join("") : `<div class="card empty">No hay preguntas en esta categoría.</div>`;
  const retry = ko.length + bl.length;
  $("#viewResults").innerHTML = `
    <div class="card res-hero">
      <div class="ring" style="--p:${p}"><div><div><b>${p}%</b><span>aciertos</span></div></div></div>
      <div>
        <h2>${esc(S.title)}</h2>
        <p>${msg} Nota neta (cada fallo resta 1/3): <b>${fmt(net)}</b> de ${n} · <b>${fmt(score10)}</b>/10</p>
        <div class="stats">
          <div class="stat o"><b>${ok.length}</b><span>Aciertos</span></div>
          <div class="stat k"><b>${ko.length}</b><span>Fallos</span></div>
          <div class="stat w"><b>${bl.length}</b><span>En blanco</span></div>
          <div class="stat"><b>${n}</b><span>Total</span></div>
        </div>
        <div class="res-actions">
          ${retry ? `<button class="btn btn-primary" type="button" data-act="retry">Repetir fallos y en blanco (${retry})</button>` : ""}
          <button class="btn ${retry ? "" : "btn-primary"}" type="button" data-act="again">${S.kind === "random" ? "Nuevo simulacro" : "Repetir"}</button>
          <button class="btn btn-ghost" type="button" data-act="nav">Revisar una a una</button>
          <button class="btn btn-ghost" type="button" data-act="home">Inicio</button>
        </div>
      </div>
    </div>
    ${breakdown}
    <div class="tabs" role="tablist">${tabs}</div>
    <div class="review">${review}</div>`;
}
$("#viewResults").addEventListener("click", e => {
  const f = e.target.closest("[data-filter]");
  if (f) { reviewFilter = f.dataset.filter; const y = $(".tabs").getBoundingClientRect().top + window.scrollY - 70; renderResults(); window.scrollTo({ top: y }); return; }
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "home") goHome();
  else if (a === "nav") { S.cur = 0; save(); show("quiz"); renderQuiz(true); }
  else if (a === "retry") {
    const ids = S.ids.filter(id => statusOf(id) !== "ok");
    const base = S.title.replace(/^Repaso de fallos · /, "");
    newSession("repaso", `Repaso de fallos · ${base}`, `${ids.length} preguntas falladas o en blanco`, ids);
  } else if (a === "again") {
    if (S.kind === "random") startRandom();
    else newSession(S.kind, S.title, S.sub, S.kind === "repaso" ? S.ids.slice() : maybeShuffle(S.ids.slice().sort((x, y) => ORDER.get(x) - ORDER.get(y))));
  }
});

/* ---------- Modal y toast ---------- */
let modalCb = null;
function confirmBox(title, text, okLabel, cb) {
  $("#modalTitle").textContent = title; $("#modalText").textContent = text; $("#modalOk").textContent = okLabel || "Aceptar";
  modalCb = cb; $("#modal").hidden = false; $("#modalOk").focus();
}
function closeModal() { $("#modal").hidden = true; modalCb = null; }
$("#modalCancel").addEventListener("click", closeModal);
$("#modalOk").addEventListener("click", () => { const cb = modalCb; closeModal(); if (cb) cb(); });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
function toast(msg) {
  const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}

/* ---------- Teclado ---------- */
document.addEventListener("keydown", e => {
  if (!$("#modal").hidden) { if (e.key === "Escape") closeModal(); return; }
  if ($("#viewQuiz").hidden || !S) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  const k = e.key;
  const map = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 };
  const id = S.ids[S.cur];
  if (k.toLowerCase() in map) { e.preventDefault(); choose(map[k.toLowerCase()]); }
  else if (k === "ArrowRight") { e.preventDefault(); go(S.cur + 1); }
  else if (k === "ArrowLeft") { e.preventDefault(); go(S.cur - 1); }
  else if (k === "Enter") {
    if (tag === "button" && !e.target.matches("[data-opt]")) return; // deja que el botón enfocado actúe
    e.preventDefault();
    const revealed = S.finished || S.corr[id];
    if (!revealed && S.ans[id] !== undefined) checkCurrent();
    else if (revealed || S.ans[id] === undefined) {
      if (S.cur < S.ids.length - 1) go(S.cur + 1);
      else if (!S.finished) askFinish();
    }
  }
});

/* ---------- Tema claro/oscuro ---------- */
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  const dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  $("#themeBtn").innerHTML = dark ? I.sun : I.moon;
}
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  store.set(K_THEME, next); applyTheme(next);
});
$("#brandBtn").addEventListener("click", () => {
  if (!$("#viewHome").hidden) return window.scrollTo({ top: 0, behavior: "smooth" });
  goHome();
});

/* ---------- Arranque ---------- */
applyTheme(store.get(K_THEME, null));
renderHome();
</script>
</body>
</html>
